name: Cena Certa Sep10 Caption Repair Dispatch

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-sep10-caption-repair-dispatch.yml'

permissions:
  contents: write
  packages: read

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/umagestaointeligente/cena-certa-runtime@sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cena-certa-factory-v2-certified
      - name: Verify repaired caption is present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ops/cena-certa/batches/cena-certa-daily8-20260910-v1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          oasis=next((x for x in data if x.get('id')=='CC-20260910-OASIS-V1'),None)
          if not oasis:
              raise SystemExit('OASIS_ITEM_MISSING')
          chunks=oasis.get('caption_chunks') or []
          if 'E ainda lotam arenas pelo mundo.' not in chunks:
              raise SystemExit('REPAIRED_CAPTION_NOT_PRESENT')
          if 'E continuam reunindo multidões pelo mundo inteiro.' in chunks:
              raise SystemExit('OLD_CAPTION_STILL_PRESENT')
          print('REPAIRED_CAPTION_PRESENT_PASS')
          PY
      - name: Full canonical preflight and dispatch
        shell: bash
        run: |
          set -euo pipefail
          python ops/cena-certa/dispatch_activate.py \
            --batch ops/cena-certa/batches/cena-certa-daily8-20260910-v1.json \
            --select-count 8 \
            --reserve-count 0 \
            --note 'Paulo authorized final video production and scheduling for 10/09; 08/09 and 09/09 remain frozen.'
      - name: Commit dispatch control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cena Certa Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/cena-certa/dispatch.json
          git diff --cached --quiet && { echo DISPATCH_NO_CHANGE; exit 1; }
          git commit -m 'ops(cena-certa): dispatch Sep 10 primary eight'
          git push origin HEAD:feat/cena-certa-factory-v2-certified
