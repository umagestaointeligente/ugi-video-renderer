name: UGI Growth Policy Runtime Gate
run-name: UGI Growth Policy Gate ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'config/ugi/growth-policy.json'
      - 'scripts/growth-policy-smoke.py'
      - '.github/workflows/ugi-growth-policy-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source of truth
        uses: actions/checkout@v4
      - name: Load and validate growth policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/growth-policy-smoke.py | tee /tmp/growth-policy-evidence.txt
          grep -q '^GROWTH_POLICY_LOADED=true$' /tmp/growth-policy-evidence.txt
          grep -q '^GROWTH_POLICY_ID=ugi-growth-engine$' /tmp/growth-policy-evidence.txt
          grep -q '^GROWTH_TARGET_VIEWS=10000$' /tmp/growth-policy-evidence.txt
          grep -q '^GROWTH_RUNTIME_GATE=PASS$' /tmp/growth-policy-evidence.txt
      - name: Prove generation-control rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/ugi/growth-policy.json').read_text(encoding='utf-8'))
          assert p['platform_independence']['enabled'] is True
          assert p['platform_independence']['default_cross_platform_replication'] is False
          assert p['creative_novelty']['window_days'] == 30
          assert p['commerce_gate']['fail_closed'] is True
          assert p['publication_evidence']['verified_requires_readback'] is True
          assert p['tiktok']['experimental_duration_seconds'] == {'min':7,'max':12}
          assert 'carousel' in p['instagram']['formats']
          assert p['youtube']['micro_winner_strategy'] == 'descendants_not_copies'
          print('GENERATION_CONTROL_INTEGRATION=PASS')
          PY
