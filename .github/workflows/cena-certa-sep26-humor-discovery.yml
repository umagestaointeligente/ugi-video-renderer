name: Cena Certa Sep26 Humor Discovery
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep26-humor-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Inspect Mister Brau
        run: |
          mkdir -p out
          yt-dlp --no-warnings --dump-single-json "https://globoplay.globo.com/v/4707587/" > out/mister.json 2> out/mister.err || true
          if test -s out/mister.json; then
            jq '{id,title,duration,ext,webpage_url,extractor,license}' out/mister.json > out/mister-summary.json
          else
            printf '{"pass":false}\n' > out/mister-summary.json
          fi
      - name: Inspect Deus Salve o Rei
        run: |
          yt-dlp --no-warnings --dump-single-json "https://globoplay.globo.com/v/6600863/" > out/deus.json 2> out/deus.err || true
          if test -s out/deus.json; then
            jq '{id,title,duration,ext,webpage_url,extractor,license}' out/deus.json > out/deus-summary.json
          else
            printf '{"pass":false}\n' > out/deus-summary.json
          fi
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'CENA_CERTA_HUMOR_DISCOVERY\nRUN_ID=%s\n\nMISTER_BRAU\n' "$GITHUB_RUN_ID" > out/issue.txt
          cat out/mister-summary.json >> out/issue.txt
          printf '\nMISTER_ERR\n' >> out/issue.txt
          tail -20 out/mister.err >> out/issue.txt || true
          printf '\nDEUS_SALVE_O_REI\n' >> out/issue.txt
          cat out/deus-summary.json >> out/issue.txt
          printf '\nDEUS_ERR\n' >> out/issue.txt
          tail -20 out/deus.err >> out/issue.txt || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-HUMOR-DISCOVERY] $GITHUB_RUN_ID" --body-file out/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-humor-discovery-${{ github.run_id }}
          path: out/
          retention-days: 7
