name: LSI Payment Hub Provider Payload Inspect R1
run-name: LSI Payment Hub Provider Payload Inspect R1 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths: ['.github/workflows/lsi-payment-hub-provider-payload-inspect-r1.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Extract bounded live provider context
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"; test -n "$CF_ACCOUNT_ID"; echo "::add-mask::$CF_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN}" "$base" >/tmp/b
          python - <<'PY'
          import re
          from email import policy
          from email.parser import BytesParser
          h=open('/tmp/h','rb').read().decode('latin1','replace'); b=open('/tmp/b','rb').read()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',h); ct=m.group(1).strip() if m else ''
          parts=[]
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=policy.default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b)
              for p in msg.walk():
                  if p.is_multipart(): continue
                  q=p.get_payload(decode=True) or b''
                  if q and b'createProviderCheckout' in q and b'/api/commerce/webhook/asaas' in q:
                      parts.append(q)
          else: parts=[b]
          if not parts: raise SystemExit('COMMERCE_MODULE_NOT_FOUND')
          s=max(parts,key=len).decode('utf-8')
          print('IMAGEBASE64_COUNT='+str(s.count('imageBase64')))
          print('CHECKOUTIMAGEBASE64_COUNT='+str(s.count('checkoutImageBase64')))
          print('CHECKOUT_ENDPOINT_COUNT='+str(s.count('/v3/checkouts')))
          print('ITEMS_TOKEN_COUNT='+str(s.count('items')))
          # Every image occurrence with tightly bounded context.
          for idx,m in enumerate(re.finditer(r'imageBase64',s),1):
              a=max(0,m.start()-420); z=min(len(s),m.end()+650)
              chunk=s[a:z]
              chunk=re.sub(r'(?i)(authorization\s*[:=]\s*["\'`])[^"\'`]+',r'\1<REDACTED>',chunk)
              print(f'---IMAGE_CONTEXT_{idx}_BEGIN---')
              print(chunk)
              print(f'---IMAGE_CONTEXT_{idx}_END---')
          # Provider function, bounded to next async/function declaration or 9000 chars.
          token='async function createProviderCheckout'
          start=s.find(token)
          if start<0: raise SystemExit('PROVIDER_FUNCTION_NOT_FOUND')
          tail=s[start:start+9000]
          nxt=re.search(r'\n(?:async\s+)?function\s+[A-Za-z0-9_]+\s*\(',tail[len(token):])
          if nxt: tail=tail[:len(token)+nxt.start()]
          tail=re.sub(r'(?i)(authorization\s*[:=]\s*["\'`])[^"\'`]+',r'\1<REDACTED>',tail)
          print('---CREATE_PROVIDER_CONTEXT_BEGIN---')
          print(tail)
          print('---CREATE_PROVIDER_CONTEXT_END---')
          print('INSPECT_ONLY=true')
          PY
