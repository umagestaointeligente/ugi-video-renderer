name: Cena Certa V2 Snapshot Sync Once

on:
  push:
    branches: [feat/cena-certa-factory-v2-bridge]
    paths: ['.github/workflows/cena-certa-snapshot-sync-once.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cena-certa-v2-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GL_REPO: https://gitlab.com/umagestaointeligente-group/umagestaointeligente-project.git
      GL_REF: feat/cena-certa-render-factory-v2
      GL_SHA: 93728bf99cd6aa3b1e0da6f0ab105504dd633973
      SNAP: vendor/cena-certa-factory-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cena-certa-factory-v2-bridge
          fetch-depth: 1

      - name: Fetch exact development source once
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --depth 1 --branch "$GL_REF" "$GL_REPO" /tmp/cena-src
          test "$(git -C /tmp/cena-src rev-parse HEAD)" = "$GL_SHA"

      - name: Build self-contained immutable snapshot
        run: |
          set -euo pipefail
          rm -rf "$SNAP/src"
          mkdir -p "$SNAP/src/factory/cena_certa/v2" "$SNAP/src/canonical/cena_certa/v1/assets"
          cp /tmp/cena-src/factory/__init__.py "$SNAP/src/factory/__init__.py"
          cp /tmp/cena-src/factory/cena_certa/__init__.py "$SNAP/src/factory/cena_certa/__init__.py"
          cp /tmp/cena-src/factory/cena_certa/v2/* "$SNAP/src/factory/cena_certa/v2/"
          cp /tmp/cena-src/canonical/cena_certa/v1/assets/approved_story_source_v1.png "$SNAP/src/canonical/cena_certa/v1/assets/approved_story_source_v1.png"
          cp /tmp/cena-src/canonical/cena_certa/v1/assets/approved_cta_source_v1.png "$SNAP/src/canonical/cena_certa/v1/assets/approved_cta_source_v1.png"
          rm -rf "$SNAP/assets-b64"
          test "$(sha256sum "$SNAP/src/canonical/cena_certa/v1/assets/approved_story_source_v1.png" | cut -d' ' -f1)" = "256448409d6016598d4a27650bec6c35f8ecc67b4e8d294a87246e1b4c4ae4ce"
          test "$(sha256sum "$SNAP/src/canonical/cena_certa/v1/assets/approved_cta_source_v1.png" | cut -d' ' -f1)" = "b19d5ccb51417c6d71ea7fa672e64a9f34023954e3d76ed9b285b83bcd41745b"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('vendor/cena-certa-factory-v2/PROVENANCE.json')
          d={
            'schema':'CENA_CERTA_CERTIFIED_FACTORY_SNAPSHOT_V3',
            'source_repository':'gitlab:umagestaointeligente-group/umagestaointeligente-project',
            'source_branch':'feat/cena-certa-render-factory-v2',
            'source_sha':'93728bf99cd6aa3b1e0da6f0ab105504dd633973',
            'snapshot_policy':'IMMUTABLE_PIN_FAIL_CLOSED',
            'snapshot_complete':True,
            'runtime_source':'GITHUB_LOCAL_SNAPSHOT_ONLY',
            'runtime_visual_assets':['approved_story_source_v1.png','approved_cta_source_v1.png'],
            'story_sha256':'256448409d6016598d4a27650bec6c35f8ecc67b4e8d294a87246e1b4c4ae4ce',
            'cta_sha256':'b19d5ccb51417c6d71ea7fa672e64a9f34023954e3d76ed9b285b83bcd41745b',
            'candidate_pool_size':10,'daily_batch_size':8,'hot_reserve_count':2,
            'networks':['facebook','instagram','tiktok','youtube'],'expected_placements':32,
            'publication_triggered_by_snapshot':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit snapshot only if exact bytes changed
        run: |
          set -euo pipefail
          git config user.name 'umagestaointeligente'
          git config user.email 'umagestaointeligente@gmail.com'
          git add "$SNAP"
          if git diff --cached --quiet; then
            echo SNAPSHOT_ALREADY_CURRENT
            exit 0
          fi
          git commit -m 'Cena Certa V2: seal self-contained snapshot 93728bf9'
          git push origin HEAD:feat/cena-certa-factory-v2-bridge
