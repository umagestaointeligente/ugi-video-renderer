name: Orbit R2 Secret Presence Probe 2026-09-13
on:
  push:
    branches:
      - infra/orbit-public-runner-canary-20260913
    paths:
      - '.github/workflows/orbit-r2-secret-presence-probe-20260913.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPLOAD_URL_STATE: ${{ secrets.UGI_VIDEO_UPLOAD_URL != '' && 'PRESENT' || 'MISSING' }}
      UPLOAD_KEY_STATE: ${{ secrets.UGI_VIDEO_UPLOAD_KEY != '' && 'PRESENT' || 'MISSING' }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s=%s\n' UGI_VIDEO_UPLOAD_URL "$UPLOAD_URL_STATE"
          printf '%s=%s\n' UGI_VIDEO_UPLOAD_KEY "$UPLOAD_KEY_STATE"
          test "$UPLOAD_URL_STATE" = PRESENT
          test "$UPLOAD_KEY_STATE" = PRESENT
          printf '%s\n' 'PUBLICATION=false' 'METRICOOL_CALL=false'
