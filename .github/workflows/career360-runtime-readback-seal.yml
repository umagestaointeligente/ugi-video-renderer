name: Career360 Runtime Readback Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-runtime-readback-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current official production readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/LSI_RECOVERY_CURRENT.md')
          s=p.read_text()
          s=s.replace('Atualizado: 2026-09-05 BRT','Atualizado: 2026-09-06 BRT',1)
          s=s.replace('Readback final deste gate em 2026-09-05 BRT:','Readback oficial mais recente em 2026-09-06 BRT:',1)
          old='- produção ainda carrega a versão V14 anterior de `app-k.js`;\n- produção ainda NÃO carrega `app-l.js`;'
          new='- produção ainda carrega a versão V14 anterior `app-k@ac1ea580667724b49ee1e8b0c8e04dfc153565f3`;\n- produção ainda NÃO carrega `app-l.js`;\n- produção ainda NÃO carrega `app-m.js`;\n- `V16_CURRENT_PRODUCTION_READBACK=V14_ONLY_NOT_PROMOTED`;'
          if old not in s: raise SystemExit('production readback anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('RUNTIME_READBACK_SEAL_SOURCE=PASS')
          PY
          git diff --check
      - name: Commit readback and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/career360-runtime-readback-seal.yml
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md .github/workflows/career360-runtime-readback-seal.yml
          git diff --cached --check
          git commit -m 'career360: seal current V14 production readback after V16 hardening'
          git push origin HEAD:main
          echo 'RUNTIME_READBACK_SEAL_PUSH=PASS'
