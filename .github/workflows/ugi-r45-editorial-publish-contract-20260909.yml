name: UGI R45.7 Editorial Publish Contract 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r45-editorial-publish-contract-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed contract only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" \
            -o /tmp/worker.out
          python - <<'PY'
          raw=open('/tmp/worker.out','rb').read().decode('utf-8','ignore')
          for needle in ['function createBufferEditorialMediaPost','function publicationStateFromBufferPost','/api/platform-publication-status','function getBufferPostStatus']:
              print('\n===== '+needle+' =====')
              i=raw.find(needle)
              if i<0:
                  print('NOT_FOUND'); continue
              print(raw[max(0,i-2500):min(len(raw),i+16000)])
          PY
