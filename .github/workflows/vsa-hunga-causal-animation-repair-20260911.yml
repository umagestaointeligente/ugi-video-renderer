name: VSA Hunga Causal Animation Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsa-hunga-causal-animation-repair-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsa-hunga-causal-animation-repair-20260911
  cancel-in-progress: false

jobs:
  repair_hunga_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zero-cost renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --quiet pillow numpy

      - name: Recover immutable approved master
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_COMMIT='bf7ba5e4a3a602780d228c0e5b995a423f733541'
          git fetch origin vsa-media-sep13-clean-20260910 --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$MEDIA_COMMIT"
          git show "$MEDIA_COMMIT:media/VSA_20260913_1300_HUNGA_TSUNAMI_FINAL.mp4" > /tmp/hunga_input.mp4
          test "$(stat -c%s /tmp/hunga_input.mp4)" -gt 100000
          sha256sum /tmp/hunga_input.mp4

      - name: Generate three causal mechanism animations
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/causal_anim.py <<'PY'
          import math, subprocess, pathlib
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          W,H=976,844
          FPS=30
          DUR=8.072
          N=round(DUR*FPS)
          OUT=pathlib.Path('/tmp/causal')
          OUT.mkdir(parents=True,exist_ok=True)

          font_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font_reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          FB=ImageFont.truetype(font_bold,38)
          FS=ImageFont.truetype(font_bold,28)
          FR=ImageFont.truetype(font_reg,24)

          def ocean_bg():
              arr=np.zeros((H,W,3),dtype=np.uint8)
              for y in range(H):
                  q=y/(H-1)
                  arr[y,:,0]=int(4+4*q)
                  arr[y,:,1]=int(22+18*(1-q))
                  arr[y,:,2]=int(48+38*(1-q))
              return Image.fromarray(arr,'RGB')

          def header(d,title,subtitle):
              d.text((36,26),title,font=FB,fill=(245,250,255))
              d.line((36,76,W-36,76),fill=(54,184,230),width=3)
              d.text((36,88),subtitle,font=FR,fill=(185,217,236))

          def encode(path,drawer):
              cmd=[
                  'ffmpeg','-y','-loglevel','error',
                  '-f','rawvideo','-pix_fmt','rgb24','-s',f'{W}x{H}','-r',str(FPS),'-i','-',
                  '-an','-c:v','libx264','-preset','veryfast','-crf','19','-pix_fmt','yuv420p',str(path)
              ]
              p=subprocess.Popen(cmd,stdin=subprocess.PIPE)
              for i in range(N):
                  p.stdin.write(np.asarray(drawer(i/FPS),dtype=np.uint8).tobytes())
              p.stdin.close()
              if p.wait()!=0:
                  raise SystemExit('ANIMATION_ENCODE_FAIL')

          def collapse_to_wave(t):
              im=ocean_bg(); d=ImageDraw.Draw(im)
              header(d,'COLAPSO SUBMARINO → ONDA','a água é deslocada pelo próprio colapso')
              sy=245
              collapse=max(0,min(1,(t-1.2)/2.0))
              wave=max(0,t-3.0)
              pts=[]
              for x in range(W):
                  amp=0.0
                  if wave>0:
                      for direction in (-1,1):
                          cx=W/2+direction*wave*95
                          amp += 23*math.exp(-((x-cx)/95)**2)*math.sin((x-cx)/34)
                  amp += 26*collapse*math.exp(-((x-W/2)/135)**2)*math.sin(math.pi*collapse)
                  pts.append((x,sy-amp))
              d.line(pts,fill=(82,210,255),width=5)
              for k in range(28):
                  x=(37*k*29+int(t*18*(k%3+1)))%W
                  y=280+(k*47)%430
                  r=2+(k%2)
                  d.ellipse((x-r,y-r,x+r,y+r),fill=(55,120,155))
              d.polygon([(0,730),(0,H),(W,H),(W,730),(700,695),(520,705),(300,690)],fill=(30,42,58))
              cx=W//2
              sink=int(95*collapse)
              peak=(cx,400+sink)
              d.polygon([(300,700),peak,(680,700)],fill=(69,70,78))
              crw=78+int(42*collapse)
              d.arc((cx-crw,peak[1]-20,cx+crw,peak[1]+45),0,180,fill=(245,129,58),width=6)
              if collapse>0:
                  for j in range(7):
                      phase=max(0,min(1,(t-1.2-j*0.12)/1.8))
                      x=cx-90+j*30+12*math.sin(j*2)
                      y=430+j*10+phase*190
                      r=9+(j%3)*3
                      d.rectangle((x-r,y-r,x+r,y+r),fill=(110,91,78))
              if 1.3<t<4.0:
                  a=min(1,(t-1.3)/0.8)
                  for dx in (-115,-55,55,115):
                      x=cx+dx; y0=520-int(90*a)
                      d.line((x,560,x,y0),fill=(255,201,74),width=7)
                      d.polygon([(x,y0-14),(x-9,y0+6),(x+9,y0+6)],fill=(255,201,74))
              if wave>0:
                  for direction in (-1,1):
                      x=cx+direction*min(350,wave*90); y=205
                      d.line((cx+direction*60,y,x,y),fill=(255,201,74),width=6)
                      if direction>0:
                          d.polygon([(x+15,y),(x-8,y-10),(x-8,y+10)],fill=(255,201,74))
                      else:
                          d.polygon([(x-15,y),(x+8,y-10),(x+8,y+10)],fill=(255,201,74))
              stage='1  estrutura desaba' if t<2.8 else ('2  água é empurrada' if t<4.7 else '3  ondas se propagam')
              d.text((36,790),stage,font=FS,fill=(255,214,92))
              return im

          def seismic_travel(t):
              im=Image.new('RGB',(W,H),(5,18,34)); d=ImageDraw.Draw(im)
              header(d,'VIBRAÇÃO VIAJA PELO SOLO','o colapso também deixa uma assinatura sísmica')
              d.rectangle((0,210,W,H),fill=(31,42,55))
              d.polygon([(0,320),(W,280),(W,390),(0,420)],fill=(42,58,69))
              d.polygon([(0,520),(W,460),(W,575),(0,635)],fill=(52,60,70))
              sx,sy=165,545
              d.polygon([(55,210),(145,330),(235,210)],fill=(62,68,74))
              d.ellipse((sx-17,sy-17,sx+17,sy+17),fill=(255,120,65))
              d.text((60,350),'origem do colapso',font=FS,fill=(240,246,250))
              sensor_x=790
              d.rectangle((sensor_x-40,150,sensor_x+40,220),fill=(170,188,198))
              d.rectangle((sensor_x-14,120,sensor_x+14,150),fill=(223,231,235))
              d.text((690,88),'sensor sísmico',font=FS,fill=(240,246,250))
              age=max(0,t-0.5)
              for k in range(5):
                  r=age*115-k*85
                  if 10<r<780:
                      box=(sx-r,sy-r*0.68,sx+r,sy+r*0.68)
                      d.arc(box,200,340,fill=(76,201,255),width=5)
                      d.arc(box,20,160,fill=(76,201,255),width=3)
              progress=max(0,min(1,(t-0.8)/5.0))
              ex=sx+(sensor_x-sx)*progress
              ey=sy-(sy-260)*progress
              d.line((sx,sy,ex,ey),fill=(255,210,78),width=5)
              if progress>0:
                  d.ellipse((ex-8,ey-8,ex+8,ey+8),fill=(255,230,140))
              d.rectangle((600,260,930,420),outline=(90,120,145),width=2)
              d.text((615,270),'registro',font=FR,fill=(190,215,230))
              arrival=5.5
              pts=[]
              for x in range(620,915):
                  u=(x-620)/295*3.0
                  if t<arrival:
                      y=355+2*math.sin(x/8)
                  else:
                      amp=45*math.exp(-max(0,u-1.3))*math.sin(u*17)
                      y=355-amp
                  pts.append((x,y))
              d.line(pts,fill=((111,235,155) if t>=arrival else (120,160,180)),width=3)
              if t>=arrival:
                  d.text((610,445),'chegada detectada',font=FS,fill=(255,214,92))
              d.text((36,790),'a vibração chega antes de parte do impacto costeiro',font=FS,fill=(255,214,92))
              return im

          def origin_reconstruction(t):
              im=Image.new('RGB',(W,H),(6,18,35)); d=ImageDraw.Draw(im)
              header(d,'SINAIS REVELAM A ORIGEM','estações distantes ajudam a reconstruir onde começou')
              d.rectangle((35,135,600,760),fill=(10,45,74),outline=(60,135,175),width=2)
              d.polygon([(45,160),(180,145),(230,230),(190,330),(95,310)],fill=(46,78,82))
              d.polygon([(420,500),(580,460),(590,650),(500,735),(430,690)],fill=(46,78,82))
              ox,oy=320,420
              d.ellipse((ox-10,oy-10,ox+10,oy+10),fill=(255,116,70))
              d.text((250,448),'Hunga Tonga',font=FR,fill=(235,242,247))
              stations=[(125,560),(515,225),(505,650)]
              for idx,(x,y) in enumerate(stations,1):
                  d.rectangle((x-18,y-18,x+18,y+18),fill=(195,205,215))
                  d.text((x-12,y-13),str(idx),font=FS,fill=(20,30,40))
              age=max(0,t-0.6); r=age*80
              if r<420:
                  d.ellipse((ox-r,oy-r,ox+r,oy+r),outline=(72,205,255),width=5)
              detections=[]
              for x,y in stations:
                  hit=t>0.6+math.hypot(x-ox,y-oy)/80
                  detections.append(hit)
                  if hit:
                      d.ellipse((x-28,y-28,x+28,y+28),outline=(255,211,76),width=5)
              d.text((650,145),'tempo de chegada',font=FS,fill=(240,246,250))
              for idx in range(3):
                  y=250+idx*150
                  d.text((650,y-38),f'estação {idx+1}',font=FR,fill=(190,215,230))
                  d.line((650,y,920,y),fill=(84,110,130),width=2)
                  if detections[idx]:
                      startt=1.2+idx*0.7
                      maxx=650+min(270,max(0,int((t-startt)*110)))
                      pts=[]
                      for x in range(650,max(651,maxx)):
                          u=(x-650)/35
                          amp=35*math.exp(-0.08*u)*math.sin(u*2.7)
                          pts.append((x,y-amp))
                      if len(pts)>1:
                          d.line(pts,fill=(111,235,155),width=3)
              if all(detections) and t>6.0:
                  for x,y in stations:
                      rr=int(math.hypot(x-ox,y-oy))
                      d.ellipse((x-rr,y-rr,x+rr,y+rr),outline=(255,211,76),width=2)
                  d.ellipse((ox-22,oy-22,ox+22,oy+22),outline=(255,255,255),width=4)
                  d.text((645,720),'origem reconstruída',font=FS,fill=(255,214,92))
              return im

          for name,drawer in [
              ('01_collapse_to_wave.mp4',collapse_to_wave),
              ('02_seismic_travel.mp4',seismic_travel),
              ('03_origin_reconstruction.mp4',origin_reconstruction),
          ]:
              encode(OUT/name,drawer)
          PY
          python /tmp/causal_anim.py

      - name: Replace only the three invalid mechanism panels
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i /tmp/hunga_input.mp4 \
            -i /tmp/causal/01_collapse_to_wave.mp4 \
            -i /tmp/causal/02_seismic_travel.mp4 \
            -i /tmp/causal/03_origin_reconstruction.mp4 \
            -filter_complex \
            "[1:v]setpts=PTS+8.072/TB[a1];\
             [2:v]setpts=PTS+24.216/TB[a2];\
             [3:v]setpts=PTS+40.360/TB[a3];\
             [0:v][a1]overlay=52:440:enable='between(t,8.072,16.144)'[v1];\
             [v1][a2]overlay=52:440:enable='between(t,24.216,32.288)'[v2];\
             [v2][a3]overlay=52:440:enable='between(t,40.360,48.432)'[vout]" \
            -map '[vout]' -map 0:a \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart \
            /tmp/VSA_20260913_1300_HUNGA_TSUNAMI_CAUSAL_REPAIR.mp4

      - name: Fail-closed causal motion QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qa.py <<'PY'
          import hashlib,json,pathlib,statistics,subprocess
          import numpy as np
          from PIL import Image

          src=pathlib.Path('/tmp/hunga_input.mp4')
          out=pathlib.Path('/tmp/VSA_20260913_1300_HUNGA_TSUNAMI_CAUSAL_REPAIR.mp4')
          if not out.exists() or out.stat().st_size<500000:
              raise SystemExit('FINAL_MASTER_MISSING')

          probe=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries',
              'format=duration:stream=codec_name,width,height,r_frame_rate',
              '-of','json',str(out)
          ],text=True))
          v=next(s for s in probe['streams'] if s.get('width'))
          if (v['width'],v['height'])!=(1080,1920):
              raise SystemExit('FORMAT_FAIL')
          if v['r_frame_rate']!='30/1':
              raise SystemExit('FPS_FAIL')
          dur=float(probe['format']['duration'])
          if not 52.0<=dur<=53.2:
              raise SystemExit('DURATION_FAIL')

          def motion(start,end,idx):
              td=pathlib.Path(f'/tmp/motion{idx}')
              td.mkdir(exist_ok=True)
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-ss',str(start),'-t',str(end-start),
                  '-i',str(out),'-vf','crop=976:844:52:440,fps=1,scale=244:210',
                  str(td/'f_%02d.png')
              ],check=True)
              fs=sorted(td.glob('f_*.png'))
              arr=[np.asarray(Image.open(f).convert('L'),dtype=np.float32) for f in fs]
              dif=[float(np.mean(np.abs(arr[i]-arr[i-1]))) for i in range(1,len(arr))]
              med=statistics.median(dif)
              active=sum(d>0.8 for d in dif)
              if med<=1.0 or active<5:
                  raise SystemExit(f'CAUSAL_MOTION_FAIL segment={idx} median={med:.3f} active={active}')
              return {'median_abs_diff':round(med,3),'active_transitions':active,'samples':len(dif)}

          metrics=[
              motion(8.072,16.144,1),
              motion(24.216,32.288,2),
              motion(40.360,48.432,3),
          ]

          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):
                      h.update(b)
              return h.hexdigest()

          receipt={
              'schema':'VSA_CAUSAL_ANIMATION_REPAIR_V1',
              'id':'HUNGA_TSUNAMI',
              'source_media_commit':'bf7ba5e4a3a602780d228c0e5b995a423f733541',
              'source_master_sha256':sha(src),
              'output_master':out.name,
              'output_sha256':sha(out),
              'legacy_static_cause_effect_template_used':False,
              'mechanism_segments':[
                  'submarine_collapse_displaces_water',
                  'seismic_wave_travels_through_ground',
                  'distant_stations_reconstruct_origin'
              ],
              'causal_motion_gate':'PASS',
              'motion_metrics':metrics,
              'audio_stream_preserved_from_source':True,
              'schedule_mutated':False,
              'release_eligible':False,
              'human_review_required':True
          }
          pathlib.Path('/tmp/HUNGA_CAUSAL_REPAIR_QA.json').write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY
          python /tmp/qa.py

      - uses: actions/upload-artifact@v4
        with:
          name: vsa-hunga-causal-animation-repair
          path: |
            /tmp/VSA_20260913_1300_HUNGA_TSUNAMI_CAUSAL_REPAIR.mp4
            /tmp/HUNGA_CAUSAL_REPAIR_QA.json
          if-no-files-found: error
