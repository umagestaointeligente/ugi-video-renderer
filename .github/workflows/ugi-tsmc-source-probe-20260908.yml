name: UGI TSMC Official Source Probe 2026-09-08
on:
  push:
    paths:
      - 'scripts/ugi_tsmc_source_probe_20260908.py'
      - '.github/workflows/ugi-tsmc-source-probe-20260908.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp
      - name: Download TSMC corporate footage
        run: |
          mkdir -p public/ugi/editorial/2026-09-08/tsmc_source_probe
          # Same TSMC Arizona corporate films shot for the company, mirrored by the DOP portfolio.
          # YouTube blocks unauthenticated GitHub runners, so Vimeo is used only as media transport.
          yt-dlp --no-playlist -f 'bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best' --merge-output-format mp4 -o public/ugi/editorial/2026-09-08/tsmc_source_probe/tsmc_arizona.mp4 'https://vimeo.com/1196413503'
          yt-dlp --no-playlist -f 'bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best' --merge-output-format mp4 -o public/ugi/editorial/2026-09-08/tsmc_source_probe/tsmc_corporate.mp4 'https://vimeo.com/1196567149'
      - name: Build visual QA contact sheets
        run: python scripts/ugi_tsmc_source_probe_20260908.py
      - name: Persist only QA contact sheets
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'ugi-editorial-video-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08/tsmc_source_probe/*_contact.jpg
          git commit -m 'qa: TSMC corporate footage contact sheets' || exit 0
          git push
