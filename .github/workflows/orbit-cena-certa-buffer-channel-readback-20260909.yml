name: Orbit Cena Certa Buffer Channel Readback 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/orbit-cena-certa-buffer-channel-readback-20260909.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Read Buffer channel identities safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_LOLA_COMMAND_KEY"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          curl --fail --silent --show-error \
            -H "x-lola-command-key: $UGI_LOLA_COMMAND_KEY" \
            -H 'accept: application/json' \
            "$WORKER_URL/api/buffer/channels" > /tmp/channels.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/channels.json'))
          print('ORBIT_BUFFER_CHANNEL_READBACK_V1')
          print('ok='+str(bool(d.get('ok'))).lower())
          org=d.get('organization') or {}
          print('organization_name='+str(org.get('name') or org.get('displayName') or ''))
          for c in d.get('channels') or []:
              print('channel service=%s name=%s displayName=%s id=%s paused=%s' % (
                  c.get('service'), c.get('name'), c.get('displayName'), c.get('id'), c.get('isQueuePaused')))
          PY
