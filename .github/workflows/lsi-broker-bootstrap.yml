name: LSI Broker Bootstrap
run-name: LSI Broker Bootstrap ${{ github.run_id }}

on:
  push:
    branches:
      - lsi-zero-cost-broker-pilot-20260828
    paths:
      - 'cloudflare/lsi-zero-cost-broker.mjs'
      - 'cloudflare/wrangler.lsi-broker.toml'
      - '.github/workflows/lsi-broker-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_URL: https://lsi-zero-cost-broker.umagestaointeligente.workers.dev
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require autonomous Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'HARD_STOP_CLOUDFLARE_TOKEN_MISSING'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'HARD_STOP_CLOUDFLARE_ACCOUNT_MISSING'; exit 1; }

      - name: Generate broker encryption keypair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
            modulusLength: 2048,
            publicExponent: 0x10001,
          });
          const pub = publicKey.export({ format: 'jwk' });
          const priv = privateKey.export({ format: 'jwk' });
          fs.writeFileSync('cloudflare/lsi-broker-public.jwk.json', JSON.stringify(pub, null, 2) + '\n');
          fs.writeFileSync('/tmp/lsi-broker-private.jwk.json', JSON.stringify(priv));
          NODE
          test -s cloudflare/lsi-broker-public.jwk.json
          test -s /tmp/lsi-broker-private.jwk.json
          echo 'BROKER_KEYPAIR_GENERATED=true' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy isolated LSI broker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --config cloudflare/wrangler.lsi-broker.toml

      - name: Install private broker key in Cloudflare secret storage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          private_jwk="$(cat /tmp/lsi-broker-private.jwk.json)"
          echo "::add-mask::$private_jwk"
          printf '%s' "$private_jwk" | npx --yes wrangler@4.32.0 secret put BROKER_PRIVATE_JWK --config cloudflare/wrangler.lsi-broker.toml >/tmp/broker-secret-put.log 2>&1
          rm -f /tmp/lsi-broker-private.jwk.json
          sleep 3
          echo 'BROKER_PRIVATE_KEY_INSTALLED=true' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify broker health
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$WORKER_URL/health")"
            if [ "$code" = '200' ] && jq -e '.ok == true and .workers_ai_bound == true and .broker_key_configured == true and .external_paid_provider == false' /tmp/health.json >/dev/null; then
              break
            fi
            sleep 3
          done
          jq -e '.ok == true and .workers_ai_bound == true and .broker_key_configured == true and .external_paid_provider == false' /tmp/health.json >/dev/null
          echo 'LSI_BROKER_HEALTH=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public encryption key to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LSI Broker Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/lsi-broker-public.jwk.json
          if git diff --cached --quiet; then
            echo 'PUBLIC_KEY_UNCHANGED=true' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'LSI: publish broker public encryption key'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'PUBLIC_KEY_PUBLISHED=true' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          cat > generated/evidence/lsi-broker-bootstrap.json <<JSON
          {
            "schema_version": "1.0",
            "project": "LSI",
            "worker": "lsi-zero-cost-broker",
            "run_id": "${GITHUB_RUN_ID}",
            "commit_sha": "${GITHUB_SHA}",
            "workers_ai": true,
            "encryption": "RSA-OAEP-256+A256GCM",
            "oidc_required": true,
            "production_publication": false,
            "external_paid_provider": false,
            "private_key_exposed": false,
            "status": "BOOTSTRAPPED"
          }
          JSON

      - name: Upload bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: lsi-broker-bootstrap-${{ github.run_id }}
          path: generated/evidence/lsi-broker-bootstrap.json
          retention-days: 14
          if-no-files-found: error
