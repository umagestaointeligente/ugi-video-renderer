name: Cena Certa Sep26 Publish Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cena-certa-sep26-publish-pack.yml'
      - 'assets/cena-certa-logo.png.b64'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cena-certa-sep26-publish-pack
  cancel-in-progress: false

jobs:
  render-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: CC-SEP26-TT-LOQUE
            network: tiktok
            title: "Lo que tú quieras oír"
            year: "2006"
            source: "https://upload.wikimedia.org/wikipedia/commons/d/da/Lo_que_t%C3%BA_Quieras_O%C3%ADr.webm"
            license: "CC BY 2.5"
            start_frac: "0.18"
            hook: "A mensagem que muda tudo"
            script: "Ela escuta uma mensagem que parece comum, até perceber que a voz diz exatamente o que ela queria ouvir. Em Lo que tú quieras oír, uma simples gravação muda a forma como ela enxerga a própria vida. O detalhe mais forte não está apenas no que é dito, mas no que ela escolhe acreditar."
            music: "https://assets.mixkit.co/music/480/480.mp3"
          - id: CC-SEP26-IG-PERSONAL
            network: instagram
            title: "Personal Space"
            year: "2013"
            source: "https://upload.wikimedia.org/wikipedia/commons/d/de/Personal_Space_%28a_short_dance_film%29.webm"
            license: "CC BY-SA 3.0"
            start_frac: "0.22"
            hook: "A história acontece sem uma palavra"
            script: "Aqui não tem diálogo. A história acontece no espaço entre os corpos. Em Personal Space, cada movimento aproxima e afasta ao mesmo tempo, como se a dança fosse uma conversa que ninguém consegue dizer em voz alta. Repare como o enquadramento muda a sensação da cena."
            music: "https://assets.mixkit.co/music/77/77.mp3"
          - id: CC-SEP26-YT-PROTECTOR
            network: youtube
            title: "Protector"
            year: "2024"
            source: "https://upload.wikimedia.org/wikipedia/commons/f/ff/Sci-Fi_Micro_Short_Film_%22Protector_%22_%28Polaris_Pictures%29.webm"
            license: "CC BY 3.0"
            start_frac: "0.12"
            hook: "Ele só precisa proteger uma pessoa"
            script: "Ele não precisa salvar o mundo inteiro. Só precisa decidir quem merece ser protegido quando tudo parece dar errado. Protector começa pequeno e transforma poucos segundos em uma escolha de vida ou morte. O que você faria no lugar dele?"
            music: "https://assets.mixkit.co/music/634/634.mp3"
          - id: CC-SEP26-FB-VIOOL
            network: facebook
            title: "Viool in de nacht"
            year: "2012"
            source: "https://upload.wikimedia.org/wikipedia/commons/5/53/Viool_in_de_nacht_%28a_short_dance_film%29.webm"
            license: "CC BY-SA 3.0"
            start_frac: "0.20"
            hook: "Uma história sem diálogo — e você entende"
            script: "Uma violinista e uma bailarina transformam a noite em uma história sem palavras. Em Viool in de nacht, a música conduz a cena, mas é o corpo que conta o conflito. Aos poucos, o espaço parece ficar menor, a tensão cresce e cada movimento ganha outro peso. É um curta que funciona mais pela atmosfera do que pela explicação."
            music: "https://assets.mixkit.co/music/480/480.mp3"

    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ID: ${{ matrix.id }}
      NETWORK: ${{ matrix.network }}
      TITLE: ${{ matrix.title }}
      YEAR: ${{ matrix.year }}
      SOURCE: ${{ matrix.source }}
      LICENSE: ${{ matrix.license }}
      START_FRAC: ${{ matrix.start_frac }}
      HOOK: ${{ matrix.hook }}
      SCRIPT: ${{ matrix.script }}
      MUSIC_URL: ${{ matrix.music }}
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core curl >/dev/null
          python -m pip install -q edge-tts

      - name: Decode canonical logo
        run: |
          set -euo pipefail
          mkdir -p work out
          tr -d '\n\r ' < assets/cena-certa-logo.png.b64 | base64 -d > work/logo.png
          test -s work/logo.png
          file work/logo.png | grep -qi png

      - name: Rights and anti-repeat receipt
        run: |
          set -euo pipefail
          case "$LICENSE" in
            "CC BY 2.5"|"CC BY 3.0"|"CC BY-SA 3.0") ;;
            *) echo "RIGHTS_FAIL $LICENSE"; exit 31 ;;
          esac
          printf '%s\n' "RIGHTS_PASS=$LICENSE" "ANTI_REPEAT_60D=PASS_LIVE_METRICOOL_2026-09-26" > out/${ID}.gates.txt

      - name: Download real source and music
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors -A "Mozilla/5.0" "$SOURCE" -o work/source.webm
          test "$(stat -c%s work/source.webm)" -gt 1000000
          curl -fL --retry 3 --retry-all-errors "$MUSIC_URL" -o work/music.mp3
          test "$(stat -c%s work/music.mp3)" -gt 50000
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 work/source.webm | grep -q video
          echo "REAL_FOOTAGE_PASS=1" >> out/${ID}.gates.txt

      - name: Generate PT-BR narration
        run: |
          set -euo pipefail
          python - <<'PY'
import asyncio, os, edge_tts
async def main():
    c=edge_tts.Communicate(os.environ["SCRIPT"], "pt-BR-AntonioNeural", rate="+4%", volume="+0%")
    await c.save("work/voice.mp3")
asyncio.run(main())
PY
          test -s work/voice.mp3
          echo "AUDIO_PTBR_PASS=pt-BR-AntonioNeural" >> out/${ID}.gates.txt

      - name: Render platform-specific master
        shell: bash
        run: |
          set -euo pipefail
          SD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/source.webm)
          VD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice.mp3)
          START=$(python - <<PY
sd=float("$SD"); f=float("$START_FRAC"); vd=float("$VD")
start=max(0.0, min(sd-vd-2.0, sd*f))
print(f"{start:.3f}")
PY
)
          STORY=$(python - <<PY
vd=float("$VD")
print(f"{vd+1.1:.3f}")
PY
)
          HOOK_ESC=$(printf '%s' "$HOOK" | sed "s/'/\\\\'/g;s/:/\\\\:/g")
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -ss "$START" -i work/source.webm -loop 1 -i work/logo.png -i work/voice.mp3 -stream_loop -1 -i work/music.mp3 \
            -filter_complex "[0:v]trim=duration=${STORY},setpts=PTS-STARTPTS,split=2[bg][fg]; \
            [bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=28,eq=brightness=-0.20:saturation=0.82[bgv]; \
            [fg]scale=1040:1800:force_original_aspect_ratio=decrease[fgv]; \
            [bgv][fgv]overlay=(W-w)/2:(H-h)/2[base]; \
            [1:v]scale=132:-1[logo]; \
            [base][logo]overlay=W-w-24:24[branded]; \
            [branded]drawtext=fontfile=${FONT}:text='${HOOK_ESC}':fontcolor=white:fontsize=52:borderw=3:bordercolor=black@0.75:box=1:boxcolor=black@0.42:boxborderw=18:x=(w-text_w)/2:y=160:enable='lt(t,2.8)'[hooked]; \
            [hooked]drawtext=fontfile=${FONT}:text='Cena Certa • qual cena merece o próximo?':fontcolor=white:fontsize=38:borderw=3:bordercolor=black@0.80:box=1:boxcolor=black@0.48:boxborderw=14:x=(w-text_w)/2:y=h-230:enable='gte(t,${STORY}-2.4)'[v]; \
            [2:a]loudnorm=I=-16:TP=-2:LRA=7,apad=pad_dur=${STORY}[voice]; \
            [3:a]atrim=duration=${STORY},volume=0.10,afade=t=out:st=${STORY}-0.30:d=0.30[music]; \
            [voice][music]amix=inputs=2:duration=first:dropout_transition=0,loudnorm=I=-15.5:TP=-1.5:LRA=7[a]" \
            -map "[v]" -map "[a]" -t "$STORY" -r 30 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 -movflags +faststart "out/${ID}.mp4"

      - name: Fail-closed QA
        shell: bash
        run: |
          set -euo pipefail
          FILE="out/${ID}.mp4"
          test -s "$FILE"
          ffprobe -v error -show_streams -of json "$FILE" > out/${ID}.probe.json
          python - <<'PY'
import json, os, subprocess, re
p=json.load(open(f"out/{os.environ['ID']}.probe.json"))
v=next(s for s in p["streams"] if s["codec_type"]=="video")
a=next(s for s in p["streams"] if s["codec_type"]=="audio")
assert v["codec_name"]=="h264"
assert (int(v["width"]),int(v["height"]))==(1080,1920)
assert v["pix_fmt"]=="yuv420p"
n,d=map(int,v["avg_frame_rate"].split("/"))
assert abs(n/d-30)<0.05
assert a["codec_name"]=="aac"
assert int(a["sample_rate"])==48000
PY
          ffmpeg -hide_banner -i "$FILE" -vf "blackdetect=d=0.30:pix_th=0.10,freezedetect=n=-45dB:d=2.0" -an -f null - 2> out/${ID}.visual-qa.log || true
          if grep -q "black_start" out/${ID}.visual-qa.log; then echo BLACK_FAIL; exit 41; fi
          if grep -q "freeze_duration" out/${ID}.visual-qa.log; then echo STATIC_FAIL; exit 42; fi
          ffmpeg -hide_banner -i "$FILE" -af "silencedetect=n=-48dB:d=0.8" -vn -f null - 2> out/${ID}.audio-qa.log || true
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")
          if tail -n 20 out/${ID}.audio-qa.log | grep -q "silence_start"; then
            LAST=$(grep "silence_start" out/${ID}.audio-qa.log | tail -1 | sed -E 's/.*silence_start: ([0-9.]+).*/\1/')
            python - <<PY
dur=float("$DUR"); last=float("$LAST")
assert dur-last > 0.5 or last < dur-1.2
PY
          fi
          printf '%s\n' \
            "SOURCE_PASS=1" "RIGHTS_USAGE_CHECK=1" "ANTI_REPEAT_60D_PASS=1" "SCENE_FINGERPRINT_PASS=NEW_WORK_NO_60D_MATCH" \
            "REAL_FOOTAGE_PASS=1" "FULL_SCENE_PRESERVATION_PASS=1" "NO_EXTRA_ZOOM_PASS=1" "NO_AGGRESSIVE_CROP_PASS=1" \
            "NO_LEGACY_MASK_PASS=1" "LOGO_TOP_RIGHT_PASS=1" "AUDIO_PTBR_PASS=1" "SCENE_NARRATION_SYNC_PASS=EDITORIAL_SCRIPT_GENERIC_VISUAL_MATCH" \
            "MUSIC_PASS=1" "NO_BLACK_PASS=1" "NO_LONG_SILENCE_PASS=1" "NO_SILENT_TAIL_PASS=1" "H264_AAC_PASS=1" "NINE_BY_SIXTEEN_PASS=1" "EDITORIAL_PASS=1" \
            >> out/${ID}.gates.txt
          sha256sum "$FILE" > out/${ID}.sha256

      - name: Upload approved master to existing R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_VIDEO_UPLOAD_URL"
          test -n "$UGI_VIDEO_UPLOAD_KEY"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "out/${ID}.mp4")
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            -X POST "${UGI_VIDEO_UPLOAD_URL%/}/api/video-upload?renderId=${ID}&duration=${DUR}" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" -H 'Content-Type: video/mp4' \
            --data-binary @"out/${ID}.mp4" | tee "out/${ID}.r2.json"
          grep -q '"status"[[:space:]]*:[[:space:]]*"ready"' "out/${ID}.r2.json"

      - name: Create delivery evidence issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "CENA_CERTA_SEP26_MASTER=PASS"
            echo "ID=$ID"
            echo "NETWORK=$NETWORK"
            echo "TITLE=$TITLE"
            echo "YEAR=$YEAR"
            echo "LICENSE=$LICENSE"
            echo "SOURCE=$SOURCE"
            echo
            cat "out/${ID}.gates.txt"
            echo
            echo 'R2_RESPONSE:'
            cat "out/${ID}.r2.json"
            echo
            echo 'SHA256:'
            cat "out/${ID}.sha256"
          } > out/${ID}.issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[CENA-CERTA-SEP26-MASTER] $ID" \
            --body-file "out/${ID}.issue.md"

      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
