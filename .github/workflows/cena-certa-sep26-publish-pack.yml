name: Cena Certa Sep26 Publish Pack
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep26-publish-pack.yml
      - scripts/cena_certa_sep26_pack.py
      - ops/cena-certa-sep26/manifest.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl fonts-dejavu-core >/dev/null
          python -m pip install -q edge-tts
      - name: Render QA and deliver
        run: |
          set -euo pipefail
          python scripts/cena_certa_sep26_pack.py
      - name: Publish approved masters as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cena-certa-sep26-recovery
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Sep26 Recovery" --notes "Approved QA masters for Metricool ingestion."
          gh release upload "$TAG" out/cena-certa-sep26/*.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          python - <<'PY'
import json, pathlib
base="https://github.com/umagestaointeligente/ugi-video-renderer/releases/download/cena-certa-sep26-recovery/"
out={}
for p in pathlib.Path("out/cena-certa-sep26").glob("*.mp4"):
    out[p.stem]=base+p.name
pathlib.Path("out/cena-certa-sep26/public-media.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
PY
      - name: Create evidence issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "CENA_CERTA_SEP26_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo
            echo 'PUBLIC_MEDIA:'
            cat out/cena-certa-sep26/public-media.json
            echo
            echo 'DELIVERY_SUMMARY:'
            echo '~~~json'
            cat out/cena-certa-sep26/delivery-summary.json
            echo '~~~'
          } > /tmp/cc-issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-SEP26-PACK] $GITHUB_RUN_ID" --body-file /tmp/cc-issue.md
      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cena-certa-sep26-pack-${{ github.run_id }}
          path: out/cena-certa-sep26/
          retention-days: 7
          if-no-files-found: warn
