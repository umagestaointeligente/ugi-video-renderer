name: Cena Certa Oct08 Benchmark Pack
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct08-breakout-pack.yml
      - scripts/cena_certa_oct08_pack.py
      - ops/cena-certa-oct08/manifest.json
      - ops/cena-certa-oct08/anti-repeat-snapshot.json
      - ops/cena-certa-oct08/history_media.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cena-certa-oct08-benchmark-pack
  cancel-in-progress: true

jobs:
  render-gate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cena_certa_render_evidence_guard.py
            scripts/cena_certa_media_safety.py
            scripts/cena_certa_oct08_pack.py
            ops/cena-certa-oct08
            assets/cena-certa-logo.png.b64
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp

      - name: Render and run all fail-closed gates
        run: |
          set -euo pipefail
          python scripts/cena_certa_oct08_pack.py

      - name: Require current execution-bound editorial evidence
        run: |
          set -euo pipefail
          python scripts/cena_certa_render_evidence_guard.py out/cena-certa-oct08/summary.json ops/cena-certa-oct08/prepublish-receipts.json out/cena-certa-oct08/release-preflight.json

      - name: Publish QA-approved network masters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for network in tiktok instagram youtube facebook; do
            tag="cena-certa-oct08-${network}"
            gh release view "${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||               gh release create "${tag}" --repo "$GITHUB_REPOSITORY"                 --title "Cena Certa Oct08 ${network}"                 --notes "Cena Certa 2.8 Oct08 benchmark test. Real scenes, original PT-BR dialogue, no narration. Released only after 60d source-window and temporal scene-sequence gates."
            gh release upload "${tag}" out/cena-certa-oct08/${network}/*.mp4 --repo "$GITHUB_REPOSITORY"
          done

      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/cena_certa_render_evidence_guard.py out/cena-certa-oct08/summary.json ops/cena-certa-oct08/prepublish-receipts.json out/cena-certa-oct08/release-preflight.json
          {
            echo "CENA_CERTA_OCT08_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "PUBLICATION_STATUS=NOT_VERIFIED"
            echo "COMMIT=$GITHUB_SHA"
            echo
            cat out/cena-certa-oct08/summary.json
          } > out/cena-certa-oct08/evidence.txt
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "[CENA-CERTA-OCT08-BENCHMARK] $GITHUB_RUN_ID"             --body-file out/cena-certa-oct08/evidence.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-oct08-benchmark-${{ github.run_id }}
          path: out/cena-certa-oct08/
          retention-days: 7
