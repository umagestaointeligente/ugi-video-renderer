name: LSI Cloudflare Specialists Pilot
run-name: LSI CF Specialists ${{ github.run_id }}

on:
  push:
    branches:
      - lsi-cf-specialists-pilot-20260829
    paths:
      - '.github/workflows/lsi-cf-specialists-pilot.yml'
      - 'cloudflare/lsi-cf-specialists-pilot.mjs'
      - 'cloudflare/wrangler.lsi-cf-specialists-pilot.toml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://lsi-cf-specialists-pilot.umagestaointeligente.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require existing deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy isolated specialist probe worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --config cloudflare/wrangler.lsi-cf-specialists-pilot.toml

      - name: Probe three specialist models through env.AI binding
        shell: bash
        run: |
          set -euo pipefail
          code='000'
          for i in 1 2 3 4 5; do
            code="$(curl --silent --show-error --output /tmp/probe.json --write-out '%{http_code}' "$WORKER_URL/probe")"
            [ "$code" = '200' ] && break
            sleep 2
          done
          test "$code" = '200' || { echo "HARD_STOP_PROBE_HTTP_$code"; cat /tmp/probe.json; exit 1; }
          jq -e '.ok == true and .glm_ok == true and .gemma_ok == true and .flux_ok == true and .external_paid_provider == false' /tmp/probe.json >/dev/null
          echo 'CF_GLM_4_7_FLASH=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CF_GEMMA_4_26B=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CF_FLUX_1_SCHNELL=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "BATCH_ELAPSED_MS=$(jq -r '.elapsed_ms' /tmp/probe.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Write sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          elapsed="$(jq -r '.elapsed_ms' /tmp/probe.json)"
          cat > generated/evidence/lsi-cf-specialists-pilot.json <<JSON
          {"schema_version":"1.0","route":"cloudflare_workers_ai_binding","specialists":[{"role":"fast_text","model":"@cf/zai-org/glm-4.7-flash","ok":true},{"role":"deep_vision","model":"@cf/google/gemma-4-26b-a4b-it","ok":true},{"role":"image","model":"@cf/black-forest-labs/flux-1-schnell","ok":true}],"elapsed_ms":${elapsed},"external_paid_provider":false,"production_changed":false,"publication":false,"run_id":"${GITHUB_RUN_ID}"}
          JSON

      - name: Upload sanitized receipt
        uses: actions/upload-artifact@v4
        with:
          name: lsi-cf-specialists-pilot-${{ github.run_id }}
          path: generated/evidence/lsi-cf-specialists-pilot.json
          retention-days: 7

      - name: Delete isolated pilot Worker
        if: always()
        shell: bash
        run: |
          npx --yes wrangler@4.32.0 delete --config cloudflare/wrangler.lsi-cf-specialists-pilot.toml --force || true
