name: LOLA Growth Pop T9 Artifact Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lola-growth-pop-t9-artifact-only
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core curl
      - name: Fetch CC0 phone visual
        run: |
          mkdir -p assets out
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/0/03/%D0%9D%D0%BE%D0%B2%D1%8B%D0%B9_Nokia_3310.png' -o assets/nokia3310-cc0.png
          test -s assets/nokia3310-cc0.png
      - name: Render T9 V3 multi-scene canary
        run: |
          ffmpeg -y -loop 1 -i assets/nokia3310-cc0.png -f lavfi -i 'anullsrc=channel_layout=stereo:sample_rate=48000' -t 34 \
            -filter_complex "[0:v]scale=900:-1,format=rgba[phone];color=c=0x0d0f12:s=1080x1920:r=30:d=34[bg];[bg][phone]overlay=(W-w)/2:390:shortest=1[base];[base]drawbox=x=0:y=0:w=1080:h=1920:color=black@0.10:t=fill:enable='between(t,0,1.5)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='VOCE AINDA CONSEGUE?':fontcolor=white:fontsize=70:x=(w-text_w)/2:y=150:enable='between(t,0,1.5)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='SEM OLHAR: ONDE FICA O S?':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=150:enable='between(t,1.5,4)',crop=1080:1920:0:0,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='NAO VALE OLHAR AS LETRAS':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=1450:enable='between(t,4,8)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='7  PQRS':fontcolor=white:fontsize=90:x=(w-text_w)/2:y=1450:enable='between(t,8,11)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='2 ABC   6 MNO   9 WXYZ':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=1450:enable='between(t,11,17)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='O DEDO LEMBRAVA ANTES DA CABECA':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=150:enable='between(t,17,23)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='HOJE A GENTE OLHA. ANTES, SENTIA AS TECLAS.':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=150:enable='between(t,23,29)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='QUAL PALAVRA VOCE DIGITAVA SEM OLHAR?':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=1450:enable='between(t,29,34)'[v]" \
            -map '[v]' -map 1:a -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -shortest -movflags +faststart out/lola-pop-t9-v3-canary.mp4
      - name: Fail-closed technical and human-proxy QA
        run: |
          test -s out/lola-pop-t9-v3-canary.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration -of default=nw=1 out/lola-pop-t9-v3-canary.mp4 | tee out/probe-video.txt
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of default=nw=1 out/lola-pop-t9-v3-canary.mp4 | tee out/probe-audio.txt
          grep -q 'codec_name=h264' out/probe-video.txt
          grep -q 'width=1080' out/probe-video.txt
          grep -q 'height=1920' out/probe-video.txt
          grep -q 'pix_fmt=yuv420p' out/probe-video.txt
          grep -q 'r_frame_rate=30/1' out/probe-video.txt
          grep -q 'codec_name=aac' out/probe-audio.txt
          cat > out/HUMAN_QA_REQUIRED.txt <<'EOF'
          HOLD: artifact is a pacing/scene-cadence canary, not publication-ready.
          Required before distribution: real PT-BR narration or meaningful native audio; visual inspection; no static-placeholder feel.
          Publication remains disabled.
          EOF
      - name: Write provenance receipt
        run: |
          cat > out/provenance.txt <<'EOF'
          Visual: Wikimedia Commons file Novo Nokia 3310.png
          Source: https://commons.wikimedia.org/wiki/File:Новый_Nokia_3310.png
          License: CC0 1.0 Universal / Public Domain Dedication
          Purpose: LOLA Pop T9 V3 isolated pacing canary
          Publication: disabled in this workflow
          EOF
      - name: Upload artifact only
        uses: actions/upload-artifact@v4
        with:
          name: lola-pop-t9-v3-canary
          path: out/
          retention-days: 1
          if-no-files-found: error
