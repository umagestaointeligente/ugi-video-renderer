name: LOLA Growth Pop T9 Artifact Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lola-growth-pop-t9-artifact-only
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render isolated T9 canary
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=0x111111:s=1080x1920:r=30:d=32 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='VOCE DIGITAVA SEM OLHAR?':fontcolor=white:fontsize=70:x=(w-text_w)/2:y=250:enable='between(t,0,4)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='2  ABC    3  DEF':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=760:enable='between(t,0,10)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='4  GHI    5  JKL    6  MNO':fontcolor=white:fontsize=56:x=(w-text_w)/2:y=900:enable='between(t,2,14)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='7 PQRS    8 TUV    9 WXYZ':fontcolor=white:fontsize=56:x=(w-text_w)/2:y=1040:enable='between(t,4,18)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ERA MEMORIA MUSCULAR.':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=520:enable='between(t,12,23)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='QUAL PALAVRA VOCE ESCREVIA SEM OLHAR?':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=1320:enable='between(t,23,32)'" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -movflags +faststart -an out/lola-pop-t9-canary.mp4
      - name: Fail-closed technical QA
        run: |
          test -s out/lola-pop-t9-canary.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration -of default=nw=1 out/lola-pop-t9-canary.mp4 | tee out/probe.txt
          grep -q 'codec_name=h264' out/probe.txt
          grep -q 'width=1080' out/probe.txt
          grep -q 'height=1920' out/probe.txt
          grep -q 'pix_fmt=yuv420p' out/probe.txt
          grep -q 'r_frame_rate=30/1' out/probe.txt
      - name: Upload artifact only
        uses: actions/upload-artifact@v4
        with:
          name: lola-pop-t9-canary
          path: out/
          retention-days: 1
          if-no-files-found: error
