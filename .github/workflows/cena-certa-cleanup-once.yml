name: Cena Certa Scoped Cleanup Once

on:
  push:
    branches: [feat/cena-certa-factory-v2-bridge]
    paths: ['.github/workflows/cena-certa-cleanup-once.yml']

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only Cena Certa Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.size_in_bytes] | @tsv' > "$tmp/artifacts.tsv" || true
          awk -F '\t' 'BEGIN{IGNORECASE=1} $2 ~ /(cena-certa|cena_certa|cc-factory|cc-20260903|factory-v2)/ {print}' "$tmp/artifacts.tsv" > "$tmp/cena-artifacts.tsv" || true
          before_artifacts=$(wc -l < "$tmp/cena-artifacts.tsv" | tr -d ' ')
          before_bytes=$(awk -F '\t' '{s+=$3} END{printf "%.0f",s+0}' "$tmp/cena-artifacts.tsv")
          while IFS=$'\t' read -r id name size; do
            [ -n "${id:-}" ] || continue
            echo "DELETE_ARTIFACT id=$id name=$name bytes=$size"
            gh api --method DELETE "/repos/$REPO/actions/artifacts/$id"
          done < "$tmp/cena-artifacts.tsv"

          gh api "/repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[] | [.id,.key,.size_in_bytes] | @tsv' > "$tmp/caches.tsv" || true
          awk -F '\t' 'BEGIN{IGNORECASE=1} $2 ~ /(cena-certa|cena_certa|cc-factory|factory-v2)/ {print}' "$tmp/caches.tsv" > "$tmp/cena-caches.tsv" || true
          before_caches=$(wc -l < "$tmp/cena-caches.tsv" | tr -d ' ')
          before_cache_bytes=$(awk -F '\t' '{s+=$3} END{printf "%.0f",s+0}' "$tmp/cena-caches.tsv")
          while IFS=$'\t' read -r id key size; do
            [ -n "${id:-}" ] || continue
            echo "DELETE_CACHE id=$id key=$key bytes=$size"
            gh api --method DELETE "/repos/$REPO/actions/caches/$id"
          done < "$tmp/cena-caches.tsv"

          for branch in cena-certa-batch-20260903 cena-certa-publish-20260903; do
            if gh api "/repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "DELETE_BRANCH $branch"
              gh api --method DELETE "/repos/$REPO/git/refs/heads/$branch"
            else
              echo "BRANCH_ALREADY_ABSENT $branch"
            fi
          done

          gh api --paginate "/repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id,.name] | @tsv' > "$tmp/runs.tsv" || true
          awk -F '\t' '$2=="Cena Certa canonical GitLab -> R2 2026-09-04" || $2=="Cena Certa V2 Snapshot Sync Once" {print}' "$tmp/runs.tsv" > "$tmp/legacy-runs.tsv" || true
          legacy_runs=$(wc -l < "$tmp/legacy-runs.tsv" | tr -d ' ')
          while IFS=$'\t' read -r id name; do
            [ -n "${id:-}" ] || continue
            echo "DELETE_LEGACY_RUN id=$id name=$name"
            gh api --method DELETE "/repos/$REPO/actions/runs/$id"
          done < "$tmp/legacy-runs.tsv"

          cat > cleanup-report.json <<JSON
          {"schema":"CENA_CERTA_CLEANUP_ONCE_V1","artifacts_deleted":$before_artifacts,"artifact_bytes_deleted":$before_bytes,"caches_deleted":$before_caches,"cache_bytes_deleted":$before_cache_bytes,"legacy_runs_deleted":$legacy_runs,"branches_targeted":["cena-certa-batch-20260903","cena-certa-publish-20260903"],"scope":"CENA_CERTA_ONLY"}
          JSON
          cat cleanup-report.json
          cat cleanup-report.json >> "$GITHUB_STEP_SUMMARY"
