name: Cena Certa Oct09 Fallback Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct09-fallback-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe fallbacks
        run: |
          set -u
          for u in \
            "https://globoplay.globo.com/v/4333317/" \
            "https://globoplay.globo.com/v/4333541/" \
            "https://globoplay.globo.com/v/4416471/" \
            "https://globoplay.globo.com/v/8735838/" \
            "https://globoplay.globo.com/v/4106405/"; do
            echo "PROBE $u"
            if yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s" "$u"; then echo "PASS $u"; else echo "FAIL $u"; fi
          done
