name: UGI 2026-09-03 Worker Recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_20260903_worker_recovery_patch.py'
      - '.github/workflows/ugi-20260903-worker-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch exact live Worker safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          python -m pip install --disable-pip-version-check --quiet requests
          python -m py_compile scripts/r45_instagram_multiformat_deploy.py scripts/ugi_20260903_worker_recovery_patch.py
          PYTHONPATH=scripts python scripts/ugi_20260903_worker_recovery_patch.py
      - name: Verify story-video recovery status
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OK=true$' cloudflare/status/ugi-20260903-worker-recovery.txt
          grep -q '^STORY_VIDEO_ROUTING=true$' cloudflare/status/ugi-20260903-worker-recovery.txt
          grep -q '^DIRECT_CANONICAL_BUFFER_CHANNELS=true$' cloudflare/status/ugi-20260903-worker-recovery.txt
      - name: Persist deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-recovery-bot'
          git config user.email 'ugi-recovery@users.noreply.github.com'
          git add cloudflare/status/ugi-20260903-worker-recovery.txt
          git commit -m 'chore: persist UGI 03/09 worker recovery evidence' || true
          git pull --rebase origin main
          git push origin HEAD:main
