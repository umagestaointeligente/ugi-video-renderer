name: UGI R44.5.20 Short Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/r44_5_20_shortlink.py
      - .github/workflows/r44-5-20-shortlink.yml

permissions:
  contents: write

jobs:
  create-shortlink:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Create and validate short link
        run: python scripts/r44_5_20_shortlink.py
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-20-shortlink.txt || echo 'SHORTLINK_READY=false' > cloudflare/status/r44-5-20-shortlink.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-20-shortlink.txt
          git commit -m 'UGI R44.5.20 — short link result' || true
          git push origin HEAD:main
