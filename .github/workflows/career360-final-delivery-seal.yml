name: Career360 Final Delivery Seal
run-name: Career360 Final Delivery Seal ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-final-delivery-seal.yml'
      - 'career360/scripts/patch_recovery_delivery_seal_20260907.py'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch authoritative recovery
        run: python career360/scripts/patch_recovery_delivery_seal_20260907.py
      - name: Verify delivery evidence and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f career360/docs/CAREER360_DELIVERY_SEAL_2026-09-07.md
          grep -F '`MASTER_PILOT_DELIVERY=SEALED_CONTROLLABLE_SCOPE`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'run `34157515919`, job `101852301179`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'run `34157515928`, job `101852301277`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '90a795bf1a371be66fd8f907c8a76501f8a5421c' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '49908165f6eb2fa44afa7bcb4515830e0eaade03339f05aff8f2f033924865dd' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '`APPLICATION_PROVIDER_CONNECTOR=NOT_LIVE`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '`MAIL_DELIVERY_CONNECTOR=NOT_LIVE`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '`PUBLIC_BETA=NOT_OPENED_PRODUCT_DECISION`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          if git diff --quiet -- docs/LSI_RECOVERY_CURRENT.md; then
            echo 'RECOVERY_ALREADY_CURRENT=1'
            exit 0
          fi
          git config user.name 'career360-delivery-seal-bot'
          git config user.email 'career360-delivery-seal-bot@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          git commit -m 'career360: seal master pilot delivery recovery'
          git push origin HEAD:main
          echo "DELIVERY_RECOVERY_COMMIT=$(git rev-parse HEAD)"
