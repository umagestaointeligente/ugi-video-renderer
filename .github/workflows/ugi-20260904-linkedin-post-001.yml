name: UGI LinkedIn Editorial 001 via Buffer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-20260904-linkedin-post-001.yml'
  workflow_dispatch:
  # Temporary recovery cadence for launch day only. Runtime guard below makes
  # all later dates a no-op. A proven Buffer post id is never recreated.
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: ugi-linkedin-editorial-001-buffer
  cancel-in-progress: false

env:
  BASE: https://lola-operacional-ugi.umagestaointeligente.workers.dev
  RECEIPT: control-plane/publisher-hub/receipts/UGI-20260904-LI-EDITORIAL-001.json

jobs:
  publish-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buffer-only publish or resume readback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"

          # This recovery exists only for the 2026-09-04 launch day. Future
          # cron invocations perform zero Buffer calls.
          local_date=$(TZ=America/Sao_Paulo date +%F)
          if [ "$local_date" != "2026-09-04" ]; then
            echo "OUTSIDE_LAUNCH_DATE_NOOP=$local_date"
            exit 0
          fi

          mkdir -p "$(dirname "$RECEIPT")"

          # Never create a second post after a proven success.
          if [ -f "$RECEIPT" ] && jq -e '.ok == true and (.publication.bufferPostId // .create.publication.bufferPostId // "") != ""' "$RECEIPT" >/dev/null 2>&1; then
            echo "ALREADY_PROVEN_NOOP"
            exit 0
          fi

          # Wait until the rate-limit-safe LinkedIn route is live. This is a
          # Worker health read only; it does not consume Buffer API quota.
          worker_ready=false
          for i in $(seq 1 30); do
            health=$(curl --silent --show-error --max-time 15 "${BASE}/api/health" || true)
            if printf '%s' "$health" | jq -e '.ok == true and (.version == "lola-v8-r45-7-linkedin-buffer-rate-limit-safe-2026-09-04")' >/dev/null 2>&1; then
              worker_ready=true
              break
            fi
            sleep 5
          done
          test "$worker_ready" = true

          cat > /tmp/payload.json <<'JSON'
          {
            "mode": "shareNow",
            "text": "A Adobe escolheu seu próximo CEO justamente quando a IA está redesenhando o próprio negócio da empresa.\n\nMas a parte mais interessante dessa sucessão talvez não seja quem entra.\n\nÉ tudo o que a organização precisa decidir ao redor dessa escolha.\n\n📌 O que aconteceu\n\nAnil Chakravarthy assumirá como CEO da Adobe em 1º de dezembro.\n\nShantanu Narayen, que lidera a companhia desde 2007, passa a Executive Chair e continuará próximo da transição.\n\nTudo isso acontece enquanto a Adobe tenta responder a uma transformação profunda provocada pela inteligência artificial — não apenas nos seus produtos, mas no próprio mercado em que compete.\n\n🧠 O que realmente importa\n\nSucessão não é simplesmente substituir um executivo por outro.\n\nÉ decidir quais capacidades devem liderar o próximo ciclo da empresa.\n\nO líder ideal para preservar o negócio que construiu o passado pode não ser necessariamente o mesmo perfil necessário para construir o negócio dos próximos dez anos.\n\n⚠️ E existe outra decisão que quase nunca aparece no anúncio oficial\n\nDavid Wadhwani, outro nome apontado entre os principais candidatos internos à sucessão, anunciou sua saída.\n\nIsso levanta uma pergunta que vale para qualquer organização:\n\ncomo reter os grandes líderes que também se imaginavam ocupando aquela cadeira?\n\n💡 Na visão da UGI, uma boa sucessão precisa responder pelo menos três perguntas:\n\n1️⃣ Estamos escolhendo o melhor líder para o negócio atual — ou para o negócio que ainda precisa nascer?\n\n2️⃣ Quanto o antigo líder deve permanecer próximo sem impedir que o novo realmente lidere?\n\n3️⃣ Qual é o plano para preservar os talentos que não foram escolhidos?\n\nTecnologia muda aquilo em que uma empresa precisa competir.\n\nGestão determina se ela conseguirá fazer essa transição sem destruir aquilo que já funciona.\n\nNa era da IA, sucessão deixou de ser apenas uma pauta de pessoas.\n\nVirou estratégia + tecnologia + governança.\n\nE na sua empresa: se o principal líder saísse amanhã, o plano de sucessão estaria preparado para preservar o passado — ou construir o futuro?\n\n#Gestão #Liderança #Estratégia #InteligênciaArtificial #UGI"
          }
          JSON

          persist_receipt() {
            cp /tmp/receipt.json /tmp/receipt-snapshot.json
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              mkdir -p "$(dirname "$RECEIPT")"
              cp /tmp/receipt-snapshot.json "$RECEIPT"
              git config user.name 'ugi-linkedin-publisher-bot'
              git config user.email 'ugi-linkedin-publisher@users.noreply.github.com'
              git add "$RECEIPT"
              git commit -m 'chore: persist UGI LinkedIn Buffer editorial 001 receipt' || true
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          # If a previous run already obtained a Buffer Post ID but could not
          # finish readback, resume from that ID. This is the duplicate guard.
          existing_post_id=""
          existing_create='null'
          if [ -f "$RECEIPT" ]; then
            existing_post_id=$(jq -r '.publication.bufferPostId // .create.publication.bufferPostId // empty' "$RECEIPT" 2>/dev/null || true)
            existing_create=$(jq -c '.create // null' "$RECEIPT" 2>/dev/null || echo null)
          fi

          if [ -z "$existing_post_id" ]; then
            curl --silent --show-error --location --max-time 90 \
              --output /tmp/create.json \
              -X POST "${BASE}/api/linkedin-text-publish" \
              -H "x-lola-command-key: ${UGI_LOLA_COMMAND_KEY}" \
              -H 'content-type: application/json' \
              --data-binary @/tmp/payload.json || true

            if jq -e '.ok == true and (.publication.bufferPostId // "") != ""' /tmp/create.json >/dev/null 2>&1; then
              existing_post_id=$(jq -r '.publication.bufferPostId' /tmp/create.json)
              existing_create=$(jq -c '.' /tmp/create.json)
              python - <<'PY'
          import json, pathlib, datetime
          create=json.loads(pathlib.Path('/tmp/create.json').read_text())
          out={
            'ok':False,'state':'BUFFER_CREATED_READBACK_PENDING','retryable':True,
            'provider':'BUFFER','platform':'linkedin','target':'UGI — Uma Gestão Inteligente',
            'personalProfileTargetAllowed':False,'create':create,'readback':None,
            'publication':create.get('publication'),
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('/tmp/receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
              # Persist the post id before any readback request. A later retry
              # can therefore never create a duplicate if readback is limited.
              persist_receipt
            else
              safe=$(jq -r '(.bufferMutationPerformed == false) and (((.bufferDiagnostics.httpStatus // 0) == 429) or ((.error // "") | contains("429")))' /tmp/create.json 2>/dev/null || echo false)
              if [ "$safe" = true ]; then
                python - <<'PY'
          import json, pathlib, datetime
          try: create=json.loads(pathlib.Path('/tmp/create.json').read_text())
          except Exception: create={'ok':False,'error':'unparseable_create_response'}
          out={
            'ok':False,'state':'WAITING_BUFFER_24H_RATE_LIMIT','retryable':True,
            'provider':'BUFFER','platform':'linkedin','target':'UGI — Uma Gestão Inteligente',
            'personalProfileTargetAllowed':False,'create':create,'readback':None,
            'publication':None,
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('/tmp/receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
                persist_receipt
                echo "BUFFER_RATE_LIMIT_WAITING_SAFE_RETRY"
                exit 0
              fi

              python - <<'PY'
          import json, pathlib, datetime
          try: create=json.loads(pathlib.Path('/tmp/create.json').read_text())
          except Exception: create={'ok':False,'error':'unparseable_create_response'}
          out={
            'ok':False,'state':'FAIL_CLOSED_UNKNOWN_MUTATION_STATE','retryable':False,
            'provider':'BUFFER','platform':'linkedin','target':'UGI — Uma Gestão Inteligente',
            'personalProfileTargetAllowed':False,'create':create,'readback':None,
            'publication':None,
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('/tmp/receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
              persist_receipt
              exit 2
            fi
          fi

          # Read back the already-created Buffer post. A 429 here never causes
          # another create; the durable post id above is reused next cycle.
          sleep 15
          curl --silent --show-error --location --max-time 60 \
            --output /tmp/status.json \
            -H "x-lola-command-key: ${UGI_LOLA_COMMAND_KEY}" \
            "${BASE}/api/linkedin-publication-status?postId=${existing_post_id}" || true

          CREATE_JSON="$existing_create" python - <<'PY'
          import json, os, pathlib, datetime
          try: readback=json.loads(pathlib.Path('/tmp/status.json').read_text())
          except Exception: readback={'ok':False,'error':'unparseable_status_response'}
          try: create=json.loads(os.environ.get('CREATE_JSON') or 'null')
          except Exception: create=None
          pub=(readback.get('publication') or {}) if readback.get('ok') else ((create or {}).get('publication') or {})
          status=str(pub.get('status') or '').lower()
          final=bool(
              readback.get('ok') is True
              and pub.get('bufferPostId')
              and (
                  pub.get('externalLink')
                  or pub.get('sentAt')
                  or pub.get('sharedNow') is True
                  or status in {'sent','posted','published','success','complete','completed'}
              )
          )
          out={
            'ok':final,
            'state':'PROVEN_PUBLISHED' if final else 'BUFFER_CREATED_READBACK_PENDING',
            'retryable':not final,
            'provider':'BUFFER','platform':'linkedin','target':'UGI — Uma Gestão Inteligente',
            'personalProfileTargetAllowed':False,'create':create,'readback':readback,
            'publication':pub,
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('/tmp/receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          persist_receipt

          if jq -e '.ok == true' /tmp/receipt-snapshot.json >/dev/null 2>&1; then
            echo "LINKEDIN_BUFFER_PUBLICATION_PROVEN"
            exit 0
          fi
          echo "LINKEDIN_BUFFER_CREATED_READBACK_PENDING"
          exit 0
