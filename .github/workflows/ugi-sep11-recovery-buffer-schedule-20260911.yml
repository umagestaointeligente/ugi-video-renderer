name: UGI Sep11 Recovery Buffer Schedule 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/ugi-sep11-recovery-buffer-schedule-20260911.yml'

permissions:
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Schedule exact recovery assets once and prove Buffer readback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          cat > /tmp/schedule.py <<'PY'
          import os,json,hashlib,urllib.request,urllib.error,time
          from datetime import datetime,timezone
          from pathlib import Path

          BASE=os.environ['WORKER_URL'].rstrip('/')
          KEY=os.environ['UGI_LOLA_COMMAND_KEY']
          COMMIT='df7541feecd2450b21df0e24fdc508b971ab0f6b'
          ROOT=f'https://raw.githubusercontent.com/umagestaointeligente/ugi-video-renderer/{COMMIT}/public/ugi/editorial/2026-09-11/'
          APPROVAL='https://raw.githubusercontent.com/umagestaointeligente/ugi-video-renderer/main/control-plane/publisher-hub/approval-pending/UGI-20260911-RECOVERY-BATCH-APPROVAL.json'
          QA_RUN='https://api.github.com/repos/umagestaointeligente/ugi-video-renderer/actions/runs/34549856604'
          IG='6a7896cdb2d9d57743457e33'; LI='6a9acd94065799be46891f24'; TT='6a789721b2d9d5774345839d'

          FAA_TEXT='''✈️ O melhor momento para tratar um gargalo é antes de ele virar fila.\n\nA FAA quer usar o sistema SMART para combinar programação, clima, capacidade aeroportuária e restrições do espaço aéreo e antecipar atrasos.\n\n📊 Para gestão, a lógica é direta: sinais antecipados valem mais quando viram decisão antes do problema.\n\n💡 Prever não elimina incerteza. Compra tempo para agir.\n\n#Gestão #Operações #Dados #Aeroportos #UGI'''
          KOJIMA_TEXT='''🎮 Um projeto importante perdeu o parceiro original — mas não morreu com a relação.\n\nPHYSINT, de Hideo Kojima, mudou de rota e ganhou um novo encaixe com Xbox.\n\n💡 Gestão também é preservar o núcleo de valor e reconfigurar apoio, distribuição e execução quando o contexto muda.\n\n#Gestão #Estratégia #Kojima #Xbox #UGI'''
          HSBC_TEXT='''🏦 Uma transformação não depende apenas da estratégia. Depende também da continuidade de quem consegue executá-la.\n\nO HSBC entra em mais um teste de sucessão com a saída programada da CFO Pam Kaur durante um período de reorganização do banco.\n\n📌 Trocas de liderança no meio de uma transformação aumentam o risco de perda de contexto, prioridade e velocidade.\n\nPor isso, sucessão não deveria começar quando a cadeira fica vazia. Ela precisa existir antes: com governança, documentação das decisões, clareza de mandato e gente preparada para assumir.\n\n💡 Empresas resilientes não eliminam transições. Elas diminuem a dependência de uma única pessoa para manter a execução viva.\n\n#Gestão #Liderança #Sucessão #Transformação #HSBC #UGI'''
          STELLANTIS_TEXT='''🚙 Uma empresa global não precisa operar com um único playbook em todos os mercados.\n\nA Stellantis está deixando mais explícita a divergência entre a estratégia para os EUA e a adotada em outras regiões.\n\n📊 Regulação, política comercial, consumidor, portfólio e parceiros mudam o contexto — e a execução precisa acompanhar.\n\n💡 Consistência estratégica não é copiar e colar a mesma resposta. É preservar o objetivo enquanto adapta o caminho.\n\n#Gestão #Estratégia #Stellantis #Mercados #UGI'''
          PRIMARK_TEXT='''🛍️ A Primark resistiu por anos à entrega em casa. Agora mudou.\n\nO ponto não é dizer que a estratégia antiga estava errada. É entender quando tecnologia, cliente e economia do canal mudaram o suficiente para exigir outro playbook.\n\n💡 Estratégia madura não é defender uma escolha para sempre. É saber qual evidência justifica mudar.\n\n#Gestão #Varejo #Estratégia #Primark #UGI'''

          # Recovery order: protect remaining Sep11 windows first, then carry six missed slots to Sep12.
          items=[
            {'id':'UGI-RECOVERY-20260911-IG-STORY-MIRO-1800','p':'instagram','format':'story','route':'ig_story','files':['story-miro-1730.mp4'],'due':'2026-09-11T21:00:00Z','text':''},
            {'id':'UGI-RECOVERY-20260911-TT-PRIMARK-1945','p':'tiktok','format':'video','route':'editorial_video','files':['tiktok-primark-1945.mp4'],'due':'2026-09-11T22:45:00Z','text':PRIMARK_TEXT},
            {'id':'UGI-RECOVERY-20260911-IG-STORY-HEFEI-2030','p':'instagram','format':'story','route':'ig_story','files':['story-hefei-2030.mp4'],'due':'2026-09-11T23:30:00Z','text':''},
            {'id':'UGI-RECOVERY-20260912-IG-STORY-ALTERA-0830','p':'instagram','format':'story','route':'ig_story','files':['story-altera-0830.mp4'],'due':'2026-09-12T11:30:00Z','text':''},
            {'id':'UGI-RECOVERY-20260912-IG-REEL-FAA-1015','p':'instagram','format':'reel','route':'editorial_video','files':['reel-faa-1015.mp4'],'due':'2026-09-12T13:15:00Z','text':FAA_TEXT},
            {'id':'UGI-RECOVERY-20260912-TT-KOJIMA-1130','p':'tiktok','format':'video','route':'editorial_video','files':['tiktok-kojima-1130.mp4'],'due':'2026-09-12T14:30:00Z','text':KOJIMA_TEXT},
            {'id':'UGI-RECOVERY-20260912-IG-STORY-COCACOLA-1200','p':'instagram','format':'story','route':'ig_story','files':['story-cocacola-1200.mp4'],'due':'2026-09-12T15:00:00Z','text':''},
            {'id':'UGI-RECOVERY-20260912-LI-HSBC-1400','p':'linkedin','format':'post','route':'editorial_image','files':['linkedin-hsbc-1400.jpg'],'due':'2026-09-12T17:00:00Z','text':HSBC_TEXT},
            {'id':'UGI-RECOVERY-20260912-IG-CAROUSEL-STELLANTIS-1430','p':'instagram','format':'carousel','route':'ig_carousel','files':['carousel-stellantis-1430-01.jpg','carousel-stellantis-1430-02.jpg','carousel-stellantis-1430-03.jpg','carousel-stellantis-1430-04.jpg','carousel-stellantis-1430-05.jpg','carousel-stellantis-1430-06.jpg'],'due':'2026-09-12T17:30:00Z','text':STELLANTIS_TEXT},
          ]
          expected_channel={'instagram':IG,'linkedin':LI,'tiktok':TT}
          def iso(v): return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
          def get_json(url):
              req=urllib.request.Request(url,headers={'user-agent':'UGI-Sep11-Recovery/1.0','accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode('utf-8'))
          def call(method,url,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(url,data=data,method=method,headers={'x-lola-command-key':KEY,'accept':'application/json','content-type':'application/json','user-agent':'UGI-Sep11-Recovery/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: body=json.loads(raw)
                      except Exception: body={'raw':raw[:1200]}
                      return r.status,body
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw[:1200]}
                  return e.code,body
              except Exception as e:
                  return 0,{'ok':False,'error':f'{type(e).__name__}:{e}','mutationOutcome':'AMBIGUOUS_DO_NOT_RETRY'}

          proof={'schema':'UGI_BUFFER_RECOVERY_PROOF_V1','assetCommit':COMMIT,'approvalRecord':APPROVAL,'scope':'SEP11_RECOVERY_PLUS_SEP12_CARRYOVER_EXACT_BATCH_ONLY','globalDistributionStateChanged':False,'startedAt':datetime.now(timezone.utc).isoformat(),'items':[],'overall':'IN_PROGRESS'}
          approval=get_json(APPROVAL)
          if approval.get('humanApproval') is not True or approval.get('assetCommit')!=COMMIT or approval.get('state')!='APPROVED_EXACT_BATCH_ONLY':
              proof['overall']='APPROVAL_GATE_FAILED'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(9)
          qa=get_json(QA_RUN)
          if qa.get('conclusion')!='success':
              proof['overall']='QA_RUN_NOT_SUCCESS'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(8)
          manifest=get_json(ROOT+'asset-provenance.json')
          sha_by_name={Path(x['path']).name:x['sha256'] for x in manifest.get('finals',[])}

          # Fail before first mutation if any approved time has already passed or bytes differ.
          now=datetime.now(timezone.utc)
          if any(iso(x['due']) <= now for x in items):
              proof['overall']='DUE_AT_NOT_FUTURE_FAIL_CLOSED'; proof['now']=now.isoformat(); open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(7)
          checked=0
          for x in items:
              x['sha']=[]
              for fname in x['files']:
                  want=sha_by_name.get(fname)
                  if not want:
                      proof['overall']='MANIFEST_HASH_MISSING'; proof['failure']={'id':x['id'],'file':fname}; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(10)
                  with urllib.request.urlopen(ROOT+fname,timeout=90) as r:
                      b=r.read(); ct=(r.headers.get('content-type') or '').lower()
                  got=hashlib.sha256(b).hexdigest()
                  if got!=want:
                      proof['overall']='PREFLIGHT_HASH_FAILED'; proof['failure']={'id':x['id'],'file':fname,'expected':want,'actual':got}; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(11)
                  if fname.endswith('.mp4') and 'video' not in ct and 'octet-stream' not in ct: raise SystemExit(12)
                  if fname.endswith('.jpg') and 'image' not in ct and 'octet-stream' not in ct: raise SystemExit(13)
                  x['sha'].append(want); checked+=1
          print(f'PRECHECK_SHA256={checked}/14_PASS')

          for x in items:
              urls=[ROOT+f for f in x['files']]
              if x['route']=='ig_story':
                  route='/api/r45-3/instagram-publish'; payload={'kind':'story_video','text':'','videoUrl':urls[0],'imageUrls':[],'mode':'customScheduled','dueAt':x['due']}
              elif x['route']=='ig_carousel':
                  route='/api/r45-3/instagram-publish'; payload={'kind':'mixed_carousel','text':x['text'],'videoUrl':'','imageUrls':urls,'mode':'customScheduled','dueAt':x['due']}
              else:
                  route='/api/editorial-media-publish'; payload={'platform':x['p'],'mediaType':'video' if x['route']=='editorial_video' else 'image','mediaUrl':urls[0],'text':x['text'],'format':x['format'],'mode':'customScheduled','dueAt':x['due']}
              h,res=call('POST',BASE+route,payload)
              rec={'id':x['id'],'platform':x['p'],'format':x['format'],'dueAtExpected':x['due'],'assetUrls':urls,'sha256':x['sha'],'scheduleHttp':h,'mutationAttemptedOnce':True}
              if h<200 or h>=300 or res.get('ok') is not True:
                  rec.update(scheduleConfirmed=False,error=res.get('error') or res.get('errorClass') or res.get('raw'),bufferMutationPerformed=res.get('bufferMutationPerformed','UNKNOWN'),mutationOutcome=res.get('mutationOutcome'))
                  proof['items'].append(rec); proof['overall']='STOPPED_FAIL_CLOSED_NO_MUTATION_RETRY'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); print(json.dumps({'STOP':rec},ensure_ascii=False)); raise SystemExit(20)
              if x['route'] in {'ig_story','ig_carousel'}:
                  post=res.get('post') or {}; target=res.get('channel') or {}; pid=post.get('id'); cid=target.get('id') or post.get('channelId'); create_status=post.get('status')
              else:
                  pub=res.get('publication') or {}; target=res.get('target') or {}; pid=pub.get('bufferPostId'); cid=target.get('channelId') or pub.get('channelId'); create_status=pub.get('bufferStatus') or pub.get('status')
              rec.update(bufferPostId=pid,channelId=cid,createStatus=create_status,bufferMutationPerformed=res.get('bufferMutationPerformed',True))
              if not pid or cid!=expected_channel[x['p']]:
                  rec.update(scheduleConfirmed=False,error='MISSING_POST_ID_OR_WRONG_CHANNEL'); proof['items'].append(rec); proof['overall']='STOPPED_FAIL_CLOSED_CHANNEL_MISMATCH'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(30)
              rb=None; rh=0
              for _ in range(4):
                  if x['p']=='linkedin': rh,rb=call('GET',BASE+'/api/linkedin-publication-status?postId='+pid)
                  else: rh,rb=call('GET',BASE+'/api/r45-2/buffer-status?id='+pid)
                  if rh==200 and rb.get('ok') is True: break
                  time.sleep(2)
              if x['p']=='linkedin':
                  rp=(rb or {}).get('publication') or {}; st=rp.get('bufferStatus') or rp.get('status'); da=rp.get('dueAt'); service='linkedin'
              else:
                  rp=(rb or {}).get('post') or {}; st=rp.get('status'); da=rp.get('dueAt'); service=rp.get('channelService')
              try: dueok=abs((iso(da)-iso(x['due'])).total_seconds())<1
              except Exception: dueok=False
              serviceok=(service==x['p'])
              rec.update(readbackHttp=rh,readbackStatus=st,dueAtActual=da,dueAtMatch=dueok,channelService=service,channelServiceMatch=serviceok,externalLink=rp.get('externalLink'),scheduleConfirmed=(rh==200 and str(st or '').lower()=='scheduled' and dueok and serviceok))
              proof['items'].append(rec)
              print(json.dumps({'id':x['id'],'bufferPostId':pid,'platform':x['p'],'status':st,'dueAt':da,'confirmed':rec['scheduleConfirmed']},ensure_ascii=False))
              if not rec['scheduleConfirmed']:
                  proof['overall']='STOPPED_READBACK_MISMATCH_NO_MUTATION_RETRY'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(40)
          proof['overall']='BUFFER_SCHEDULED_9_OF_9'; proof['completedAt']=datetime.now(timezone.utc).isoformat(); open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); print('BUFFER_SCHEDULED_9_OF_9')
          PY
          python /tmp/schedule.py
      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugi-sep11-recovery-buffer-proof
          path: schedule-proof.json
          if-no-files-found: warn
