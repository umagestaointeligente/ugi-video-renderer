name: Orbit Cena Certa Facebook Direct

on:
  workflow_dispatch:
    inputs:
      item_key:
        description: Canonical unique item key
        required: true
        type: string
      media_url:
        description: Public HTTPS media URL
        required: true
        type: string
      caption:
        description: Facebook caption
        required: false
        default: ''
        type: string
      publish_at:
        description: Future RFC3339 UTC timestamp
        required: true
        type: string
      format:
        description: video or story; Reel remains fail-closed until native contract is verified
        required: true
        default: video
        type: choice
        options: [video, story]
      expected_page_id:
        description: Hard-lock expected Facebook Page id
        required: true
        default: '1314911305035494'
        type: string
      graph_version:
        description: Explicit Graph API version after contract verification
        required: true
        default: v23.0
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-cena-certa-facebook-${{ inputs.item_key }}
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGE_ACCESS_TOKEN: ${{ secrets.CENA_CERTA_META_ACCESS_TOKEN }}
      PAGE_ID: ${{ inputs.expected_page_id }}
      ITEM_KEY: ${{ inputs.item_key }}
      MEDIA_URL: ${{ inputs.media_url }}
      CAPTION: ${{ inputs.caption }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      FORMAT: ${{ inputs.format }}
      GRAPH_VERSION: ${{ inputs.graph_version }}
    steps:
      - name: Validate secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_ACCESS_TOKEN" || { echo 'BLOCKED: CENA_CERTA_META_ACCESS_TOKEN missing'; exit 78; }

      - name: Native schedule with page identity and duplicate guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, json, os, sys, urllib.error, urllib.parse, urllib.request
          version=os.environ['GRAPH_VERSION'].strip()
          if not version.startswith('v'):
              raise SystemExit('BLOCKED: invalid Graph API version')
          API='https://graph.facebook.com/'+version
          token=os.environ['PAGE_ACCESS_TOKEN']
          page=os.environ['PAGE_ID'].strip()
          item=os.environ['ITEM_KEY'].strip()
          media=os.environ['MEDIA_URL'].strip()
          caption=os.environ.get('CAPTION','')
          fmt=os.environ['FORMAT'].strip().lower()
          publish_at=os.environ['PUBLISH_AT'].strip()
          canonical_page='1314911305035494'
          if page != canonical_page:
              raise SystemExit('BLOCKED: expected_page_id is not canonical Cena Certa page')

          def get(path, params):
              q=urllib.parse.urlencode({**params,'access_token':token})
              with urllib.request.urlopen(API+path+'?'+q, timeout=120) as r:
                  return json.loads(r.read())
          def post(path, data):
              payload=urllib.parse.urlencode({**data,'access_token':token}).encode()
              req=urllib.request.Request(API+path,data=payload,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR',e.code,e.read()[:3000].decode('utf-8','replace'))
                  raise

          dt=datetime.datetime.fromisoformat(publish_at.replace('Z','+00:00'))
          now=datetime.datetime.now(datetime.timezone.utc)
          if dt <= now + datetime.timedelta(minutes=10):
              raise SystemExit('BLOCKED: Facebook native scheduling requires >10 minutes lead time')
          if not media.startswith('https://') or fmt not in {'video','story'}:
              raise SystemExit('BLOCKED: invalid media/format')

          me=get('/me',{'fields':'id,name'})
          print('PAGE_TOKEN_ID='+str(me.get('id')))
          print('PAGE_TOKEN_NAME='+str(me.get('name')))
          if str(me.get('id')) != page:
              raise SystemExit('BLOCKED: token does not belong to Cena Certa Ofc page')

          # Stories are intentionally not represented as native future schedules.
          if fmt=='story':
              raise SystemExit('BLOCKED: Facebook Story requires native UI or due-time executor; no fake native schedule')

          marker='orbit_'+hashlib.sha256(item.encode()).hexdigest()[:24]
          recent=get('/'+page+'/videos',{'fields':'id,description,created_time','limit':'100'})
          for v in recent.get('data',[]):
              if marker in (v.get('description') or ''):
                  print('IDEMPOTENT_EXISTING_VIDEO_ID='+str(v.get('id')))
                  sys.exit(0)

          epoch=int(dt.timestamp())
          out=post('/'+page+'/videos',{
              'file_url':media,
              'description':caption+'\n\n'+marker,
              'published':'false',
              'scheduled_publish_time':str(epoch)
          })
          vid=out.get('id')
          if not vid:
              raise SystemExit('UNCERTAIN_AFTER_POST: Facebook returned no scheduled video id; readback required')
          verify=get('/'+str(vid),{'fields':'id,description,scheduled_publish_time,published'})
          if marker not in (verify.get('description') or '') or bool(verify.get('published')):
              raise SystemExit('UNCERTAIN_AFTER_POST: Facebook readback state mismatch; do not retry blindly')
          print('NATIVE_VIDEO_ID='+str(vid))
          print('READBACK_VERIFIED=true')
          print('NATIVE_PUBLISH_AT='+publish_at)
          print('ORBIT_ITEM_KEY='+item)
          PY
