name: UGI TSMC Company Preview V1 2026-09-08

on:
  push:
    paths:
      - 'scripts/ugi_editorial_20260908_tsmc_company_v1.py'
      - '.github/workflows/ugi-editorial-tsmc-v1-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
      - name: Build TSMC preview
        run: python scripts/ugi_editorial_20260908_tsmc_company_v1.py
      - name: Persist preview and QA evidence only
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'umagestaointeligente@gmail.com'
          git add public/ugi/editorial/2026-09-08/video-tsmc-company-preview-v1.mp4 \
                  public/ugi/editorial/2026-09-08/video-tsmc-company-preview-v1-qa.jpg \
                  public/ugi/editorial/2026-09-08/video-tsmc-company-preview-v1-qa.json \
                  public/ugi/editorial/2026-09-08/PREVIEW_ONLY.txt
          git diff --cached --quiet && exit 0
          git commit -m 'preview: render TSMC company-first editorial v1'
          git push
