name: Career360 Provider Credential Presence Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-provider-credential-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check provider secret presence without revealing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'SUPABASE_ACCESS_TOKEN_PRESENT=true'
          else
            echo 'SUPABASE_ACCESS_TOKEN_PRESENT=false'
          fi
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            echo 'VERCEL_TOKEN_PRESENT=true'
          else
            echo 'VERCEL_TOKEN_PRESENT=false'
          fi
          echo 'SECRET_VALUES_EXPOSED=false'
