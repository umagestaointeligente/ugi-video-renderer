name: VSA Sep13 Ledger Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsa-sep13-ledger-sync-20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Sep13 scheduled semantic topics idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          ledger_path=pathlib.Path('canonical/vsa/v1/VSA_TOPIC_LEDGER_60D.json')
          receipt_path=pathlib.Path('receipts/vsa/2026-09-10/VSA_SEP13_CLEAN_HEADER_POSTLY_SCHEDULE_RECEIPT.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          receipt=json.loads(receipt_path.read_text(encoding='utf-8'))
          mechanisms={
            'DUST_MALI':'fine dust remains suspended and is transported long distances by winds aloft',
            'FERNANDA_MONTENEGRO':'career consistency, competence and longevity can sustain public trust beyond posting frequency',
            'HUNGA_TSUNAMI':'submarine volcanic collapse displaces water while seismic signals reveal origin timing and mechanism',
            'ELTON_ENERGY':'mobility assistance can be used to conserve energy during long airport transfers after demanding performances',
            'EMIT_MINE':'hyperspectral signatures identify minerals associated with mine waste and prioritize field inspection',
            'MARISKA_LONGEVITY':'character evolution across roles and relationships sustains recognition and television longevity',
            'SENTINEL_HURRICANE':'sea-surface-height measurements help infer deep ocean heat that can support hurricane intensification',
            'EMICIDA_INFLUENCE':'messages become influence when identity and relevance make ideas persist and circulate beyond initial attention'
          }
          entries=ledger.setdefault('entries',[])
          existing_ids={str(x.get('content_id')) for x in entries}
          for item in receipt['items']:
              cid='VSA-20260913-'+item['id']
              if cid in existing_ids:
                  continue
              entries.append({
                'content_id':cid,
                'date_local':'2026-09-13',
                'status':'SCHEDULED_POSTLY',
                'title':item['title'],
                'semantic_topic_id':item['semantic_topic_id'],
                'central_mechanism':mechanisms[item['id']],
                'platform_scheduler':'Postly',
                'postly_id':item['postly_id']
              })
          ledger['generated_at_local']='2026-09-10T22:10:00-03:00'
          ledger['source_of_truth']='Upload-Post live YouTube media readback + live scheduled queue + Postly verified scheduled readback'
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SEP13_LEDGER_SYNC_PASS',sum(1 for x in entries if x.get('date_local')=='2026-09-13'))
          PY
      - name: Commit ledger update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vsa-ledger-bot'
          git config user.email 'vsa-ledger-bot@users.noreply.github.com'
          git add canonical/vsa/v1/VSA_TOPIC_LEDGER_60D.json
          if git diff --cached --quiet; then
            echo 'NO_CHANGES_ALREADY_SYNCED'
          else
            git commit -m 'ops(vsa): lock Sep13 scheduled topics for 60 days'
            git push origin HEAD:main
          fi
