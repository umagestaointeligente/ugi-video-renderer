name: Orbit Secret Presence Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/orbit-secret-presence-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT_STATE: ${{ secrets.ORBIT_BUNDLE_ENDPOINT != '' && 'PRESENT' || 'MISSING' }}
      TOKEN_STATE: ${{ secrets.ORBIT_BUNDLE_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      SHA_STATE: ${{ secrets.ORBIT_BUNDLE_SHA256 != '' && 'PRESENT' || 'MISSING' }}
      AGE_STATE: ${{ secrets.ORBIT_OUTPUT_AGE_RECIPIENT != '' && 'PRESENT' || 'MISSING' }}
    steps:
      - name: Report names and presence only
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Orbit secret presence"
            echo
            echo "| Secret | Status |"
            echo "|---|---|"
            echo "| ORBIT_BUNDLE_ENDPOINT | $ENDPOINT_STATE |"
            echo "| ORBIT_BUNDLE_TOKEN | $TOKEN_STATE |"
            echo "| ORBIT_BUNDLE_SHA256 | $SHA_STATE |"
            echo "| ORBIT_OUTPUT_AGE_RECIPIENT | $AGE_STATE |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s=%s\n' ORBIT_BUNDLE_ENDPOINT "$ENDPOINT_STATE"
          printf '%s=%s\n' ORBIT_BUNDLE_TOKEN "$TOKEN_STATE"
          printf '%s=%s\n' ORBIT_BUNDLE_SHA256 "$SHA_STATE"
          printf '%s=%s\n' ORBIT_OUTPUT_AGE_RECIPIENT "$AGE_STATE"
