# VSA_VISUAL_STORY_ENGINE_V1
# VSA_VISUAL_RELEASE_RECEIPT_V2
# Metricool VSA brand lock: 6935441
# NON-PUBLISHING PILOT. Any future release-capable path MUST use:
# ./.github/actions/vsa-release-gate
name: VSA Hydroelectric Assisted Pilot
# trigger: hydroelectric pilot render

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vsa-hydroelectric-assisted-pilot.yml'
      - 'production/vsa/pilots/hydro_grand_v2/render_grand_hydro.py'
      - 'examples/vsa/assisted_animation/hydroelectric_pilot_request.json'
      - 'scripts/vsa/assisted_animation_stage.py'
      - 'config/vsa/VSA_ASSISTED_ANIMATION_CAPABILITIES_V1.json'
  push:
    branches:
      - feat/vsa-assisted-animation-zsky-steve-v1
    paths:
      - '.github/workflows/vsa-hydroelectric-assisted-pilot.yml'
      - 'production/vsa/pilots/hydroelectric/render_pilot.py'
      - 'examples/vsa/assisted_animation/hydroelectric_pilot_request.json'
      - 'scripts/vsa/assisted_animation_stage.py'
      - 'config/vsa/VSA_ASSISTED_ANIMATION_CAPABILITIES_V1.json'

permissions:
  contents: read

concurrency:
  group: vsa-hydroelectric-assisted-pilot
  cancel-in-progress: true

jobs:
  inspect-grand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Download and sample Itaipu + Belo Monte
        run: |
          set -euo pipefail
          mkdir -p /tmp/grand
          curl -fL --retry 5 --retry-delay 2             'https://upload.wikimedia.org/wikipedia/commons/transcoded/9/97/A_Itaipu_Binacional_maior_usina_hidrel%C3%A9trica_do_mundo%2C_tem_novo_Diretor-Geral.webm/A_Itaipu_Binacional_maior_usina_hidrel%C3%A9trica_do_mundo%2C_tem_novo_Diretor-Geral.webm.720p.vp9.webm'             -o /tmp/grand/itaipu.webm
          curl -fL --retry 5 --retry-delay 2             'https://upload.wikimedia.org/wikipedia/commons/transcoded/b/b4/14%C2%AA_turbina_da_Usina_de_Belo_Monte_entra_em_funcionamento.webm/14%C2%AA_turbina_da_Usina_de_Belo_Monte_entra_em_funcionamento.webm.720p.vp9.webm'             -o /tmp/grand/belo.webm
          mkdir -p /tmp/grand/out
          for t in 8 16 24 32 40 48 56 64 72 80 88 96 104; do
            ffmpeg -y -loglevel error -ss "$t" -i /tmp/grand/itaipu.webm -frames:v 1 "/tmp/grand/out/itaipu_${t}.jpg"
          done
          for t in 12 24 36 48 60 72 84 96 108 120 132 144 156 168 180 192 204; do
            ffmpeg -y -loglevel error -ss "$t" -i /tmp/grand/belo.webm -frames:v 1 "/tmp/grand/out/belo_${t}.jpg"
          done
          ffmpeg -y -loglevel error -i /tmp/grand/itaipu.webm             -vf "fps=1/7,scale=320:-2,tile=4x4:padding=4:margin=4" -frames:v 1 /tmp/grand/out/itaipu_contact.jpg
          ffmpeg -y -loglevel error -ss 105 -i /tmp/grand/belo.webm             -vf "fps=1/7,scale=320:-2,tile=4x4:padding=4:margin=4" -frames:v 1 /tmp/grand/out/belo_contact_late.jpg
      - name: Upload grand hydro frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: vsa-grand-hydro-frame-evidence
          path: /tmp/grand/out/
          if-no-files-found: error
          retention-days: 7

  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated pilot branch
        uses: actions/checkout@v4

      - name: Install zero-cost runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow requests edge-tts

      - name: Compile pilot code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/vsa/assisted_animation_stage.py \
            production/vsa/pilots/hydro_grand_v2/render_grand_hydro.py

      - name: Generate assisted visual plan
        run: |
          set -euo pipefail
          mkdir -p /tmp/hydro
          python scripts/vsa/assisted_animation_stage.py plan \
            --request examples/vsa/assisted_animation/hydroelectric_pilot_request.json \
            --out /tmp/hydro/visual_plan.json \
            --package /tmp/hydro/manual_package.md
          jq -e '.publication_allowed == false and .automatic_publication == false' /tmp/hydro/visual_plan.json
          jq -e '[.scenes[] | select(.tool_candidate=="zsky")] | length >= 3' /tmp/hydro/visual_plan.json
          jq -e '[.scenes[] | select(.tool_candidate=="zsky") | .production_route] | all(.=="current_pipeline")' /tmp/hydro/visual_plan.json

      - name: Render grand zero-credit real plus 3D hydro pilot
        run: |
          set -euo pipefail
          python production/vsa/pilots/hydro_grand_v2/render_grand_hydro.py 2>&1 | tee /tmp/hydro/render.log
          OUT=production/vsa/pilots/hydro_grand_v2/output
          test -s "$OUT/VSA_HIDRELETRICA_GRAND_ZERO_CREDIT_V2.mp4"
          test -s "$OUT/RECEIPT.json"
          jq -e '.publication_allowed == false and .metricool_mutated == false and .cta_single_pass == true' "$OUT/RECEIPT.json"
          jq -e '.explanatory_animation.credit_cost_verified_before == .explanatory_animation.credit_cost_verified_after' "$OUT/RECEIPT.json"
          cp /tmp/hydro/visual_plan.json "$OUT/VISUAL_PLAN.json"
          cp /tmp/hydro/manual_package.md "$OUT/MANUAL_PACKAGE.md"
          cp /tmp/hydro/render.log "$OUT/RENDER_LOG.txt"

      - name: Inspect final format
        run: |
          set -euo pipefail
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate,codec_name,pix_fmt \
            -of json production/vsa/pilots/hydro_grand_v2/output/VSA_HIDRELETRICA_GRAND_ZERO_CREDIT_V2.mp4 \
            | tee production/vsa/pilots/hydroelectric/output/FFPROBE.json
          jq -e '.streams[0].width == 1080 and .streams[0].height == 1920 and .streams[0].codec_name == "h264" and .streams[0].pix_fmt == "yuv420p"' production/vsa/pilots/hydroelectric/output/FFPROBE.json

      - name: Upload pilot for Paulo review
        uses: actions/upload-artifact@v4
        with:
          name: vsa-hydroelectric-assisted-pilot
          path: production/vsa/pilots/hydro_grand_v2/output/
          if-no-files-found: error
          retention-days: 7
