name: Cena Certa Oct12 Diversity Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct12-diversity-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe diversity sources
        run: |
          set -u
          failed=0
          urls=(
            "https://globoplay.globo.com/v/9178997/"
            "https://globoplay.globo.com/v/9447937/"
            "https://globoplay.globo.com/v/2894988/"
            "https://globoplay.globo.com/v/3871876/"
            "https://globoplay.globo.com/v/5594397/"
            "https://globoplay.globo.com/v/3038961/"
          )
          for u in "${urls[@]}"; do
            echo "PROBE $u"
            if yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s | %(uploader)s" "$u"; then
              echo "SOURCE_PROBE_PASS $u"
            else
              echo "SOURCE_PROBE_FAIL $u"
              failed=$((failed+1))
            fi
          done
          echo "SOURCE_PROBE_FAILED_COUNT=$failed"
          test "$failed" -eq 0
