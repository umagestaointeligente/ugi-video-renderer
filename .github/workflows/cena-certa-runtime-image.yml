name: Cena Certa V2 Runtime Image

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/runtime/cena-certa/Dockerfile'
      - '.github/workflows/cena-certa-runtime-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/umagestaointeligente/cena-certa-runtime
  IMAGE_TAG: py31214-bookworm-v1

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/runtime/cena-certa
          file: .github/runtime/cena-certa/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Prove immutable digest
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.build.outputs.digest }}'
          echo 'CENA_CERTA_RUNTIME_DIGEST=${{ steps.build.outputs.digest }}'
          docker pull '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}'
          docker run --rm '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' bash -lc "ffmpeg -version | head -1; ffprobe -version | head -1; fc-match Lato | head -1; python - <<'PY'
import PIL,numpy
assert PIL.__version__=='12.3.0'
assert numpy.__version__=='2.5.2'
print('CENA_CERTA_RUNTIME_HEALTH_PASS')
PY"
