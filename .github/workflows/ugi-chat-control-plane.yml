name: UGI Legacy Render Bridge (Deprecated)

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/commands/*.json'

permissions:
  actions: write
  contents: read

jobs:
  forward-to-publisher-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Forward command reconciliation to canonical hub
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ugi-publisher-hub.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f wait_seconds=0
          echo "LEGACY_RENDER_FORWARD_OK"
          echo "Direct render-video dispatch is disabled here."
          echo "UGI Publisher Hub owns render -> draft -> Buffer reconciliation."
