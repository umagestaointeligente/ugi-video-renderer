name: LSI Payment Hub Autopilot R1
run-name: LSI Payment Hub Autopilot R1 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths:
      - '.github/workflows/lsi-payment-hub-autopilot-r1.yml'
      - 'greenfield/payment-hub/provider-state-r1.json'
      - 'greenfield/payment-hub/lsi-payment-route-council-r1.mjs'
permissions: {contents: read}
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe live Asaas checkout without paying
        shell: bash
        run: |
          set -u
          base='https://lola-operacional-ugi.umagestaointeligente.workers.dev'
          mkdir -p generated/evidence
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$base/greenfield/packvalue-pro/health" || true)
          checkout_code='0'; order_code='0'; reason='health_not_ready'; host=''; ref=''; e2e=false
          if [ "$health_code" = '200' ] && jq -e '.ok==true and .provider=="asaas" and .price==49.90 and .spendCapability==false and .deliveryRequiresPaidWebhook==true' /tmp/health.json >/dev/null 2>&1; then
            checkout_code=$(curl -sS -o /tmp/checkout.json -w '%{http_code}' -X POST "$base/greenfield/packvalue-pro/checkout" -H 'content-type: application/json' --data '{}' || true)
            if [ "$checkout_code" = '201' ] && jq -e '.ok==true and .provider=="asaas" and .productId=="packvalue-pro-r1" and .amount==49.90 and .currency=="BRL" and .deliveryRequiresPaidWebhook==true and (.checkoutUrl|startswith("https://"))' /tmp/checkout.json >/dev/null 2>&1; then
              ref=$(jq -r '.referenceId // empty' /tmp/checkout.json)
              host=$(jq -r '.checkoutUrl // empty' /tmp/checkout.json | sed -E 's#https://([^/]+)/?.*#\1#')
              reason='order_not_visible_yet'
              for i in 1 2 3 4 5; do
                order_code=$(curl -sS -o /tmp/order.json -w '%{http_code}' "$base/greenfield/packvalue-pro/order/$ref" || true)
                if [ "$order_code" = '200' ] && jq -e '.ok==true and .fulfillmentReady==false and (.deliveryUrl==null)' /tmp/order.json >/dev/null 2>&1; then
                  e2e=true; reason='pass'; break
                fi
                sleep 1
              done
            else
              reason=$(jq -r '.error // "checkout_provider_response_invalid"' /tmp/checkout.json 2>/dev/null || echo 'checkout_provider_response_invalid')
            fi
          fi
          provider_status=$(jq -r '.providerStatus // empty' /tmp/checkout.json 2>/dev/null || true)
          provider_errors=$(jq -c '.providerErrors // []' /tmp/checkout.json 2>/dev/null || echo '[]')
          jq -n --argjson e2e "$e2e" --arg health "$health_code" --arg checkout "$checkout_code" --arg order "$order_code" --arg host "$host" --arg ref "$ref" --arg reason "$reason" --arg provider_status "$provider_status" --argjson provider_errors "$provider_errors" '{schema_version:"1.2",project:"LSI_PAYMENT_HUB_R1",component:"ASAAS_E2E_CHECKOUT",asaas_checkout_e2e:$e2e,health_http_status:$health,checkout_http_status:$checkout,order_http_status:$order,checkout_host:$host,reference_id:$ref,failure_reason:$reason,provider_status:(if $provider_status=="" then null else $provider_status end),provider_errors:$provider_errors,payment_performed:false,real_value_moved:false,fulfillment_released:false,verified_revenue_brl:0,authoritative_payment_event:"CHECKOUT_PAID"}' > generated/evidence/asaas-e2e-probe-r1.json
          jq -e '.schema_version=="1.2" and (.asaas_checkout_e2e|type)=="boolean"' generated/evidence/asaas-e2e-probe-r1.json >/dev/null
          cat generated/evidence/asaas-e2e-probe-r1.json
      - name: Run LSI Payment Route Council
        shell: bash
        run: |
          set -euo pipefail
          node greenfield/payment-hub/lsi-payment-route-council-r1.mjs greenfield/payment-hub/provider-state-r1.json generated/evidence/asaas-e2e-probe-r1.json generated/evidence/lsi-payment-route-council-r1.json
          jq -e '.hard_rules.never_generate_or_store_private_keys==true and .hard_rules.never_claim_revenue_from_unpaid_checkout==true' generated/evidence/lsi-payment-route-council-r1.json >/dev/null
      - name: Build receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile e2e generated/evidence/asaas-e2e-probe-r1.json --slurpfile council generated/evidence/lsi-payment-route-council-r1.json --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '{schema_version:"1.2",project:"LSI_PAYMENT_HUB_R1",state:(if $e2e[0].asaas_checkout_e2e then "AUTOPILOT_E2E_AND_ROUTE_COUNCIL_PASS" else "AUTOPILOT_DIAGNOSTIC_AND_ROUTE_COUNCIL_PASS" end),run_id:$run,commit:$sha,asaas_e2e:$e2e[0],route_council:$council[0],real_value_moved:false,verified_revenue_brl:0}' > generated/evidence/lsi-payment-hub-autopilot-r1.json
          jq '.state,.asaas_e2e,.route_council.selected_autonomous_next_action' generated/evidence/lsi-payment-hub-autopilot-r1.json
      - uses: actions/upload-artifact@v4
        with:
          name: lsi-payment-hub-autopilot-r1-${{ github.run_id }}
          path: |
            generated/evidence/asaas-e2e-probe-r1.json
            generated/evidence/lsi-payment-route-council-r1.json
            generated/evidence/lsi-payment-hub-autopilot-r1.json
          retention-days: 30
