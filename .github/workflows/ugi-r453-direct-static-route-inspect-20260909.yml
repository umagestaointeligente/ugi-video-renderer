name: UGI R45.3 Direct Static Route Inspect 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r453-direct-static-route-inspect-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Redacted route contract readback
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          import re
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          print('LSI_R453_ROUTE_CONTRACT_V2')
          paths=sorted(set(re.findall(r'["\'](/api/[^"\']+)["\']',s)))
          for p in paths:
            if 'r45' in p.lower() or 'platform-publication' in p.lower(): print('PATH='+p[:240])
          for needle in ['function r453CreateInstagramPost','function createBufferEditorialMediaPost','async function r453CreateInstagramPost','r453CreateInstagramPost =']:
            i=s.find(needle)
            if i>=0:
              clean=re.sub(r'\s+',' ',s[i:i+1800])
              print('CONTRACT='+clean[:1800])
          PY
# route-contract-readback 2026-09-09T21:27:00-03:00
