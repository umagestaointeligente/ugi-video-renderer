name: UGI R45.3 Direct Static Route Inspect 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r453-direct-static-route-inspect-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect all deployed callers of R45.3 static-capable helper
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          for n in ['r453CreateInstagramPost(', '/api/r45-3/', 'story_video', 'imageUrls']:
              print('\n===== '+n+' =====')
              pos=0; seen=0
              while seen<12:
                  i=s.find(n,pos)
                  if i<0: break
                  print(s[max(0,i-6500):min(len(s),i+18000)])
                  pos=i+len(n); seen+=1
              if seen==0: print('NOT_FOUND')
          PY
