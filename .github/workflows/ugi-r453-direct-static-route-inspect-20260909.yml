name: UGI R45.3 Direct Static Route Inspect 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r453-direct-static-route-inspect-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Redacted callable publisher contract readback
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          import re
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          print('LSI_CALLABLE_PUBLISHER_CONTRACT_V1')
          for needle in ['/api/r45-3/instagram-publish','createBufferEditorialMediaPost(','/api/editorial','platform-publication-eligibility']:
            pos=0; seen=0
            while seen<8:
              i=s.find(needle,pos)
              if i<0: break
              clean=re.sub(r'\s+',' ',s[max(0,i-1200):i+4200])
              print('SNIP='+clean[:5400])
              pos=i+len(needle); seen+=1
          PY
# callable-contract-readback 2026-09-09T21:31:00-03:00
