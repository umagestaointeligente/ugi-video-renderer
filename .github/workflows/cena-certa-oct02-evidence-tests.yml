name: Cena Certa Oct02 Evidence Tests
on:
  pull_request:
    paths:
      - 'scripts/cena_certa_oct02*'
      - 'scripts/cena_certa_render_evidence_guard.py'
      - 'tests/test_cena_certa_oct02_evidence.py'
      - '.github/workflows/cena-certa-oct02*'
      - 'ops/cena-certa-oct02/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p 'test_cena_certa_oct02_evidence.py' -v
