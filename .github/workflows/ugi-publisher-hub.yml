name: UGI Publisher Hub

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Optional repo-relative manifest path
        required: false
        type: string
      wait_seconds:
        description: Seconds to wait for draft/media readiness (0 = reconcile and exit)
        required: false
        default: '0'
        type: string
  # Queue pushes remain immediate. The hourly schedule is recovery-only and
  # deliberately conservative because Buffer enforces a 500-request / 24h
  # client window; 15-minute polling unnecessarily exhausted that quota.
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'control-plane/publisher-hub/queue/*.json'

permissions:
  contents: write

concurrency:
  group: ugi-publisher-hub
  cancel-in-progress: false

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  render-schedule-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate hub policy and manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ugi_publisher_hub.py scripts/ugi_render_reconciler.py scripts/ugi_anti_repeat_gate.py scripts/ugi_topic_history_sync.py
          test -f control-plane/anti-repeat/platform-topic-history.json
          MANIFEST="${{ github.event.inputs.manifest || '' }}"
          if [ -n "$MANIFEST" ]; then
            python3 scripts/ugi_publisher_hub.py --validate-only --manifest "$MANIFEST"
          else
            python3 scripts/ugi_publisher_hub.py --validate-only
          fi

      - name: Hard anti-repeat gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_anti_repeat_gate.py

      - name: Ensure missing renders through authoritative Worker bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python3 scripts/ugi_render_reconciler.py

      - name: Schedule through Buffer and prove by readback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          MANIFEST="${{ github.event.inputs.manifest || '' }}"
          WAIT="${{ github.event.inputs.wait_seconds || '0' }}"
          if [ -n "$MANIFEST" ]; then
            python3 scripts/ugi_publisher_hub.py --manifest "$MANIFEST" --wait-seconds "$WAIT"
          else
            python3 scripts/ugi_publisher_hub.py --wait-seconds "$WAIT"
          fi

      - name: Sync proven Buffer receipts into per-platform 15d topic history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_topic_history_sync.py

      - name: Persist Publisher Hub render state, receipts, anti-repeat, topic history and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            control-plane/publisher-hub/render-state/*.json
            control-plane/publisher-hub/receipts/*.json
            control-plane/publisher-hub/status/latest.json
            control-plane/anti-repeat/latest.json
            control-plane/anti-repeat/platform-topic-history.json
          )
          for f in "${files[@]}"; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              if diff -q \
                <(git show "HEAD:$f" | jq -S 'del(.timestamp,.updatedAt,.checkedAt)') \
                <(jq -S 'del(.timestamp,.updatedAt,.checkedAt)' "$f") >/dev/null; then
                git checkout HEAD -- "$f"
              fi
            fi
          done
          git config user.name 'ugi-publisher-hub-bot'
          git config user.email 'ugi-publisher-hub@users.noreply.github.com'
          git add control-plane/publisher-hub/render-state/*.json 2>/dev/null || true
          git add control-plane/publisher-hub/receipts/*.json 2>/dev/null || true
          git add control-plane/publisher-hub/status/latest.json 2>/dev/null || true
          git add control-plane/anti-repeat/platform-topic-history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Publisher Hub state changes"
            exit 0
          fi
          git commit -m "chore: persist UGI Publisher Hub reconciliation"
          git pull --rebase origin main
          git push origin HEAD:main
