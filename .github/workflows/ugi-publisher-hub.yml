name: UGI Publisher Hub

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Optional repo-relative manifest path
        required: false
        type: string
      wait_seconds:
        description: Seconds to wait for draft/media readiness (0 = reconcile and exit)
        required: false
        default: '0'
        type: string
  # Queue pushes remain immediate. Scheduled runs are sparse recovery windows.
  # Buffer-backed work is additionally protected by the zero-network circuit
  # guard, so an OPEN cooldown consumes zero Buffer calls.
  schedule:
    - cron: '47 2,6,10,14,18,22 * * *'
  push:
    branches: [main]
    paths:
      - 'control-plane/publisher-hub/queue/*.json'

permissions:
  contents: write

concurrency:
  group: ugi-publisher-hub
  cancel-in-progress: false

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  render-schedule-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate hub policy and manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ugi_publisher_hub.py \
            scripts/ugi_render_reconciler.py \
            scripts/ugi_anti_repeat_gate.py \
            scripts/ugi_topic_history_sync.py \
            scripts/ugi_buffer_budget_guard.py \
            scripts/ugi_buffer_recovery_canary.py
          test -f config/ugi/buffer-budget-policy.json
          test -f control-plane/observability/buffer-circuit.json
          test -f control-plane/anti-repeat/platform-topic-history.json
          MANIFEST="${{ github.event.inputs.manifest || '' }}"
          if [ -n "$MANIFEST" ]; then
            python3 scripts/ugi_publisher_hub.py --validate-only --manifest "$MANIFEST"
          else
            python3 scripts/ugi_publisher_hub.py --validate-only
          fi

      - name: Hard anti-repeat gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_anti_repeat_gate.py

      - name: Ensure missing renders through authoritative Worker bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python3 scripts/ugi_render_reconciler.py

      - name: Evaluate Buffer budget before any Buffer-backed call
        id: buffer_guard_before
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_buffer_budget_guard.py \
            --operation mutation \
            --github-output "$GITHUB_OUTPUT"

      - name: Controlled one-call Buffer recovery canary
        if: steps.buffer_guard_before.outputs.canary_due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python3 scripts/ugi_buffer_recovery_canary.py

      - name: Re-evaluate Buffer budget after canary
        id: buffer_guard_after
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_buffer_budget_guard.py \
            --operation mutation \
            --github-output "$GITHUB_OUTPUT"

      - name: Schedule through Buffer and prove by readback
        if: steps.buffer_guard_after.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          MANIFEST="${{ github.event.inputs.manifest || '' }}"
          WAIT="${{ github.event.inputs.wait_seconds || '0' }}"
          if [ -n "$MANIFEST" ]; then
            python3 scripts/ugi_publisher_hub.py --manifest "$MANIFEST" --wait-seconds "$WAIT"
          else
            python3 scripts/ugi_publisher_hub.py --wait-seconds "$WAIT"
          fi

      - name: Record Buffer cooldown without probing
        if: steps.buffer_guard_after.outputs.allowed != 'true'
        shell: bash
        run: |
          echo "BUFFER_CALLS_SKIPPED=true"
          echo "BUFFER_GUARD_REASON=${{ steps.buffer_guard_after.outputs.reason }}"
          echo "BUFFER_NEXT_PROBE_AT=${{ steps.buffer_guard_after.outputs.next_probe_at }}"

      - name: Sync proven Buffer receipts into per-platform 15d topic history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_topic_history_sync.py

      - name: Persist Publisher Hub render state, receipts, anti-repeat, circuit and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            control-plane/publisher-hub/render-state/*.json
            control-plane/publisher-hub/receipts/*.json
            control-plane/publisher-hub/status/latest.json
            control-plane/anti-repeat/latest.json
            control-plane/anti-repeat/platform-topic-history.json
            control-plane/observability/buffer-circuit.json
          )
          for f in "${files[@]}"; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              if diff -q \
                <(git show "HEAD:$f" | jq -S 'del(.timestamp,.updatedAt,.checkedAt)') \
                <(jq -S 'del(.timestamp,.updatedAt,.checkedAt)' "$f") >/dev/null; then
                git checkout HEAD -- "$f"
              fi
            fi
          done
          git config user.name 'ugi-publisher-hub-bot'
          git config user.email 'ugi-publisher-hub@users.noreply.github.com'
          git add control-plane/publisher-hub/render-state/*.json 2>/dev/null || true
          git add control-plane/publisher-hub/receipts/*.json 2>/dev/null || true
          git add control-plane/publisher-hub/status/latest.json 2>/dev/null || true
          git add control-plane/anti-repeat/platform-topic-history.json 2>/dev/null || true
          git add control-plane/observability/buffer-circuit.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Publisher Hub state changes"
            exit 0
          fi
          git commit -m "chore: persist UGI Publisher Hub reconciliation"
          git pull --rebase origin main
          git push origin HEAD:main
