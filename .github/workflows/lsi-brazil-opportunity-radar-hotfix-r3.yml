name: LSI Brazil Opportunity Radar Hotfix R3
run-name: LSI Brazil Opportunity Radar Hotfix R3 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths:
      - 'greenfield/brazil-opportunity-radar-r1/hotfix_live_commerce_r3.py'
      - '.github/workflows/lsi-brazil-opportunity-radar-hotfix-r3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_HOST: lola-operacional-ugi.umagestaointeligente.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot live Worker and build R3 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"; test -n "$CF_ACCOUNT_ID"; echo "::add-mask::$CF_API_TOKEN"
          basecf="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN}" "$basecf" >/tmp/b
          python - <<'PY'
          import re
          from email import policy
          from email.parser import BytesParser
          h=open('/tmp/h','rb').read().decode('latin1','replace'); body=open('/tmp/b','rb').read(); m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',h); ct=m.group(1).strip() if m else ''
          parts=[]
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=policy.default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              for p in msg.walk():
                  if p.is_multipart(): continue
                  q=p.get_payload(decode=True) or b''
                  if q and b'RADAR_COMMERCE_PERF_R2' in q and b'/greenfield/brazil-opportunity-radar/checkout' in q and b'/api/commerce/webhook/asaas' in q:
                      cd=p.get('Content-Disposition',''); nm=re.search(r'(?:name|filename)="([^"]+)"',cd)
                      parts.append((q,nm.group(1) if nm else 'worker.js'))
          else: parts=[(body,'worker.js')]
          if not parts: raise SystemExit('R3_LIVE_RADAR_MODULE_NOT_FOUND')
          src,name=max(parts,key=lambda x:len(x[0])); text=src.decode('utf-8')
          for g in ['CHECKOUT_PAID','ASAAS_WEBHOOK_TOKEN','RADAR_PRICE_BRL = 19.90','RADAR_COMMERCE_PERF_R2','application/ld+json']:
              if g not in text: raise SystemExit('R3_GATE_MISSING:'+g)
          safe=re.sub(r'[^A-Za-z0-9._-]','-',name) or 'worker.js'
          if not safe.endswith(('.js','.mjs')): safe='worker.js'
          open('/tmp/current.mjs','wb').write(src);open('/tmp/module-name','w').write(safe)
          PY
          python greenfield/brazil-opportunity-radar-r1/hotfix_live_commerce_r3.py --source /tmp/current.mjs --output /tmp/patched.mjs
          node --check /tmp/patched.mjs
          python - <<'PY'
          old=open('/tmp/current.mjs',encoding='utf-8').read(); new=open('/tmp/patched.mjs',encoding='utf-8').read()
          invariants=['/api/video-render','/api/video-upload','/api/platform-approval','/api/commerce/webhook/asaas','BUFFER_ACCESS_TOKEN','ASAAS_WEBHOOK_TOKEN','CHECKOUT_PAID','/greenfield/packvalue-pro/checkout','RADAR_PRICE_BRL = 19.90','RADAR_ACCESS_TTL_MS = 30 * 24 * 60 * 60 * 1000','application/ld+json']
          for a in invariants:
              if old.count(a)!=new.count(a): raise SystemExit('R3_INVARIANT_CHANGED:'+a)
          for a in ['RADAR_COMMERCE_DENSITY_R3','ranked-source-set-2026-08-31']:
              if a not in new: raise SystemExit('R3_REQUIRED_MISSING:'+a)
          print('R3_PRE_DEPLOY_INVARIANTS=PASS')
          PY
      - name: Deploy R3 content only
        shell: bash
        run: |
          set -euo pipefail
          name="$(cat /tmp/module-name)"; endpoint="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi/content"
          code=$(curl --silent --show-error -o /tmp/deploy.json -w '%{http_code}' -X PUT "$endpoint" -H "Authorization: Bearer ${CF_API_TOKEN}" -F "metadata={\"main_module\":\"${name}\"};type=application/json" -F "${name}=@/tmp/patched.mjs;filename=${name};type=application/javascript+module")
          test "$code" -ge 200; test "$code" -lt 300; jq -e '.success==true' /tmp/deploy.json >/dev/null
      - name: Prove density speed and payment invariants with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'R3_ROLLBACK=START'
            name="$(cat /tmp/module-name)"; endpoint="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi/content"
            curl --fail --silent --show-error -X PUT "$endpoint" -H "Authorization: Bearer ${CF_API_TOKEN}" -F "metadata={\"main_module\":\"${name}\"};type=application/json" -F "${name}=@/tmp/current.mjs;filename=${name};type=application/javascript+module" >/tmp/rollback.json
            jq -e '.success==true' /tmp/rollback.json >/dev/null
            echo 'R3_ROLLBACK=PASS'
          }
          trap rollback ERR
          base="https://${PUBLIC_HOST}"
          ready=false
          for i in $(seq 1 20); do
            h=$(curl -sS -o /tmp/h.json -w '%{http_code}' "$base/greenfield/brazil-opportunity-radar/health" || true)
            s=$(curl --max-time 12 -sS -o /tmp/source.json -w '%{http_code}' "$base/greenfield/brazil-opportunity-radar/source-health" || true)
            if [ "$h" = 200 ] && [ "$s" = 200 ] && jq -e '.ok==true and .densityVersion=="ranked-source-set-2026-08-31" and .count>0 and .elapsedMs<10000 and (.upstream|length)==4 and (.upstream|any(.provider=="Compras.gov.br" and .status==200))' /tmp/source.json >/dev/null 2>&1; then ready=true; echo "R3_EDGE_READY=$i"; break; fi
            sleep 1
          done
          test "$ready" = true
          neg=$(curl -sS -o /tmp/neg.json -w '%{http_code}' -X POST "$base/greenfield/brazil-opportunity-radar/checkout" -H 'content-type: application/json' --data '{"price":1}' || true)
          test "$neg" = 400; jq -e '.error=="fixed_offer_accepts_no_client_parameters"' /tmp/neg.json >/dev/null
          fake=$(curl -sS -o /tmp/fake.txt -w '%{http_code}' "$base/greenfield/brazil-opportunity-radar/access/not-a-real-token" || true)
          test "$fake" = 410
          pack=$(curl -sS -o /tmp/pack.json -w '%{http_code}' "$base/greenfield/packvalue-pro/health" || true); test "$pack" = 200
          landing=$(curl -sS -o /tmp/landing.html -w '%{http_code}' "$base/brazil-opportunity-radar" || true); test "$landing" = 200; grep -Fq 'application/ld+json' /tmp/landing.html
          trap - ERR
          echo "R3_SOURCE_COUNT=$(jq -r '.count' /tmp/source.json)"
          echo "R3_SOURCE_ELAPSED_MS=$(jq -r '.elapsedMs' /tmp/source.json)"
          echo 'R3_PRODUCTION_QA=PASS'
      - name: Receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson source "$(cat /tmp/source.json)" '{schema_version:"1.0",project:"LSI_REVENUE_DEMAND_FIRST",component:"BRAZIL_OPPORTUNITY_RADAR_COMMERCE_R3",state:"LIVE_RECEIVABLE_DENSE_FAST",run_id:$run,commit:$sha,price_brl:19.90,access_days:30,payment_provider:"asaas",authoritative_payment_event:"CHECKOUT_PAID",density_version:"ranked-source-set-2026-08-31",source_health:$source,paid_access_requires_settlement:true,verified_revenue_brl:0,real_value_moved:false,rollback_ready:true}' | tee generated/evidence/lsi-brazil-opportunity-radar-hotfix-r3.json
      - uses: actions/upload-artifact@v4
        with:
          name: lsi-brazil-opportunity-radar-hotfix-r3-${{ github.run_id }}
          path: generated/evidence/lsi-brazil-opportunity-radar-hotfix-r3.json
          retention-days: 30
