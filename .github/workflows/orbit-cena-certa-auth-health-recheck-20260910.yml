name: Orbit Cena Certa Auth Health Recheck
on:
  push:
    paths:
      - '.github/workflows/orbit-cena-certa-auth-health-recheck-20260910.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed auth worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://orbit-cena-certa-auth.umagestaointeligente.workers.dev'
          echo ORBIT_CENA_CERTA_AUTH_HEALTH_RECHECK_V1
          for path in /health /status; do
            code="$(curl -sS -o /tmp/out -w '%{http_code}' "$BASE$path")"
            echo "$path HTTP=$code"
            cat /tmp/out | head -c 1000; echo
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/start")"
          echo "/start HTTP=$code"
          echo MUTATION_PERFORMED=false
