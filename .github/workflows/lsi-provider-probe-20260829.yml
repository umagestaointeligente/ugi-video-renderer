name: LSI Provider Zero-Cost Probe
run-name: LSI Provider Probe ${{ github.run_id }}

on:
  push:
    branches: [lsi-provider-probe-20260829]
    paths:
      - '.github/workflows/lsi-provider-probe-20260829.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Probe credential presence without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          bool(){ if [ -n "${1:-}" ]; then printf true; else printf false; fi; }
          jq -n \
            --argjson gemini_free "$(bool "$GEMINI_FREE_API_KEY")" \
            --argjson gemini "$(bool "$GEMINI_API_KEY")" \
            --argjson google "$(bool "$GOOGLE_API_KEY")" \
            --argjson groq "$(bool "$GROQ_API_KEY")" \
            --argjson openrouter "$(bool "$OPENROUTER_API_KEY")" \
            --argjson anthropic "$(bool "$ANTHROPIC_API_KEY")" \
            '{gemini_free_api_key:$gemini_free,gemini_api_key:$gemini,google_api_key:$google,groq_api_key:$groq,openrouter_api_key:$openrouter,anthropic_api_key:$anthropic}' \
            > generated/evidence/provider-secret-presence.json

      - name: Probe Gemini direct authentication only
        if: env.GEMINI_FREE_API_KEY != '' || env.GEMINI_API_KEY != '' || env.GOOGLE_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          KEY="$GEMINI_FREE_API_KEY"; [ -n "$KEY" ] || KEY="$GEMINI_API_KEY"; [ -n "$KEY" ] || KEY="$GOOGLE_API_KEY"
          code="$(curl --silent --show-error --output /tmp/gemini-models.json --write-out '%{http_code}' -H "x-goog-api-key: $KEY" 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')"
          if [ "$code" = 200 ]; then echo '{"auth":true,"inference_tested":false,"billing_risk_taken":false}' > generated/evidence/gemini-direct-probe.json; else jq -n --arg code "$code" '{auth:false,http_code:$code,inference_tested:false,billing_risk_taken:false}' > generated/evidence/gemini-direct-probe.json; fi

      - name: Probe Groq authentication only
        if: env.GROQ_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/groq-models.json --write-out '%{http_code}' -H "Authorization: Bearer $GROQ_API_KEY" 'https://api.groq.com/openai/v1/models')"
          if [ "$code" = 200 ]; then echo '{"auth":true,"inference_tested":false,"billing_risk_taken":false}' > generated/evidence/groq-probe.json; else jq -n --arg code "$code" '{auth:false,http_code:$code,inference_tested:false,billing_risk_taken:false}' > generated/evidence/groq-probe.json; fi

      - name: Probe OpenRouter with explicit zero-dollar model
        if: env.OPENROUTER_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          MODEL='google/gemma-4-26b-a4b-it:free'
          code="$(curl --silent --show-error --output /tmp/openrouter.json --write-out '%{http_code}' \
            -X POST 'https://openrouter.ai/api/v1/chat/completions' \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply exactly OPENROUTER_FREE_OK\"}],\"max_tokens\":40,\"temperature\":0}")"
          text="$(jq -r '.choices[0].message.content // empty' /tmp/openrouter.json 2>/dev/null || true)"
          err="$(jq -r '.error.message // empty' /tmp/openrouter.json 2>/dev/null || true)"
          model_returned="$(jq -r '.model // empty' /tmp/openrouter.json 2>/dev/null || true)"
          jq -n --arg code "$code" --arg text "$text" --arg error "$err" --arg requested "$MODEL" --arg returned "$model_returned" \
            '{http_code:$code,free_model:true,requested_model:$requested,returned_model:$returned,marker:($text|contains("OPENROUTER_FREE_OK")),response_present:($text|length>0),error:$error}' \
            > generated/evidence/openrouter-free-probe.json

      - name: Record Anthropic as no-call paid candidate
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        run: |
          echo '{"credential_present":true,"api_called":false,"reason":"paid_api_excluded_by_zero_cost_policy"}' > generated/evidence/anthropic-probe.json

      - name: Consolidate sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile secrets generated/evidence/provider-secret-presence.json \
            --argjson gemini "$(cat generated/evidence/gemini-direct-probe.json 2>/dev/null || echo null)" \
            --argjson groq "$(cat generated/evidence/groq-probe.json 2>/dev/null || echo null)" \
            --argjson openrouter "$(cat generated/evidence/openrouter-free-probe.json 2>/dev/null || echo null)" \
            --argjson anthropic "$(cat generated/evidence/anthropic-probe.json 2>/dev/null || echo null)" \
            '{schema_version:"1.1",secrets:$secrets[0],gemini:$gemini,groq:$groq,openrouter:$openrouter,anthropic:$anthropic,secrets_exposed:false,zero_cost_policy:true}' \
            > generated/evidence/lsi-provider-probe.json
          cat generated/evidence/lsi-provider-probe.json

      - uses: actions/upload-artifact@v4
        with:
          name: lsi-provider-probe-${{ github.run_id }}
          path: generated/evidence/
          retention-days: 14
          if-no-files-found: error
