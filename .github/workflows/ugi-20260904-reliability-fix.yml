name: UGI 2026-09-04 Reliability Fix

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-20260904-reliability-fix.yml'

permissions:
  contents: write

concurrency:
  group: ugi-20260904-reliability-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve native video format in render bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ugi_render_reconciler.py')
          text = p.read_text(encoding='utf-8')
          old = '''    payload: dict[str, Any] = {\n        "title": command.get("title"),\n        "duration": command.get("duration"),\n        "content_id": content_id,\n'''
          new = '''    payload: dict[str, Any] = {\n        "title": command.get("title"),\n        "duration": command.get("duration"),\n        "type": command.get("type") or package_meta.get("type") or "reel",\n        "content_id": content_id,\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '"type": command.get("type") or package_meta.get("type") or "reel"' not in text:
              raise SystemExit('RENDER_TYPE_ANCHOR_NOT_FOUND')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate native format patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ugi_render_reconciler.py scripts/ugi_publisher_hub.py
          grep -q 'command.get("type") or package_meta.get("type") or "reel"' scripts/ugi_render_reconciler.py
          ! grep -q 'raise RuntimeError("BUFFER_CHANNELS_FAIL")' scripts/ugi_publisher_hub.py
          grep -q 'SKIP_STALE' .github/workflows/ugi-instagram-multiformat-hub.yml

      - name: Commit native format repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-reliability-bot'
          git config user.email 'ugi-reliability@users.noreply.github.com'
          git add scripts/ugi_render_reconciler.py
          if git diff --cached --quiet; then
            echo 'Native format repair already applied.'
            exit 0
          fi
          git commit -m 'fix: preserve native video format in render bridge'
          git pull --rebase origin main
          git push origin HEAD:main
