name: UGI 2026-09-04 Reliability Fix

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-20260904-reliability-fix.yml'

permissions:
  contents: write

concurrency:
  group: ugi-20260904-reliability-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Publisher Hub Buffer readiness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          hub = Path('scripts/ugi_publisher_hub.py')
          text = hub.read_text(encoding='utf-8')

          old_doc = '- Worker health and Buffer channels must be proven before mutation;'
          new_doc = '- Worker health must be proven before mutation; Buffer is proven on the actual per-post create/readback path;'
          if old_doc in text:
              text = text.replace(old_doc, new_doc, 1)
          elif new_doc not in text:
              raise SystemExit('PUBLISHER_HUB_DOCSTRING_ANCHOR_NOT_FOUND')

          old_gate = '''    channels = client.get("/api/buffer/channels")\n    if not channels.get("ok"):\n        raise RuntimeError("BUFFER_CHANNELS_FAIL")\n\n'''
          new_gate = '''    # Buffer channel discovery is not a global hard gate. The Worker owns\n    # canonical channel resolution; the authoritative proof is the actual\n    # per-post /api/platform-publish response followed by scheduled readback.\n    # A real Buffer create/readback failure still fails closed below.\n\n'''
          if old_gate in text:
              text = text.replace(old_gate, new_gate, 1)
          elif new_gate not in text:
              raise SystemExit('PUBLISHER_HUB_BUFFER_GATE_ANCHOR_NOT_FOUND')

          hub.write_text(text, encoding='utf-8')
          PY

      - name: Validate Publisher Hub patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ugi_publisher_hub.py
          grep -q 'per-post /api/platform-publish' scripts/ugi_publisher_hub.py
          ! grep -q 'raise RuntimeError("BUFFER_CHANNELS_FAIL")' scripts/ugi_publisher_hub.py
          grep -q 'gate": "BUFFER_CREATE"' scripts/ugi_publisher_hub.py
          grep -q '_scheduled_readback_pass' scripts/ugi_publisher_hub.py

      - name: Commit Publisher Hub repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-reliability-bot'
          git config user.email 'ugi-reliability@users.noreply.github.com'
          git add scripts/ugi_publisher_hub.py
          if git diff --cached --quiet; then
            echo 'Publisher Hub repair already applied.'
            exit 0
          fi
          git commit -m 'fix: prove Buffer on create and readback path'
          git pull --rebase origin main
          git push origin HEAD:main
