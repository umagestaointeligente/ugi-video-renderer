name: Cena Certa Sep10 Trigger Production

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-sep10-trigger-production.yml'

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch canonical production workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_MARKER: sep10-v4-20260908T2219Z
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch_marker=$RUN_MARKER"
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/cena-certa-production-v2.yml/dispatches'
          payload=json.dumps({'ref':'feat/cena-certa-factory-v2-certified'}).encode()
          req=urllib.request.Request(url,data=payload,method='POST',headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'CenaCertaSep10Trigger',
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status != 204:
                  raise SystemExit(f'WORKFLOW_DISPATCH_FAIL status={r.status}')
          print('WORKFLOW_DISPATCH_ACCEPTED cena-certa-production-v2.yml')
          PY
