name: Career360 V16 Clarity Smoke

on:
  push:
    branches: [main]
    paths:
      - 'career360/frontend/app-m.js'
      - 'career360/frontend/index.html'
      - 'career360/tests/v16-clarity-smoke.mjs'
      - '.github/workflows/career360-v16-clarity-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career360-v16-clarity-smoke
  cancel-in-progress: true

jobs:
  clarity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cp career360/frontend/app-m.js /tmp/app-m.mjs
          node --check /tmp/app-m.mjs
          node --check career360/tests/v16-clarity-smoke.mjs

      - name: Canonical V16 bundle pin gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '@6df7b4e63d7e52ce3c3f02247392b98f0393cbe8/career360/frontend/app-k.js' career360/frontend/index.html >/dev/null
          grep -F '@4283646143425e4a3156e44100aabb475df88d27/career360/frontend/app-l.js' career360/frontend/index.html >/dev/null
          grep -F '@d3279ea45b3d3bb9f1686249199d2a46d34eaa2b/career360/frontend/app-m.js' career360/frontend/index.html >/dev/null
          test "$(grep -o 'career360/frontend/app-m.js' career360/frontend/index.html | wc -l | tr -d ' ')" = '1'
          echo 'V16_CANONICAL_BUNDLE_PIN_GATE=PASS'
          echo 'V16_TOUCH_TARGET_POLICY=44PX'

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/career360-v16
          cd /tmp/career360-v16
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/career360/tests/v16-clarity-smoke.mjs" ./v16-clarity-smoke.mjs

      - name: Run V16 clarity browser regression
        env:
          REPO_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/career360-v16
          node v16-clarity-smoke.mjs
