name: UGI Instagram 2026-09-01 V2 Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-instagram-20260901-production.yml'
      - 'scripts/ugi_instagram_production_20260901.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-instagram-20260901-production
  cancel-in-progress: false

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audiovisual runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet requests pillow
      - name: Generate V2 stories and carousel
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_instagram_production_20260901.py
      - name: Persist assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf control-plane/instagram-20260901/assets/_music
          git config user.name 'ugi-instagram-production-bot'
          git config user.email 'ugi-instagram-production@users.noreply.github.com'
          git add control-plane/instagram-20260901/assets
          git commit -m 'media: persist UGI Instagram V2 assets for 2026-09-01'
          git pull --rebase origin main
          git push origin HEAD:main
