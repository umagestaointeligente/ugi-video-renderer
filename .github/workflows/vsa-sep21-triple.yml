# VSA_VISUAL_STORY_ENGINE_V1
# VSA_VISUAL_RELEASE_RECEIPT_V2
# Metricool VSA brand lock: 6935441
# NON-PUBLISHING PRODUCTION. Scheduling only after exact-master release PASS.
name: VSA Sep21 Triple Production
on:
  workflow_dispatch:
  push:
    branches: [ops/vsa-sep21-three-production]
    paths:
      - '.github/workflows/vsa-sep21-triple.yml'
      - 'production/vsa/pilots/sep21_triple/render_sep21_triple.py'
permissions:
  contents: read
concurrency:
  group: vsa-sep21-triple-production
  cancel-in-progress: true
jobs:
  render-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow requests edge-tts
      - name: Compile renderer
        run: python -m py_compile production/vsa/pilots/sep21_triple/render_sep21_triple.py
      - name: Editorial hard gates before render
        run: |
          set -euo pipefail
          R=production/vsa/pilots/sep21_triple/render_sep21_triple.py
          test "$(grep -o 'Agora você já sabe\.' "$R" | wc -l)" -eq 1
          grep -q 'ANIMAÇÃO • CENTRO DE MASSA' "$R"
          grep -q 'ANIMAÇÃO • ONDA SONORA' "$R"
          grep -q 'ANIMAÇÃO • MIXAGEM NO OUVIDO' "$R"
          grep -q 'MASK_SHA="ac8162ee849f154edf2519ef649f64cd470737df7b5ecbabb7085f72059cfd56"' "$R"
      - name: Render three fresh final masters
        run: |
          set -euo pipefail
          python production/vsa/pilots/sep21_triple/render_sep21_triple.py | tee /tmp/vsa_sep21.log
          OUT=production/vsa/pilots/sep21_triple/output
          test -s "$OUT/flip_vertical/VSA_flip_vertical_SEP21.mp4"
          test -s "$OUT/trovao_atraso/VSA_trovao_atraso_SEP21.mp4"
          test -s "$OUT/anitta_inear/VSA_anitta_inear_SEP21.mp4"
          cp /tmp/vsa_sep21.log "$OUT/RENDER_LOG.txt"
      - name: Prove animation segments are visually distinct
        run: |
          set -euo pipefail
          AS=production/vsa/pilots/sep21_triple/assets
          for slug in flip_vertical trovao_atraso anitta_inear; do
            rm -f /tmp/${slug}_*.png
            ffmpeg -loglevel error -ss 0.5 -i "$AS/${slug}_3d.mp4" -frames:v 1 "/tmp/${slug}_0.png"
            ffmpeg -loglevel error -ss 2.5 -i "$AS/${slug}_3d.mp4" -frames:v 1 "/tmp/${slug}_1.png"
            ffmpeg -loglevel error -ss 4.5 -i "$AS/${slug}_3d.mp4" -frames:v 1 "/tmp/${slug}_2.png"
            test "$(sha256sum /tmp/${slug}_*.png | awk '{print $1}' | sort -u | wc -l)" -eq 3
          done
      - name: Gate exact masters
        run: |
          set -euo pipefail
          OUT=production/vsa/pilots/sep21_triple/output
          for slug in flip_vertical trovao_atraso anitta_inear; do
            python scripts/vsa/validate_release_receipt.py               --policy config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json               --receipt "$OUT/$slug/RELEASE_RECEIPT.json"               --master "$OUT/$slug/VSA_${slug}_SEP21.mp4"
          done
      - name: Upload gated masters and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: vsa-sep21-three-gated-shorts
          path: production/vsa/pilots/sep21_triple/output/
          if-no-files-found: error
          retention-days: 7
