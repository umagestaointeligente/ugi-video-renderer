name: UGI SEMICON Taiwan Preview V1 2026-09-08
on:
  push:
    paths:
      - 'scripts/ugi_editorial_20260908_semicon_v1.py'
      - '.github/workflows/ugi-editorial-semicon-v1-20260908.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install edge-tts
      - name: Build SEMICON preview
        run: python scripts/ugi_editorial_20260908_semicon_v1.py
      - name: Persist preview and QA only
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'ugi-editorial-video-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08/video-semicon-taiwan-preview-v1.mp4 public/ugi/editorial/2026-09-08/video-semicon-taiwan-preview-v1-qa.jpg public/ugi/editorial/2026-09-08/PREVIEW_ONLY.txt
          git commit -m 'preview: SEMICON Taiwan UGI video v1' || exit 0
          git push
