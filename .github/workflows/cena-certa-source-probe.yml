name: Cena Certa Source Probe

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Resolve and HEAD exact four production sources
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          headers={'User-Agent':'CenaCertaSourceProbe/6.0 (canonical production preflight)'}
          files={
            'tears':'Tears of Steel 1080p.webm',
            'pendatang':'PENDATANG (2023) full movie.webm',
            'bodega':'Breakfast at the Bodega.webm',
            'scp':'SCP- Containment Breach - The Movie - SCP-173 Live Action.webm',
          }
          wanted={rid:'480p.vp9.webm' for rid in files}
          rows=[]
          for rid,title in files.items():
              params=urllib.parse.urlencode({'action':'query','format':'json','formatversion':'2','prop':'videoinfo','titles':'File:'+title,'viprop':'url|size|mime|derivatives'})
              req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+params,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              vi=data['query']['pages'][0]['videoinfo'][0]
              candidates=[]
              for d in vi.get('derivatives',[]):
                  src=d.get('src') or ''
                  if src.startswith('//'): src='https:'+src
                  if src and wanted[rid] in src:
                      candidates.append(src)
              if not candidates: raise SystemExit('DERIVATIVE_NOT_FOUND '+rid+' '+wanted[rid])
              src=candidates[0]
              hreq=urllib.request.Request(src,headers=headers,method='HEAD')
              with urllib.request.urlopen(hreq,timeout=30) as r:
                  length=int(r.headers.get('Content-Length') or 0); ctype=r.headers.get('Content-Type'); final=r.geturl(); status=r.status
              if status<200 or status>=400 or not length or length>2147483648: raise SystemExit(f'SOURCE_HEAD_FAIL {rid} {status} {length}')
              rows.append({'id':rid,'title':title,'url':src,'final_url':final,'status':status,'content_length':length,'content_type':ctype})
          report={'schema':'CENA_CERTA_EXACT4_SOURCE_PROOF_V1','items':rows}
          open('source-probe.json','w',encoding='utf-8').write(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: cena-certa-source-probe-${{ github.run_id }}
          path: source-probe.json
          if-no-files-found: error
          retention-days: 2
