name: Cena Certa Source Probe

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Resolve licensed Wikimedia source derivatives without media download
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          files={
            'tears':'Tears of Steel 1080p.webm',
            'scp_cb':'SCP- Containment Breach - The Movie - SCP-173 Live Action.webm',
            'antimemetics':'There Is No Antimemetics Division.webm',
            'pendatang':'PENDATANG (2023) full movie.webm',
          }
          headers={'User-Agent':'CenaCertaSourceProbe/2.0 (canonical production preflight)'}
          rows=[]
          for rid,title in files.items():
              params=urllib.parse.urlencode({
                  'action':'query','format':'json','formatversion':'2','prop':'videoinfo',
                  'titles':'File:'+title,'viprop':'url|size|mime|derivatives'
              })
              url='https://commons.wikimedia.org/w/api.php?'+params
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              page=data['query']['pages'][0]
              vi=page['videoinfo'][0]
              derivatives=[]
              for d in vi.get('derivatives',[]):
                  src=d.get('src')
                  if src and src.startswith('//'): src='https:'+src
                  derivatives.append({
                      'src':src,'type':d.get('type'),'transcodekey':d.get('transcodekey'),
                      'width':d.get('width'),'height':d.get('height'),'bandwidth':d.get('bandwidth')
                  })
              rows.append({'id':rid,'title':title,'original_url':vi.get('url'),'size':vi.get('size'),'mime':vi.get('mime'),'derivatives':derivatives})
          report={'schema':'CENA_CERTA_COMMONS_SOURCE_PROBE_V2','items':rows}
          open('source-probe.json','w',encoding='utf-8').write(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: cena-certa-source-probe-${{ github.run_id }}
          path: source-probe.json
          if-no-files-found: error
          retention-days: 2
