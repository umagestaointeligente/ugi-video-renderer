name: Career360 V16 Static Auth Truth Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-static-auth-truth-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch static auth copy
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_static_auth_truth_patch.py
          git diff --check
      - name: Commit static truth source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add career360/frontend/index.html
          git diff --cached --check
          git commit -m 'career360: make auth copy truthful in static HTML'
          git push origin HEAD:main
          echo "V16_STATIC_AUTH_TRUTH_BUNDLE_COMMIT=$(git rev-parse HEAD)"
