name: LSI Specialist Router CI
run-name: LSI Specialist Router CI ${{ github.run_id }}

on:
  push:
    branches:
      - lsi-specialist-router-prod-20260829
    paths:
      - 'cloudflare/lsi-zero-cost-broker.mjs'
      - '.github/workflows/lsi-specialist-router-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate exact production router module
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/lsi-zero-cost-broker.mjs
          node --input-type=module <<'NODE'
          import worker, { resolveRole } from './cloudflare/lsi-zero-cost-broker.mjs';
          const expected = {
            cheap_text: '@cf/meta/llama-3.1-8b-instruct-fast',
            fast_text: '@cf/zai-org/glm-4.7-flash',
            structured_json: '@cf/zai-org/glm-4.7-flash',
            deep_text: '@cf/google/gemma-4-26b-a4b-it',
          };
          for (const [role, model] of Object.entries(expected)) {
            const route = resolveRole(role);
            if (route.model !== model || route.role !== role) throw new Error(`route_mismatch:${role}`);
          }
          if (resolveRole().role !== 'cheap_text') throw new Error('default_role_mismatch');
          let denied = false;
          try { resolveRole('paid_or_unknown'); } catch (e) { denied = String(e.message).includes('task_role_not_allowed'); }
          if (!denied) throw new Error('unknown_role_not_denied');
          const response = await worker.fetch(new Request('https://broker.test/health'), { AI: {}, BROKER_PRIVATE_JWK: 'configured' });
          const health = await response.json();
          if (!health.ok || health.external_paid_provider !== false) throw new Error('health_zero_cost_gate_failed');
          if (health.default_role !== 'cheap_text') throw new Error('health_default_role_failed');
          if (Object.keys(health.role_models || {}).length !== 4) throw new Error('health_role_map_failed');
          console.log(JSON.stringify({ok:true, expected, version:health.version}));
          NODE

      - name: Ensure no model override escape hatch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'task_model_override_forbidden' cloudflare/lsi-zero-cost-broker.mjs
          grep -q 'task_role_not_allowed' cloudflare/lsi-zero-cost-broker.mjs
          echo 'LSI_SPECIALIST_ROUTER_CI=PASS' >> "$GITHUB_STEP_SUMMARY"
