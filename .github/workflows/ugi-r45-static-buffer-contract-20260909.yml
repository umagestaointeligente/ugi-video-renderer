name: UGI R45.7 Static Buffer Contract 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r45-static-buffer-contract-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed static Buffer helper and post-status routes
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          for n in ['async function bufferCreatePost','function bufferCreatePost','async function getBufferPostStatus','getBufferPostStatus(postId','/api/linkedin-publication-status']:
              print('\n===== '+n+' =====')
              pos=0; seen=0
              while seen<3:
                  i=s.find(n,pos)
                  if i<0: break
                  print(s[max(0,i-3500):min(len(s),i+15000)])
                  pos=i+len(n); seen+=1
              if seen==0: print('NOT_FOUND')
          PY
