name: UGI 2026-09-04 Story Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_20260904_story_hotfix.py'
      - '.github/workflows/ugi-20260904-story-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deploy exact Story hotfix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python -m py_compile scripts/r45_instagram_multiformat_deploy.py scripts/ugi_20260904_story_hotfix.py
          PYTHONPATH=scripts python scripts/ugi_20260904_story_hotfix.py
      - name: Verify deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OK=true$' cloudflare/status/ugi-20260904-story-hotfix.txt
          grep -q '^TODAY_STORY_METADATA_LOCK=0900,1030,1800$' cloudflare/status/ugi-20260904-story-hotfix.txt
          grep -q '^EXACT_RECOVERY_ALLOWLIST=1030,1800$' cloudflare/status/ugi-20260904-story-hotfix.txt
      - name: Persist deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-recovery-bot'
          git config user.email 'ugi-recovery@users.noreply.github.com'
          git add cloudflare/status/ugi-20260904-story-hotfix.txt
          git commit -m 'chore: persist UGI 04/09 Story hotfix' || true
          git pull --rebase origin main
          git push origin HEAD:main
