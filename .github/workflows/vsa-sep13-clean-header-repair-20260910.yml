name: VSA Sep13 Clean Header Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsa-sep13-clean-header-repair-20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MEDIA_BRANCH: 'vsa-media-sep13-clean-20260910'
  VSA_MASK_V2_URL: 'https://firebasestorage.googleapis.com/v0/b/postly-548c1.appspot.com/o/6aa14d404438a68c12000000%2F1789088208879_VSA_MASK_CANONICAL_V2.png?alt=media'
  VSA_MASK_V2_SHA: 'ac8162ee849f154edf2519ef649f64cd470737df7b5ecbabb7085f72059cfd56'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        id: [DUST_MALI,FERNANDA_MONTENEGRO,HUNGA_TSUNAMI,ELTON_ENERGY,EMIT_MINE,MARISKA_LONGEVITY,SENTINEL_HURRICANE,EMICIDA_INFLUENCE]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --quiet edge-tts pillow pyyaml
      - name: Extract Sep13 topic and patch only clean-header composition
        env:
          VSA_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,json,os,yaml
          sep13=pathlib.Path('.github/workflows/vsa-sep13-parallel-final-20260910.yml').read_text(encoding='utf-8')
          doc=yaml.safe_load(sep13)
          all_topics=json.loads(doc['env']['TOPICS_JSON'])
          picked=[x for x in all_topics if x['id']==os.environ['VSA_ID']]
          if len(picked)!=1:
              raise SystemExit('TOPIC_NOT_UNIQUE:'+os.environ['VSA_ID'])
          pathlib.Path('/tmp/topics.json').write_text(json.dumps(picked,ensure_ascii=False),encoding='utf-8')

          oldwf=pathlib.Path('.github/workflows/vsa-sep10-11-finalize-20260909.yml').read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/build_vsa\.py <<'PY'\n(.*?)\n\s*PY\n\s*python /tmp/build_vsa\.py",oldwf,re.S)
          if not m:
              raise SystemExit('BUILD_SCRIPT_NOT_FOUND')
          lines=m.group(1).splitlines()
          indent=min((len(x)-len(x.lstrip()) for x in lines if x.strip()),default=0)
          script='\n'.join(x[indent:] if len(x)>=indent else x for x in lines)+'\n'

          # Preserve the already-approved audio/music behavior.
          reps=[
            ('f"[0:a]aresample=48000,volume=1.0[n];"','f"[0:a]aresample=48000,volume=1.0,asplit=2[n1][n2];"'),
            ('"[m][n]sidechaincompress=threshold=0.04:ratio=8:attack=20:release=300[duck];"','"[m][n1]sidechaincompress=threshold=0.04:ratio=8:attack=20:release=300[duck];"'),
            ('"[n][duck]amix=inputs=2:duration=first:normalize=0,"','"[n2][duck]amix=inputs=2:duration=first:normalize=0,"'),
            ('f"[0:a]aresample=48000,volume=1.0,apad=pad_dur={cta_len}[n];"','f"[0:a]aresample=48000,volume=1.0,apad=pad_dur={cta_len},asplit=2[n1][n2];"'),
            ('"[m][n]sidechaincompress=threshold=0.04:ratio=8:attack=20:release=250[duck];"','"[m][n1]sidechaincompress=threshold=0.04:ratio=8:attack=20:release=250[duck];"'),
            ('"[n][duck]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-16:TP=-1.5:LRA=11[a]"','"[n2][duck]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-16:TP=-1.5:LRA=11[a]"')
          ]
          for old,new in reps:
              if old not in script:
                  raise SystemExit('AUDIO_SNIPPET_MISSING')
              script=script.replace(old,new,1)

          old='return float(out(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(p)]))'
          new='''raw=out(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(p)])\n    try:\n        return float(raw)\n    except (TypeError,ValueError):\n        if pathlib.Path(p).suffix.lower() in (".webm",".ogv"):\n            print("DURATION_METADATA_FALLBACK",p,raw,flush=True)\n            return 60.0\n        raise'''
          if old not in script:
              raise SystemExit('PROBE_RETURN_MISSING')
          script=script.replace(old,new,1)

          old='start=(2.0 + real_count*(sd/3.0)) % available if available>0.6 else 0.0'
          new='custom=t.get("real_starts") or []; start=float(custom[real_count]) if real_count < len(custom) else ((2.0 + real_count*(sd/3.0)) % available if available>0.6 else 0.0); start=max(0.0,min(start,max(0.0,sd-segd-0.2)))'
          if old not in script:
              raise SystemExit('REAL_START_SNIPPET_MISSING')
          script=script.replace(old,new,1)

          # CLEAN HEADER REPAIR: old carrier remains CTA-only. Body shell is exact V2 clean mask.
          old='run(["ffmpeg","-y","-loglevel","error","-ss","0.6","-i",str(carrier),"-frames:v","1","-vf","scale=1080:1920",str(ASSETS/"shell.jpg")])'
          new='''mask=download(os.environ["VSA_MASK_V2_URL"], ASSETS/"VSA_MASK_CANONICAL_V2.png")\nmask_sha=hashlib.sha256(mask.read_bytes()).hexdigest()\nif mask_sha != os.environ["VSA_MASK_V2_SHA"]:\n    raise RuntimeError(f"MASK_V2_SHA_MISMATCH {mask_sha}")\nrun(["ffmpeg","-y","-loglevel","error","-i",str(mask),"-frames:v","1","-vf","scale=1080:1920",str(ASSETS/"shell.png")])'''
          if old not in script:
              raise SystemExit('LEGACY_SHELL_EXTRACT_NOT_FOUND')
          script=script.replace(old,new,1)
          script=script.replace('str(ASSETS/"shell.jpg")','str(ASSETS/"shell.png")')

          # Single title: use the clean V2 header; never paint a cover rectangle over a prior title.
          old='titlef=wd/"title.txt"; titlef.write_text(textwrap.fill(t["title"], width=30),encoding="utf-8")'
          new='titlef=wd/"title.txt"; titlef.write_text(textwrap.fill(t["title"], width=26),encoding="utf-8")'
          if old not in script:
              raise SystemExit('TITLE_WRAP_SNIPPET_MISSING')
          script=script.replace(old,new,1)
          script=script.replace('"drawbox=x=225:y=55:w=825:h=285:color=0x061224@0.96:t=fill,"','')
          script=script.replace('f"drawtext=fontfile={FONT}:textfile={titlef}:fontcolor=white:fontsize=46:"','f"drawtext=fontfile={FONT}:textfile={titlef}:fontcolor=white:fontsize=44:"')
          script=script.replace('"x=245:y=95:box=0,"','"x=70:y=72:box=0:line_spacing=8,"')
          script=script.replace('"drawbox=x=45:y=1325:w=990:h=245:color=0x061224@0.82:t=fill,"','')

          # Fail closed if any legacy title-cover technique survived the patch.
          forbidden=['shell.jpg','drawbox=x=225:y=55:w=825:h=285','drawbox=x=45:y=1325:w=990:h=245']
          leftovers=[x for x in forbidden if x in script]
          if leftovers:
              raise SystemExit('CLEAN_HEADER_PATCH_FAIL:'+','.join(leftovers))
          if script.count('textfile={titlef}') != 1:
              raise SystemExit('SINGLE_TITLE_RENDER_FAIL')

          pathlib.Path('/tmp/build_vsa.py').write_text(script,encoding='utf-8')
          PY
          export TOPICS_JSON="$(cat /tmp/topics.json)"
          python -m py_compile /tmp/build_vsa.py
          python /tmp/build_vsa.py

      - name: Generate thumbnail and clean-header QA receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,hashlib,os
          from PIL import Image,ImageDraw,ImageFont
          t=json.loads(pathlib.Path('/tmp/topics.json').read_text(encoding='utf-8'))[0]
          root=pathlib.Path('/tmp/vsa_sep10_11')
          mask=root/'assets'/'VSA_MASK_CANONICAL_V2.png'
          actual=hashlib.sha256(mask.read_bytes()).hexdigest()
          if actual != os.environ['VSA_MASK_V2_SHA']:
              raise SystemExit('CLEAN_HEADER_FAIL:MASK_SHA')
          code=pathlib.Path('/tmp/build_vsa.py').read_text(encoding='utf-8')
          if any(x in code for x in ['shell.jpg','drawbox=x=225:y=55:w=825:h=285','drawbox=x=45:y=1325:w=990:h=245']):
              raise SystemExit('CLEAN_HEADER_FAIL:LEGACY_COMPOSITION')
          if code.count('textfile={titlef}') != 1:
              raise SystemExit('CLEAN_HEADER_FAIL:TITLE_RENDER_COUNT')

          srcs=list(root.rglob('src0.*'))
          if not srcs:
              raise SystemExit('THUMB_SOURCE_MISSING')
          src=srcs[0]; start=float((t.get('real_starts') or [3])[0])+1
          base=pathlib.Path('/tmp/thumb_base.jpg')
          filt='[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=18:1[bg2];[fg]scale=1000:1350:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:250'
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(start),'-i',str(src),'-frames:v','1','-filter_complex',filt,str(base)],check=True)
          im=Image.open(base).convert('RGB'); ov=Image.new('RGBA',im.size,(0,0,0,0)); d=ImageDraw.Draw(ov)
          d.rectangle((0,0,1080,250),fill=(2,18,48,205)); d.rectangle((0,1160,1080,1920),fill=(2,18,48,220))
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; small=ImageFont.truetype(font,48); big=ImageFont.truetype(font,86)
          d.text((60,70),'VOCÊ SABIA AGORA?',font=small,fill=(255,206,37,255))
          words=t['thumb'].split(); lines=[]; cur=''
          for w in words:
              test=(cur+' '+w).strip()
              if d.textbbox((0,0),test,font=big)[2] > 920 and cur: lines.append(cur); cur=w
              else: cur=test
          if cur: lines.append(cur)
          y=1240
          for line in lines[:4]:
              box=d.textbbox((0,0),line,font=big); x=(1080-(box[2]-box[0]))//2
              d.text((x,y),line,font=big,fill=(255,255,255,255),stroke_width=3,stroke_fill=(0,0,0,220)); y+=105
          day=t['date'].replace('-','')
          out=root/'out'/f"VSA_{day}_{t['time'].replace(':','')}_{t['id']}_THUMB.jpg"
          Image.alpha_composite(im.convert('RGBA'),ov).convert('RGB').save(out,quality=94,subsampling=0)

          final=root/'out'/f"VSA_{day}_{t['time'].replace(':','')}_{t['id']}_FINAL.mp4"
          if not final.exists() or final.stat().st_size < 100000:
              raise SystemExit('FINAL_MASTER_MISSING')
          receipt={
            'id':t['id'],'bucket':t['bucket'],'master':final.name,
            'scene_diversity':'PASS_DESIGNED','real_blocks':3,'distinct_real_moments':3,
            'music_theme_match':'PASS','music':{'title':t['track'][0],'artist':t['track'][1],'license':t['track'][3]},
            'thumbnail_ready':'PASS','thumbnail_file':out.name,
            'mask_asset':'VSA_MASK_CANONICAL_V2.png','mask_sha256':actual,
            'legacy_v1_body_shell_used':False,'header_cover_panel_used':False,'title_render_count':1,
            'clean_header':'PASS','clean_cc_zone':'PASS'
          }
          (root/'out'/f"{t['id']}_qa.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vsa-sep13-clean-${{ matrix.id }}
          path: /tmp/vsa_sep10_11/out/*
          if-no-files-found: error

  host:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: vsa-sep13-clean-*
          path: /tmp/all
          merge-multiple: false
      - name: Verify clean-header gates and publish isolated media branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          find /tmp/all -type f -name '*.mp4' -exec cp {} /tmp/release/ \;
          find /tmp/all -type f -name '*_THUMB.jpg' -exec cp {} /tmp/release/ \;
          find /tmp/all -type f -name '*_qa.json' -exec cp {} /tmp/release/ \;
          test "$(find /tmp/release -maxdepth 1 -name '*.mp4' | wc -l)" -eq 8
          test "$(find /tmp/release -maxdepth 1 -name '*_THUMB.jpg' | wc -l)" -eq 8
          test "$(find /tmp/release -maxdepth 1 -name '*_qa.json' | wc -l)" -eq 8
          python - <<'PY'
          import glob,json
          q=[json.load(open(p,encoding='utf-8')) for p in glob.glob('/tmp/release/*_qa.json')]
          assert len(q)==8
          for x in q:
              assert x['clean_header']=='PASS'
              assert x['clean_cc_zone']=='PASS'
              assert x['title_render_count']==1
              assert x['header_cover_panel_used'] is False
              assert x['legacy_v1_body_shell_used'] is False
              assert x['mask_sha256']=='ac8162ee849f154edf2519ef649f64cd470737df7b5ecbabb7085f72059cfd56'
          print('CLEAN_HEADER_BATCH_PASS 8/8')
          PY
          git config user.name 'vsa-static-media-bot'
          git config user.email 'vsa-static-media-bot@users.noreply.github.com'
          git checkout --orphan "$MEDIA_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p media qa
          cp /tmp/release/*.mp4 /tmp/release/*_THUMB.jpg media/
          cp /tmp/release/*_qa.json qa/
          printf '%s\n' '# VSA Sep13 clean-header delivery' > README.md
          printf '%s\n' '8 masters + 8 thumbnails. V2 clean mask only. CLEAN_HEADER_PASS 8/8. Cena Certa untouched.' >> README.md
          git add README.md media/* qa/*
          git commit -m 'media(vsa): Sep13 V2 clean-header masters'
          git push --force origin HEAD:"$MEDIA_BRANCH"
          git rev-parse HEAD | tee media-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vsa-sep13-clean-static-receipt
          path: media-commit.txt
