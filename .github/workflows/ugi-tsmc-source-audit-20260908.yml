name: UGI TSMC Official Source Audit 2026-09-08
run-name: UGI TSMC Official Source Audit ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-tsmc-source-audit-20260908.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q yt-dlp
      - name: Audit official TSMC source videos
        run: python scripts/ugi_tsmc_source_audit.py
      - name: Persist QA contact sheets only
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08/tsmc-source-*-qa.jpg public/ugi/editorial/2026-09-08/tsmc-source-audit.json
          git commit -m 'UGI: persist TSMC official source QA [skip ci]' || true
          git pull --rebase origin main || true
          git push || true
