name: VSA Sep16 Longform Repair

on:
  push:
    branches:
      - ops/vsa-sep16-production
    paths:
      - production/vsa/2026-09-16/TRIGGER_LONG_REPAIR.txt

permissions:
  contents: read

jobs:
  build-long:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vsa-sep16-production
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts requests
      - name: Build coherent NASA longform candidate
        run: python production/vsa/2026-09-16/build_long_repair.py
      - name: Upload candidate and visual proof
        uses: actions/upload-artifact@v4
        with:
          name: vsa-sep16-long-repair
          path: production/vsa/2026-09-16/long_repair_output/
          if-no-files-found: error
          retention-days: 7
