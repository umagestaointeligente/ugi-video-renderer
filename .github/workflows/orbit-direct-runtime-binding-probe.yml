name: Orbit Direct Runtime Binding Probe

on:
  push:
    paths:
      - '.github/workflows/orbit-direct-runtime-binding-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report binding names and types only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'BLOCKED: Cloudflare token missing'; exit 78; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'BLOCKED: Cloudflare account missing'; exit 78; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi/settings" \
            -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          print('ORBIT_RUNTIME_BINDING_NAMES_V1')
          result=d.get('result') or {}
          bindings=result.get('bindings') or []
          for b in bindings:
              name=str(b.get('name') or '')
              typ=str(b.get('type') or '')
              if any(k in name.upper() for k in ('YOUTUBE','GOOGLE','META','FACEBOOK','INSTAGRAM','TIKTOK','OAUTH','CLIENT','REFRESH')):
                  print(f'binding name={name} type={typ}')
          PY
