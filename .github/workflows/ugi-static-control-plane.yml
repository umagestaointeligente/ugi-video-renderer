name: UGI Static Content Control Plane
run-name: UGI Static ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - 'control-plane/static-commands/*.json'
permissions:
  contents: write
jobs:
  build-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve command
        id: cmd
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^control-plane/static-commands/.*\.json$' | tail -n1)"
          [ -n "$FILE" ] || exit 1
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Build slides
        shell: bash
        env:
          CMD_FILE: ${{ steps.cmd.outputs.file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, textwrap
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          d=json.loads(Path(os.environ['CMD_FILE']).read_text(encoding='utf-8'))
          aid=d['asset_id']; slides=d['slides']
          out=Path('generated/static')/aid; out.mkdir(parents=True,exist_ok=True)
          W,H=1080,1350
          bg=(6,26,43); gold=(231,167,44); white=(248,250,252); muted=(190,203,216)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def font(sz,bold=False): return ImageFont.truetype(bold_path if bold else font_path,sz)
          for i,s in enumerate(slides,1):
            im=Image.new('RGB',(W,H),bg); dr=ImageDraw.Draw(im)
            dr.rounded_rectangle((70,70,1010,1280),radius=36,fill=(10,39,62),outline=(24,64,91),width=3)
            dr.text((100,105),'UGI · UMA GESTÃO INTELIGENTE',font=font(30,True),fill=gold)
            kicker=str(s.get('kicker','')).upper()
            if kicker: dr.text((100,180),kicker,font=font(28,True),fill=muted)
            title=str(s.get('title',''))
            lines=[]
            for para in title.split('\n'):
              lines += textwrap.wrap(para,width=25) or ['']
            y=255
            for line in lines:
              dr.text((100,y),line,font=font(58,True),fill=white); y+=72
            body=str(s.get('body',''))
            if body:
              y+=24
              for line in textwrap.wrap(body,width=43):
                dr.text((100,y),line,font=font(35),fill=muted); y+=51
            footer=str(s.get('footer',''))
            if footer: dr.text((100,1195),footer,font=font(28,True),fill=gold)
            dr.text((930,1195),f'{i}/{len(slides)}',font=font(25),fill=muted)
            im.save(out/f'slide-{i}.png',quality=95,optimize=True)
          receipt={'assetId':aid,'slideCount':len(slides),'files':[f'generated/static/{aid}/slide-{i}.png' for i in range(1,len(slides)+1)],'ready':True}
          rdir=Path('control-plane/static-receipts'); rdir.mkdir(parents=True,exist_ok=True)
          (rdir/f'{aid}.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          PY
      - name: Persist assets and receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-control-plane-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/static control-plane/static-receipts
          git commit -m 'feat: generate UGI static social assets'
          git pull --rebase origin main
          git push origin HEAD:main
