name: UGI Reel Renderer R41 Commercial Storytelling

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Reel"
        required: true
        default: "Se tudo precisa passar por você, sua empresa não está crescendo. Está ficando dependente."
      duration:
        description: "Duração em segundos"
        required: true
        default: "30"
      render_id:
        description: "ID único enviado pela Lola Operacional"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ugi-reel-${{ inputs.render_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DURATION: ${{ inputs.duration }}
      VIDEO_RENDER_ID: ${{ inputs.render_id }}
      VIDEO_CTA: "Conheça a UGI."
      VIDEO_NARRATION: ""

      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg and curl
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y curl
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          curl --version | head -n 1

      - name: Install Kokoro PT-BR TTS and media dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy requests
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-ptbr-v1

      - name: Acquire R41 semantic human media from Pexels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/media output

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          api_key = (os.getenv("PEXELS_API_KEY") or "").strip()
          media_dir = Path("output/media")
          output_dir = Path("output")
          media_dir.mkdir(parents=True, exist_ok=True)
          output_dir.mkdir(parents=True, exist_ok=True)

          if not api_key:
              raise SystemExit("PEXELS_API_KEY ausente.")

          queries = {
              1: [
                  "overwhelmed male manager busy office work",
                  "stressed business manager office coworkers"
              ],
              2: [
                  "business team waiting meeting female manager office",
                  "team waiting decision office meeting"
              ],
              3: [
                  "busy diverse office team working pressure",
                  "corporate team workload busy office"
              ],
              4: [
                  "young professional presenting diverse team collaboration",
                  "young employee presenting idea business team"
              ],
              5: [
                  "male leader dashboard diverse team autonomous office",
                  "business leader reviewing dashboard team working"
              ],
              6: [
                  "diverse business team man woman young professional success",
                  "diverse office team leadership young professional"
              ],
          }

          endpoint = "https://api.pexels.com/v1/videos/search"
          headers = {"Authorization": api_key}

          used_video_ids = set()
          attribution = []
          selected_count = 0

          def score(file):
              width = int(file.get("width") or 0)
              height = int(file.get("height") or 0)
              quality = str(file.get("quality") or "")
              file_type = str(file.get("file_type") or "")

              if file_type != "video/mp4":
                  return -100000

              portrait_bonus = 7000 if height > width else 0
              hd_bonus = 1000 if quality == "hd" else 0
              resolution = min(width, 1080) + min(height, 1920)
              fit_penalty = abs(width - 1080) * 0.15 + abs(height - 1920) * 0.06
              return portrait_bonus + hd_bonus + resolution - fit_penalty

          for scene, alternatives in queries.items():
              chosen = None
              chosen_query = None

              for query in alternatives:
                  response = requests.get(
                      endpoint,
                      headers=headers,
                      params={
                          "query": query,
                          "orientation": "portrait",
                          "per_page": 15,
                          "page": 1,
                      },
                      timeout=30,
                  )
                  response.raise_for_status()
                  payload = response.json()

                  ranked = []
                  for video in payload.get("videos", []):
                      video_id = video.get("id")
                      if video_id in used_video_ids:
                          continue

                      for file in video.get("video_files", []):
                          if not file.get("link"):
                              continue
                          ranked.append((score(file), video, file))

                  ranked.sort(key=lambda item: item[0], reverse=True)

                  if ranked:
                      chosen = ranked[0]
                      chosen_query = query
                      break

              if not chosen:
                  print(f"SCENE_{scene}: nenhuma mídia encontrada.")
                  continue

              _, video, file = chosen
              used_video_ids.add(video.get("id"))
              target = media_dir / f"scene-{scene}.mp4"

              print(
                  f"SCENE_{scene}: video={video.get('id')} "
                  f"{file.get('width')}x{file.get('height')} "
                  f"query={chosen_query}"
              )

              with requests.get(file["link"], stream=True, timeout=90) as media:
                  media.raise_for_status()
                  with target.open("wb") as fh:
                      for chunk in media.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              fh.write(chunk)

              if target.stat().st_size < 50_000:
                  target.unlink(missing_ok=True)
                  print(f"SCENE_{scene}: arquivo pequeno demais; descartado.")
                  continue

              selected_count += 1
              user = video.get("user") or {}

              attribution.append(
                  {
                      "scene": scene,
                      "query": chosen_query,
                      "pexels_video_id": video.get("id"),
                      "pexels_url": video.get("url"),
                      "creator_name": user.get("name"),
                      "creator_url": user.get("url"),
                      "width": file.get("width"),
                      "height": file.get("height"),
                      "quality": file.get("quality"),
                      "local_file": str(target),
                  }
              )

          (output_dir / "pexels-attribution.json").write_text(
              json.dumps(
                  {
                      "version": "R41",
                      "provider": "Pexels",
                      "selected_scene_count": selected_count,
                      "items": attribution,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (output_dir / "casting-policy.json").write_text(
              json.dumps(
                  {
                      "version": "R41",
                      "policy": "semantic_storytelling_plus_visual_diversity",
                      "principles": [
                          "cada cena deve representar semanticamente a etapa da história",
                          "alternar perfis profissionais e faixas de senioridade",
                          "misturar homens, mulheres e profissionais jovens",
                          "priorizar pessoas em ação e ambientes corporativos reais",
                          "evitar repetir o mesmo vídeo entre cenas",
                          "buscar fechamento com composição profissional diversa"
                      ]
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(f"PEXELS_SELECTED_SCENES={selected_count}/6")

          if selected_count < 4:
              raise SystemExit("R41 exige pelo menos 4 de 6 cenas humanas.")
          PY

      - name: Inspect acquired R41 media
        shell: bash
        run: |
          set -euo pipefail

          find output/media -maxdepth 1 -type f -name 'scene-*.mp4' -print -exec ls -lh {} \;

          for f in output/media/scene-*.mp4; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$f"
          done

      - name: Render UGI Reel R41
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python render-reel.py

      - name: Validate R41 Reel
        shell: bash
        run: |
          set -euo pipefail

          test -s output/ugi-reel.mp4
          test -s output/r41-storyboard.json
          test -s output/pexels-attribution.json

          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of json \
            output/ugi-reel.mp4 | tee output/ffprobe.json

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            output/ugi-reel.mp4 | tee output/audio-check.txt

          grep -q "codec_name=aac" output/audio-check.txt

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          video = Path("output/ugi-reel.mp4")
          header = video.read_bytes()[:12]

          if len(header) < 12 or header[4:8] != b"ftyp":
              raise SystemExit("MP4 inválido: assinatura ftyp ausente.")

          probe = json.loads(Path("output/ffprobe.json").read_text())
          final_duration = float(probe["format"]["duration"])
          requested = float(os.environ["VIDEO_DURATION"])

          if abs(final_duration - requested) > 0.25:
              raise SystemExit(
                  f"Duração final incorreta: final={final_duration:.3f}s requested={requested:.3f}s"
              )

          storyboard = json.loads(
              Path("output/r41-storyboard.json").read_text(encoding="utf-8")
          )

          if storyboard.get("qualityStatus") != "pass":
              raise SystemExit("Commercial Storytelling QA do R41 reprovado.")

          qa = storyboard.get("commercialStorytellingQA") or {}
          if not all(qa.values()):
              raise SystemExit(f"R41 QA incompleto/reprovado: {qa}")

          pexels = json.loads(
              Path("output/pexels-attribution.json").read_text(encoding="utf-8")
          )

          if int(pexels.get("selected_scene_count") or 0) < 4:
              raise SystemExit("R41 reprovado: menos de 4 cenas humanas.")

          print(
              f"R41_VALIDATION_OK bytes={video.stat().st_size} "
              f"duration={final_duration:.3f}s "
              f"humanScenes={pexels.get('selected_scene_count')}"
          )
          PY

      - name: Preserve GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugi-reel-${{ inputs.render_id }}
          path: |
            output/ugi-reel.mp4
            output/ffprobe.json
            output/audio-check.txt
            output/r41-storyboard.json
            output/pexels-attribution.json
            output/casting-policy.json
          if-no-files-found: error
          retention-days: 7

      - name: Deliver MP4 to Lola R2
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"
          UPLOAD_URL="${BASE_URL}/api/video-upload?renderId=${VIDEO_RENDER_ID}&githubRunId=${GITHUB_RUN_ID}&duration=${VIDEO_DURATION}"

          RESPONSE="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: video/mp4" \
            --data-binary @output/ugi-reel.mp4)"

          printf '%s\n' "$RESPONSE" | tee output/r2-upload-response.json
          echo "$RESPONSE" | grep -q '"status": "ready"'

          echo "R2_DELIVERY_SUCCESS renderId=${VIDEO_RENDER_ID}"

      - name: Report failure to Lola
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e

          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"

          [ -n "$BASE_URL" ] || exit 0
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || exit 0
          [ -n "$VIDEO_RENDER_ID" ] || exit 0

          curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "${BASE_URL}/api/video-status" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"renderId\":\"${VIDEO_RENDER_ID}\",\"status\":\"failed\",\"githubRunId\":\"${GITHUB_RUN_ID}\",\"errorClass\":\"github_workflow_or_delivery_failed\",\"githubError\":\"O workflow R41 falhou antes de concluir a entrega automática do MP4 ao R2. Consulte o GitHub Actions run ${GITHUB_RUN_ID}.\"}"

