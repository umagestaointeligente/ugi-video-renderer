name: UGI Reel Renderer R32 Final

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Reel"
        required: true
        default: "Sua empresa cresceu. A gestão precisa acompanhar."
      duration:
        description: "Duração em segundos"
        required: true
        default: "8"
      render_id:
        description: "ID único enviado pela Lola Operacional"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ugi-reel-${{ inputs.render_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DURATION: ${{ inputs.duration }}
      VIDEO_RENDER_ID: ${{ inputs.render_id }}
      VIDEO_CTA: "Conheça a UGI"
      VIDEO_NARRATION: "Sua empresa cresceu. A gestão precisa acompanhar. Conheça a UGI."
      PIPER_VOICE_MODEL: "voices/pt_BR-cadu-medium.onnx"
      PIPER_VOICE_CONFIG: "voices/pt_BR-cadu-medium.onnx.json" 
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Piper TTS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Cache PT-BR voice
        id: cache-piper-voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-pt-br-cadu-medium-v1

      - name: Download PT-BR neural voice
        if: steps.cache-piper-voice.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voices
          curl -fL --retry 4 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx?download=true" \
            -o voices/pt_BR-cadu-medium.onnx
          curl -fL --retry 4 --retry-delay 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx.json?download=true" \
            -o voices/pt_BR-cadu-medium.onnx.json
          test -s voices/pt_BR-cadu-medium.onnx
          test -s voices/pt_BR-cadu-medium.onnx.json


      - name: Prepare render ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VIDEO_RENDER_ID" ]; then
            echo "VIDEO_RENDER_ID=legacy-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          fi

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIDEO_RENDER_ID"
          test -n "$UGI_VIDEO_UPLOAD_URL"
          test -n "$UGI_VIDEO_UPLOAD_KEY"
          case "$VIDEO_DURATION" in
            ''|*[!0-9]*) echo "VIDEO_DURATION inválida"; exit 1 ;;
          esac
          if [ "$VIDEO_DURATION" -lt 4 ] || [ "$VIDEO_DURATION" -gt 40 ]; then
            echo "VIDEO_DURATION deve estar entre 4 e 40 segundos"
            exit 1
          fi

      - name: Render UGI Reel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python render-reel.py

      - name: Validate generated Reel
        shell: bash
        run: |
          set -euo pipefail
          test -s output/ugi-reel.mp4
          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of json \
            output/ugi-reel.mp4 | tee output/ffprobe.json

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            output/ugi-reel.mp4 | tee output/audio-check.txt

          grep -q "codec_name=aac" output/audio-check.txt

          python - <<'PY'
          from pathlib import Path
          p = Path("output/ugi-reel.mp4")
          b = p.read_bytes()[:12]
          if len(b) < 12 or b[4:8] != b"ftyp":
              raise SystemExit("MP4 inválido: assinatura ftyp ausente")
          print(f"MP4_OK bytes={p.stat().st_size}")
          PY

      - name: Preserve GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugi-reel-${{ inputs.render_id }}
          path: |
            output/ugi-reel.mp4
            output/ffprobe.json
          if-no-files-found: error
          retention-days: 7

      - name: Deliver MP4 to Lola R2
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"
          UPLOAD_URL="${BASE_URL}/api/video-upload?renderId=${VIDEO_RENDER_ID}&githubRunId=${GITHUB_RUN_ID}&duration=${VIDEO_DURATION}"

          RESPONSE="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: video/mp4" \
            --data-binary @output/ugi-reel.mp4)"

          printf '%s\n' "$RESPONSE" | tee output/r2-upload-response.json
          echo "$RESPONSE" | grep -q '"status": "ready"'
          echo "R2_DELIVERY_SUCCESS renderId=${VIDEO_RENDER_ID}"

      - name: Report failure to Lola
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"
          [ -n "$BASE_URL" ] || exit 0
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || exit 0
          [ -n "$VIDEO_RENDER_ID" ] || exit 0

          curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "${BASE_URL}/api/video-status" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"renderId\":\"${VIDEO_RENDER_ID}\",\"status\":\"failed\",\"githubRunId\":\"${GITHUB_RUN_ID}\",\"errorClass\":\"github_workflow_or_delivery_failed\",\"githubError\":\"O workflow falhou antes de concluir a entrega automática do MP4 ao R2. Consulte o GitHub Actions run ${GITHUB_RUN_ID}.\"}"

