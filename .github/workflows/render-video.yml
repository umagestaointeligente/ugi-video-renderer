name: UGI Reel Renderer R43.8.2 Dynamic Scenes + Multi-Provider Media Cascade

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Reel"
        required: true
        default: "Se tudo precisa passar por você, sua empresa não está crescendo. Está ficando dependente."
      duration:
        description: "Duração de compatibilidade do render primário"
        required: true
        default: "32"
      render_id:
        description: "ID único enviado pela Lola Operacional"
        required: false
        default: ""
      content_id:
        description: "Content ID rastreável enviado pela Lola Operacional"
        required: false
        default: "UGI-R43-CONTENT"
      experiment_id:
        description: "Experiment ID rastreável"
        required: false
        default: "UGI-R43-EXPERIMENT"
      variant:
        description: "Variante experimental"
        required: false
        default: "A"
      commercial_intent:
        description: "Intenção comercial do conteúdo"
        required: false
        default: "atracao_com_potencial_de_conversao"
      scenes_json:
        description: "JSON das cenas dinâmicas enviado pela Lola Operacional"
        required: true
        default: ""
      smoke_test:
        description: "Ativar smoke test curto"
        required: false
        type: boolean
        default: false
      smoke_test_duration:
        description: "Duração do smoke test em segundos"
        required: false
        default: "4"
      smoke_test_platform:
        description: "Plataforma-base do smoke test"
        required: false
        type: choice
        options:
          - instagram
          - tiktok
          - youtube
        default: instagram

permissions:
  contents: read

concurrency:
  group: ugi-reel-${{ inputs.render_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DURATION: ${{ inputs.duration }}
      VIDEO_RENDER_ID: ${{ inputs.render_id }}
      VIDEO_CTA: "Conheça a UGI."
      VIDEO_NARRATION: ""

      VIDEO_CONTENT_ID: ${{ inputs.content_id }}
      VIDEO_EXPERIMENT_ID: ${{ inputs.experiment_id }}
      VIDEO_VARIANT: ${{ inputs.variant }}
      VIDEO_COMMERCIAL_INTENT: ${{ inputs.commercial_intent }}
      VIDEO_SCENES_JSON: ${{ inputs.scenes_json }}
      VIDEO_ALLOW_LEGACY_SCENES: "false"

      # R43.8.2 — cenas dinâmicas obrigatórias; sem fallback produtivo legado.
      VIDEO_SMOKE_TEST: ${{ inputs.smoke_test }}
      VIDEO_SMOKE_TEST_DURATION: ${{ inputs.smoke_test_duration }}
      VIDEO_SMOKE_TEST_PLATFORM: ${{ inputs.smoke_test_platform }}

      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner media tools
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for bin in ffmpeg ffprobe curl; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "MISSING_BINARY=$bin"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "R43.8.2 runner already contains FFmpeg, FFprobe and curl."
          else
            echo "R43.8.2 one or more runner binaries are missing; controlled apt recovery required."
            echo "UGI_APT_RECOVERY_REQUIRED=true" >> "$GITHUB_ENV"
          fi

          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          fi

          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -version | head -n 1
          fi

          if command -v curl >/dev/null 2>&1; then
            curl --version | head -n 1
          fi

      - name: Controlled apt recovery for missing system tools
        if: ${{ env.UGI_APT_RECOVERY_REQUIRED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt_update() {
            timeout 150s sudo apt-get               -o Acquire::Retries=2               -o Acquire::http::Timeout=20               -o Acquire::https::Timeout=20               update
          }

          if ! apt_update; then
            echo "Primary apt update failed or timed out. Replacing Azure mirror with archive.ubuntu.com and retrying once."

            sudo sed -i               's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'               /etc/apt/sources.list 2>/dev/null || true

            sudo sed -i               's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'               /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

            apt_update
          fi

          packages=()

          command -v ffmpeg >/dev/null 2>&1 || packages+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || packages+=(ffmpeg)
          command -v curl >/dev/null 2>&1 || packages+=(curl)

          if [ "${#packages[@]}" -gt 0 ]; then
            timeout 180s sudo apt-get               -o Acquire::Retries=2               -o Acquire::http::Timeout=20               -o Acquire::https::Timeout=20               install -y --no-install-recommends "${packages[@]}"
          fi

          command -v ffmpeg
          command -v ffprobe
          command -v curl

      - name: Install Kokoro PT-BR TTS and Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy requests

      - name: Ensure espeak-ng without unbounded apt update
        shell: bash
        run: |
          set -euo pipefail

          if command -v espeak-ng >/dev/null 2>&1; then
            echo "R43.8.2 espeak-ng already available."
            espeak-ng --version | head -n 1
            exit 0
          fi

          export DEBIAN_FRONTEND=noninteractive

          apt_update() {
            timeout 150s sudo apt-get               -o Acquire::Retries=2               -o Acquire::http::Timeout=20               -o Acquire::https::Timeout=20               update
          }

          if ! apt_update; then
            echo "Primary apt update failed or timed out. Replacing Azure mirror with archive.ubuntu.com and retrying once."

            sudo sed -i               's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'               /etc/apt/sources.list 2>/dev/null || true

            sudo sed -i               's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'               /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

            apt_update
          fi

          timeout 180s sudo apt-get             -o Acquire::Retries=2             -o Acquire::http::Timeout=20             -o Acquire::https::Timeout=20             install -y --no-install-recommends espeak-ng

          command -v espeak-ng
          espeak-ng --version | head -n 1

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-ptbr-v1

      - name: Resolve render mode
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED_DURATION="${VIDEO_DURATION:-32}"
          EXPLICIT_SMOKE="${VIDEO_SMOKE_TEST:-false}"
          RESOLVED_SMOKE="false"
          RESOLVED_SMOKE_DURATION="${VIDEO_SMOKE_TEST_DURATION:-4}"

          # Compatibilidade com o Worker atual:
          # se ele ainda não enviar smoke_test=true, uma duração solicitada <= 5s
          # ativa automaticamente o smoke test.
          if [ "${EXPLICIT_SMOKE}" = "true" ]; then
            RESOLVED_SMOKE="true"
          elif python - "${REQUESTED_DURATION}" <<'PY'
          import sys
          try:
              value = float(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if 0 < value <= 5 else 1)
          PY
          then
            RESOLVED_SMOKE="true"
            RESOLVED_SMOKE_DURATION="${REQUESTED_DURATION}"
          fi

          echo "VIDEO_SMOKE_TEST=${RESOLVED_SMOKE}" >> "$GITHUB_ENV"
          echo "VIDEO_SMOKE_TEST_DURATION=${RESOLVED_SMOKE_DURATION}" >> "$GITHUB_ENV"

          echo "VIDEO_SMOKE_TEST=${RESOLVED_SMOKE}"
          echo "VIDEO_SMOKE_TEST_DURATION=${RESOLVED_SMOKE_DURATION}"
          echo "VIDEO_SMOKE_TEST_PLATFORM=${VIDEO_SMOKE_TEST_PLATFORM}"

          if [ "${RESOLVED_SMOKE}" = "true" ]; then
            echo "R43.8.2_MODE=TRUE_SMOKE_TEST"
          else
            echo "R43.8.2_MODE=FULL_MULTI_PLATFORM"
          fi

      - name: Validate dynamic scenes payload
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          raw = (os.getenv("VIDEO_SCENES_JSON") or "").strip()
          if not raw:
              raise SystemExit("R43.8.2 FAIL-CLOSED: VIDEO_SCENES_JSON ausente.")

          payload = json.loads(raw)
          scenes = payload.get("scenes") if isinstance(payload, dict) else payload

          if not isinstance(scenes, list):
              raise SystemExit("R43.8.2 FAIL-CLOSED: scenes_json não contém array scenes.")

          if not 4 <= len(scenes) <= 10:
              raise SystemExit(f"R43.8.2 FAIL-CLOSED: quantidade de cenas inválida: {len(scenes)}")

          allowed_roles = {"hook", "pain", "consequence", "turn", "result", "cta"}
          required_platforms = {"instagram", "tiktok", "youtube"}

          for idx, scene in enumerate(scenes, start=1):
              if not isinstance(scene, dict):
                  raise SystemExit(f"R43.8.2 cena {idx} inválida.")
              if str(scene.get("role") or "").strip() not in allowed_roles:
                  raise SystemExit(f"R43.8.2 role inválido na cena {idx}.")
              if not str(scene.get("visual_intent") or "").strip():
                  raise SystemExit(f"R43.8.2 visual_intent ausente na cena {idx}.")
              if not str(scene.get("pexels_query") or "").strip():
                  raise SystemExit(f"R43.8.2 pexels_query ausente na cena {idx}.")
              for field in ("overlay", "support", "narration"):
                  value = scene.get(field)
                  if not isinstance(value, dict) or set(value.keys()) < required_platforms:
                      raise SystemExit(f"R43.8.2 {field} incompleto na cena {idx}.")
                  for platform in required_platforms:
                      if not str(value.get(platform) or "").strip():
                          raise SystemExit(
                              f"R43.8.2 {field}.{platform} vazio na cena {idx}."
                          )

          forbidden = [
              "tudo passa por você",
              "tudo depende de você",
              "o líder vira gargalo",
              "você virou o gargalo",
              "autonomia com direção",
              "mais autonomia. mais execução",
          ]

          content_id = (os.getenv("VIDEO_CONTENT_ID") or "").strip().lower()
          canonical = json.dumps(scenes, ensure_ascii=False, sort_keys=True).lower()

          # Proteção específica do incidente confirmado.
          if "trial03" in content_id or "1945" in content_id:
              hits = [phrase for phrase in forbidden if phrase in canonical]
              if hits:
                  raise SystemExit(
                      "LEGACY_RENDERER_CONTENT_LEAK_DETECTED: " + ", ".join(hits)
                  )

          print(f"R43_8_2_DYNAMIC_SCENES_VALID scenes={len(scenes)} content_id={content_id}")
          PY

      - name: Acquire semantic human media from provider cascade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/media output

          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests

          pexels_key = (os.getenv("PEXELS_API_KEY") or "").strip()
          pixabay_key = (os.getenv("PIXABAY_API_KEY") or "").strip()
          media_dir = Path("output/media")
          output_dir = Path("output")

          media_dir.mkdir(parents=True, exist_ok=True)
          output_dir.mkdir(parents=True, exist_ok=True)

          smoke_test = (os.getenv("VIDEO_SMOKE_TEST") or "false").strip().lower() in {
              "1", "true", "yes", "on"
          }

          raw = (os.getenv("VIDEO_SCENES_JSON") or "").strip()
          payload = json.loads(raw)
          scenes = payload.get("scenes") if isinstance(payload, dict) else payload

          dynamic_queries = {}
          for idx, scene in enumerate(scenes, start=1):
              primary = str(scene.get("pexels_query") or "").strip()
              visual = str(scene.get("visual_intent") or "").strip()
              alternatives = []
              for candidate in (primary, visual):
                  candidate = candidate.strip()
                  if candidate and candidate not in alternatives:
                      alternatives.append(candidate)
              if not alternatives:
                  raise SystemExit(f"R43.8.2 cena {idx}: nenhuma query disponível.")
              dynamic_queries[idx] = alternatives

          queries = {1: dynamic_queries[1]} if smoke_test else dynamic_queries

          used_ids = set()
          attribution = []
          selected_count = 0
          provider_failures = []

          def retry_get(url, *, headers=None, params=None, attempts=3, stream=False):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      response = requests.get(
                          url,
                          headers=headers,
                          params=params,
                          stream=stream,
                          timeout=(10, 60 if not stream else 120),
                      )
                      response.raise_for_status()
                      return response
                  except requests.RequestException as exc:
                      last = exc
                      print(
                          f"MEDIA_HTTP_ATTEMPT_FAILED url={url} "
                          f"attempt={attempt}/{attempts} "
                          f"error={type(exc).__name__}: {exc}"
                      )
                      if attempt < attempts:
                          time.sleep(2 * attempt)
              raise last

          def download(url, target):
              last = None
              for attempt in range(1, 4):
                  try:
                      with retry_get(url, attempts=1, stream=True) as response:
                          with target.open("wb") as fh:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                      if target.stat().st_size >= 50_000:
                          return True
                      raise RuntimeError("download menor que 50 KB")
                  except Exception as exc:
                      last = exc
                      target.unlink(missing_ok=True)
                      print(
                          f"MEDIA_DOWNLOAD_FAILED attempt={attempt}/3 "
                          f"error={type(exc).__name__}: {exc}"
                      )
                      if attempt < 3:
                          time.sleep(2 * attempt)
              print(f"MEDIA_DOWNLOAD_EXHAUSTED error={last}")
              return False

          def pexels_candidates(query):
              if not pexels_key:
                  return []

              try:
                  response = retry_get(
                      "https://api.pexels.com/v1/videos/search",
                      headers={"Authorization": pexels_key},
                      params={
                          "query": query,
                          "orientation": "portrait",
                          "per_page": 15,
                          "page": 1,
                      },
                      attempts=3,
                  )
                  data = response.json()
              except Exception as exc:
                  provider_failures.append(
                      f"pexels:{query}:{type(exc).__name__}:{exc}"
                  )
                  return []

              candidates = []
              for video in data.get("videos", []):
                  video_id = f"pexels:{video.get('id')}"
                  if video_id in used_ids:
                      continue

                  user = video.get("user") or {}
                  for file in video.get("video_files", []):
                      if file.get("file_type") != "video/mp4" or not file.get("link"):
                          continue
                      width = int(file.get("width") or 0)
                      height = int(file.get("height") or 0)
                      portrait_bonus = 7000 if height > width else 0
                      hd_bonus = 1000 if str(file.get("quality") or "") == "hd" else 0
                      score = (
                          portrait_bonus
                          + hd_bonus
                          + min(width, 1080)
                          + min(height, 1920)
                          - abs(width - 1080) * 0.15
                          - abs(height - 1920) * 0.06
                      )
                      candidates.append({
                          "score": score,
                          "provider": "Pexels",
                          "id": video_id,
                          "source_id": video.get("id"),
                          "url": file["link"],
                          "page_url": video.get("url"),
                          "creator_name": user.get("name"),
                          "creator_url": user.get("url"),
                          "width": width,
                          "height": height,
                      })
              return sorted(candidates, key=lambda item: item["score"], reverse=True)

          def pixabay_candidates(query):
              if not pixabay_key:
                  return []

              try:
                  response = retry_get(
                      "https://pixabay.com/api/videos/",
                      params={
                          "key": pixabay_key,
                          "q": query,
                          "video_type": "film",
                          "category": "business",
                          "per_page": 20,
                          "safesearch": "true",
                      },
                      attempts=3,
                  )
                  data = response.json()
              except Exception as exc:
                  provider_failures.append(
                      f"pixabay:{query}:{type(exc).__name__}:{exc}"
                  )
                  return []

              candidates = []
              for video in data.get("hits", []):
                  video_id = f"pixabay:{video.get('id')}"
                  if video_id in used_ids:
                      continue

                  videos = video.get("videos") or {}
                  for variant_name in ("large", "medium", "small", "tiny"):
                      variant = videos.get(variant_name) or {}
                      url = variant.get("url")
                      if not url:
                          continue
                      width = int(variant.get("width") or 0)
                      height = int(variant.get("height") or 0)
                      portrait_bonus = 7000 if height > width else 0
                      score = (
                          portrait_bonus
                          + min(width, 1080)
                          + min(height, 1920)
                          - abs(width - 1080) * 0.15
                          - abs(height - 1920) * 0.06
                      )
                      candidates.append({
                          "score": score,
                          "provider": "Pixabay",
                          "id": video_id,
                          "source_id": video.get("id"),
                          "url": url,
                          "page_url": video.get("pageURL"),
                          "creator_name": video.get("user"),
                          "creator_url": None,
                          "width": width,
                          "height": height,
                      })
                      break
              return sorted(candidates, key=lambda item: item["score"], reverse=True)

          provider_functions = [
              ("Pexels", pexels_candidates),
              ("Pixabay", pixabay_candidates),
          ]

          if not pexels_key and not pixabay_key:
              raise SystemExit(
                  "R43.8.2 exige ao menos PEXELS_API_KEY ou PIXABAY_API_KEY."
              )

          for scene, alternatives in queries.items():
              chosen = None
              chosen_query = None

              for provider_name, provider_fn in provider_functions:
                  for query in alternatives:
                      print(
                          f"SCENE_{scene}: provider={provider_name} query={query}"
                      )
                      candidates = provider_fn(query)
                      if candidates:
                          chosen = candidates[0]
                          chosen_query = query
                          break
                  if chosen:
                      break

              if not chosen:
                  print(
                      f"SCENE_{scene}: nenhum provider retornou mídia. "
                      f"failures={provider_failures[-8:]}"
                  )
                  continue

              used_ids.add(chosen["id"])
              target = media_dir / f"scene-{scene}.mp4"

              print(
                  f"SCENE_{scene}: selected provider={chosen['provider']} "
                  f"id={chosen['source_id']} "
                  f"{chosen['width']}x{chosen['height']} "
                  f"query={chosen_query}"
              )

              if not download(chosen["url"], target):
                  print(
                      f"SCENE_{scene}: download final falhou "
                      f"provider={chosen['provider']}"
                  )
                  continue

              selected_count += 1
              attribution.append(
                  {
                      "scene": scene,
                      "provider": chosen["provider"],
                      "query": chosen_query,
                      "provider_video_id": chosen["source_id"],
                      "provider_page_url": chosen["page_url"],
                      "creator_name": chosen["creator_name"],
                      "creator_url": chosen["creator_url"],
                      "width": chosen["width"],
                      "height": chosen["height"],
                      "local_file": str(target),
                  }
              )

          (output_dir / "pexels-attribution.json").write_text(
              json.dumps(
                  {
                      "version": "R43.8.2",
                      "provider_strategy": "Pexels_primary_Pixabay_fallback",
                      "smoke_test": smoke_test,
                      "selected_scene_count": selected_count,
                      "items": attribution,
                      "provider_failures": provider_failures,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (output_dir / "casting-policy.json").write_text(
              json.dumps(
                  {
                      "version": "R43.8.2",
                      "policy": "dynamic_semantic_storytelling_multi_provider",
                      "smoke_test": smoke_test,
                      "principles": [
                          "cada cena deve representar semanticamente a etapa da história",
                          "Pexels é provider primário",
                          "Pixabay é fallback automático quando Pexels falha",
                          "evitar repetir o mesmo vídeo entre cenas",
                          "priorizar pessoas em ação e ambientes profissionais reais"
                      ]
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          required_minimum = 1 if smoke_test else 4
          expected_maximum = 1 if smoke_test else len(queries)

          print(
              f"MEDIA_SELECTED_SCENES={selected_count}/{expected_maximum} "
              f"smoke_test={smoke_test}"
          )

          if selected_count < required_minimum:
              raise SystemExit(
                  f"R43.8.2 exige pelo menos {required_minimum} cena(s) humana(s)."
              )
          PY

      - name: Inspect acquired media
        shell: bash
        run: |
          set -euo pipefail

          find output/media -maxdepth 1 -type f -name 'scene-*.mp4' -print -exec ls -lh {} \;

          for f in output/media/scene-*.mp4; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$f"
          done

      - name: Render UGI R43.8.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python render-reel.py

      - name: Validate R43.8.2 outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s output/ugi-reel.mp4
          test -s output/instagram-reel.mp4
          test -s output/tiktok-reel.mp4
          test -s output/youtube-short.mp4
          test -s output/r42-platform-manifest.json

          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of json \
            output/ugi-reel.mp4 | tee output/ffprobe.json

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            output/ugi-reel.mp4 | tee output/audio-check.txt

          grep -q "codec_name=aac" output/audio-check.txt

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          smoke_test = (os.getenv("VIDEO_SMOKE_TEST") or "false").strip().lower() in {
              "1", "true", "yes", "on"
          }
          smoke_duration = float(os.getenv("VIDEO_SMOKE_TEST_DURATION") or "4")

          if smoke_test:
              expected = {
                  "instagram-reel.mp4": smoke_duration,
                  "tiktok-reel.mp4": smoke_duration,
                  "youtube-short.mp4": smoke_duration,
              }
          else:
              expected = {
                  "instagram-reel.mp4": 32.0,
                  "tiktok-reel.mp4": 24.0,
                  "youtube-short.mp4": 36.0,
              }

          for filename, target in expected.items():
              path = Path("output") / filename
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f"Arquivo ausente/inválido: {filename}")

              cp = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              duration = float(cp.stdout.strip())

              if abs(duration - target) > 0.30:
                  raise SystemExit(
                      f"Duração incorreta {filename}: {duration:.3f}s; esperado {target:.3f}s"
                  )

          manifest = json.loads(
              Path("output/r42-platform-manifest.json").read_text(encoding="utf-8")
          )

          results = manifest.get("platform_results") or []

          if smoke_test:
              if len(results) != 1:
                  raise SystemExit(
                      f"Smoke manifest deve conter 1 render real; recebido={len(results)}"
                  )
          else:
              if len(results) != 3:
                  raise SystemExit(
                      "Manifesto full multi-platform não contém 3 resultados."
                  )

          for result in results:
              qa = result.get("qa") or {}
              if qa.get("quality_status") != "pass":
                  raise SystemExit(
                      f"QA reprovado em {result.get('platform')}: {qa}"
                  )

          print(
              "R43_8_2_VALIDATION_OK "
              f"smoke_test={smoke_test} "
              f"smoke_duration={smoke_duration if smoke_test else 'n/a'}"
          )
          PY

      - name: Preserve GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugi-reel-r43-7-12-${{ inputs.render_id }}
          path: |
            output/ugi-reel.mp4
            output/instagram-reel.mp4
            output/tiktok-reel.mp4
            output/youtube-short.mp4
            output/ffprobe.json
            output/audio-check.txt
            output/r42-platform-manifest.json
            output/r42-storyboard-*.json
            output/pexels-attribution.json
            output/casting-policy.json
            output/r2-upload-instagram.json
            output/r2-upload-tiktok.json
            output/r2-upload-youtube.json
          if-no-files-found: error
          retention-days: 7

      - name: Deliver 3 platform masters to Lola R2
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"

          [ -n "$BASE_URL" ] || { echo "UGI_VIDEO_UPLOAD_URL ausente"; exit 1; }
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || { echo "UGI_VIDEO_UPLOAD_KEY ausente"; exit 1; }
          [ -n "$VIDEO_RENDER_ID" ] || { echo "VIDEO_RENDER_ID ausente"; exit 1; }

          if [ "${VIDEO_SMOKE_TEST}" = "true" ]; then
            INSTAGRAM_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
            TIKTOK_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
            YOUTUBE_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
            echo "R43.8.2 delivery mode=SMOKE duration=${VIDEO_SMOKE_TEST_DURATION}"
          else
            INSTAGRAM_DURATION="32"
            TIKTOK_DURATION="24"
            YOUTUBE_DURATION="36"
            echo "R43.8.2 delivery mode=FULL"
          fi

          upload_asset() {
            local platform="$1"
            local duration="$2"
            local file="$3"
            local response_file="$4"

            test -s "$file"

            local upload_url="${BASE_URL}/api/video-upload?renderId=${VIDEO_RENDER_ID}&githubRunId=${GITHUB_RUN_ID}&platform=${platform}&duration=${duration}"

            echo "Uploading platform=${platform} file=${file} duration=${duration}"

            local response
            response="$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 180 \
              -X POST "$upload_url" \
              -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
              -H "Content-Type: video/mp4" \
              -H "X-UGI-Platform: ${platform}" \
              -H "X-UGI-Video-Duration: ${duration}" \
              --data-binary @"$file")"

            printf '%s\n' "$response" | tee "$response_file"

            python - "$platform" "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          platform = sys.argv[1]
          path = Path(sys.argv[2])

          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("ok") is not True:
              raise SystemExit(f"Upload {platform} retornou ok!=true: {data}")

          if data.get("platform") != platform:
              raise SystemExit(
                  f"Worker retornou plataforma incorreta: esperado={platform} recebido={data.get('platform')}"
              )

          assets = data.get("assets") or {}
          asset = assets.get(platform) or {}

          if asset.get("ready") is not True:
              raise SystemExit(f"Asset {platform} não ficou ready: {asset}")

          if not asset.get("videoUrl") or not asset.get("videoKey"):
              raise SystemExit(f"Asset {platform} sem videoUrl/videoKey: {asset}")

          print(
              f"UPLOAD_OK platform={platform} "
              f"status={data.get('status')} "
              f"readyPlatforms={data.get('readyPlatforms')}"
          )
          PY
          }

          upload_asset \
            "instagram" \
            "${INSTAGRAM_DURATION}" \
            "output/instagram-reel.mp4" \
            "output/r2-upload-instagram.json"

          upload_asset \
            "tiktok" \
            "${TIKTOK_DURATION}" \
            "output/tiktok-reel.mp4" \
            "output/r2-upload-tiktok.json"

          upload_asset \
            "youtube" \
            "${YOUTUBE_DURATION}" \
            "output/youtube-short.mp4" \
            "output/r2-upload-youtube.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          final = json.loads(
              Path("output/r2-upload-youtube.json").read_text(encoding="utf-8")
          )

          expected = {"instagram", "tiktok", "youtube"}
          ready = set(final.get("readyPlatforms") or [])
          assets = final.get("assets") or {}

          if final.get("status") != "ready":
              raise SystemExit(f"Render multi-asset não ficou ready: {final}")

          if final.get("ready") is not True:
              raise SystemExit("Render multi-asset terminou sem ready=true.")

          if final.get("allPlatformsReady") is not True:
              raise SystemExit("Worker não confirmou allPlatformsReady=true.")

          if ready != expected:
              raise SystemExit(
                  f"readyPlatforms incorreto: recebido={sorted(ready)} esperado={sorted(expected)}"
              )

          smoke_test = (os.getenv("VIDEO_SMOKE_TEST") or "false").strip().lower() in {
              "1", "true", "yes", "on"
          }
          smoke_duration = float(os.getenv("VIDEO_SMOKE_TEST_DURATION") or "4")

          for platform in sorted(expected):
              asset = assets.get(platform) or {}
              if asset.get("ready") is not True:
                  raise SystemExit(f"{platform} não está ready no resultado final.")
              if not asset.get("videoUrl") or not asset.get("videoKey"):
                  raise SystemExit(f"{platform} sem videoUrl/videoKey.")

              if smoke_test:
                  actual = float(asset.get("duration") or 0)
                  if abs(actual - smoke_duration) > 0.30:
                      raise SystemExit(
                          f"Smoke duration incorreta em {platform}: "
                          f"{actual:.3f}s vs {smoke_duration:.3f}s"
                      )

          # Compatibilidade legada deve continuar apontando para Instagram.
          if final.get("videoUrl") != assets["instagram"].get("videoUrl"):
              raise SystemExit("videoUrl legado deixou de apontar para Instagram.")

          if final.get("videoKey") != assets["instagram"].get("videoKey"):
              raise SystemExit("videoKey legado deixou de apontar para Instagram.")

          print(
              "R43_8_2_MULTI_ASSET_DELIVERY_OK "
              f"smoke_test={smoke_test}"
          )
          PY

          echo "R2_MULTI_ASSET_DELIVERY_SUCCESS renderId=${VIDEO_RENDER_ID}"

      - name: Report failure to Lola
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e

          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"

          [ -n "$BASE_URL" ] || exit 0
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || exit 0
          [ -n "$VIDEO_RENDER_ID" ] || exit 0

          curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "${BASE_URL}/api/video-status" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"renderId\":\"${VIDEO_RENDER_ID}\",\"status\":\"failed\",\"githubRunId\":\"${GITHUB_RUN_ID}\",\"errorClass\":\"github_workflow_or_delivery_failed\",\"githubError\":\"O workflow R43.8.2 falhou antes de concluir a geração ou entrega multi-asset. Consulte o GitHub Actions run ${GITHUB_RUN_ID}.\"}"

