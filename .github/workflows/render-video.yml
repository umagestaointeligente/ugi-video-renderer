name: UGI Reel Renderer

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Reel"
        required: true
        default: "Sua empresa cresceu. A gestão precisa acompanhar."
      duration:
        description: "Duração em segundos"
        required: true
        default: "8"

jobs:
  render-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render UGI Reel
        env:
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_CTA: "Conheça a UGI"
        run: |
          python render-reel.py

      - name: Validate generated Reel
        run: |
          echo "Validando arquivo..."
          ls -lh output/

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of json \
            output/ugi-reel.mp4

      - name: Upload Reel
        uses: actions/upload-artifact@v4
        with:
          name: ugi-reel
          path: output/ugi-reel.mp4
          retention-days: 7
