name: UGI Reel Renderer R43.8.4 Dynamic Scenes + Semantic Success Callback

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do Reel"
        required: true
        default: "Se tudo precisa passar por você, sua empresa não está crescendo. Está ficando dependente."
      duration:
        description: "Duração de compatibilidade do render primário"
        required: true
        default: "32"
      render_id:
        description: "ID único enviado pela Lola Operacional"
        required: false
        default: ""
      content_id:
        description: "Content ID rastreável enviado pela Lola Operacional"
        required: false
        default: "UGI-R43-CONTENT"
      experiment_id:
        description: "Experiment ID rastreável"
        required: false
        default: "UGI-R43-EXPERIMENT"
      variant:
        description: "Variante experimental"
        required: false
        default: "A"
      commercial_intent:
        description: "Intenção comercial do conteúdo"
        required: false
        default: "atracao_com_potencial_de_conversao"
      scenes_json:
        description: "JSON das cenas dinâmicas enviado pela Lola Operacional"
        required: true
        default: ""
      smoke_test:
        description: "Ativar smoke test curto"
        required: false
        type: boolean
        default: false
      smoke_test_duration:
        description: "Duração do smoke test em segundos"
        required: false
        default: "4"
      smoke_test_platform:
        description: "Plataforma-base do smoke test"
        required: false
        type: choice
        options:
          - instagram
          - tiktok
          - youtube
        default: instagram

permissions:
  contents: read

concurrency:
  group: ugi-reel-${{ inputs.render_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DURATION: ${{ inputs.duration }}
      VIDEO_RENDER_ID: ${{ inputs.render_id }}
      VIDEO_CTA: "Conheça a UGI."
      VIDEO_NARRATION: ""

      VIDEO_CONTENT_ID: ${{ inputs.content_id }}
      VIDEO_EXPERIMENT_ID: ${{ inputs.experiment_id }}
      VIDEO_VARIANT: ${{ inputs.variant }}
      VIDEO_COMMERCIAL_INTENT: ${{ inputs.commercial_intent }}
      VIDEO_SCENES_JSON: ${{ inputs.scenes_json }}
      VIDEO_ALLOW_LEGACY_SCENES: "false"

      # R43.8.4 — cenas dinâmicas obrigatórias; sem fallback produtivo legado.
      VIDEO_SMOKE_TEST: ${{ inputs.smoke_test }}
      VIDEO_SMOKE_TEST_DURATION: ${{ inputs.smoke_test_duration }}
      VIDEO_SMOKE_TEST_PLATFORM: ${{ inputs.smoke_test_platform }}

      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner media tools
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for bin in ffmpeg ffprobe curl; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "MISSING_BINARY=$bin"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "R43.8.4 runner already contains FFmpeg, FFprobe and curl."
          else
            echo "R43.8.4 one or more runner binaries are missing; controlled apt recovery required."
            echo "UGI_APT_RECOVERY_REQUIRED=true" >> "$GITHUB_ENV"
          fi
          command -v ffmpeg >/dev/null 2>&1 && ffmpeg -version | head -n 1
          command -v ffprobe >/dev/null 2>&1 && ffprobe -version | head -n 1
          command -v curl >/dev/null 2>&1 && curl --version | head -n 1

      - name: Controlled apt recovery for missing system tools
        if: ${{ env.UGI_APT_RECOVERY_REQUIRED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt_update() {
            timeout 150s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          }
          if ! apt_update; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            apt_update
          fi
          packages=()
          command -v ffmpeg >/dev/null 2>&1 || packages+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || packages+=(ffmpeg)
          command -v curl >/dev/null 2>&1 || packages+=(curl)
          if [ "${#packages[@]}" -gt 0 ]; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends "${packages[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v curl

      - name: Install Kokoro PT-BR TTS and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy requests

      - name: Ensure espeak-ng without unbounded apt update
        shell: bash
        run: |
          set -euo pipefail
          if command -v espeak-ng >/dev/null 2>&1; then
            echo "R43.8.4 espeak-ng already available."
            espeak-ng --version | head -n 1
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt_update() {
            timeout 150s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          }
          if ! apt_update; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            apt_update
          fi
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends espeak-ng
          command -v espeak-ng
          espeak-ng --version | head -n 1

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-ptbr-v1

      - name: Resolve render mode
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED_DURATION="${VIDEO_DURATION:-32}"
          EXPLICIT_SMOKE="${VIDEO_SMOKE_TEST:-false}"
          RESOLVED_SMOKE="false"
          RESOLVED_SMOKE_DURATION="${VIDEO_SMOKE_TEST_DURATION:-4}"
          if [ "${EXPLICIT_SMOKE}" = "true" ]; then
            RESOLVED_SMOKE="true"
          elif python - "${REQUESTED_DURATION}" <<'PY'
          import sys
          try:
              value = float(sys.argv[1])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if 0 < value <= 5 else 1)
          PY
          then
            RESOLVED_SMOKE="true"
            RESOLVED_SMOKE_DURATION="${REQUESTED_DURATION}"
          fi
          echo "VIDEO_SMOKE_TEST=${RESOLVED_SMOKE}" >> "$GITHUB_ENV"
          echo "VIDEO_SMOKE_TEST_DURATION=${RESOLVED_SMOKE_DURATION}" >> "$GITHUB_ENV"
          echo "VIDEO_SMOKE_TEST=${RESOLVED_SMOKE}"
          echo "VIDEO_SMOKE_TEST_DURATION=${RESOLVED_SMOKE_DURATION}"
          echo "VIDEO_SMOKE_TEST_PLATFORM=${VIDEO_SMOKE_TEST_PLATFORM}"

      - name: Validate dynamic scenes payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          raw = (os.getenv("VIDEO_SCENES_JSON") or "").strip()
          if not raw:
              raise SystemExit("R43.8.4 FAIL-CLOSED: VIDEO_SCENES_JSON ausente.")
          payload = json.loads(raw)
          scenes = payload.get("scenes") if isinstance(payload, dict) else payload
          if not isinstance(scenes, list):
              raise SystemExit("R43.8.4 FAIL-CLOSED: scenes_json não contém array scenes.")
          if not 4 <= len(scenes) <= 10:
              raise SystemExit(f"R43.8.4 FAIL-CLOSED: quantidade de cenas inválida: {len(scenes)}")
          allowed_roles = {"hook", "pain", "consequence", "turn", "result", "cta"}
          required_platforms = {"instagram", "tiktok", "youtube"}
          for idx, scene in enumerate(scenes, start=1):
              if not isinstance(scene, dict):
                  raise SystemExit(f"R43.8.4 cena {idx} inválida.")
              if str(scene.get("role") or "").strip() not in allowed_roles:
                  raise SystemExit(f"R43.8.4 role inválido na cena {idx}.")
              if not str(scene.get("visual_intent") or "").strip():
                  raise SystemExit(f"R43.8.4 visual_intent ausente na cena {idx}.")
              if not str(scene.get("pexels_query") or "").strip():
                  raise SystemExit(f"R43.8.4 pexels_query ausente na cena {idx}.")
              for field in ("overlay", "support", "narration"):
                  value = scene.get(field)
                  if not isinstance(value, dict) or set(value.keys()) < required_platforms:
                      raise SystemExit(f"R43.8.4 {field} incompleto na cena {idx}.")
                  for platform in required_platforms:
                      if not str(value.get(platform) or "").strip():
                          raise SystemExit(f"R43.8.4 {field}.{platform} vazio na cena {idx}.")
          print(f"R43_8_4_DYNAMIC_SCENES_VALID scenes={len(scenes)}")
          PY

      - name: Acquire semantic human media from provider cascade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/media output
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import requests
          pexels_key=(os.getenv("PEXELS_API_KEY") or "").strip()
          pixabay_key=(os.getenv("PIXABAY_API_KEY") or "").strip()
          raw=(os.getenv("VIDEO_SCENES_JSON") or "").strip()
          payload=json.loads(raw)
          scenes=payload.get("scenes") if isinstance(payload,dict) else payload
          smoke=(os.getenv("VIDEO_SMOKE_TEST") or "false").lower() in {"1","true","yes","on"}
          scene_list=scenes[:1] if smoke else scenes
          used=set(); attribution=[]; selected=0
          def get(url, **kwargs):
              for n in range(3):
                  try:
                      r=requests.get(url,timeout=(10,120),**kwargs); r.raise_for_status(); return r
                  except Exception:
                      if n==2: raise
                      time.sleep(2*(n+1))
          def download(url,target):
              try:
                  r=get(url,stream=True)
                  with open(target,"wb") as f:
                      for c in r.iter_content(1024*1024):
                          if c:f.write(c)
                  return Path(target).stat().st_size>=50000
              except Exception:return False
          for idx,scene in enumerate(scene_list,1):
              queries=[str(scene.get("pexels_query") or "").strip(),str(scene.get("visual_intent") or "").strip()]
              chosen=None
              if pexels_key:
                  for q in queries:
                      if not q: continue
                      try:
                          data=get("https://api.pexels.com/v1/videos/search",headers={"Authorization":pexels_key},params={"query":q,"orientation":"portrait","per_page":15}).json()
                          for v in data.get("videos",[]):
                              vid=f"pexels:{v.get('id')}"
                              if vid in used: continue
                              files=[x for x in v.get("video_files",[]) if x.get("file_type")=="video/mp4" and x.get("link")]
                              if files:
                                  files.sort(key=lambda x:(int(x.get("height") or 0)>int(x.get("width") or 0),int(x.get("height") or 0)),reverse=True)
                                  chosen=("Pexels",vid,v.get("id"),files[0]["link"],q,v.get("url"))
                                  break
                      except Exception: pass
                      if chosen: break
              if not chosen and pixabay_key:
                  for q in queries:
                      if not q: continue
                      try:
                          data=get("https://pixabay.com/api/videos/",params={"key":pixabay_key,"q":q,"video_type":"film","safesearch":"true","per_page":20}).json()
                          for v in data.get("hits",[]):
                              vid=f"pixabay:{v.get('id')}"
                              if vid in used: continue
                              variants=v.get("videos") or {}
                              x=variants.get("large") or variants.get("medium") or variants.get("small") or {}
                              if x.get("url"):
                                  chosen=("Pixabay",vid,v.get("id"),x["url"],q,v.get("pageURL")); break
                      except Exception: pass
                      if chosen: break
              if chosen:
                  provider,vid,source,url,q,page=chosen
                  target=f"output/media/scene-{idx}.mp4"
                  if download(url,target):
                      used.add(vid); selected+=1
                      attribution.append({"scene":idx,"provider":provider,"query":q,"provider_video_id":source,"provider_page_url":page,"local_file":target})
          Path("output/pexels-attribution.json").write_text(json.dumps({"version":"R43.8.4","items":attribution},ensure_ascii=False,indent=2),encoding="utf-8")
          Path("output/casting-policy.json").write_text(json.dumps({"version":"R43.8.4","policy":"dynamic_semantic_storytelling_multi_provider"},ensure_ascii=False,indent=2),encoding="utf-8")
          required=1 if smoke else 4
          if selected<required: raise SystemExit(f"R43.8.4 exige pelo menos {required} cena(s) humana(s).")
          PY

      - name: Resolve CTA and semantic metadata from scenes payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = (os.getenv("VIDEO_SCENES_JSON") or "").strip()
          payload = json.loads(raw)
          if not isinstance(payload, dict):
              payload = {"scenes": payload}

          cta = str(payload.get("cta") or os.getenv("VIDEO_CTA") or "Conheça a UGI.").strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"VIDEO_CTA={cta}\n")

          request_meta = {
              "version": "R43.8.4",
              "renderId": os.getenv("VIDEO_RENDER_ID"),
              "contentId": os.getenv("VIDEO_CONTENT_ID"),
              "experimentId": os.getenv("VIDEO_EXPERIMENT_ID"),
              "variant": os.getenv("VIDEO_VARIANT"),
              "commercialIntent": os.getenv("VIDEO_COMMERCIAL_INTENT"),
              "cta": cta,
              "commercialOffer": payload.get("commercial_offer") is True,
              "commerce": payload.get("commerce") or {},
              "copyLock": payload.get("copy_lock") or {},
              "sceneCount": len(payload.get("scenes") or []),
          }
          Path("output/semantic-request-meta.json").write_text(
              json.dumps(request_meta, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"R43.8.4 VIDEO_CTA={cta}")
          PY

      - name: Render UGI R43.8.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python render-reel.py

      - name: Validate R43.8.4 outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s output/ugi-reel.mp4
          test -s output/instagram-reel.mp4
          test -s output/tiktok-reel.mp4
          test -s output/youtube-short.mp4
          test -s output/r42-platform-manifest.json
          ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json output/ugi-reel.mp4 | tee output/ffprobe.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 output/ugi-reel.mp4 | tee output/audio-check.txt
          grep -q "codec_name=aac" output/audio-check.txt

      - name: Deliver 3 platform masters to Lola R2
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"
          [ -n "$BASE_URL" ] || { echo "UGI_VIDEO_UPLOAD_URL ausente"; exit 1; }
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || { echo "UGI_VIDEO_UPLOAD_KEY ausente"; exit 1; }
          [ -n "$VIDEO_RENDER_ID" ] || { echo "VIDEO_RENDER_ID ausente"; exit 1; }
          if [ "${VIDEO_SMOKE_TEST}" = "true" ]; then
            INSTAGRAM_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
            TIKTOK_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
            YOUTUBE_DURATION="${VIDEO_SMOKE_TEST_DURATION}"
          else
            INSTAGRAM_DURATION="32"; TIKTOK_DURATION="24"; YOUTUBE_DURATION="36"
          fi
          upload_asset() {
            local platform="$1"; local duration="$2"; local file="$3"; local response_file="$4"
            test -s "$file"
            local upload_url="${BASE_URL}/api/video-upload?renderId=${VIDEO_RENDER_ID}&githubRunId=${GITHUB_RUN_ID}&platform=${platform}&duration=${duration}"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 180 -X POST "$upload_url" -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" -H "Content-Type: video/mp4" -H "X-UGI-Platform: ${platform}" -H "X-UGI-Video-Duration: ${duration}" --data-binary @"$file" | tee "$response_file"
          }
          upload_asset "instagram" "${INSTAGRAM_DURATION}" "output/instagram-reel.mp4" "output/r2-upload-instagram.json"
          upload_asset "tiktok" "${TIKTOK_DURATION}" "output/tiktok-reel.mp4" "output/r2-upload-tiktok.json"
          upload_asset "youtube" "${YOUTUBE_DURATION}" "output/youtube-short.mp4" "output/r2-upload-youtube.json"

      - name: Build and deliver semantic success callback
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${UGI_VIDEO_UPLOAD_URL%/}"
          [ -n "$BASE_URL" ] || { echo "UGI_VIDEO_UPLOAD_URL ausente"; exit 1; }
          [ -n "$UGI_VIDEO_UPLOAD_KEY" ] || { echo "UGI_VIDEO_UPLOAD_KEY ausente"; exit 1; }
          [ -n "$VIDEO_RENDER_ID" ] || { echo "VIDEO_RENDER_ID ausente"; exit 1; }

          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = (os.getenv("VIDEO_SCENES_JSON") or "").strip()
          payload = json.loads(raw)
          if not isinstance(payload, dict):
              payload = {"scenes": payload}

          expected_scenes = payload.get("scenes") or []
          copy_lock = payload.get("copy_lock") or {}
          commerce = payload.get("commerce") or {}
          expected_cta = str(payload.get("cta") or os.getenv("VIDEO_CTA") or "").strip()
          smoke = (os.getenv("VIDEO_SMOKE_TEST") or "false").strip().lower() in {"1","true","yes","on"}

          storyboard_files = sorted(Path("output").glob("r42-storyboard-*.json"))
          storyboards = []
          for path in storyboard_files:
              try:
                  storyboards.append(json.loads(path.read_text(encoding="utf-8")))
              except Exception as exc:
                  raise SystemExit(f"STORYBOARD_READ_FAILED {path}: {exc}")

          if not storyboards:
              raise SystemExit("SEMANTIC_CALLBACK_FAIL: nenhum storyboard disponível")

          manifest = json.loads(Path("output/r42-platform-manifest.json").read_text(encoding="utf-8"))
          attribution_path = Path("output/pexels-attribution.json")
          attribution = json.loads(attribution_path.read_text(encoding="utf-8")) if attribution_path.exists() else {}

          mismatches = []
          qa_pass = True
          validated_platforms = []
          rendered_scene_counts = {}
          final_ctas = {}

          for sb in storyboards:
              platform = str(sb.get("platform") or "").strip()
              if not platform:
                  continue
              validated_platforms.append(platform)
              qa = sb.get("qa") or {}
              if qa.get("quality_status") != "pass":
                  qa_pass = False
                  mismatches.append({"platform": platform, "field": "qa.quality_status", "expected": "pass", "received": qa.get("quality_status")})

              rendered = sb.get("scenes") or []
              rendered_scene_counts[platform] = len(rendered)
              for rendered_scene in rendered:
                  idx = int(rendered_scene.get("index") or 0)
                  if idx < 1 or idx > len(expected_scenes):
                      mismatches.append({"platform": platform, "scene": idx, "field": "index", "reason": "out_of_expected_range"})
                      continue
                  exp = expected_scenes[idx - 1]
                  for field in ("role", "visual_intent", "pexels_query"):
                      if str(rendered_scene.get(field) or "") != str(exp.get(field) or ""):
                          mismatches.append({"platform": platform, "scene": idx, "field": field, "expected": exp.get(field), "received": rendered_scene.get(field)})
                  for field in ("overlay", "support", "narration"):
                      exp_map = exp.get(field) or {}
                      expected_value = str(exp_map.get(platform) or "")
                      received_value = str(rendered_scene.get(field) or "")
                      if received_value != expected_value:
                          mismatches.append({"platform": platform, "scene": idx, "field": field, "expected": expected_value, "received": received_value})

              profile = (qa.get("profile") or {})
              actual_cta = str(profile.get("primary_cta") or "").strip()
              final_ctas[platform] = actual_cta
              if expected_cta and actual_cta != expected_cta:
                  mismatches.append({"platform": platform, "field": "final_cta", "expected": expected_cta, "received": actual_cta})

          canonical_storyboards = json.dumps(storyboards, ensure_ascii=False, sort_keys=True).lower()
          forbidden = [
              "tudo passa por você",
              "tudo depende de você",
              "o líder vira gargalo",
              "você virou o gargalo",
              "autonomia com direção",
              "mais autonomia. mais execução",
          ]
          legacy_hits = [phrase for phrase in forbidden if phrase in canonical_storyboards]
          legacy_detected = bool(legacy_hits)

          copy_required = copy_lock.get("enabled") is True
          copy_pass = (not copy_required) or len(mismatches) == 0
          semantic_pass = qa_pass and copy_pass and not legacy_detected

          evidence = {
              "version": "R43.8.4",
              "renderId": os.getenv("VIDEO_RENDER_ID"),
              "githubRunId": os.getenv("GITHUB_RUN_ID"),
              "contentId": os.getenv("VIDEO_CONTENT_ID"),
              "experimentId": os.getenv("VIDEO_EXPERIMENT_ID"),
              "variant": os.getenv("VIDEO_VARIANT"),
              "sceneCount": len(expected_scenes),
              "sceneRoles": [str(x.get("role") or "") for x in expected_scenes],
              "validatedPlatforms": validated_platforms,
              "renderedSceneCounts": rendered_scene_counts,
              "smokeTest": smoke,
              "exactCopyScope": "rendered_scenes_only" if smoke else "all_rendered_platform_scenes",
              "finalCtaByPlatform": final_ctas,
              "commercialOffer": payload.get("commercial_offer") is True,
              "commerce": commerce,
              "copyLock": copy_lock,
              "manifest": {
                  "version": manifest.get("version"),
                  "sceneSource": manifest.get("sceneSource"),
                  "sceneCount": manifest.get("sceneCount"),
                  "sceneRoles": manifest.get("sceneRoles"),
                  "legacyHardcodedScenesDisabled": manifest.get("legacyHardcodedScenesDisabled"),
              },
          }

          result = {
              "renderId": os.getenv("VIDEO_RENDER_ID"),
              "githubRunId": os.getenv("GITHUB_RUN_ID"),
              "semanticValidation": {
                  "pass": semantic_pass,
                  "qaPass": qa_pass,
                  "copyLockPass": copy_pass,
                  "validatedPlatforms": validated_platforms,
                  "declaredSceneCount": len(expected_scenes),
                  "renderedSceneCounts": rendered_scene_counts,
                  "smokeTest": smoke,
                  "mismatches": mismatches,
              },
              "copyLockValidation": {
                  "required": copy_required,
                  "pass": copy_pass,
                  "mode": copy_lock.get("mode") or "exact",
                  "strict": copy_lock.get("strict") is not False,
                  "mismatches": mismatches,
              },
              "legacyContentLeakDetected": legacy_detected,
              "semanticEvidence": evidence,
              "mediaProviders": attribution.get("items") or [],
              "finalCta": expected_cta or None,
          }

          Path("output/semantic-result-request.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          if not semantic_pass:
              print(json.dumps(result, ensure_ascii=False, indent=2))
              raise SystemExit("SEMANTIC_VALIDATION_FAILED")

          print("R43_8_4_SEMANTIC_VALIDATION_LOCAL_PASS")
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            -X POST "${BASE_URL}/api/video-semantic-result" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @output/semantic-result-request.json \
            | tee output/semantic-result-response.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("output/semantic-result-response.json").read_text(encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(f"SEMANTIC_CALLBACK ok!=true: {data}")
          if data.get("semanticValidationAvailable") is not True:
              raise SystemExit(f"SEMANTIC_CALLBACK semanticValidationAvailable!=true: {data}")
          if data.get("semanticPass") is not True:
              raise SystemExit(f"SEMANTIC_CALLBACK semanticPass!=true: {data}")
          if data.get("legacyContentLeakDetected") is True:
              raise SystemExit(f"SEMANTIC_CALLBACK legacy leak: {data}")
          if (data.get("copyLockValidation") or {}).get("pass") is not True:
              raise SystemExit(f"SEMANTIC_CALLBACK copy lock failed: {data}")
          print("R43_8_4_SEMANTIC_CALLBACK_OK")
          PY

