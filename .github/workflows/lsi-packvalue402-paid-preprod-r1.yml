name: LSI PackValue402 Paid Preprod R1
run-name: LSI PackValue402 Paid Preprod R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-mass-market-r1-20260829]
    paths:
      - 'cloudflare/packvalue402-paid-r1/**'
      - '.github/workflows/lsi-packvalue402-paid-preprod-r1.yml'

permissions:
  contents: read

jobs:
  prove-payment-ready-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATEWAY_URL: https://lsi-packvalue402-paid-r1-preprod.umagestaointeligente.workers.dev
      FACILITATOR_URL: https://facilitator.payai.network
    steps:
      - uses: actions/checkout@v4

      - name: Static financial protocol and distribution gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PAYMENTS_ENABLED = "false"' cloudflare/packvalue402-paid-r1/wrangler.toml
          ! grep -q '^PAY_TO' cloudflare/packvalue402-paid-r1/wrangler.toml
          grep -q 'NETWORK = "eip155:8453"' cloudflare/packvalue402-paid-r1/wrangler.toml
          grep -q 'FACILITATOR_URL = "https://facilitator.payai.network"' cloudflare/packvalue402-paid-r1/wrangler.toml
          grep -q 'server_can_spend: false' cloudflare/packvalue402-paid-r1/src/index.mjs
          grep -q 'money_movement_from_server: false' cloudflare/packvalue402-paid-r1/src/index.mjs
          grep -q 'payments_not_activated' cloudflare/packvalue402-paid-r1/src/index.mjs
          grep -q 'bazaar_declared: true' cloudflare/packvalue402-paid-r1/src/index.mjs
          grep -q 'bazaar_indexed: false' cloudflare/packvalue402-paid-r1/src/index.mjs
          grep -q '"@x402/hono": "2.24.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"@x402/core": "2.24.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"@x402/evm": "2.24.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"@x402/extensions": "2.24.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"@x402/fetch": "2.24.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"viem": "2.56.0"' cloudflare/packvalue402-paid-r1/package.json
          grep -q '"hono": "4.13.5"' cloudflare/packvalue402-paid-r1/package.json
          ! grep -q '"x402-hono"' cloudflare/packvalue402-paid-r1/package.json
          ! grep -q '"x402"' cloudflare/packvalue402-paid-r1/package.json

      - name: Install and audit native x402 v2 dependencies
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run check
          node --input-type=module <<'NODE'
          const [honoX402, coreServer, evmServer, bazaar, fetchX402] = await Promise.all([
            import('@x402/hono'),
            import('@x402/core/server'),
            import('@x402/evm/exact/server'),
            import('@x402/extensions/bazaar'),
            import('@x402/fetch'),
          ]);
          if (typeof honoX402.paymentMiddleware !== 'function') process.exit(2);
          if (typeof coreServer.x402ResourceServer !== 'function') process.exit(3);
          if (typeof coreServer.HTTPFacilitatorClient !== 'function') process.exit(4);
          if (typeof evmServer.registerExactEvmScheme !== 'function') process.exit(5);
          if (typeof bazaar.declareDiscoveryExtension !== 'function') process.exit(6);
          if (!bazaar.bazaarResourceServerExtension) process.exit(7);
          if (typeof fetchX402.wrapFetchWithPaymentFromConfig !== 'function') process.exit(8);
          console.log('X402_V2_BAZAAR_CLIENT_IMPORTS=PASS');
          NODE

      - name: Verify live facilitator supports x402 v2 Base mainnet
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 20 "$FACILITATOR_URL/supported" > /tmp/facilitator.json
          jq -e '((.kinds | any(.x402Version==2 and .scheme=="exact" and .network=="eip155:8453"))) and (((.extensions // []) | index("bazaar")) != null)' /tmp/facilitator.json >/dev/null

      - name: Prove unpaid 402 challenge and Bazaar metadata in-process
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { default: app } = await import('./src/index.mjs');
          const payTo = '0x1111111111111111111111111111111111111111';
          const req = new Request('https://packvalue402.invalid/v1/compare', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ offers: [
              { label: '6-pack', text: '6x330 ml', price: 5.94, currency: 'USD' },
              { label: '2-liter', text: '2 L', price: 5.60, currency: 'USD' }
            ] })
          });
          const env = {
            PAYMENTS_ENABLED: 'true',
            PAY_TO: payTo,
            NETWORK: 'eip155:8453',
            FACILITATOR_URL: 'https://facilitator.payai.network'
          };
          const ctx = { waitUntil() {}, passThroughOnException() {} };
          const res = await app.fetch(req, env, ctx);
          if (res.status !== 402) throw new Error(`expected_402_got_${res.status}:${await res.text()}`);
          const raw = res.headers.get('payment-required');
          if (!raw) throw new Error('missing_PAYMENT_REQUIRED_header');
          const normalized = raw.replace(/-/g, '+').replace(/_/g, '/');
          const required = JSON.parse(Buffer.from(normalized, 'base64').toString('utf8'));
          if (required.x402Version !== 2) throw new Error('not_x402_v2');
          const a = required.accepts?.[0];
          if (!a || a.scheme !== 'exact' || a.network !== 'eip155:8453' || a.payTo.toLowerCase() !== payTo.toLowerCase()) throw new Error('invalid_accepts');
          if (a.amount !== '1000') throw new Error(`unexpected_amount_${a.amount}`);
          const bz = required.extensions?.bazaar;
          if (!bz?.info || !bz?.schema) throw new Error('bazaar_extension_missing');
          if (bz.info.input?.type !== 'http' || bz.info.input?.method !== 'POST' || bz.info.input?.bodyType !== 'json') throw new Error('bazaar_http_shape_invalid');
          if (!Array.isArray(bz.info.input?.body?.offers) || bz.info.input.body.offers.length !== 2) throw new Error('bazaar_example_missing');
          if (required.resource?.serviceName !== 'PackValue402') throw new Error('service_name_missing');
          console.log('UNPAID_X402_V2_BAZAAR_CHALLENGE=PASS');
          NODE

      - name: Prove cryptographic x402 client verify settle E2E without value
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e-mock

      - name: Require autonomous Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy isolated payment gateway preprod
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Prove preprod health is payment-disabled
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS "$GATEWAY_URL/health?ts=$RANDOM" > /tmp/health.json 2>/dev/null && jq -e '.ok==true and .mode=="PREPROD_DISABLED" and .payment.protocol=="x402-v2" and .payment.scheme=="exact" and .payment.bazaar_declared==true and .payment.enabled==false and .payment.pay_to_configured==false and .payment.ready==false and .payment.network=="eip155:8453" and .payment.target_price_usd==0.001 and .payment.facilitator=="https://facilitator.payai.network" and .payment.server_private_key_required==false and .payment.server_can_spend==false and .money_movement_from_server==false' /tmp/health.json >/dev/null; then
              ok=true
              break
            fi
            sleep 2
          done
          test "$ok" = true

      - name: Prove free normalize still works through gateway
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSG "$GATEWAY_URL/v1/normalize" \
            --data-urlencode 'text=6x330 ml' \
            --data-urlencode 'price=5.94' \
            --data-urlencode 'currency=USD' > /tmp/normalize.json
          jq -e '.ok==true and .result.count==6 and .result.base_quantity==1980 and .result.display_basis=="L" and .result.display_price==3' /tmp/normalize.json >/dev/null

      - name: Prove paid compare cannot run before approval
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/blocked.json -w '%{http_code}' -X POST "$GATEWAY_URL/v1/compare" -H 'content-type: application/json' --data '{"offers":[{"label":"a","text":"1 L","price":3},{"label":"b","text":"2 L","price":5}]}' )"
          test "$code" = "503"
          jq -e '.ok==false and .error=="payments_not_activated" and .mode=="PREPROD_DISABLED" and .wallet_bound==false and .money_movement==false' /tmp/blocked.json >/dev/null

      - name: Prove discovery is explicit about payment state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$GATEWAY_URL/.well-known/agent.json" > /tmp/agent.json
          jq -e '.name=="PackValue402" and .mode=="PREPROD_DISABLED" and .distribution.bazaar_declared==true and .distribution.bazaar_indexed==false and .distribution.indexing_requires_valid_settlement==true and .payment.protocol=="x402-v2" and .payment.scheme=="exact" and .payment.enabled==false and .payment.ready==false and .payment.network=="eip155:8453" and .payment.price_usd==0.001 and .payment.pay_to_configured==false and .payment.facilitator=="https://facilitator.payai.network" and .payment.server_can_spend==false and ((.tools|length)==2)' /tmp/agent.json >/dev/null

      - name: Write preprod acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '{schema_version:"1.4",project:"PACKVALUE402_PAID_PREPROD_R1",acceptance_state:"PASS",run_id:$run,commit:$sha,protocol:"x402-v2",scheme:"exact",x402_stack:"native-scoped-v2",target_price_usd:0.001,network:"eip155:8453",facilitator:"https://facilitator.payai.network",facilitator_live_support_verified:true,dependency_high_critical_gate:"PASS",ci_dependency_high_critical_gate:"PASS",unpaid_402_challenge_verified:true,bazaar_declared:true,bazaar_challenge_verified:true,bazaar_indexed:false,indexing_requires_valid_settlement:true,cryptographic_eip712_signature_verified:true,mock_verify_verified:true,mock_settle_verified:true,client_retry_to_200_verified:true,payment_response_receipt_verified:true,blockchain_broadcast:false,real_value_moved:false,private_key_persisted:false,payments_enabled:false,pay_to_configured:false,server_private_key_required:false,server_can_spend:false,money_movement:false,origin_shadow_proven:true,activation_gate:"EXPLICIT_APPROVAL_PLUS_RECEIVE_ADDRESS"}' > generated/evidence/packvalue402-paid-preprod-r1.json

      - name: Upload preprod acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: packvalue402-paid-preprod-${{ github.run_id }}
          path: generated/evidence/packvalue402-paid-preprod-r1.json
          retention-days: 14
          if-no-files-found: error
