name: Cena Certa Sep26 Format Recovery Discovery
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep26-format-recovery-discovery.yml
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Inspect sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for spec in "colonia|iFBYJdG8l9I" "lady|aZcc0FXRs4w" "porchat|VVyMUeLuq6Q" "suburbanos|3o3S_miD8W4"; do
            name="${spec%%|*}"
            id="${spec##*|}"
            echo "===== ${name} / ${id} ====="
            yt-dlp --no-warnings --skip-download --write-auto-subs --write-subs --sub-langs "pt-BR,pt,pt.*" --sub-format vtt --print "TITLE=%(title)s" --print "DURATION=%(duration)s" -o "out/${name}.%(ext)s" "https://www.youtube.com/watch?v=${id}" || true
            vtt="$(find out -maxdepth 1 -type f -name "${name}*.vtt" | head -n1 || true)"
            if [ -n "$vtt" ]; then
              grep -Ev '^(WEBVTT|Kind:|Language:|$)' "$vtt" | head -n 220 || true
            else
              echo "NO_PT_SUBTITLE"
            fi
          done
