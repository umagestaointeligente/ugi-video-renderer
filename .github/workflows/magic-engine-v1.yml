name: Lola Magic Engine V1
run-name: Magic Engine ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'magic-engine/**'
      - '.github/workflows/magic-engine-v1.yml'

permissions:
  contents: read

concurrency:
  group: lola-magic-engine-v1
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MAGIC_COUNCIL_MAX_MODELS: '3'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
      UGI_PUBLISH_PROVIDER: 'buffer'
      UGI_ANALYTICS_PROVIDER: 'metricool'
      UGI_METRICOOL_PUBLICATION_ALLOWED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Enforce UGI publication routing lock
        shell: bash
        run: |
          set -euo pipefail
          test "$UGI_PUBLISH_PROVIDER" = 'buffer'
          test "$UGI_ANALYTICS_PROVIDER" = 'metricool'
          test "$UGI_METRICOOL_PUBLICATION_ALLOWED" = 'false'
          python - <<'PY'
          import json
          p=json.load(open('config/ugi/growth-policy.json'))
          r=p['integration_roles']
          assert r['publisher']['primary']=='buffer'
          assert r['publisher']['metricool_allowed'] is False
          assert r['analytics']['primary']=='metricool'
          assert r['analytics']['publishing_allowed'] is False
          print('UGI_PUBLICATION_ROUTING_LOCK_PASS=true')
          PY

      - name: Run autonomous trend radar
        run: python magic-engine/magic_engine.py

      - name: Run zero-cost Multi-AI Council
        run: python magic-engine/multi_ai_council.py

      - name: Validate YouTube native OAuth health (supplemental only)
        continue-on-error: true
        run: python magic-engine/youtube_auth_health.py

      - name: Check native platform authorization matrix (supplemental only)
        run: python magic-engine/publishers.py

      - name: Summarize gates
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path('magic-engine/output/latest.json').read_text())
          s=p['summary']
          council_path=Path('magic-engine/output/multi-ai-council-latest.json')
          council=json.loads(council_path.read_text()) if council_path.exists() else {}
          yt_path=Path('magic-engine/output/youtube-auth-health.json')
          yt=json.loads(yt_path.read_text()) if yt_path.exists() else {}
          print('# Lola Magic Engine V1')
          print('- PUBLISH_PROVIDER: BUFFER')
          print('- ANALYTICS_PROVIDER: METRICOOL')
          print('- METRICOOL_PUBLICATION_ALLOWED: false')
          print(f"- proposals: {s['total']}")
          print(f"- rights GREEN: {s['green']}")
          print(f"- rights YELLOW: {s['yellow']}")
          print(f"- rights RED: {s['red']}")
          print(f"- MULTI_AI_COUNCIL: {council.get('status','NOT_RUN')}")
          print(f"- COUNCIL_MODELS: {council.get('calls',0)}")
          print(f"- COST_GATE: {council.get('cost_gate','PASS')}")
          print(f"- YOUTUBE_NATIVE_AUTH_STATUS: {yt.get('auth_status','NOT_RUN')} (supplemental; not publisher gate)")
          print('- Publication remains fail-closed on UGI content/commerce gates and Buffer publication/readback.')
          PY

      - name: Persist lightweight evidence
        uses: actions/upload-artifact@v4
        with:
          name: magic-engine-plan-${{ github.run_id }}
          path: magic-engine/output/*.json
          retention-days: 7
          if-no-files-found: error
