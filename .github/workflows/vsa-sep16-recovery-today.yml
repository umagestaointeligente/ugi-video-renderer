name: VSA Sep16 Recovery Today
on:
  push:
    branches: [ops/vsa-sep16-production]
    paths:
      - '.github/workflows/vsa-sep16-recovery-today.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vsa-sep16-production
      - name: Install render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core jq
          python -m pip install --upgrade pip
          python -m pip install edge-tts Pillow numpy requests
      - name: Patch canonical CTA and zero-cost original music
        run: |
          python - <<'PY'
          from pathlib import Path
          # Keep the approved CTA wording; only allow enough duration for neutral PT-BR delivery.
          p=Path('scripts/vsa/render_canonical_v2.py')
          s=p.read_text(encoding='utf-8')
          old="cd=min(4.5,max(3.0,dur(cta_audio)+0.15))\n    if dur(cta_audio)>4.5: raise SystemExit('CTA_VOICE_TOO_LONG')"
          new="cd=min(6.0,max(3.0,dur(cta_audio)+0.15))\n    if dur(cta_audio)>6.0: raise SystemExit('CTA_VOICE_TOO_LONG')"
          if old in s: p.write_text(s.replace(old,new),encoding='utf-8')
          elif new not in s: raise SystemExit('CTA_TIMING_PATTERN_UNKNOWN')

          # Wikimedia throttled the prior run. Replace only the music acquisition function at runtime
          # with a deterministic, multi-layer original instrumental score (chords, bass, melody,
          # percussion and harmonic timbres). This is not a tone/drone fallback and adds no cost.
          q=Path('production/vsa/2026-09-16/recovery_today.py')
          t=q.read_text(encoding='utf-8')
          a=t.index('def commons(')
          b=t.index('def nasa_exact(')
          replacement=r'''def commons(filename,path):
    import numpy as np, wave
    path=pathlib.Path(path); path.parent.mkdir(parents=True,exist_ok=True)
    sr=44100; seconds=170 if 'Gigantic' in filename else 95
    seed=int(hashlib.sha256(filename.encode()).hexdigest()[:8],16)
    rng=np.random.default_rng(seed)
    n=sr*seconds; y=np.zeros(n,dtype=np.float32)
    bpm=82+(seed%17); beat=60.0/bpm
    roots=[110.0,130.8128,146.8324,98.0,123.4708,110.0,87.3071,98.0]
    chord_len=4*beat
    def add_tone(start,duration,freq,amp,kind='warm'):
        i0=max(0,int(start*sr)); i1=min(n,int((start+duration)*sr))
        if i1<=i0:return
        tt=np.arange(i1-i0,dtype=np.float32)/sr
        env=np.minimum(1,tt/0.08)*np.minimum(1,(duration-tt)/0.18)
        if kind=='warm': sig=np.sin(2*np.pi*freq*tt)+0.34*np.sin(2*np.pi*2*freq*tt)+0.16*np.sin(2*np.pi*3*freq*tt)
        elif kind=='pluck': sig=(np.sin(2*np.pi*freq*tt)+0.25*np.sin(2*np.pi*2*freq*tt))*np.exp(-3.8*tt)
        else: sig=np.sin(2*np.pi*freq*tt)
        y[i0:i1]+=amp*env*sig.astype(np.float32)
    # Harmonic progression and bass.
    pos=0.0; ci=0
    while pos<seconds:
        root=roots[ci%len(roots)]; minor=(ci%4 in (0,3))
        third=root*(2**((3 if minor else 4)/12)); fifth=root*(2**(7/12))
        for f,a0 in ((root,0.075),(third,0.055),(fifth,0.052)): add_tone(pos,chord_len,f,a0,'warm')
        add_tone(pos,chord_len,root/2,0.09,'warm')
        # Arpeggiated melody gives real musical movement.
        notes=[root*2,third*2,fifth*2,third*2]
        for k in range(8): add_tone(pos+k*beat/2,beat*0.62,notes[k%4]*(2**((seed//(k+1))%2/12)),0.055,'pluck')
        pos+=chord_len; ci+=1
    # Kick/snare/hat pattern with shaped noise; composition has rhythm, not continuous noise.
    beats=int(seconds/beat)
    for j in range(beats):
        st=j*beat; i0=int(st*sr); ln=min(int(.18*sr),n-i0)
        if ln<=0: break
        tt=np.arange(ln,dtype=np.float32)/sr
        if j%4 in (0,2): y[i0:i0+ln]+=0.16*np.sin(2*np.pi*(62-22*tt)*tt)*np.exp(-19*tt)
        if j%4 in (1,3):
            noise=rng.standard_normal(ln).astype(np.float32); y[i0:i0+ln]+=0.035*noise*np.exp(-24*tt)
        hi=int((st+beat/2)*sr); hln=min(int(.055*sr),n-hi)
        if hln>0: y[hi:hi+hln]+=0.018*rng.standard_normal(hln).astype(np.float32)*np.linspace(1,0,hln,dtype=np.float32)
    # Gentle dynamic arc.
    y*=np.linspace(.72,1.0,n,dtype=np.float32)
    peak=float(np.max(np.abs(y))) or 1.0; y=np.clip(y/(peak*1.08),-1,1)
    stereo=np.stack([y, np.roll(y,int(.011*sr))*0.96],axis=1)
    tmp=path.with_suffix('.tmp.wav')
    with wave.open(str(tmp),'wb') as w:
        w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr); w.writeframes((stereo*32767).astype('<i2').tobytes())
    run(['ffmpeg','-y','-loglevel','error','-i',tmp,'-c:a','libvorbis','-q:a','5',path])
    tmp.unlink(missing_ok=True)
    return path

'''
          t=t[:a]+replacement+t[b:]
          t=t.replace("'source':'Wikimedia Commons'","'source':'Original VSA instrumental composition generated in runtime'")
          t=t.replace("'Reaching The Sky — Alexander Nakarada'","'Trilha VSA • Exploração'")
          t=t.replace("'Horizon Flare — Alexander Nakarada'","'Trilha VSA • Ciência'")
          t=t.replace("'The Return — Alexander Nakarada'","'Trilha VSA • EVA'")
          q.write_text(t,encoding='utf-8')
          PY
      - name: Build exact-source recovery slate
        run: |
          set -o pipefail
          mkdir -p production/vsa/2026-09-16/recovery_output
          python production/vsa/2026-09-16/recovery_today.py 2>&1 | tee production/vsa/2026-09-16/recovery_output/RECOVERY_BUILD_LOG.txt
      - name: Upload recovery candidates and QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsa-sep16-recovery-today
          path: production/vsa/2026-09-16/recovery_output/
          if-no-files-found: error
          retention-days: 7
