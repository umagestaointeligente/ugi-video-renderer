name: UGI Admin Bridge Deep Probe
run-name: UGI Admin Bridge Deep Probe ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-admin-bridge-deep-probe.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://lola-github-admin-bridge-ugi.umagestaointeligente.workers.dev

jobs:
  deep-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Run deep probe and always restore clean source
        shell: bash
        run: |
          set +e
          mkdir -p control-plane/receipts/ugi-admin-bridge
          SRC='cloudflare/lola-github-admin-bridge-ugi.mjs'
          CFG='cloudflare/wrangler.ugi-admin.toml'
          cp "$SRC" /tmp/clean.mjs
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          export SMOKE_TOKEN
          HEALTH_BEFORE_CODE=0
          TEMP_DEPLOY_EXIT=999
          DIAG_CODE=0
          ACTIONS_CODE=0
          RESTORE_EXIT=999
          HEALTH_AFTER_CODE=0
          PROTECTED_CODE=0

          curl --silent --show-error --max-time 20 -o /tmp/health-before.txt -w '%{http_code}' "$WORKER_URL/health" >/tmp/health-before-code.txt 2>/tmp/health-before-err.txt
          HEALTH_BEFORE_EXIT=$?
          HEALTH_BEFORE_CODE=$(cat /tmp/health-before-code.txt 2>/dev/null || echo 0)

          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('cloudflare/lola-github-admin-bridge-ugi.mjs')
          s=p.read_text()
          old='if (!(await requireAuth(request, env))) {'
          token=os.environ['SMOKE_TOKEN']
          new=f'if (request.headers.get("x-ugi-smoke") !== "{token}" && !(await requireAuth(request, env))) {{'
          if s.count(old)!=1:
              raise SystemExit('auth gate anchor not unique')
          p.write_text(s.replace(old,new))
          PY
          PATCH_EXIT=$?

          if [ "$PATCH_EXIT" = '0' ]; then
            npx --yes wrangler@4.32.0 deploy --config "$CFG" >/tmp/temp-deploy.log 2>&1
            TEMP_DEPLOY_EXIT=$?
          fi

          if [ "$TEMP_DEPLOY_EXIT" = '0' ]; then
            DIAG_CODE=$(curl --silent --show-error --max-time 30 -o /tmp/diag.txt -w '%{http_code}' -H "x-ugi-smoke: $SMOKE_TOKEN" "$WORKER_URL/diagnostics" 2>/tmp/diag-err.txt)
            DIAG_EXIT=$?
            ACTIONS_CODE=$(curl --silent --show-error --max-time 30 -o /tmp/actions.txt -w '%{http_code}' -H "x-ugi-smoke: $SMOKE_TOKEN" "$WORKER_URL/github/actions/status" 2>/tmp/actions-err.txt)
            ACTIONS_EXIT=$?
          else
            DIAG_EXIT=999
            ACTIONS_EXIT=999
          fi

          cp /tmp/clean.mjs "$SRC"
          npx --yes wrangler@4.32.0 deploy --config "$CFG" >/tmp/restore.log 2>&1
          RESTORE_EXIT=$?

          HEALTH_AFTER_CODE=$(curl --silent --show-error --max-time 20 -o /tmp/health-after.txt -w '%{http_code}' "$WORKER_URL/health" 2>/tmp/health-after-err.txt)
          HEALTH_AFTER_EXIT=$?
          PROTECTED_CODE=$(curl --silent --show-error --max-time 20 -o /tmp/protected.txt -w '%{http_code}' "$WORKER_URL/diagnostics" 2>/tmp/protected-err.txt)
          PROTECTED_EXIT=$?

          export HEALTH_BEFORE_EXIT HEALTH_BEFORE_CODE PATCH_EXIT TEMP_DEPLOY_EXIT DIAG_EXIT DIAG_CODE ACTIONS_EXIT ACTIONS_CODE RESTORE_EXIT HEALTH_AFTER_EXIT HEALTH_AFTER_CODE PROTECTED_EXIT PROTECTED_CODE
          python - <<'PY'
          import json,os,datetime
          def txt(path,n=1600):
              try:return open(path).read()[:n]
              except:return ''
          def js(path):
              try:return json.loads(open(path).read())
              except:return None
          out={
            'project':'UGI','repository':'umagestaointeligente/ugi-video-renderer','worker':'lola-github-admin-bridge-ugi',
            'health_before':{'curl_exit':int(os.environ['HEALTH_BEFORE_EXIT']),'http_code':int(os.environ['HEALTH_BEFORE_CODE'] or 0),'json':js('/tmp/health-before.txt'),'error':txt('/tmp/health-before-err.txt') or None},
            'patch_exit':int(os.environ['PATCH_EXIT']),
            'temp_deploy':{'exit':int(os.environ['TEMP_DEPLOY_EXIT']),'log':txt('/tmp/temp-deploy.log') or None},
            'diagnostics':{'curl_exit':int(os.environ['DIAG_EXIT']),'http_code':int(os.environ['DIAG_CODE'] or 0),'json':js('/tmp/diag.txt'),'body':None if js('/tmp/diag.txt') else txt('/tmp/diag.txt'),'error':txt('/tmp/diag-err.txt') or None},
            'actions_status':{'curl_exit':int(os.environ['ACTIONS_EXIT']),'http_code':int(os.environ['ACTIONS_CODE'] or 0),'json':js('/tmp/actions.txt'),'body':None if js('/tmp/actions.txt') else txt('/tmp/actions.txt'),'error':txt('/tmp/actions-err.txt') or None},
            'restore_clean':{'exit':int(os.environ['RESTORE_EXIT']),'log':txt('/tmp/restore.log') or None},
            'health_after':{'curl_exit':int(os.environ['HEALTH_AFTER_EXIT']),'http_code':int(os.environ['HEALTH_AFTER_CODE'] or 0),'json':js('/tmp/health-after.txt'),'error':txt('/tmp/health-after-err.txt') or None},
            'unauthenticated_diagnostics':{'curl_exit':int(os.environ['PROTECTED_EXIT']),'http_code':int(os.environ['PROTECTED_CODE'] or 0),'json':js('/tmp/protected.txt'),'body':None if js('/tmp/protected.txt') else txt('/tmp/protected.txt')},
            'secrets_exposed':False,'publication_triggered':False,'payment_triggered':False,'fail_closed':True,
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'commit_sha':os.environ.get('GITHUB_SHA'),'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('control-plane/receipts/ugi-admin-bridge/deep-probe.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - name: Persist deep probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-autonomy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/receipts/ugi-admin-bridge/deep-probe.json
          git commit -m 'UGI autonomy: persist admin bridge deep probe [skip ci]' || true
          git push

