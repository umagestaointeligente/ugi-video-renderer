name: Cena Certa Sep29 Real Scenes Pack
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep29-real-scenes-pack.yml
      - scripts/cena_certa_sep29_real_scenes_pack.py
      - ops/cena-certa-sep29/manifest.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp
      - name: Render and QA 12 masters
        run: |
          set -euo pipefail
          python scripts/cena_certa_sep29_real_scenes_pack.py
      - name: Require current execution-bound editorial evidence
        run: |
          set -euo pipefail
          python scripts/cena_certa_render_evidence_guard.py out/cena-certa-sep29/summary.json ops/cena-certa-sep29/prepublish-receipts.json out/cena-certa-sep29/release-preflight.json

      - name: Publish approved masters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cena-certa-sep29-real-scenes
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Sep29 Real Scenes" --notes "12 real-scene PT-BR masters approved for Metricool."
          gh release upload "$TAG" out/cena-certa-sep29/*.mp4 --repo "$GITHUB_REPOSITORY"
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_SEP29_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "PUBLICATION_STATUS=NOT_VERIFIED"
            echo
            cat out/cena-certa-sep29/summary.json
          } > out/cena-certa-sep29/issue.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-SEP29-PACK] $GITHUB_RUN_ID" --body-file out/cena-certa-sep29/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-sep29-${{ github.run_id }}
          path: out/cena-certa-sep29/
          retention-days: 7
