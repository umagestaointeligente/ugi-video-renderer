name: Career360 Vercel Chat Only Policy Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-vercel-chat-only-policy-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply policy patch
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/patch_vercel_chat_only_policy.py
          git diff --check
      - name: Commit canonical recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          git diff --cached --check
          git commit -m 'career360: enforce Vercel ChatGPT-only access policy'
          git push origin HEAD:main
          echo 'VERCEL_CHAT_ONLY_POLICY_PUSH=PASS'
