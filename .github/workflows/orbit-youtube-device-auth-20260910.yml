name: Orbit YouTube Device Auth

on:
  push:
    paths:
      - '.github/workflows/orbit-youtube-device-auth-20260910.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      EXPECTED_CHANNEL_ID: UCq1h6RSnev5-JJQ8k4T98tg
    steps:
      - name: Request Google device authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID" || { echo 'AUTH_GATE: YOUTUBE_CLIENT_ID missing'; exit 78; }
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          payload=urllib.parse.urlencode({
            'client_id': os.environ['CLIENT_ID'],
            'scope': 'https://www.googleapis.com/auth/youtube https://www.googleapis.com/auth/youtube.upload'
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/device/code',data=payload,headers={'Content-Type':'application/x-www-form-urlencoded'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read())
          except urllib.error.HTTPError as e:
            print('DEVICE_AUTH_HTTP='+str(e.code))
            print('DEVICE_AUTH_BODY='+e.read().decode(errors='replace')[:800])
            raise SystemExit(78)
          open('/tmp/device.json','w').write(json.dumps(data))
          print('DEVICE_AUTH_RESULT=READY')
          print('VERIFICATION_URL='+data.get('verification_url',data.get('verification_uri','')))
          print('USER_CODE='+data.get('user_code',''))
          print('EXPIRES_IN='+str(data.get('expires_in','')))
          print('INTERVAL='+str(data.get('interval','5')))
          print('DEVICE_CODE_EXPOSED=false')
          PY

      - name: Poll authorization and verify Cena Certa identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          d=json.load(open('/tmp/device.json'))
          interval=max(5,int(d.get('interval',5)))
          deadline=time.time()+min(int(d.get('expires_in',900)),900)
          token=None
          while time.time()<deadline:
            body=urllib.parse.urlencode({
              'client_id':os.environ['CLIENT_ID'],
              'device_code':d['device_code'],
              'grant_type':'urn:ietf:params:oauth:grant-type:device_code'
            }).encode()
            req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                token=json.loads(r.read()); break
            except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')
              try: err=json.loads(raw).get('error','')
              except: err=''
              if err=='authorization_pending': time.sleep(interval); continue
              if err=='slow_down': interval+=5; time.sleep(interval); continue
              print('TOKEN_POLL_HTTP='+str(e.code)); print('TOKEN_POLL_ERROR='+err); raise SystemExit(78)
          if not token:
            print('AUTH_RESULT=TIMEOUT'); raise SystemExit(78)
          access=token.get('access_token','')
          if not access:
            print('AUTH_RESULT=NO_ACCESS_TOKEN'); raise SystemExit(78)
          req=urllib.request.Request('https://www.googleapis.com/youtube/v3/channels?part=id,snippet&mine=true',headers={'Authorization':'Bearer '+access})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read())
          items=data.get('items') or []
          print('TOKEN_ISSUED=true')
          print('REFRESH_TOKEN_ISSUED='+str(bool(token.get('refresh_token'))).lower())
          print('CHANNEL_COUNT='+str(len(items)))
          if len(items)!=1:
            print('IDENTITY_RESULT=AMBIGUOUS'); raise SystemExit(78)
          ch=items[0]; cid=ch.get('id',''); title=(ch.get('snippet') or {}).get('title','')
          print('CHANNEL_ID='+cid); print('CHANNEL_TITLE='+title)
          print('EXPECTED_CHANNEL_ID='+os.environ['EXPECTED_CHANNEL_ID'])
          match=(cid==os.environ['EXPECTED_CHANNEL_ID'])
          print('IDENTITY_MATCH='+str(match).lower())
          print('MUTATION_PERFORMED=false')
          if not match: raise SystemExit(78)
          print('AUTH_RESULT=SUCCESS')
          PY
