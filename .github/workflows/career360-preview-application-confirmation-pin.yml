name: Career360 Preview Application Confirmation Pin
run-name: Career360 Preview Application Confirmation Pin ${{ github.run_id }}

on:
  push:
    branches: ['career360-cloudflare-preview-20260906']
    paths:
      - '.github/workflows/career360-preview-application-confirmation-pin.yml'
      - 'career360/scripts/patch_preview_application_confirmation_pin.py'

permissions:
  contents: write

jobs:
  patch-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app-i immutable pin
        run: python career360/scripts/patch_preview_application_confirmation_pin.py
      - name: Verify and commit pin
        shell: bash
        run: |
          set -euo pipefail
          grep -F '@90a795bf1a371be66fd8f907c8a76501f8a5421c/career360/frontend/app-i.js' career360/frontend/index.html >/dev/null
          ! grep -F '@0a2ea38883094ccf9be4c5fde9ea4efa14617b65/career360/frontend/app-i.js' career360/frontend/index.html >/dev/null
          if git diff --quiet -- career360/frontend/index.html; then
            echo 'APP_I_PIN_ALREADY_CURRENT=1'
            exit 0
          fi
          git config user.name 'career360-preview-pin-bot'
          git config user.email 'career360-preview-pin-bot@users.noreply.github.com'
          git add career360/frontend/index.html
          git commit -m 'career360: pin application confirmation UI in Cloudflare preview'
          git push origin HEAD:career360-cloudflare-preview-20260906
          echo "PIN_COMMIT=$(git rev-parse HEAD)"
