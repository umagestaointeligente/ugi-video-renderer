name: Cena Certa Oct05 Source Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct05-source-probe.yml
      - scripts/cena_certa_source_probe.py
      - ops/cena-certa-oct05/manifest.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe exact manifest identities and source windows
        run: |
          set -euo pipefail
          python scripts/cena_certa_source_probe.py ops/cena-certa-oct05/manifest.json
