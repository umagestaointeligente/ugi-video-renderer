name: Cena Certa Oct05 Source Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct05-source-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Identify fallback candidates
        run: |
          set -euo pipefail
          for u in             "https://globoplay.globo.com/v/1785271/"             "https://globoplay.globo.com/v/13994402/"; do
            yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s" "$u"
          done
