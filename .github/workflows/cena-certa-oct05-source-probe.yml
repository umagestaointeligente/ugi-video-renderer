name: Cena Certa Oct05 Source Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct05-source-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe Oct05 candidates
        run: |
          set -u
          urls=(
            "https://globoplay.globo.com/v/1412674/"
            "https://globoplay.globo.com/v/2874951/"
            "https://globoplay.globo.com/v/919887/"
            "https://globoplay.globo.com/v/14917711/"
            "https://globoplay.globo.com/v/5694170/"
            "https://globoplay.globo.com/v/10648385/"
            "https://globoplay.globo.com/v/2873003/"
            "https://globoplay.globo.com/v/14018885/"
            "https://globoplay.globo.com/v/2505129/"
            "https://globoplay.globo.com/v/15004552/"
            "https://globoplay.globo.com/v/5694282/"
            "https://globoplay.globo.com/v/13606454/"
          )
          fail=0
          for u in "${urls[@]}"; do
            id="${u%/}"; id="${id##*/}"
            if yt-dlp --no-warnings --simulate -f "bv*+ba/b" "$u" >/tmp/probe-$id.log 2>&1; then
              echo "SOURCE_PROBE_PASS $id"
            else
              echo "SOURCE_PROBE_FAIL $id"
              tail -20 /tmp/probe-$id.log
              fail=1
            fi
          done
          exit $fail
