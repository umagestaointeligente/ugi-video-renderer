name: VSA Sep16 Jessica Replacement

on:
  push:
    branches:
      - ops/vsa-sep16-production
    paths:
      - production/vsa/2026-09-16/TRIGGER_JESSICA.txt

permissions:
  contents: read

jobs:
  build-jessica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/vsa-sep16-production
      - name: Install render dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts Pillow numpy requests
      - name: Patch canonical CTA duration without changing wording or voice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/vsa/render_canonical_v2.py'); s=p.read_text(encoding='utf-8')
          old="cd=min(4.5,max(3.0,dur(cta_audio)+0.15))\n    if dur(cta_audio)>4.5: raise SystemExit('CTA_VOICE_TOO_LONG')"
          new="cd=min(6.0,max(3.0,dur(cta_audio)+0.15))\n    if dur(cta_audio)>6.0: raise SystemExit('CTA_VOICE_TOO_LONG')"
          if old not in s: raise SystemExit('CTA_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Build exact-person replacement
        run: python production/vsa/2026-09-16/build_jessica_replacement.py
      - name: Upload candidate and visual proof
        uses: actions/upload-artifact@v4
        with:
          name: vsa-sep16-jessica
          path: production/vsa/2026-09-16/jessica_output/
          if-no-files-found: error
          retention-days: 7
