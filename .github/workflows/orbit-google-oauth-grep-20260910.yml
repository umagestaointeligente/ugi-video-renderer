name: Orbit Google OAuth Grep
on:
  push:
    paths:
      - '.github/workflows/orbit-google-oauth-grep-20260910.yml'
permissions:
  contents: read
jobs:
  grep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find callback references
        shell: bash
        run: |
          set -euo pipefail
          echo ORBIT_GOOGLE_OAUTH_GREP_V1
          grep -RniE 'redirect_uri|oauth2callback|accounts\.google\.com/o/oauth2|oauth2\.googleapis\.com/token' . --exclude-dir=.git --exclude='orbit-google-oauth-grep-20260910.yml' | head -200 || true
          echo SECRET_VALUES_EXPOSED=false
