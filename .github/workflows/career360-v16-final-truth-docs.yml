name: Career360 V16 Final Truth Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-final-truth-docs.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seal final V16 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_final_truth_docs.py
          git diff --check
      - name: Commit canonical docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md
          git diff --cached --check
          git commit -m 'career360: seal final V16 auth and runtime truth evidence'
          git push origin HEAD:main
          echo 'V16_FINAL_TRUTH_DOCS_PUSH=PASS'
