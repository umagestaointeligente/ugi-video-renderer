name: Cena Certa Sep10 Dispatch Bootstrap

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-sep10-dispatch-bootstrap.yml'

permissions:
  contents: write
  packages: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/umagestaointeligente/cena-certa-runtime@sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cena-certa-factory-v2-certified
      - name: Repair verified caption overflow only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('ops/cena-certa/batches/cena-certa-daily8-20260910-v1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          old='E continuam reunindo multidões pelo mundo inteiro.'
          new='E ainda lotam arenas pelo mundo.'
          hits=0
          for item in data:
              chunks=item.get('caption_chunks') or []
              for i,s in enumerate(chunks):
                  if s==old:
                      chunks[i]=new; hits+=1
          if hits!=1:
              raise SystemExit(f'CAPTION_REPAIR_BINDING_FAIL hits={hits}')
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('CAPTION_REPAIR_PASS',hits)
          PY
      - name: Activate exact validated 8-to-8 dispatch
        shell: bash
        run: |
          set -euo pipefail
          python ops/cena-certa/dispatch_activate.py \
            --batch ops/cena-certa/batches/cena-certa-daily8-20260910-v1.json \
            --select-count 8 \
            --reserve-count 0 \
            --note 'Paulo authorized final video production and scheduling for 10/09; 08/09 and 09/09 are frozen.'
      - name: Persist repaired batch then dispatch through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          branch='feat/cena-certa-factory-v2-certified'
          api='https://api.github.com/repos/'+repo+'/contents/'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CenaCertaFactoryV2'}
          def get_meta(path):
              url=api+urllib.parse.quote(path,safe='/')+'?ref='+urllib.parse.quote(branch,safe='')
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())
          def put_file(path,message):
              meta=get_meta(path)
              raw=pathlib.Path(path).read_bytes()
              payload={'message':message,'content':base64.b64encode(raw).decode(),'sha':meta['sha'],'branch':branch}
              req=urllib.request.Request(api+urllib.parse.quote(path,safe='/'),data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req,timeout=45) as r:
                  out=json.loads(r.read().decode())
              print('CONTENTS_API_WRITE_PASS',path,out['commit']['sha'])
          put_file('ops/cena-certa/batches/cena-certa-daily8-20260910-v1.json','ops(cena-certa): repair Sep 10 caption')
          put_file('ops/cena-certa/dispatch.json','ops(cena-certa): dispatch Sep 10 primary eight')
          PY
