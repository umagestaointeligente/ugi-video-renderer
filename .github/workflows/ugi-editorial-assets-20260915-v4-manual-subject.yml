name: UGI Editorial Assets 2026-09-15 V4 Manual Subject

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ugi_build_editorial_assets_20260915_v4_manual_subject_receipts.py'
      - '.github/workflows/ugi-editorial-assets-20260915-v4-manual-subject.yml'

permissions:
  contents: write

concurrency:
  group: ugi-editorial-assets-20260915-v4-manual-subject
  cancel-in-progress: false

jobs:
  build-qa-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow requests edge-tts
          python -m py_compile scripts/ugi_build_editorial_assets_20260913.py scripts/ugi_build_editorial_assets_20260915_v3_exact_subject.py scripts/ugi_build_editorial_assets_20260915_v4_manual_subject_receipts.py
      - name: Build with manual exact-subject receipts
        id: build
        shell: bash
        run: |
          set +e
          python scripts/ugi_build_editorial_assets_20260915_v4_manual_subject_receipts.py > /tmp/ugi-sep15-v4.log 2>&1
          rc=$?
          cat /tmp/ugi-sep15-v4.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload diagnostics on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ugi-sep15-v4-manual-subject-diagnostics
          path: /tmp/ugi-sep15-v4.log
          retention-days: 1
      - name: Assert exact-subject QA and manual receipts
        run: |
          python - <<'PY'
          import json, pathlib
          q=json.loads(pathlib.Path('public/ugi/editorial/2026-09-15/exact-subject-v3/qa.json').read_text(encoding='utf-8'))
          m=json.loads(pathlib.Path('public/ugi/editorial/2026-09-15/exact-subject-v3/source-manifest.json').read_text(encoding='utf-8'))
          assert q['state']=='PASS' and q['metricoolMutationAuthorized'] is True and q['hardGateFailures']==[]
          assert q['counts']=={'instagram_story':4,'instagram_reel':2,'linkedin_video':1,'tiktok_video':2,'instagram_carousel_slide':6,'youtube_video':1}
          titles={k:v.get('title','') for k,v in m['visualSources'].items()}
          assert titles['stellantis_1']=='File:Stellantis.svg'
          assert titles['santos_1']=='File:Santos limited corporate logo.svg'
          assert titles['total_1']=='File:TotalEnergies wordmark (2021-present).svg'
          assert titles['lego_1']=='File:LEGO Billund.JPG'
          assert titles['lego_2']=='File:Lego House Billund.jpg'
          assert titles['lego_3']=='File:Legoland Indgangen.jpg'
          assert titles['mps_1']=='MONTE DEI PASCHI DI SIENA'
          assert titles['mediobanca_1']=='MEDIOBANCA'
          assert titles['intesa_1']=='INTESA SANPAOLO'
          forbidden=['burnt','burned','protest','demonstration','naval museum','pride','parade','kopaj']
          for key,val in titles.items():
              tl=val.lower()
              assert not any(x in tl for x in forbidden), (key,val)
          print('UGI_SEP15_V4_MANUAL_SUBJECT_QA_PASS')
          PY
      - name: Commit corrected finals
        run: |
          git config user.name 'ugi-editorial-bot'
          git config user.email 'ugi-editorial-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-15/exact-subject-v3
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'assets(ugi): Sep15 manual exact-subject receipts v4 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
