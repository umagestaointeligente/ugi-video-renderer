name: UGI Mixkit Music Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-mixkit-music-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover direct licensed music URLs
        shell: python
        run: |
          import html, json, re, urllib.request
          from pathlib import Path
          url='https://mixkit.co/free-stock-music/corporate-music/'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','ignore')
          decoded=html.unescape(raw).replace('\\/','/')
          urls=sorted(set(re.findall(r'https?://[^"\'<> ]+?\.mp3(?:\?[^"\'<> ]*)?', decoded)))
          previews=sorted(set(re.findall(r'https?://assets\.mixkit\.co/[^"\'<> ]+', decoded)))
          out={'source':url,'mp3_urls':urls,'asset_urls':previews[:300],'html_bytes':len(raw)}
          Path('control-plane/music-discovery').mkdir(parents=True, exist_ok=True)
          Path('control-plane/music-discovery/mixkit-latest.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-music-discovery-bot'
          git config user.email 'ugi-music@users.noreply.github.com'
          git add control-plane/music-discovery/mixkit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist Mixkit music discovery'
          git pull --rebase origin main
          git push origin HEAD:main
