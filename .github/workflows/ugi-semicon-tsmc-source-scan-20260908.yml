name: UGI SEMICON TSMC Source Scan 2026-09-08

on:
  push:
    paths:
      - 'scripts/ugi_semicon_tsmc_source_scan_20260908.py'
      - '.github/workflows/ugi-semicon-tsmc-source-scan-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Build contact sheets from official TSMC videos
        run: python scripts/ugi_semicon_tsmc_source_scan_20260908.py
      - name: Commit QA sheets
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'umagestaointeligente@gmail.com'
          git add public/ugi/editorial/2026-09-08/semicon-tsmc-scan
          git diff --cached --quiet && exit 0
          git commit -m 'qa: add TSMC official source contact sheets'
          git push
