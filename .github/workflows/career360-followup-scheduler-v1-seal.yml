name: Career360 Followup Scheduler V1 Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-followup-scheduler-v1-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seal followup scheduler V1
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/followup_scheduler_v1_seal.py
          git diff --check
      - name: Commit canonical recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          git diff --cached --check
          git commit -m 'career360: seal followup scheduler v1 live'
          git push origin HEAD:main
          echo 'FOLLOWUP_SCHEDULER_V1_RECOVERY_PUSH=PASS'
