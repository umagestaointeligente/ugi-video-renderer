name: LSI PackValue PRO Anchor Diagnostic R1
run-name: LSI PackValue PRO Anchor Diagnostic R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-asaas-greenfield-r1-20260830]
    paths: ['.github/workflows/lsi-packvalue-pro-anchor-diagnostic-r1.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"; test -n "$CF_ACCOUNT_ID"
          echo "CF_API_TOKEN=$CF_API_TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CF_API_TOKEN"
      - name: Extract safe version declaration diagnostics
        shell: bash
        env:
          OLD: lola-v8-r44-5-23-store-multi-product-premium-v6-2026-08-25
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN}" "$base" > /tmp/b
          python - <<'PY'
          import os,re
          from email import policy
          from email.parser import BytesParser
          h=open('/tmp/h','rb').read().decode('latin1'); b=open('/tmp/b','rb').read()
          ct=re.search(r'(?im)^content-type:\s*([^\r\n]+)',h).group(1).strip()
          if 'multipart/' in ct:
            msg=BytesParser(policy=policy.default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b)
            parts=[p.get_payload(decode=True) or b'' for p in msg.iter_parts()]
            payload=[p for p in parts if b'createProviderCheckout' in p][0]
          else: payload=b
          s=payload.decode('utf-8'); old=os.environ['OLD']
          lines=s.splitlines()
          hits=[(i+1,line.strip()) for i,line in enumerate(lines) if old in line]
          print('OLD_STRING_LINE_COUNT='+str(len(hits)))
          for no,line in hits[:10]:
            safe=line[:500]
            print(f'VERSION_CONTEXT line={no}: {safe}')
          patterns={
            'const_VERSION_double': rf'const\s+VERSION\s*=\s*"{re.escape(old)}"',
            'const_VERSION_single': rf"const\s+VERSION\s*=\s*'{re.escape(old)}'",
            'any_assignment': rf'(?:const|let|var)\s+[A-Za-z0-9_$]*VERSION[A-Za-z0-9_$]*\s*=\s*[\"\']{re.escape(old)}[\"\']'
          }
          for name,pat in patterns.items(): print(name+'='+str(len(re.findall(pat,s))))
          PY
