name: UGI R45.7 Editorial Route Final Inspect 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r457-editorial-route-final-inspect-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect canonical media upload and editorial publish contracts only
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          for n in ['/api/r45-2/media-upload','/api/video-upload','/api/editorial-media-publish']:
              print('\n===',n,'===')
              i=s.find(n)
              if i<0:
                  print('NOT_FOUND')
              else:
                  print(s[max(0,i-1800):min(len(s),i+14000)])
          for fn in ['r45StaticAsset','r45VerifyPublicImage','createBufferEditorialMediaPost','isGithubVideoUploadAuthorized']:
              print('\n=== function',fn,'===')
              i=s.find('function '+fn+'(')
              if i<0: i=s.find('const '+fn)
              if i<0: i=s.find(fn+' =')
              if i<0:
                  print('NOT_FOUND')
              else:
                  print(s[max(0,i-500):min(len(s),i+10000)])
          PY
