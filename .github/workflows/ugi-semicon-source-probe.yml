name: UGI SEMICON Taiwan Source Probe

on:
  push:
    paths:
      - 'scripts/ugi_semicon_source_probe.py'
      - '.github/workflows/ugi-semicon-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp
      - name: Probe source
        run: python scripts/ugi_semicon_source_probe.py
      - name: Persist QA probe
        run: |
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'ugi-editorial-video-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08/semicon_probe
          git commit -m 'qa: add SEMICON Taiwan source probe' || exit 0
          git push
