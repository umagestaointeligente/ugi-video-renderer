name: UGI Premium V6 Store Publish
run-name: UGI Premium V6 Store Publish ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/store-publish-trigger/*.json'
      - '.github/workflows/ugi-premium-v6-store-publish.yml'
      - 'scripts/ugi_premium_v6_publish.py'
      - 'scripts/r44_5_23_store_multi_product.py'

permissions:
  contents: write

concurrency:
  group: ugi-premium-v6-store-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UGI_BASE_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_BASE_URL:-}"
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet reportlab requests
      - name: Generate and publish approved Premium V6 PDFs
        run: python -m scripts.ugi_premium_v6_publish
      - name: Deploy multi-product Store V3
        run: python -m scripts.r44_5_23_store_multi_product
      - name: Final public readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          base='https://lola-operacional-ugi.umagestaointeligente.workers.dev'
          out={'store':{},'products':{}}
          r=requests.get(base+'/materiais',timeout=20); out['store']={'http':r.status_code,'gov':'Governança' in r.text,'decision':'Decisão' in r.text,'premium':'Premium V6' in r.text or 'PREMIUM V6' in r.text}
          if r.status_code!=200 or not all(out['store'][k] for k in ['gov','decision','premium']): raise SystemExit('STORE_READBACK_FAILED')
          for slug in ['governanca-ia','decisao-humana-ia']:
            p=requests.get(base+'/'+slug,timeout=20)
            c=requests.get(base+'/comprar/'+slug+'?source=final_readback',timeout=30,allow_redirects=False)
            loc=c.headers.get('location','')
            out['products'][slug]={'pageHttp':p.status_code,'buyPresent':'Comprar agora' in p.text,'checkoutHttp':c.status_code,'checkoutAsaas':'asaas.com/checkoutSession/show' in loc}
            if p.status_code!=200 or 'Comprar agora' not in p.text or c.status_code not in (301,302,303,307,308) or 'asaas.com/checkoutSession/show' not in loc: raise SystemExit('PRODUCT_READBACK_FAILED '+slug)
          open('control-plane/commerce-receipts/ugi-premium-v6-store-readback.json','w').write(json.dumps({'ok':True,'paymentTriggered':False,**out},ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Preserve review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ugi-premium-v6-approved-store-pdfs
          path: generated/commerce/premium-v6/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Persist receipts and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-control-plane-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/commerce-receipts/*.json cloudflare/status/r44-5-23-store-multi-product.txt generated/commerce/premium-v6/*.pdf 2>/dev/null || true
          git commit -m 'chore: persist UGI Premium V6 store publication evidence' || true
          git pull --rebase origin main
          git push origin HEAD:main
