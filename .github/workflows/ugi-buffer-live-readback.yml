name: UGI Buffer Live Readback
run-name: UGI Buffer Live Readback ${{ github.run_id }}

on:
  workflow_dispatch: {}
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-buffer-live-readback.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  readback:
    if: >-
      (github.event_name != 'issues' || startsWith(github.event.issue.title, '[UGI-AUTONOMY]')) &&
      (github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, '[UGI-AUTONOMY]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane/receipts/ugi-buffer control-plane/receipts/ugi-today
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          curl --fail --silent --show-error -A 'UGI-GitHub-Actions/1.0' -H "x-lola-command-key: $UGI_LOLA_COMMAND_KEY" "$WORKER_URL/api/health" -o /tmp/health.json
          curl --fail --silent --show-error -A 'UGI-GitHub-Actions/1.0' -H "x-lola-command-key: $UGI_LOLA_COMMAND_KEY" "$WORKER_URL/api/buffer/channels" -o /tmp/channels.json
      - name: Ensure today independent drafts exist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,os,datetime,pathlib,urllib.parse
          base=os.environ['WORKER_URL']; key=os.environ['UGI_LOLA_COMMAND_KEY']
          briefs=[
            ('instagram','UGI-20260823-IG-001',{'contentId':'UGI-20260823-IG-001','type':'reel','topic':'Checklist de 5 minutos para começar segunda-feira sem apagar incêndio','objective':'saves shares retention','keyMessage':'Antes de começar a segunda, elimine ruído: escolha três resultados, remova uma falsa urgência e delegue uma tarefa.','cta':'Salve para usar amanhã cedo.','commercialIntent':'none','instructions':'Conteúdo independente para Instagram. Reel profissional, direto, sem introdução lenta, foco em saves e shares. Não reutilizar criativo recente. Não citar link no perfil nem produto.'}),
            ('tiktok','UGI-20260823-TT-001',{'contentId':'UGI-20260823-TT-001','type':'reel','topic':'3 sinais de que sua segunda-feira vai começar apagando incêndio','objective':'choose to view retention completion shares','keyMessage':'Agenda lotada, nenhuma prioridade explícita e tudo marcado como urgente são sinais de segunda reativa.','cta':'Comenta qual dos três mais acontece na sua rotina.','commercialIntent':'none','requestedVideoDuration':10,'instructions':'Conteúdo independente para TikTok. 7 a 12 segundos, hook no frame zero, cortes rápidos, sem introdução lenta. Não reutilizar criativo recente. Não usar link no perfil.'}),
            ('youtube','UGI-20260823-YT-001',{'contentId':'UGI-20260823-YT-001','type':'reel','topic':'Use IA em 2 minutos para transformar pendências em 3 prioridades de segunda','objective':'choose to view average percentage viewed satisfaction','keyMessage':'Liste as pendências, peça à IA para separar impacto, urgência real e delegação, e saia com três prioridades explícitas.','cta':'Teste antes de abrir sua agenda amanhã.','commercialIntent':'none','instructions':'Conteúdo independente para YouTube Short. Hook imediato, explicação prática e fechamento curto. Não reutilizar criativo recente. Não citar produto ou oferta.'})]
          H=['-A','UGI-GitHub-Actions/1.0','-H',f'x-lola-command-key: {key}','-H','accept: application/json']
          out=[]
          for platform,cid,payload in briefs:
            url=base+'/api/draft-lookup?content_id='+urllib.parse.quote(cid)
            p=subprocess.run(['curl','--silent','--show-error',*H,url],text=True,capture_output=True)
            try: look=json.loads(p.stdout)
            except: look={}
            draft=look.get('draft') if look.get('ok') else None
            if not draft:
              body=json.dumps(payload,ensure_ascii=False)
              q=subprocess.run(['curl','--silent','--show-error','--location','--max-time','180',*H,'-H','content-type: application/json','--data-binary',body,base+'/api/command'],text=True,capture_output=True)
              try: resp=json.loads(q.stdout)
              except: resp={'raw':q.stdout[:1500]}
              draft=(resp.get('proposal') or {})
            out.append({'platform':platform,'contentId':cid,'draftId':draft.get('id'),'renderStatus':draft.get('renderStatus'),'allPlatformsReady':draft.get('allPlatformsReady',False),'qualityStatus':draft.get('qualityStatus')})
          pathlib.Path('control-plane/receipts/ugi-today/drafts.json').write_text(json.dumps({'results':out},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Dispatch zero-cost GitHub renders where needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,os,pathlib
          base=os.environ['WORKER_URL']; key=os.environ['UGI_LOLA_COMMAND_KEY']
          rows=json.load(open('control-plane/receipts/ugi-today/drafts.json'))['results']
          results=[]
          for r in rows:
            if not r.get('draftId'):
              results.append({**r,'ok':False,'error':'draft_missing'}); continue
            if r.get('allPlatformsReady'):
              results.append({**r,'ok':True,'skipped':'already_ready'}); continue
            payload={'draftId':r['draftId'],'content_id':r['contentId']}
            p=subprocess.run(['curl','--silent','--show-error','--location','--max-time','60','-A','UGI-GitHub-Actions/1.0','-H','content-type: application/json','-H','accept: application/json','-H',f'x-lola-command-key: {key}','--data-binary',json.dumps(payload),base+'/api/video-render'],text=True,capture_output=True)
            try: resp=json.loads(p.stdout)
            except: resp={'raw':p.stdout[:2000],'stderr':p.stderr[:1000]}
            results.append({**r,'renderResponse':resp,'ok':bool(resp.get('ok'))})
          pathlib.Path('control-plane/receipts/ugi-today/render-dispatch.json').write_text(json.dumps({'results':results},ensure_ascii=False,indent=2)+'\n')
          if not all(x.get('ok') for x in results): raise SystemExit(2)
          PY
      - name: Upload recovery evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ugi-autonomy-recovery-${{ github.run_id }}
          path: |
            control-plane/receipts/ugi-today/drafts.json
            control-plane/receipts/ugi-today/render-dispatch.json
          retention-days: 3
          if-no-files-found: warn
