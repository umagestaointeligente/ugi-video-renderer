name: UGI Buffer Live Readback
run-name: UGI Buffer Live Readback ${{ github.run_id }}

# MUTATING WORKFLOW: explicit dispatch only.
# Maintenance PRs, code pushes and watchdogs must never schedule social posts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for render readiness, approve, schedule via Buffer, and read back
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          mkdir -p control-plane/receipts/ugi-today
          python - <<'PY'
          import json, os, subprocess, time, datetime, pathlib, urllib.parse
          base=os.environ['WORKER_URL']; key=os.environ['UGI_LOLA_COMMAND_KEY']
          H=['-A','UGI-GitHub-Actions/1.0','-H',f'x-lola-command-key: {key}','-H','accept: application/json']
          wanted=[
            ('instagram','UGI-20260823-IG-001','2026-08-24T00:45:00.000Z'),
            ('tiktok','UGI-20260823-TT-001','2026-08-24T01:15:00.000Z'),
            ('youtube','UGI-20260823-YT-001','2026-08-24T01:45:00.000Z')]
          def get_json(url):
            p=subprocess.run(['curl','--silent','--show-error',*H,url],text=True,capture_output=True)
            try:return json.loads(p.stdout)
            except:return {'ok':False,'raw':p.stdout[:1500],'stderr':p.stderr[:1000]}
          def post_json(path,payload):
            p=subprocess.run(['curl','--silent','--show-error','--location','--max-time','90',*H,'-H','content-type: application/json','--data-binary',json.dumps(payload,ensure_ascii=False),base+path],text=True,capture_output=True)
            try:return json.loads(p.stdout)
            except:return {'ok':False,'raw':p.stdout[:2000],'stderr':p.stderr[:1000]}
          channels=get_json(base+'/api/buffer/channels')
          if not channels.get('ok'): raise SystemExit('BUFFER_CHANNELS_NOT_READY')
          resolved={}
          deadline=time.time()+720
          while time.time()<deadline:
            d=get_json(base+'/api/drafts')
            items=d.get('drafts') or []
            resolved={}
            for platform,cid,due in wanted:
              matches=[x for x in items if str(x.get('contentId') or x.get('content_id') or '')==cid]
              matches.sort(key=lambda x:str(x.get('updatedAt') or x.get('createdAt') or ''),reverse=True)
              if matches: resolved[cid]=matches[0]
            ready=True
            for platform,cid,due in wanted:
              dr=resolved.get(cid) or {}
              asset=(dr.get('assets') or {}).get(platform) or {}
              if not (dr.get('allPlatformsReady') is True and asset.get('ready') is True and asset.get('videoUrl')):
                ready=False
            if ready: break
            time.sleep(20)
          if not ready:
            pathlib.Path('control-plane/receipts/ugi-today/final-schedule.json').write_text(json.dumps({'ok':False,'error':'RENDER_NOT_READY_BEFORE_DEADLINE','resolved':{k:{'id':v.get('id'),'allPlatformsReady':v.get('allPlatformsReady'),'qualityStatus':v.get('qualityStatus')} for k,v in resolved.items()}},ensure_ascii=False,indent=2)+'\n')
            raise SystemExit(2)
          now=datetime.datetime.now(datetime.timezone.utc)
          first=datetime.datetime.fromisoformat(wanted[0][2].replace('Z','+00:00'))
          if first <= now + datetime.timedelta(minutes=8):
            minute=((now.minute//15)+1)*15
            basehour=now.replace(second=0,microsecond=0)
            if minute>=60: first=basehour.replace(minute=0)+datetime.timedelta(hours=1,minutes=15)
            else: first=basehour.replace(minute=minute)+datetime.timedelta(minutes=15)
            due_map={'instagram':first,'tiktok':first+datetime.timedelta(minutes=30),'youtube':first+datetime.timedelta(minutes=60)}
          else:
            due_map={p:datetime.datetime.fromisoformat(d.replace('Z','+00:00')) for p,c,d in wanted}
          results=[]
          for platform,cid,_ in wanted:
            dr=resolved[cid]; did=dr['id']
            asset=(dr.get('assets') or {}).get(platform) or {}
            existing=(asset.get('publication') or {})
            if existing.get('bufferPostId') and str(existing.get('status','')).lower() not in {'error','cancelled'}:
              pub={'ok':True,'already_active':True,'publication':existing}
            else:
              approval=post_json('/api/platform-approval',{'id':did,'platform':platform,'decision':'approved'})
              if not approval.get('ok'):
                results.append({'platform':platform,'contentId':cid,'draftId':did,'approval':approval,'ok':False}); continue
              eligibility=get_json(base+'/api/platform-publication-eligibility/'+urllib.parse.quote(did))
              state=((eligibility.get('platformStates') or {}).get(platform) or {})
              if not state.get('eligible'):
                results.append({'platform':platform,'contentId':cid,'draftId':did,'approval':approval,'eligibility':state,'ok':False}); continue
              due=due_map[platform].isoformat(timespec='seconds').replace('+00:00','Z')
              pub=post_json('/api/platform-publish',{'id':did,'platform':platform,'mode':'customScheduled','dueAt':due})
            if not pub.get('ok'):
              results.append({'platform':platform,'contentId':cid,'draftId':did,'publish':pub,'ok':False}); continue
            status=get_json(base+'/api/platform-publication-status?id='+urllib.parse.quote(did)+'&platform='+platform)
            publication=(status.get('publication') or pub.get('publication') or {})
            results.append({'platform':platform,'contentId':cid,'draftId':did,'dueAt':publication.get('dueAt'),'bufferPostId':publication.get('bufferPostId'),'bufferStatus':publication.get('bufferStatus') or publication.get('status'),'externalLink':publication.get('externalLink'),'readback':status,'ok':bool(publication.get('bufferPostId'))})
          out={'ok':all(x.get('ok') for x in results),'publication_provider':'BUFFER','analytics_provider':'METRICOOL','metricool_publication_allowed':False,'publication_triggered':True,'payment_triggered':False,'results':results,'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('control-plane/receipts/ugi-today/final-schedule.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          if not out['ok']: raise SystemExit(2)
          PY
      - name: Upload final scheduling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugi-today-final-schedule-${{ github.run_id }}
          path: control-plane/receipts/ugi-today/final-schedule.json
          retention-days: 7
          if-no-files-found: error
