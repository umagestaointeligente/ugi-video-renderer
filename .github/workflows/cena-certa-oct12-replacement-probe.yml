name: Cena Certa Oct12 Replacement Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct12-replacement-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe replacements
        run: |
          set -u
          failed=0
          for u in \
            "https://globoplay.globo.com/v/5584476/" \
            "https://globoplay.globo.com/v/5592388/" \
            "https://globoplay.globo.com/v/5592396/"; do
            echo "PROBE $u"
            if yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s" "$u"; then
              echo "SOURCE_PROBE_PASS $u"
            else
              echo "SOURCE_PROBE_FAIL $u"; failed=$((failed+1))
            fi
          done
          echo "SOURCE_PROBE_FAILED_COUNT=$failed"
          test "$failed" -eq 0
