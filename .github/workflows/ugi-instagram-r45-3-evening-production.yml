name: UGI Instagram R45.3 Evening Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-instagram-r45-3-evening-production.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ugi-instagram-r45-3-evening-production-20260830
  cancel-in-progress: false

jobs:
  deploy-build-schedule-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Verify credentials
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$CF_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
      - name: Deploy R45.3 scheduled media adapter
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/r45_3_instagram_schedule_deploy.py
      - name: Build, QA, clean old slots and schedule today's Instagram agenda
        run: |
          set -euo pipefail
          python scripts/ugi_instagram_evening_production_20260830.py
      - name: Persist scheduling evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-r45-3-production-bot'
          git config user.email 'ugi-r45-3-production@users.noreply.github.com'
          git add cloudflare/status/r45-3-instagram-scheduled-media.txt control-plane/instagram-r45-3/receipts/ugi-20260830-evening-growth.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No evidence changes.'
            exit 0
          fi
          git commit -m 'chore: persist UGI Instagram R45.3 evening schedule evidence'
          git pull --rebase origin main
          git push origin HEAD:main
