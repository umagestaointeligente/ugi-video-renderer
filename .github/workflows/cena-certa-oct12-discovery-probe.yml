name: Cena Certa Oct12 Discovery Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct12-discovery-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --upgrade yt-dlp
      - name: Probe candidate sources
        run: |
          set -u
          failed=0
          urls=(
            "https://globoplay.globo.com/v/2678004/"
            "https://globoplay.globo.com/v/9178997/"
            "https://globoplay.globo.com/v/5584476/"
            "https://globoplay.globo.com/v/5584497/"
            "https://globoplay.globo.com/v/5592391/"
            "https://globoplay.globo.com/v/5592395/"
            "https://globoplay.globo.com/v/5592396/"
            "https://globoplay.globo.com/v/1338055/"
            "https://globoplay.globo.com/v/1338057/"
            "https://globoplay.globo.com/v/1338058/"
            "https://globoplay.globo.com/v/1338059/"
            "https://globoplay.globo.com/v/1338061/"
            "https://globoplay.globo.com/v/1338062/"
            "https://globoplay.globo.com/v/1338064/"
            "https://globoplay.globo.com/v/6713552/"
            "https://globoplay.globo.com/v/8476310/"
            "https://globoplay.globo.com/v/9447937/"
            "https://www.youtube.com/watch?v=eRsGyueVLvQ"
            "https://www.youtube.com/watch?v=R6MlUcmOul8"
            "https://www.youtube.com/watch?v=WhWc3b3KhnY"
            "https://www.youtube.com/watch?v=mN0zPOpADL4"
          )
          for u in "${urls[@]}"; do
            echo "PROBE $u"
            if yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s | %(uploader)s | %(license)s" "$u"; then
              echo "SOURCE_PROBE_PASS $u"
            else
              echo "SOURCE_PROBE_FAIL $u"
              failed=$((failed+1))
            fi
          done
          echo "SOURCE_PROBE_FAILED_COUNT=$failed"
