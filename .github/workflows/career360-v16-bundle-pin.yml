name: Career360 V16 Recovery Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-bundle-pin.yml'

permissions:
  contents: write

concurrency:
  group: career360-v16-recovery-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canonical Recovery idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/LSI_RECOVERY_CURRENT.md')
          s=p.read_text()

          old='`CURRENT_STATUS=V14_PRODUCTION_STABLE_V15_BROWSER_VALIDATED_DEPLOY_PIPELINE_HARDENED_WAITING_VERCEL_AUTH`'
          new='`CURRENT_STATUS=V14_PRODUCTION_STABLE_V15_V16_BROWSER_VALIDATED_BUNDLE_PINNED_WAITING_VERCEL_AUTH`'
          if old in s:
              s=s.replace(old,new,1)

          gate='`CLARITY_UI_V16=BROWSER_VALIDATED_BUNDLE_PINNED_NOT_YET_PROMOTED`'
          if gate not in s:
              anchor='`UI_RESPONSIVE_V15=BROWSER_VALIDATED_NOT_YET_PROMOTED`'
              if anchor not in s: raise SystemExit('V15 UI gate anchor not found')
              s=s.replace(anchor,anchor+'\n'+gate,1)

          section='''## 9A. V16 — Clarity UI / menos texto / decisão primeiro\n\nEstado:\n`CLARITY_UI_V16=BROWSER_VALIDATED_BUNDLE_PINNED_NOT_YET_PROMOTED`\n\nCamada incremental:\n`career360/frontend/app-m.js`\n\nPin imutável:\n`f597e48006aae69c73c6c0a540b797f0093e4e84`\n\nBundle canônico com `app-k -> app-l -> app-m`:\n`08f100d3c3bf10320e429a47529816b0b674b6f3`\n\nRelease canônica:\n`career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md`\n\nObjetivo da V16:\n- reduzir texto repetitivo na superfície;\n- melhorar hierarquia, respiro, bordas, sombras e densidade;\n- transformar Meu Agente em superfície de decisão;\n- manter métricas e pendências visíveis;\n- esconder detalhe operacional que não precisa competir com a decisão;\n- oferecer ações rápidas de consulta sem criar novas mutações.\n\nValidação final sobre bundle canônico:\n- run `34007073507`;\n- job `101416159331`;\n- `V16_CANONICAL_BUNDLE_PIN_GATE=PASS`;\n- `CLARITY_360=PASS mutations=5`;\n- `CLARITY_412=PASS mutations=5`;\n- `CLARITY_768=PASS mutations=5`;\n- `CLARITY_1180=PASS mutations=5`;\n- `V16_AGENT_QUICK_ACTIONS=PASS`;\n- `V16_DYNAMIC_PROACTIVE_RECOMPACT=PASS`.\n\nIMPORTANTE:\nBrowser PASS + bundle pinado NÃO significa produção LIVE.\nA V16 só vira LIVE após promoção comprovada no domínio oficial e gate móvel autenticado.\n\n'''
          if '## 9A. V16 — Clarity UI / menos texto / decisão primeiro' not in s:
              anchor='## 10. Radar / Matching'
              if anchor not in s: raise SystemExit('Radar section anchor not found')
              s=s.replace(anchor,section+anchor,1)

          s=s.replace('- Remote Desktop Commander = nenhum dispositivo online;','- Remote Desktop Commander = `PROIBIDO` por decisão do usuário; não sugerir esta rota novamente;')
          p.write_text(s)
          print('RECOVERY_V16_SEAL=PASS')
          PY

      - name: Commit Recovery and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/career360-v16-bundle-pin.yml
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md .github/workflows/career360-v16-bundle-pin.yml
          git diff --cached --check
          git commit -m 'career360: seal V16 clarity state in Recovery'
          git push origin HEAD:main
          echo 'V16_RECOVERY_SEAL_PUSH=PASS'
