name: Cena Certa Sep26 Humor Transcript
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep26-humor-transcript.yml
      - scripts/transcribe_humor_candidates.py
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          python -m pip install -q --upgrade yt-dlp faster-whisper
      - name: Download official sources
        run: |
          set -euo pipefail
          mkdir -p out/src
          yt-dlp --no-warnings -f "bv*+ba/b" --merge-output-format mp4 -o "out/src/mister.%(ext)s" "https://globoplay.globo.com/v/4707587/"
          yt-dlp --no-warnings -f "bv*+ba/b" --merge-output-format mp4 -o "out/src/deus.%(ext)s" "https://globoplay.globo.com/v/6600863/"
          ls -lh out/src
      - name: Transcribe PT-BR with timestamps
        run: |
          set -euo pipefail
          python scripts/transcribe_humor_candidates.py
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_HUMOR_TRANSCRIPT"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo
            echo "## Mister Brau - Falha Nossa"
            cat out/mister-transcript.txt
            echo
            echo "## Deus Salve o Rei - Falha Nossa"
            cat out/deus-transcript.txt
          } > out/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-HUMOR-TRANSCRIPT] $GITHUB_RUN_ID" --body-file out/issue.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-humor-transcript-${{ github.run_id }}
          path: out/
          retention-days: 7
