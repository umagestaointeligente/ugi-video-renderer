              out.append(item)
          p=pathlib.Path('ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('SEP11_BATCH_BUILD_PASS',len(out),ready)
