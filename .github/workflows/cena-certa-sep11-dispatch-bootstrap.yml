      - name: Activate exact validated 8-to-8 dispatch
        shell: bash
        run: |
          set -euo pipefail
          python ops/cena-certa/dispatch_activate.py \
            --batch ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json \
            --select-count 8 \
            --reserve-count 0 \
            --note 'Paulo authorized final video production, editorial continuation and scheduling for 11/09 after live source and 60-day dedup gates.'
      - name: Persist batch and dispatch through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='feat/cena-certa-factory-v2-certified'
          api='https://api.github.com/repos/'+repo+'/contents/'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CenaCertaFactoryV2'}
          def meta(path):
              url=api+urllib.parse.quote(path,safe='/')+'?ref='+urllib.parse.quote(branch,safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code==404: return None
                  raise
          def put(path,message):
              raw=pathlib.Path(path).read_bytes(); m=meta(path)
              payload={'message':message,'content':base64.b64encode(raw).decode(),'branch':branch}
              if m: payload['sha']=m['sha']
              req=urllib.request.Request(api+urllib.parse.quote(path,safe='/'),data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req,timeout=45) as r: result=json.loads(r.read().decode())
              print('CONTENTS_API_WRITE_PASS',path,result['commit']['sha'])
          put('ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json','ops(cena-certa): persist Sep 11 canonical batch')
          put('ops/cena-certa/dispatch.json','ops(cena-certa): dispatch Sep 11 primary eight')
          PY
