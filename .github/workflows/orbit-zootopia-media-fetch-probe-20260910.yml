name: Orbit Zootopia Media Fetch Probe

on:
  push:
    paths:
      - '.github/workflows/orbit-zootopia-media-fetch-probe-20260910.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect media without publishing
        shell: bash
        env:
          URL: https://static.metricool.com/planner/202609/6809869-file-16383714918174588957.mp4
        run: |
          set -euo pipefail
          echo 'ORBIT_MEDIA_FETCH_PROBE_V1'
          code="$(curl -L --silent --show-error --output /tmp/media.mp4 --write-out '%{http_code}' "$URL")"
          echo "HTTP_STATUS=$code"
          test "$code" = '200'
          bytes="$(wc -c </tmp/media.mp4 | tr -d ' ')"
          echo "BYTES=$bytes"
          test "$bytes" -gt 100000
          mime="$(file -b --mime-type /tmp/media.mp4)"
          echo "MIME=$mime"
          sha256sum /tmp/media.mp4 | awk '{print "SHA256="$1}'
          ffprobe -v error -show_entries format=duration,format_name -of default=nw=1 /tmp/media.mp4
          echo 'MUTATION_PERFORMED=false'
