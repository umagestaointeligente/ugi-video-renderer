name: Cena Certa Sep28 Pack
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep28-pack.yml
      - scripts/cena_certa_sep28_pack.py
      - ops/cena-certa-sep28/manifest.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp edge-tts
      - name: Render and QA 12 masters
        run: |
          set -euo pipefail
          python scripts/cena_certa_sep28_pack.py
      - name: Publish approved masters as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cena-certa-sep28
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Sep28" --notes "12 QA-approved multiplatform masters."
          gh release upload "$TAG" out/cena-certa-sep28/*.mp4 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_SEP28_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo
            cat out/cena-certa-sep28/summary.json
          } > out/cena-certa-sep28/issue.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-SEP28-PACK] $GITHUB_RUN_ID" --body-file out/cena-certa-sep28/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-sep28-${{ github.run_id }}
          path: out/cena-certa-sep28/
          retention-days: 7
