name: UGI R44.5.17 Source Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and inspect Cloudflare multipart
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -D /tmp/cf.headers \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi/content/v2" \
            -o /tmp/cf.body

          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          from pathlib import Path
          import re, hashlib

          headers = Path('/tmp/cf.headers').read_text(errors='ignore')
          body = Path('/tmp/cf.body').read_bytes()
          m = re.search(r'(?im)^content-type:\s*([^\r\n]+)', headers)
          ctype = m.group(1).strip() if m else ''
          bm = re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))', ctype, re.I)
          print('R44.5.17_DEPLOY_STAGE=MULTIPART_DIAGNOSTIC')
          print('CONTENT_TYPE=' + ctype)
          print('BODY_SIZE=' + str(len(body)))
          if not bm:
              print('BOUNDARY_FOUND=false')
              print('BODY_HAS_R44_5_16=' + str(b'lola-v8-r44-5-16-commerce-publication-gate-fix-2026-08-21' in body).lower())
              raise SystemExit(0)

          boundary = (bm.group(1) or bm.group(2)).encode()
          print('BOUNDARY_FOUND=true')
          parts=[]
          for idx, part in enumerate(body.split(b'--' + boundary)):
              if not part.strip() or part.strip() == b'--':
                  continue
              sep = b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
              if not sep:
                  print(f'PART_{idx}_NO_SEPARATOR=true')
                  continue
              head,payload=part.split(sep,1)
              payload=payload.rstrip(b'\r\n-')
              h=head.decode('utf-8',errors='ignore').replace('\r',' ').replace('\n',' ')[:300]
              has16=b'lola-v8-r44-5-16-commerce-publication-gate-fix-2026-08-21' in payload
              hasconst=b'const VERSION' in payload
              print(f'PART_{idx}_SIZE={len(payload)}')
              print(f'PART_{idx}_HEADER={h}')
              print(f'PART_{idx}_HAS_R44_5_16={str(has16).lower()}')
              print(f'PART_{idx}_HAS_CONST_VERSION={str(hasconst).lower()}')
              print(f'PART_{idx}_SHA256={hashlib.sha256(payload).hexdigest()}')
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — multipart diagnostic result'
          git push origin HEAD:main
