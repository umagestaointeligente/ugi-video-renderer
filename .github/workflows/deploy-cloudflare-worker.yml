name: UGI R44.5.17 Binding-Safe Final Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy verified 19-binding R44.5.17 version
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi"
          VID='35dc7be4-2d9e-479d-8f27-39e726e0b58f'
          cat > /tmp/deploy.json <<EOF
          {"strategy":"percentage","versions":[{"version_id":"$VID","percentage":100}],"annotations":{"workers/message":"UGI R44.5.17 binding-safe final deploy"}}
          EOF
          HTTP="$(curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/deploy.json -o /tmp/deploy-response.json -w '%{http_code}' "$BASE/deployments")"

          mkdir -p cloudflare/status
          python - "$HTTP" <<'PY' > cloudflare/status/r44-5-17.txt
          import json,sys
          from pathlib import Path
          http=sys.argv[1]
          r=json.loads(Path('/tmp/deploy-response.json').read_text())
          result=r.get('result') or {}
          print('R44.5.17_DEPLOY_STAGE=DEPLOYMENT_CREATE_RESULT')
          print('HTTP='+http)
          print('SUCCESS='+str(r.get('success')).lower())
          print('DEPLOYMENT_ID='+str(result.get('id')))
          print('ERRORS='+json.dumps(r.get('errors'),ensure_ascii=False))
          print('MESSAGES='+json.dumps(r.get('messages'),ensure_ascii=False))
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — deployment create result'
          git push origin HEAD:main

          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/deploy-response.json').read_text())
          if not r.get('success'):
              raise SystemExit('deployment create failed')
          PY

      - name: Validate live health bindings and permalink
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          PERMALINK='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          PASS=false
          for i in 1 2 3 4 5 6 7 8; do
            curl --silent --show-error "$HEALTH" -o /tmp/health.json || true
            if grep -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' /tmp/health.json \
              && grep -q '"ok":true' /tmp/health.json \
              && grep -q '"MEDIA_R2":true' /tmp/health.json \
              && grep -q '"AI":true' /tmp/health.json \
              && grep -q '"BROWSER":true' /tmp/health.json \
              && grep -q '"IMAGES":true' /tmp/health.json \
              && grep -q '"VIDEO":true' /tmp/health.json \
              && grep -q '"ASAAS_API_KEY":true' /tmp/health.json \
              && grep -q '"ASAAS_WEBHOOK_TOKEN":true' /tmp/health.json; then
              PASS=true
              break
            fi
            sleep 4
          done

          PCODE="$(curl --silent --show-error --output /tmp/priorizacao.html --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$PERMALINK")"
          BUTTON=false
          PRICE=false
          [ "$PCODE" = '200' ] && grep -q 'Comprar agora' /tmp/priorizacao.html && BUTTON=true || true
          [ "$PCODE" = '200' ] && grep -q 'R$ 14,99' /tmp/priorizacao.html && PRICE=true || true

          mkdir -p cloudflare/status
          cat > cloudflare/status/r44-5-17.txt <<EOF
          R44.5.17_DEPLOY_STAGE=FINAL_VALIDATION
          HEALTH_BINDINGS_PASS=$PASS
          PERMALINK_HTTP=$PCODE
          BUY_BUTTON_PASS=$BUTTON
          PRICE_PASS=$PRICE
          LIVE_URL=$PERMALINK
          VERSION_ID=35dc7be4-2d9e-479d-8f27-39e726e0b58f
          EOF

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — final validation result'
          git push origin HEAD:main

          test "$PASS" = true
          test "$PCODE" = '200'
          test "$BUTTON" = true
          test "$PRICE" = true
