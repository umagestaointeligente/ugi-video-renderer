name: UGI Cloudflare Version Recovery Diagnostic REST

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: List Worker versions and deployments via REST
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/versions?per_page=20" -o /tmp/versions.json
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/deployments" -o /tmp/deployments.json

          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          import json
          from pathlib import Path
          vr=json.loads(Path('/tmp/versions.json').read_text())
          dr=json.loads(Path('/tmp/deployments.json').read_text())
          versions=vr.get('result') or []
          deployments=(dr.get('result') or {}).get('deployments') if isinstance(dr.get('result'),dict) else (dr.get('result') or [])
          deployments=deployments or []
          print('R44.5.17_DEPLOY_STAGE=VERSION_RECOVERY_DIAGNOSTIC_REST')
          print('VERSIONS_SUCCESS='+str(vr.get('success')).lower())
          print('VERSIONS_COUNT='+str(len(versions)))
          for i,v in enumerate(versions[:12]):
              meta=v.get('metadata') or {}
              ann=meta.get('annotations') or {}
              print(f'VERSION_{i}_ID={v.get("id")}')
              print(f'VERSION_{i}_NUMBER={v.get("number")}')
              print(f'VERSION_{i}_CREATED={meta.get("created_on")}')
              print(f'VERSION_{i}_SOURCE={meta.get("source")}')
              print(f'VERSION_{i}_MESSAGE={ann.get("workers/message") or ""}')
          print('DEPLOYMENTS_SUCCESS='+str(dr.get('success')).lower())
          print('DEPLOYMENTS_COUNT='+str(len(deployments)))
          for i,d in enumerate(deployments[:12]):
              print(f'DEPLOYMENT_{i}_ID={d.get("id")}')
              print(f'DEPLOYMENT_{i}_CREATED={d.get("created_on")}')
              print(f'DEPLOYMENT_{i}_SOURCE={d.get("source")}')
              vers=d.get('versions') or []
              print(f'DEPLOYMENT_{i}_VERSIONS='+','.join(str(x.get('version_id') or x.get('id')) for x in vers if isinstance(x,dict)))
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI — Cloudflare REST version diagnostic result'
          git push origin HEAD:main
