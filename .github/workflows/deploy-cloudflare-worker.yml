name: UGI R44.5.17 Live Source Marker Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live Cloudflare source markers
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -D /tmp/cf.headers \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi/content/v2" \
            -o /tmp/cf.body

          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          from pathlib import Path
          import re, hashlib
          headers=Path('/tmp/cf.headers').read_text(errors='ignore')
          body=Path('/tmp/cf.body').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ctype=m.group(1).strip() if m else ''
          bm=re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))',ctype,re.I)
          source=body
          selected_header='RAW_BODY'
          if bm:
              boundary=(bm.group(1) or bm.group(2)).encode()
              parts=[]
              for part in body.split(b'--'+boundary):
                  sep=b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
                  if not sep: continue
                  head,payload=part.split(sep,1)
                  payload=payload.rstrip(b'\r\n-')
                  if b'javascript' in head.lower() or b'module' in head.lower():
                      parts.append((head,payload))
              if not parts: raise SystemExit('No JS multipart part found')
              head,source=max(parts,key=lambda p:len(p[1]))
              selected_header=head.decode('utf-8',errors='ignore').replace('\r',' ').replace('\n',' ')[:300]
          probes={
            'HAS_R44_5_16': b'lola-v8-r44-5-16-commerce-publication-gate-fix-2026-08-21' in source,
            'HAS_R44_5_17': b'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' in source,
            'HAS_PERMANENT_ENTRYPOINT': b'permanentCommerceEntrypoint' in source,
            'HAS_PRIORIZACAO_ROUTE': b'/priorizacao' in source,
            'HAS_BUY_ROUTE': b'/comprar/priorizacao' in source,
            'HAS_JIT_ASAAS': b'justInTimeAsaasCheckout' in source,
            'HAS_COMMERCE_GATE_V2': b'commercePublicationGateV2' in source,
            'HAS_CONST_VERSION_LITERAL': b'const VERSION' in source,
            'HAS_VAR_VERSION_LITERAL': b'var VERSION' in source,
          }
          print('R44.5.17_DEPLOY_STAGE=LIVE_MARKER_DIAGNOSTIC')
          print('CONTENT_TYPE='+ctype)
          print('SELECTED_HEADER='+selected_header)
          print('SOURCE_SIZE='+str(len(source)))
          print('SOURCE_SHA256='+hashlib.sha256(source).hexdigest())
          for k,v in probes.items(): print(f'{k}={str(v).lower()}')
          # safe nearby snippets around R44.5.17/permanentCommerceEntrypoint only
          s=source.decode('utf-8',errors='ignore')
          for label,needle in [('R44_5_17','r44-5-17'),('PERMANENT','permanentCommerceEntrypoint'),('PRIORIZACAO','/priorizacao')]:
              i=s.lower().find(needle.lower())
              if i>=0:
                  snippet=s[max(0,i-120):i+300].replace('\n',' ').replace('\r',' ')
                  print(f'{label}_SNIPPET='+snippet[:420])
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — live source marker diagnostic'
          git push origin HEAD:main
