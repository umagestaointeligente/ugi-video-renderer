name: UGI R44.5.17 Permanent Commerce Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          echo "CLOUDFLARE_CREDENTIALS_PRESENT=true"

      - name: Fetch live R44.5.16 Worker
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -D /tmp/cf.headers \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" \
            -o /tmp/cf.body

          python - <<'PY'
          from pathlib import Path
          import re

          headers = Path('/tmp/cf.headers').read_text(errors='ignore')
          body = Path('/tmp/cf.body').read_bytes()
          expected = b'lola-v8-r44-5-16-commerce-publication-gate-fix-2026-08-21'

          m = re.search(r'(?im)^content-type:\s*([^\r\n]+)', headers)
          if not m:
              raise SystemExit('Cloudflare content-type header missing')

          content_type = m.group(1).strip()
          bm = re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))', content_type, re.I)

          if bm:
              boundary = (bm.group(1) or bm.group(2)).encode()
              candidates = []
              for part in body.split(b'--' + boundary):
                  if expected not in part:
                      continue
                  sep = b'\r\n\r\n' if b'\r\n\r\n' in part else b'\n\n'
                  if sep not in part:
                      continue
                  payload = part.split(sep, 1)[1].rstrip(b'\r\n')
                  candidates.append(payload)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one Worker JS part, found {len(candidates)}')
              source = candidates[0]
          else:
              source = body

          if expected not in source:
              raise SystemExit('Live Worker is not the expected R44.5.16 baseline')

          Path('/tmp/current-worker.mjs').write_bytes(source)
          print(f'LIVE_SOURCE_BYTES={len(source)}')
          PY

          grep -q 'lola-v8-r44-5-16-commerce-publication-gate-fix-2026-08-21' /tmp/current-worker.mjs
          node --check /tmp/current-worker.mjs

      - name: Apply deterministic R44.5.17 patch
        shell: bash
        run: |
          set -euo pipefail
          python cloudflare/patch-r44-5-17.py /tmp/current-worker.mjs /tmp/r44-5-17-worker.mjs
          node --check /tmp/r44-5-17-worker.mjs
          grep -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' /tmp/r44-5-17-worker.mjs
          grep -q 'path === "/priorizacao"' /tmp/r44-5-17-worker.mjs
          grep -q 'path === "/comprar/priorizacao"' /tmp/r44-5-17-worker.mjs
          echo "R44_5_17_SOURCE_GATE=PASS"

      - name: Deploy R44.5.17 to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy /tmp/r44-5-17-worker.mjs --name lola-operacional-ugi --compatibility-date 2026-08-20

      - name: Post-deploy health gate
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "$HEALTH" || true)"
            if printf '%s' "$BODY" | grep -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' \
              && printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"permanentCommerceEntrypoint":true' \
              && printf '%s' "$BODY" | grep -q '"justInTimeAsaasCheckout":true'; then
              printf '%s\n' "$BODY"
              echo 'R44_5_17_HEALTH_PASS=true'
              exit 0
            fi
            sleep 5
          done
          echo 'R44_5_17_HEALTH_PASS=false' >&2
          exit 1

      - name: Permanent commerce URL smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          CODE="$(curl --silent --show-error --output /tmp/permalink.html --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$URL")"
          test "$CODE" = '200'
          grep -q 'Comprar agora' /tmp/permalink.html
          grep -q 'R$ 14,99' /tmp/permalink.html
          echo 'PERMANENT_COMMERCE_URL_PASS=true'

      - name: Sync deployed Worker source back to repository
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r44-5-17-worker.mjs cloudflare/lola-operacional-worker.mjs
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/lola-operacional-worker.mjs
          if git diff --cached --quiet; then
            echo 'WORKER_SYNC=NO_CHANGE'
            exit 0
          fi
          git commit -m 'UGI R44.5.17 — sync permanent commerce Worker after successful deploy'
          git push origin HEAD:main
          echo 'WORKER_SYNC=PASS'
