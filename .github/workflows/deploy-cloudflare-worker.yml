name: UGI R44.5.18 Stage 1 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect current production and Cloudflare binding baseline
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          mkdir -p cloudflare/status
          OUT=cloudflare/status/r44-5-18-debug.txt
          : > "$OUT"
          echo 'STAGE=1_DIAGNOSTIC' >> "$OUT"
          echo "CF_ACCOUNT_ID_PRESENT=$([ -n "${CF_ACCOUNT_ID:-}" ] && echo true || echo false)" >> "$OUT"
          echo "CF_API_TOKEN_PRESENT=$([ -n "${CF_API_TOKEN:-}" ] && echo true || echo false)" >> "$OUT"

          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          HCODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$HEALTH" || true)"
          echo "HEALTH_HTTP=$HCODE" >> "$OUT"
          if [ -s /tmp/health.json ]; then
            python - <<'PY' >> "$OUT"
          import json
          from pathlib import Path
          try:
              h=json.loads(Path('/tmp/health.json').read_text())
          except Exception as e:
              print('HEALTH_PARSE=false')
              print('HEALTH_ERROR='+str(e))
          else:
              print('HEALTH_PARSE=true')
              print('HEALTH_OK='+str(h.get('ok')).lower())
              print('HEALTH_VERSION='+str(h.get('version')))
              print('HEALTH_STATUS='+str(h.get('status')))
              b=h.get('bindings') or {}
              print('BINDING_COUNT_VISIBLE='+str(sum(1 for v in b.values() if v is True)))
              for k in ['MEDIA_R2','BUFFER_API_KEY','ASAAS_API_KEY','LOLA_AUTH_KEY','LOLA_COMMAND_KEY']:
                  print('BINDING_'+k+'='+str(b.get(k)).lower())
          PY
          fi

          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID:-missing}/workers/scripts/lola-operacional-ugi"
          SCODE="$(curl --silent --show-error -H "Authorization: Bearer ${CF_API_TOKEN:-missing}" --output /tmp/stable.json --write-out '%{http_code}' "$BASE/versions/35dc7be4-2d9e-479d-8f27-39e726e0b58f" || true)"
          echo "STABLE_VERSION_HTTP=$SCODE" >> "$OUT"
          if [ "$SCODE" = '200' ]; then
            python - <<'PY' >> "$OUT"
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/stable.json').read_text())
          r=d.get('result') or {}
          bindings=((r.get('resources') or {}).get('bindings') or [])
          print('STABLE_VERSION_ID='+str(r.get('id')))
          print('STABLE_BINDING_COUNT='+str(len(bindings)))
          print('STABLE_BINDING_NAMES='+','.join(sorted(str(x.get('name')) for x in bindings if isinstance(x,dict))))
          PY
          fi

          CCODE="$(curl --silent --show-error -D /tmp/content.headers -H "Authorization: Bearer ${CF_API_TOKEN:-missing}" --output /tmp/content.body --write-out '%{http_code}' "$BASE/content/v2" || true)"
          echo "LIVE_CONTENT_HTTP=$CCODE" >> "$OUT"
          if [ -s /tmp/content.body ]; then
            grep -a -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' /tmp/content.body && echo 'LIVE_SOURCE_R44_5_17=true' >> "$OUT" || echo 'LIVE_SOURCE_R44_5_17=false' >> "$OUT"
          fi

          PCODE="$(curl --silent --show-error --output /tmp/permalink.html --write-out '%{http_code}' 'https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao' || true)"
          echo "PERMALINK_HTTP=$PCODE" >> "$OUT"
          if [ -s /tmp/permalink.html ]; then
            grep -q 'Comprar agora' /tmp/permalink.html && echo 'PERMALINK_BUY_BUTTON=true' >> "$OUT" || echo 'PERMALINK_BUY_BUTTON=false' >> "$OUT"
          fi

      - name: Persist diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-18-debug.txt || echo 'STAGE=WORKFLOW_STARTED_BUT_DIAGNOSTIC_FILE_MISSING' > cloudflare/status/r44-5-18-debug.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-debug.txt
          git commit -m 'UGI R44.5.18 — stage 1 diagnostic result' || true
          git push origin HEAD:main
