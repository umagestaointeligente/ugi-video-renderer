name: UGI Stable Version Preview Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preview known pre-R44.5.17 version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_ID='a05b7d5b-b604-40c1-8370-bd025402d0a0'
          URL='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          curl --fail --silent --show-error \
            -H "Cloudflare-Workers-Version-Overrides: lola-operacional-ugi=\"$VERSION_ID\"" \
            "$URL" -o /tmp/stable-health.json

          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/stable-health.json').read_text())
          b=h.get('bindings') or {}
          print('R44.5.17_DEPLOY_STAGE=STABLE_VERSION_PREVIEW')
          print('STABLE_VERSION_ID=a05b7d5b-b604-40c1-8370-bd025402d0a0')
          print('OK='+str(h.get('ok')).lower())
          print('VERSION='+str(h.get('version')))
          print('STATUS='+str(h.get('status')))
          for key in ['AI','BROWSER','IMAGES','MEDIA_R2','VIDEO','ASAAS_API_KEY','ASAAS_WEBHOOK_TOKEN','BUFFER_API_KEY','GITHUB_VIDEO_TOKEN','GITHUB_VIDEO_UPLOAD_KEY','LOLA_AUTH_KEY','LOLA_COMMAND_KEY']:
              print(f'BINDING_{key}={b.get(key)!r}')
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI — stable version preview result'
          git push origin HEAD:main
