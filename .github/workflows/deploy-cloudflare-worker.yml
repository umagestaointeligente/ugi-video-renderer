name: UGI R44.5.18 Live Route Context Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/inspect_live_context.py
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect live Worker source context
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/inspect_live_context.py
      - name: Persist context evidence
        shell: bash
        run: |
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-context.txt
          git commit -m 'UGI R44.5.18 — live route context diagnostic result'
          git push origin HEAD:main
