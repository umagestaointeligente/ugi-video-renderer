name: UGI R44.5.18 Stage 2B State Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture live state
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          mkdir -p cloudflare/status
          OUT=cloudflare/status/r44-5-18-stage2-debug.txt
          : > "$OUT"
          echo 'STAGE=2B_STATE_DIAGNOSTIC' >> "$OUT"
          HCODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' 'https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health' || true)"
          echo "HEALTH_HTTP=$HCODE" >> "$OUT"
          if [ -s /tmp/health.json ]; then
            python - <<'PY' >> "$OUT"
          import json
          h=json.load(open('/tmp/health.json'))
          print('OK='+str(h.get('ok')).lower())
          print('VERSION='+str(h.get('version')))
          print('STATUS='+str(h.get('status')))
          c=h.get('capabilities') or {}
          b=h.get('bindings') or {}
          for k in ['permanentCommerceEntrypoint','permanentCommercePublicationLinkPolicy','directAsaasCheckoutInPublicTextBlocked','permanentCommercePublicUrl','justInTimeAsaasCheckout']:
              print('CAP_'+k+'='+repr(c.get(k)))
          for k in ['MEDIA_R2','BUFFER_API_KEY','ASAAS_API_KEY','LOLA_AUTH_KEY','LOLA_COMMAND_KEY']:
              print('BINDING_'+k+'='+repr(b.get(k)))
          PY
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID:-missing}/workers/scripts/lola-operacional-ugi"
          CCODE="$(curl --silent --show-error -D /tmp/ch -H "Authorization: Bearer ${CF_API_TOKEN:-missing}" --output /tmp/cb --write-out '%{http_code}' "$BASE/content/v2" || true)"
          echo "CONTENT_HTTP=$CCODE" >> "$OUT"
          grep -a -q 'lola-v8-r44-5-18-permanent-publication-link-policy-2026-08-21' /tmp/cb 2>/dev/null && echo 'SOURCE_R44_5_18=true' >> "$OUT" || echo 'SOURCE_R44_5_18=false' >> "$OUT"
          grep -a -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' /tmp/cb 2>/dev/null && echo 'SOURCE_R44_5_17=true' >> "$OUT" || echo 'SOURCE_R44_5_17=false' >> "$OUT"
          for URL in 'https://umagestaointeligente.com/priorizacao' 'https://www.umagestaointeligente.com/priorizacao' 'https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'; do
            CODE="$(curl --silent --show-error --location --output /tmp/page --write-out '%{http_code}' --connect-timeout 6 --max-time 12 "$URL" || true)"
            KEY="$(echo "$URL" | sed 's#https://##; s#[^A-Za-z0-9]#_#g')"
            echo "URL_${KEY}_HTTP=$CODE" >> "$OUT"
            if [ "$CODE" = '200' ] && grep -q 'Comprar agora' /tmp/page; then echo "URL_${KEY}_BUY_BUTTON=true" >> "$OUT"; else echo "URL_${KEY}_BUY_BUTTON=false" >> "$OUT"; fi
          done
      - name: Persist diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-18-stage2-debug.txt || echo 'STAGE=2B_WORKFLOW_STARTED' > cloudflare/status/r44-5-18-stage2-debug.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-stage2-debug.txt
          git commit -m 'UGI R44.5.18 — stage 2B diagnostic result' || true
          git push origin HEAD:main
