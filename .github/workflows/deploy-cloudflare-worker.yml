name: UGI R44.5.17 Live Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate health and permanent commerce URL
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          PERMALINK='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          mkdir -p cloudflare/status

          HCODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$HEALTH")"
          PCODE="$(curl --silent --show-error --output /tmp/priorizacao.html --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$PERMALINK")"

          VERSION_PASS=false
          CAPABILITY_PASS=false
          PERMALINK_PASS=false
          PRICE_PASS=false
          BUTTON_PASS=false

          if [ "$HCODE" = '200' ] && grep -q 'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' /tmp/health.json; then VERSION_PASS=true; fi
          if grep -q '"permanentCommerceEntrypoint":true' /tmp/health.json && grep -q '"justInTimeAsaasCheckout":true' /tmp/health.json && grep -q '"expiredCheckoutReturnsToPermalink":true' /tmp/health.json; then CAPABILITY_PASS=true; fi
          if [ "$PCODE" = '200' ]; then PERMALINK_PASS=true; fi
          if grep -q 'R$ 14,99' /tmp/priorizacao.html; then PRICE_PASS=true; fi
          if grep -q 'Comprar agora' /tmp/priorizacao.html && grep -q '/comprar/priorizacao' /tmp/priorizacao.html; then BUTTON_PASS=true; fi

          cat > cloudflare/status/r44-5-17.txt <<EOF
          R44.5.17_DEPLOY_STAGE=LIVE_VALIDATION
          HEALTH_HTTP=$HCODE
          PERMALINK_HTTP=$PCODE
          VERSION_PASS=$VERSION_PASS
          CAPABILITY_PASS=$CAPABILITY_PASS
          PERMALINK_PASS=$PERMALINK_PASS
          PRICE_PASS=$PRICE_PASS
          BUY_BUTTON_PASS=$BUTTON_PASS
          LIVE_URL=$PERMALINK
          EOF

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — live validation result'
          git push origin HEAD:main

          test "$VERSION_PASS" = true
          test "$CAPABILITY_PASS" = true
          test "$PERMALINK_PASS" = true
          test "$PRICE_PASS" = true
          test "$BUTTON_PASS" = true
