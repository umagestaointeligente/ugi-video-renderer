name: UGI R44.5.17 Binding Inheritance Upload Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create non-deployed version with strict inherited bindings
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi"

          curl --fail --silent --show-error -D /tmp/cf.headers -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/content/v2" -o /tmp/cf.body
          python - <<'PY'
          from pathlib import Path
          import re
          headers=Path('/tmp/cf.headers').read_text(errors='ignore'); body=Path('/tmp/cf.body').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers); ctype=m.group(1).strip() if m else ''
          bm=re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))',ctype,re.I)
          if not bm: source=body
          else:
              boundary=(bm.group(1) or bm.group(2)).encode(); candidates=[]
              for part in body.split(b'--'+boundary):
                  sep=b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
                  if not sep: continue
                  head,payload=part.split(sep,1); payload=payload.rstrip(b'\r\n-')
                  if b'javascript' in head.lower() or b'module' in head.lower(): candidates.append(payload)
              if not candidates: raise SystemExit('no JS part')
              source=max(candidates,key=len)
          if b'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' not in source: raise SystemExit('not R44.5.17')
          Path('/tmp/worker.js').write_bytes(source)
          PY
          node --check /tmp/worker.js

          python - <<'PY' >/tmp/metadata.json
          import json
          stable='a05b7d5b-b604-40c1-8370-bd025402d0a0'
          names=['AI','ASAAS_API_KEY','ASAAS_WEBHOOK_TOKEN','BROWSER','BUFFER_API_KEY','BUFFER_CHANNEL_INSTAGRAM','BUFFER_CHANNEL_TIKTOK','BUFFER_CHANNEL_YOUTUBE','GITHUB_VIDEO_OWNER','GITHUB_VIDEO_REPO','GITHUB_VIDEO_TOKEN','GITHUB_VIDEO_UPLOAD_KEY','GITHUB_VIDEO_WORKFLOW','IMAGES','LOLA_AUTH_KEY','LOLA_COMMAND_KEY','MEDIA','MUSIC_CATALOG_JSON','VIDEO']
          print(json.dumps({'main_module':'worker.js','compatibility_date':'2026-08-20','annotations':{'workers/message':'UGI R44.5.17 strict binding inheritance diagnostic'},'bindings':[{'name':n,'type':'inherit','version_id':stable} for n in names]},separators=(',',':')))
          PY

          META="$(cat /tmp/metadata.json)"
          HTTP="$(curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -o /tmp/create.json -w '%{http_code}' "$BASE/versions?bindings_inherit=strict" -F "metadata=$META;type=application/json" -F 'worker.js=@/tmp/worker.js;type=application/javascript+module')"

          mkdir -p cloudflare/status
          python - "$HTTP" <<'PY' > cloudflare/status/r44-5-17.txt
          import json,sys
          from pathlib import Path
          http=sys.argv[1]
          try:r=json.loads(Path('/tmp/create.json').read_text())
          except Exception as e:r={'parse_error':str(e),'raw':Path('/tmp/create.json').read_text(errors='ignore')[:1000]}
          result=r.get('result') or {} if isinstance(r,dict) else {}
          resources=result.get('resources') or {} if isinstance(result,dict) else {}
          bindings=resources.get('bindings') or [] if isinstance(resources,dict) else []
          print('R44.5.17_DEPLOY_STAGE=BINDING_INHERIT_UPLOAD_DIAGNOSTIC')
          print('HTTP='+http)
          print('SUCCESS='+str(r.get('success') if isinstance(r,dict) else None).lower())
          print('NEW_VERSION_ID='+str(result.get('id') if isinstance(result,dict) else None))
          print('NEW_BINDING_COUNT='+str(len(bindings)))
          print('ERRORS='+json.dumps(r.get('errors') if isinstance(r,dict) else None,ensure_ascii=False))
          print('MESSAGES='+json.dumps(r.get('messages') if isinstance(r,dict) else None,ensure_ascii=False))
          for i,b in enumerate(bindings):
              if isinstance(b,dict): print(f'BINDING_{i}={b.get("name")}:{b.get("type")}')
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — binding inheritance upload diagnostic result'
          git push origin HEAD:main
