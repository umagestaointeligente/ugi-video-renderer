name: UGI R44.5.17 Binding-Safe Version Create

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  create-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload non-deployed R44.5.17 version with restored bindings
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi"
          STABLE='a05b7d5b-b604-40c1-8370-bd025402d0a0'

          # Fetch currently-live R44.5.17 source.
          curl --fail --silent --show-error -D /tmp/cf.headers -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/content/v2" -o /tmp/cf.body
          python - <<'PY'
          from pathlib import Path
          import re
          headers=Path('/tmp/cf.headers').read_text(errors='ignore'); body=Path('/tmp/cf.body').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers); ctype=m.group(1).strip() if m else ''
          bm=re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))',ctype,re.I)
          if not bm: source=body
          else:
              boundary=(bm.group(1) or bm.group(2)).encode(); candidates=[]
              for part in body.split(b'--'+boundary):
                  sep=b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
                  if not sep: continue
                  head,payload=part.split(sep,1); payload=payload.rstrip(b'\r\n-')
                  if b'javascript' in head.lower() or b'module' in head.lower(): candidates.append(payload)
              if not candidates: raise SystemExit('no JS module found')
              source=max(candidates,key=len)
          if b'lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21' not in source: raise SystemExit('live source is not R44.5.17')
          Path('/tmp/worker.js').write_bytes(source)
          PY
          node --check /tmp/worker.js

          # Fetch the last known-good version metadata containing all 19 bindings.
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/versions/$STABLE" -o /tmp/stable.json

          # Copy all non-secret binding objects exactly from the stable version.
          # Preserve secret values by inheriting only the 7 secret_text bindings from latest,
          # because the current version still contains those secrets.
          python - <<'PY' >/tmp/metadata.json
          import json
          from pathlib import Path
          root=json.loads(Path('/tmp/stable.json').read_text())
          stable=root.get('result') or {}
          resources=stable.get('resources') or {}
          bindings=resources.get('bindings') or []
          if len(bindings) != 19: raise SystemExit(f'expected 19 stable bindings, got {len(bindings)}')
          restored=[]
          for b in bindings:
              if b.get('type') == 'secret_text':
                  restored.append({'name':b['name'],'type':'inherit','version_id':'latest'})
              else:
                  restored.append(b)
          metadata={
            'main_module':'worker.js',
            'compatibility_date':'2026-08-20',
            'annotations':{
              'workers/message':'UGI R44.5.17 permanent commerce entrypoint — binding-safe restore',
              'workers/tag':'r44-5-17-binding-safe'
            },
            'bindings':restored
          }
          print(json.dumps(metadata,separators=(',',':'),ensure_ascii=False))
          PY

          META="$(cat /tmp/metadata.json)"
          HTTP="$(curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -o /tmp/create.json -w '%{http_code}' "$BASE/versions?bindings_inherit=strict" -F "metadata=$META;type=application/json" -F 'worker.js=@/tmp/worker.js;type=application/javascript+module')"

          mkdir -p cloudflare/status
          python - "$HTTP" <<'PY' > cloudflare/status/r44-5-17.txt
          import json,sys
          from pathlib import Path
          http=sys.argv[1]
          r=json.loads(Path('/tmp/create.json').read_text())
          result=r.get('result') or {}
          resources=result.get('resources') or {}
          bindings=resources.get('bindings') or []
          print('R44.5.17_DEPLOY_STAGE=BINDING_SAFE_VERSION_CREATE')
          print('HTTP='+http)
          print('SUCCESS='+str(r.get('success')).lower())
          print('NEW_VERSION_ID='+str(result.get('id')))
          print('NEW_BINDING_COUNT='+str(len(bindings)))
          print('ERRORS='+json.dumps(r.get('errors'),ensure_ascii=False))
          print('MESSAGES='+json.dumps(r.get('messages'),ensure_ascii=False))
          for i,b in enumerate(bindings):
              if isinstance(b,dict): print(f'BINDING_{i}={b.get("name")}:{b.get("type")}')
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — binding-safe version create result'
          git push origin HEAD:main
