name: UGI R44.5.18 Asset-Preserving Slot02 Repair V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/r44_5_18_repair_v2.py
      - scripts/r44_5_18_repair_v2_runner.py
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy-repair-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Execute robust R44.5.18 Slot02 repair
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.r44_5_18_repair_v2_runner

      - name: Persist execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-18-final.txt || echo 'R44.5.18_STAGE=V2_STARTED_BUT_STATUS_MISSING' > cloudflare/status/r44-5-18-final.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-final.txt
          git commit -m 'UGI R44.5.18 — asset-preserving Slot02 repair v2 result' || true
          git push origin HEAD:main
