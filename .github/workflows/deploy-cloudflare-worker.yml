name: UGI R44.5.17 Health Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose public health and permalink
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          PERMALINK='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          curl --fail --silent --show-error "$HEALTH" -o /tmp/health.json
          curl --silent --show-error -D /tmp/permalink.headers "$PERMALINK" -o /tmp/permalink.body

          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          import json
          from pathlib import Path

          h=json.loads(Path('/tmp/health.json').read_text())
          body=Path('/tmp/permalink.body').read_text(errors='ignore')
          headers=Path('/tmp/permalink.headers').read_text(errors='ignore')

          print('R44.5.17_DEPLOY_STAGE=HEALTH_DIAGNOSTIC')
          print('OK='+str(h.get('ok')).lower())
          print('VERSION='+str(h.get('version')))
          print('STATUS='+str(h.get('status')))

          caps=h.get('capabilities') or {}
          for key in [
            'permanentCommerceEntrypoint','permanentCommerceUrlPrioritization','justInTimeAsaasCheckout',
            'expiredCheckoutReturnsToPermalink','directAsaasCheckoutPublishingDeprecated',
            'materialStore','productCatalog','commerceAdapter','commerceFulfillment','materialDeliveryTokenized',
            'commercePublicationGateV2'
          ]:
            print(f'CAP_{key}={caps.get(key)!r}')

          bindings=h.get('bindings') or {}
          for key in sorted(bindings):
            val=bindings.get(key)
            if isinstance(val,(bool,int,float)) or val is None:
              print(f'BINDING_{key}={val!r}')
            else:
              print(f'BINDING_{key}=PRESENT')

          status_line=headers.splitlines()[0] if headers.splitlines() else ''
          print('PERMALINK_STATUS_LINE='+status_line)
          print('PERMALINK_BODY='+body[:300].replace('\n',' '))
          PY

          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — health diagnostic result'
          git push origin HEAD:main
