name: UGI R44.5.17 Final State Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live health and permalink
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          PERMALINK='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          curl --silent --show-error "$HEALTH" -o /tmp/health.json
          curl --silent --show-error -D /tmp/p.headers "$PERMALINK" -o /tmp/p.body
          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-17.txt
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/health.json').read_text())
          b=h.get('bindings') or {}; c=h.get('capabilities') or {}
          ph=Path('/tmp/p.headers').read_text(errors='ignore').splitlines()
          pb=Path('/tmp/p.body').read_text(errors='ignore')
          print('R44.5.17_DEPLOY_STAGE=FINAL_STATE_DIAGNOSTIC')
          print('OK='+str(h.get('ok')).lower())
          print('VERSION='+str(h.get('version')))
          print('STATUS='+str(h.get('status')))
          for k in ['AI','BROWSER','IMAGES','MEDIA_R2','VIDEO','ASAAS_API_KEY','ASAAS_WEBHOOK_TOKEN','BUFFER_API_KEY','GITHUB_VIDEO_OWNER','GITHUB_VIDEO_REPO','GITHUB_VIDEO_TOKEN','GITHUB_VIDEO_UPLOAD_KEY','GITHUB_VIDEO_WORKFLOW','LOLA_AUTH_KEY','LOLA_COMMAND_KEY']:
              print(f'BINDING_{k}={b.get(k)!r}')
          for k in ['permanentCommerceEntrypoint','permanentCommerceUrlPrioritization','justInTimeAsaasCheckout','expiredCheckoutReturnsToPermalink','directAsaasCheckoutPublishingDeprecated','materialStore','productCatalog','commerceAdapter','commerceFulfillment','materialDeliveryTokenized']:
              print(f'CAP_{k}={c.get(k)!r}')
          print('PERMALINK_STATUS='+(ph[0] if ph else ''))
          print('BUY_BUTTON_PRESENT='+str('Comprar agora' in pb).lower())
          print('PRICE_PRESENT='+str('R$ 14,99' in pb).lower())
          print('BUY_ROUTE_PRESENT='+str('/comprar/priorizacao' in pb).lower())
          print('PERMALINK_BODY='+pb[:240].replace('\n',' '))
          PY
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17.txt
          git commit -m 'UGI R44.5.17 — final state diagnostic result'
          git push origin HEAD:main
