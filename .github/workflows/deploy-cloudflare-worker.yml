name: UGI R44.5.18 Stage 2D Source Marker Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

jobs:
  diagnose-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract live source markers
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer $CF_API_TOKEN" "$BASE/content/v2" -o /tmp/b
          mkdir -p cloudflare/status
          python - <<'PY' > cloudflare/status/r44-5-18-markers.txt
          from pathlib import Path
          import re
          headers=Path('/tmp/h').read_text(errors='ignore'); body=Path('/tmp/b').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers); ctype=m.group(1).strip() if m else ''
          bm=re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))',ctype,re.I)
          if bm:
              boundary=(bm.group(1) or bm.group(2)).encode(); candidates=[]
              for part in body.split(b'--'+boundary):
                  sep=b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
                  if not sep: continue
                  head,payload=part.split(sep,1); payload=payload.rstrip(b'\r\n-')
                  if b'javascript' in head.lower() or b'module' in head.lower(): candidates.append(payload)
              source=max(candidates,key=len)
          else: source=body
          text=source.decode('utf-8',errors='replace')
          print('SOURCE_BYTES='+str(len(source)))
          patterns=['VERSION','R44.5.17','R44_5_17','permanent-commerce-entrypoint','VIDEO_UPLOAD_MAX_BYTES','createBufferPlatformVideoPost','permanentCommerceEntrypoint','checkoutSession','PERMANENT_COMMERCE']
          for p in patterns:
              print('\nPATTERN='+p+' COUNT='+str(text.count(p)))
              starts=[m.start() for m in re.finditer(re.escape(p),text)][:5]
              for i,s in enumerate(starts):
                  a=max(0,s-180); b=min(len(text),s+300)
                  snippet=text[a:b].replace('\n','\\n').replace('\r','')
                  print(f'SNIPPET_{i}='+snippet)
          PY
      - name: Persist markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-markers.txt
          git commit -m 'UGI R44.5.18 — stage 2D marker diagnostic result' || true
          git push origin HEAD:main
