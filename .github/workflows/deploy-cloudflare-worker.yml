name: UGI R44.5.18 Stage 2C Patch Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  patch-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live source and test patch anchors
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          mkdir -p cloudflare/status
          OUT=cloudflare/status/r44-5-18-patch-debug.txt
          : > "$OUT"
          echo 'STAGE=2C_PATCH_DIAGNOSTIC' >> "$OUT"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID:-missing}/workers/scripts/lola-operacional-ugi"
          CODE="$(curl --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN:-missing}" --output /tmp/b --write-out '%{http_code}' "$BASE/content/v2" || true)"
          echo "CONTENT_HTTP=$CODE" >> "$OUT"
          python - "$OUT" <<'PY'
          from pathlib import Path
          import re,sys
          out=Path(sys.argv[1])
          def log(k,v):
              with out.open('a') as f: f.write(f'{k}={v}\n')
          headers=Path('/tmp/h').read_text(errors='ignore')
          body=Path('/tmp/b').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ctype=m.group(1).strip() if m else ''
          bm=re.search(r'boundary=(?:"([^"]+)"|([^;\s]+))',ctype,re.I)
          log('CONTENT_TYPE',ctype)
          log('MULTIPART',bool(bm))
          if not bm:
              source=body
          else:
              boundary=(bm.group(1) or bm.group(2)).encode(); candidates=[]
              for part in body.split(b'--'+boundary):
                  sep=b'\r\n\r\n' if b'\r\n\r\n' in part else (b'\n\n' if b'\n\n' in part else None)
                  if not sep: continue
                  head,payload=part.split(sep,1); payload=payload.rstrip(b'\r\n-')
                  if b'javascript' in head.lower() or b'module' in head.lower(): candidates.append(payload)
              log('JS_CANDIDATES',len(candidates))
              source=max(candidates,key=len) if candidates else b''
          text=source.decode('utf-8',errors='replace')
          log('SOURCE_BYTES',len(source))
          checks={
            'VERSION_ANCHOR': 'const VERSION = "lola-v8-r44-5-17-permanent-commerce-entrypoint-2026-08-21";',
            'BANNER_ANCHOR': '// R44.5.17 PERMANENT COMMERCE ENTRYPOINT:\n',
            'CONST_ANCHOR': 'const VIDEO_UPLOAD_MAX_BYTES = 50 * 1024 * 1024; // 50 MB de proteção operacional\n',
            'BUFFER_HELPER_ANCHOR': 'async function createBufferPlatformVideoPost(\n',
            'CREATEPOST_TEXT_ANCHOR': '          text: ${JSON.stringify(String(draft.text || ""))}\n',
            'HEALTH_ANCHOR': '            permanentCommerceEntrypoint: true,\n'
          }
          for k,s in checks.items(): log(k+'_COUNT',text.count(s))
          Path('/tmp/source.js').write_text(text)
          PY
          if node --check /tmp/source.js >/tmp/node.out 2>/tmp/node.err; then echo 'SOURCE_NODE_CHECK=true' >> "$OUT"; else echo 'SOURCE_NODE_CHECK=false' >> "$OUT"; fi
          sed 's/^/NODE_ERR=/' /tmp/node.err >> "$OUT" || true
      - name: Persist patch diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-18-patch-debug.txt || echo 'STAGE=2C_STARTED_FILE_MISSING' > cloudflare/status/r44-5-18-patch-debug.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-18-patch-debug.txt
          git commit -m 'UGI R44.5.18 — stage 2C patch diagnostic result' || true
          git push origin HEAD:main
