name: UGI R44.5.18 Final Read-Only Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health'
          curl --fail --silent --show-error "$HEALTH" -o /tmp/health.json
          grep -q 'lola-v8-r44-5-18-permanent-publication-link-policy-2026-08-21' /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"permanentCommercePublicationLinkPolicy":true' /tmp/health.json
          grep -q '"directAsaasCheckoutInPublicTextBlocked":true' /tmp/health.json
          grep -q '"BUFFER_API_KEY":true' /tmp/health.json
          grep -q '"ASAAS_API_KEY":true' /tmp/health.json

      - name: Verify permanent commerce entrypoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lola-operacional-ugi.umagestaointeligente.workers.dev/priorizacao'
          CODE="$(curl --silent --show-error --output /tmp/page --write-out '%{http_code}' "$URL")"
          test "$CODE" = '200'
          grep -q 'Kit UGI' /tmp/page
          grep -q 'Comprar agora' /tmp/page
          grep -q 'R$ 14,99' /tmp/page
