name: LSI Revenue Mass-Market Radar R1
run-name: LSI Revenue Radar R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-mass-market-r1-20260829]
    paths:
      - 'cloudflare/lsi-revenue-radar-r1.mjs'
      - 'cloudflare/wrangler.lsi-revenue-radar-r1.toml'
      - '.github/workflows/lsi-revenue-mass-market-r1.yml'

permissions:
  contents: read

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RADAR_URL: https://lsi-revenue-radar-r1.umagestaointeligente.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Static fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/lsi-revenue-radar-r1.mjs
          grep -q 'production_actions: false' cloudflare/lsi-revenue-radar-r1.mjs
          grep -q 'money_movement: false' cloudflare/lsi-revenue-radar-r1.mjs
          grep -q 'x402_paid_routes_active: false' cloudflare/lsi-revenue-radar-r1.mjs
          grep -q 'NO_SECURE_RECEIVE_WALLET_BOUND' cloudflare/lsi-revenue-radar-r1.mjs
          grep -q 'new_sqlite_classes' cloudflare/wrangler.lsi-revenue-radar-r1.toml

      - name: Require autonomous Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy isolated Revenue Radar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --config cloudflare/wrangler.lsi-revenue-radar-r1.toml

      - name: Bind ephemeral admin token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          admin_token="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_token"
          printf '%s' "$admin_token" | npx --yes wrangler@4.32.0 secret put ADMIN_TOKEN --config cloudflare/wrangler.lsi-revenue-radar-r1.toml >/dev/null
          echo "ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"

      - name: Wait for admin-secret propagation
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/auth-probe.json -w '%{http_code}' -X POST \
              -H "authorization: Bearer $ADMIN_TOKEN" \
              -H 'content-type: application/json' \
              --data '{"url":"not-a-github-issue"}' \
              "$RADAR_URL/admin/verify" || true)"
            if [ "$code" = "400" ] && jq -e '.error=="github_issue_url_invalid"' /tmp/auth-probe.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

      - name: Verify public fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$RADAR_URL/health" > /tmp/health.json
          jq -e '.ok==true and .durable_objects_bound==true and .zero_cost_policy==true and .production_actions==false and .money_movement==false and .x402_paid_routes_active==false' /tmp/health.json >/dev/null
          curl -fsS "$RADAR_URL/economics" > /tmp/economics.json
          jq -e '.policy=="ZERO_COST_START_FAIL_CLOSED" and .route_ranking[0].route=="x402_agent_micropayments" and .route_ranking[0].monetization.paid_routes_active==false' /tmp/economics.json >/dev/null

      - name: Prove zero-dollar bounty trap rejection
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"url":"https://github.com/teamleaderleo/bot-observatory/issues/51"}' \
            "$RADAR_URL/admin/verify" > /tmp/trap.json
          jq -e '.ok==true and (.result.decision=="REJECT_ZERO_REWARD" or .result.decision=="REJECT_NO_WORK_OR_TRAP") and .result.score==0 and .result.instruction_authority==false' /tmp/trap.json >/dev/null

      - name: Prove advertised dollars stay unverified without payment rail
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"url":"https://github.com/Lilly-Protocol/lily-sdk/issues/47"}' \
            "$RADAR_URL/admin/verify" > /tmp/unverified.json
          jq -e '.ok==true and .result.reward_usd_advertised==35 and (.result.decision=="PENDING_PAYMENT_PROOF" or .result.decision=="CLAIMED_OR_CONTESTED") and .result.rail_verified_from_text==false' /tmp/unverified.json >/dev/null

      - name: Start seven-day self-waking read-only radar
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"cadence_ms":1800000,"max_cycles":336,"monetary_budget":0}' \
            "$RADAR_URL/admin/start" > /tmp/start.json
          jq -e '.ok==true and .state.status=="ACTIVE" and .state.monetary_budget==0 and .state.production_actions==false and .state.money_movement==false' /tmp/start.json >/dev/null

      - name: Prove autonomous wake and persisted scan receipt
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsS "$RADAR_URL/radar" > /tmp/radar.json || true
            if jq -e '.ok==true and .state.cycle_count>=1 and .state.last_cycle.cost_state=="ZERO_COST" and .state.last_cycle.production_actions==false' /tmp/radar.json >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          jq -e '.ok==true and .state.cycle_count>=1 and .state.last_cycle.cost_state=="ZERO_COST" and .state.last_cycle.production_actions==false and .state.last_cycle.instruction_authority_from_external_content==false' /tmp/radar.json >/dev/null

      - name: Write sanitized receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          trap_decision="$(jq -r '.result.decision // "UNKNOWN"' /tmp/trap.json 2>/dev/null || echo UNKNOWN)"
          unverified_decision="$(jq -r '.result.decision // "UNKNOWN"' /tmp/unverified.json 2>/dev/null || echo UNKNOWN)"
          cycles="$(jq -r '.state.cycle_count // 0' /tmp/radar.json 2>/dev/null || echo 0)"
          scan_state="$(jq -r '.state.last_cycle.state // "UNKNOWN"' /tmp/radar.json 2>/dev/null || echo UNKNOWN)"
          candidates="$(jq -r '.state.last_cycle.candidate_count // 0' /tmp/radar.json 2>/dev/null || echo 0)"
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg trap "$trap_decision" --arg unverified "$unverified_decision" --arg scan "$scan_state" --argjson cycles "$cycles" --argjson candidates "$candidates" \
            '{schema_version:"1.0",project:"LSI_REVENUE_MASS_MARKET_R1",run_id:$run,commit:$sha,trap_test:$trap,unverified_money_test:$unverified,background_radar:{scan_state:$scan,cycles:$cycles,candidate_count:$candidates,cadence_minutes:30,max_cycles:336,open_chat_required:false},zero_cost_route:true,production_actions:false,money_movement:false,x402_paid_routes_active:false}' \
            > generated/evidence/lsi-revenue-mass-market-r1.json

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsi-revenue-radar-${{ github.run_id }}
          path: generated/evidence/lsi-revenue-mass-market-r1.json
          retention-days: 14
          if-no-files-found: error
