name: Orbit YouTube Redirect History Probe
on:
  push:
    paths:
      - '.github/workflows/orbit-youtube-redirect-history-probe-20260910.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find historical redirect URI references
        shell: bash
        run: |
          set -euo pipefail
          echo ORBIT_YOUTUBE_REDIRECT_HISTORY_V1
          git log --all -G'YOUTUBE_REDIRECT_URI|127\.0\.0\.1:8765|oauth2callback' --pretty='COMMIT=%H %s' -p -- '*.py' '*.yml' '*.yaml' '*.md' '*.txt' | grep -E '^(COMMIT=|[+-].*(YOUTUBE_REDIRECT_URI|127\.0\.0\.1:8765|oauth2callback))' | head -200 || true
          echo SECRET_VALUES_EXPOSED=false
