name: Career360 Application Dispatch V2 Recovery Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-application-dispatch-v2-recovery-seal.yml'
      - 'career360/scripts/patch_recovery_application_dispatch_v2.py'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch recovery
        run: python career360/scripts/patch_recovery_application_dispatch_v2.py
      - name: Commit recovery if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/LSI_RECOVERY_CURRENT.md; then
            echo 'RECOVERY_ALREADY_CURRENT=1'
            exit 0
          fi
          git config user.name 'career360-recovery-seal-bot'
          git config user.email 'career360-recovery-seal-bot@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          git commit -m 'career360: seal application submission dispatch v2 recovery'
          git push origin HEAD:main
          echo "RECOVERY_COMMIT=$(git rev-parse HEAD)"
