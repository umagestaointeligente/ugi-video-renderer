name: Orbit Direct Publisher Secret Probe

on:
  push:
    paths:
      - '.github/workflows/orbit-direct-publisher-secret-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORBIT_YOUTUBE_CLIENT_ID_STATE: ${{ secrets.ORBIT_YOUTUBE_CLIENT_ID != '' && 'PRESENT' || 'MISSING' }}
      ORBIT_YOUTUBE_CLIENT_SECRET_STATE: ${{ secrets.ORBIT_YOUTUBE_CLIENT_SECRET != '' && 'PRESENT' || 'MISSING' }}
      CENA_CERTA_YOUTUBE_REFRESH_TOKEN_STATE: ${{ secrets.CENA_CERTA_YOUTUBE_REFRESH_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      CENA_CERTA_YT_REFRESH_TOKEN_STATE: ${{ secrets.CENA_CERTA_YT_REFRESH_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN_STATE: ${{ secrets.ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      ORBIT_YOUTUBE_REFRESH_TOKEN_STATE: ${{ secrets.ORBIT_YOUTUBE_REFRESH_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      CENA_CERTA_META_ACCESS_TOKEN_STATE: ${{ secrets.CENA_CERTA_META_ACCESS_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      ORBIT_META_ACCESS_TOKEN_STATE: ${{ secrets.ORBIT_META_ACCESS_TOKEN != '' && 'PRESENT' || 'MISSING' }}
      CENA_CERTA_FACEBOOK_PAGE_ID_STATE: ${{ secrets.CENA_CERTA_FACEBOOK_PAGE_ID != '' && 'PRESENT' || 'MISSING' }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ORBIT_YOUTUBE_CLIENT_ID_STATE \
            ORBIT_YOUTUBE_CLIENT_SECRET_STATE \
            CENA_CERTA_YOUTUBE_REFRESH_TOKEN_STATE \
            CENA_CERTA_YT_REFRESH_TOKEN_STATE \
            ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN_STATE \
            ORBIT_YOUTUBE_REFRESH_TOKEN_STATE \
            CENA_CERTA_META_ACCESS_TOKEN_STATE \
            ORBIT_META_ACCESS_TOKEN_STATE \
            CENA_CERTA_FACEBOOK_PAGE_ID_STATE; do
            printf '%s=%s\n' "$name" "${!name}"
          done
