name: LSI PackValue PRO Build + Live Patch V6
run-name: LSI PackValue PRO Build + Live Patch V6 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths:
      - 'greenfield/packvalue-pro/patch_worker_v4.py'
      - '.github/workflows/lsi-packvalue-pro-build-patch-v4.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Product acceptance
        shell: bash
        run: |
          set -euo pipefail
          node greenfield/packvalue-pro/test.mjs
          node greenfield/packvalue-pro/build.mjs
          jq -e '.network_capability==false and .pii_collection==false and .server_required_after_delivery==false' greenfield/packvalue-pro/dist/manifest.json >/dev/null
      - name: Configure Cloudflare read access
        env:
          CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          echo "CF_API_TOKEN=$CF_API_TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CF_API_TOKEN"
      - name: Extract live commerce module with structural gates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://lola-operacional-ugi.umagestaointeligente.workers.dev/api/health >/tmp/health.json
          jq -e '.ok==true and (.version|type=="string")' /tmp/health.json >/dev/null
          printf 'LIVE_HEALTH_VERSION=%s\n' "$(jq -r '.version' /tmp/health.json)"
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN}" "$base" >/tmp/b
          python - <<'PY'
          import re
          from email import policy
          from email.parser import BytesParser
          headers=open('/tmp/h','rb').read().decode('latin1','replace')
          body=open('/tmp/b','rb').read()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ct=m.group(1).strip() if m else ''
          candidates=[]
          if 'multipart/' in ct.lower():
              msg=BytesParser(policy=policy.default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
              for part in msg.walk():
                  if part.is_multipart(): continue
                  payload=part.get_payload(decode=True) or b''
                  if payload: candidates.append(payload)
          else:
              candidates=[body]
          exact=[p for p in candidates if b'createProviderCheckout' in p and b'/api/commerce/webhook/asaas' in p and b'/api/material-delivery/' in p]
          if exact:
              chosen=max(exact,key=len)
          else:
              jsish=[p for p in candidates if b'createProviderCheckout' in p or b'/api/commerce/webhook/asaas' in p]
              if not jsish:
                  raise SystemExit(f'WORKER_MODULE_NOT_FOUND content_type={ct!r} candidate_count={len(candidates)} sizes={[len(x) for x in candidates[:20]]}')
              chosen=max(jsish,key=len)
              if b'createProviderCheckout' not in chosen or b'/api/commerce/webhook/asaas' not in chosen:
                  raise SystemExit('WORKER_MODULE_ANCHORS_SPLIT')
          text=chosen.decode('utf-8')
          required=['if (request.method === "POST" && path === "/api/commerce/checkout") {','if (request.method === "POST" && path === "/api/commerce/webhook/asaas") {','async function createProviderCheckout(env, provider, product, material, body, origin) {','isCommerceAdminAuthorized(request, env)','ASAAS_WEBHOOK_TOKEN']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('STRUCTURAL_GATE_MISSING:'+','.join(missing))
          open('/tmp/current.mjs','wb').write(chosen)
          print(f'LIVE_MODULE_EXTRACT=PASS bytes={len(chosen)} content_type={ct!r} candidates={len(candidates)}')
          PY
      - name: Patch exact live source and validate JS
        shell: bash
        run: |
          set -euo pipefail
          python greenfield/packvalue-pro/patch_worker_v4.py --source /tmp/current.mjs --asset greenfield/packvalue-pro/dist/packvalue-pro.html --output /tmp/patched.mjs
          node --check /tmp/patched.mjs
          grep -Fq 'const PACKVALUE_PRO_PRICE = 49.90;' /tmp/patched.mjs
          grep -Fq 'fixed_offer_accepts_no_client_parameters' /tmp/patched.mjs
          grep -Fq 'product?.greenfield === true ? `${origin}/api/greenfield/packvalue-pro/checkout-return`' /tmp/patched.mjs
          grep -Fq 'grant.productId === "packvalue-pro-r1" ? `attachment; filename="packvalue-pro.html"`' /tmp/patched.mjs
          grep -Fq 'if (!isCommerceAdminAuthorized(request, env))' /tmp/patched.mjs
          grep -Fq 'if (!env.ASAAS_WEBHOOK_TOKEN)' /tmp/patched.mjs
          echo 'PATCH_V6_STATIC_ACCEPTANCE=PASS'
      - name: Legacy invariant gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          old=open('/tmp/current.mjs',encoding='utf-8').read();new=open('/tmp/patched.mjs',encoding='utf-8').read()
          for a in ['/api/video-render','/api/video-upload','/api/platform-approval','/api/commerce/webhook/asaas','BUFFER_ACCESS_TOKEN','ASAAS_WEBHOOK_TOKEN']:
              if old.count(a)!=new.count(a): raise SystemExit('INVARIANT_CHANGED:'+a)
          if new.count('if (request.method === "POST" && path === "/api/commerce/checkout") {')!=1: raise SystemExit('ADMIN_CHECKOUT_COUNT_CHANGED')
          if new.count('isCommerceAdminAuthorized(request, env)')<old.count('isCommerceAdminAuthorized(request, env)'): raise SystemExit('ADMIN_AUTH_REDUCED')
          print('LEGACY_INVARIANTS=PASS')
          PY
      - name: Receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg health_version "$(jq -r '.version' /tmp/health.json)" --arg source "$(sha256sum /tmp/current.mjs|awk '{print $1}')" --arg patched "$(sha256sum /tmp/patched.mjs|awk '{print $1}')" --argjson product "$(cat greenfield/packvalue-pro/dist/manifest.json)" '{schema_version:"1.0",project:"LSI_PAYMENT_HUB_R1",component:"PACKVALUE_PRO_ASAAS",stage:"PATCH_V6",acceptance_state:"PASS",run_id:$run,commit:$sha,live_health_version:$health_version,extension_version:"packvalue-pro-commerce-r1-2026-08-30",fixed_price_brl:49.90,current_source_sha256:$source,patched_source_sha256:$patched,product:$product,production_deployed:false,provider_checkout_created:false,real_value_moved:false}'|tee generated/evidence/packvalue-pro-patch-v6.json
      - uses: actions/upload-artifact@v4
        with:
          name: packvalue-pro-patch-v6-${{ github.run_id }}
          path: generated/evidence/packvalue-pro-patch-v6.json
          retention-days: 14
