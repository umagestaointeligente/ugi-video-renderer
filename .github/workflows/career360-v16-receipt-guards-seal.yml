name: Career360 V16 Receipt Guards Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-receipt-guards-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seal receipt guard evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_receipt_guards_seal.py
          git diff --check
      - name: Commit canonical docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md
          git diff --cached --check
          git commit -m 'career360: seal delivery evidence guards'
          git push origin HEAD:main
          echo 'V16_RECEIPT_GUARDS_DOCS_PUSH=PASS'
