name: UGI LinkedIn Buffer Rate Limit Safety Deploy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_20260904_linkedin_rate_limit_safety_deploy.py'
      - '.github/workflows/ugi-20260904-linkedin-rate-limit-safety-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deploy safe Buffer 429 classification
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          python -m pip install --disable-pip-version-check --quiet requests
          PYTHONPATH=scripts python scripts/ugi_20260904_linkedin_rate_limit_safety_deploy.py
      - name: Persist deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/ugi-linkedin-buffer-rate-limit-safe.txt || printf 'OK=false\nSTATUS_MISSING=true\n' > cloudflare/status/ugi-linkedin-buffer-rate-limit-safe.txt
          git config user.name 'ugi-linkedin-buffer-deploy-bot'
          git config user.email 'ugi-linkedin-buffer-deploy@users.noreply.github.com'
          git add cloudflare/status/ugi-linkedin-buffer-rate-limit-safe.txt
          git commit -m 'chore: persist LinkedIn Buffer rate-limit safety deploy' || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
