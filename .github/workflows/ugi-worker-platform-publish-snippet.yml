name: UGI Worker Platform Publish Snippet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-worker-platform-publish-snippet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract live platform-publish route only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, requests, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import r45_instagram_multiformat_deploy as base
          token=os.environ['CF_API_TOKEN']; account=os.environ['CF_ACCOUNT_ID']
          if not token or not account: raise SystemExit('Cloudflare credentials missing')
          api_base=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{base.WORKER_NAME}"
          r=requests.get(api_base+'/content/v2',headers=base.api_headers(token),timeout=45)
          r.raise_for_status()
          src=base.extract_worker_source(r)
          anchor='if (path === "/api/platform-publish" && request.method === "POST")'
          i=src.find(anchor)
          if i < 0: raise SystemExit('anchor missing')
          j=src.find('if (path === "/api/platform-publication-status"', i)
          if j < 0: j=min(len(src),i+16000)
          out=src[i:j]
          Path('control-plane/recovery/UGI_WORKER_PLATFORM_PUBLISH_SNIPPET_20260904.txt').write_text(out,encoding='utf-8')
          print(out[:12000])
          PY
      - name: Persist snippet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-diagnostic-bot'
          git config user.email 'ugi-diagnostic@users.noreply.github.com'
          git add control-plane/recovery/UGI_WORKER_PLATFORM_PUBLISH_SNIPPET_20260904.txt
          git commit -m 'diag(ugi): persist live platform publish route' || true
          git pull --rebase origin main
          git push origin HEAD:main
