name: UGI Editorial Finalize 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_editorial_20260908_finalize_assets.py'
      - '.github/workflows/ugi-editorial-finalize-20260908.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-editorial-finalize-20260908
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          ffmpeg -version >/dev/null
      - name: Build exact staged assets
        run: |
          set -euo pipefail
          python scripts/ugi_editorial_20260908_finalize_assets.py
          test -s public/ugi/editorial/2026-09-08/story-nvidia-company-approved-v2.png
          test -s public/ugi/editorial/2026-09-08/linkedin-semicon-taiwan-company-context-v1.png
      - name: Persist final assets
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-asset-bot'
          git config user.email 'ugi-editorial-asset@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08/story-nvidia-company-approved-v2.png
          git add public/ugi/editorial/2026-09-08/linkedin-semicon-taiwan-company-context-v1.png
          if git diff --cached --quiet; then
            echo 'No asset changes'
            exit 0
          fi
          git commit -m 'asset: finalize UGI Sep 8 distribution media'
          git pull --rebase origin main
          git push origin HEAD:main
