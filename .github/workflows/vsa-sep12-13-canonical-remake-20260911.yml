# VSA_VISUAL_STORY_ENGINE_V1
# VSA_VISUAL_RELEASE_RECEIPT_V1
name: VSA Sep12-13 Canonical Remake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsa-sep12-13-canonical-remake-20260911.yml'
      - 'scripts/vsa/canonical_remake_sep12_13.py'
      - 'scripts/vsa/canonical_remake_sep12_13_v2.py'
      - 'scripts/vsa/canonical_remake_sep12_13_v3.py'
      - 'scripts/vsa/canonical_remake_sep12_13_v4.py'
      - 'scripts/vsa/canonical_remake_sep12_13_v5.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: vsa-sep12-13-canonical-remake-20260911
  cancel-in-progress: true

env:
  GOLDEN_RUN_ID: '34594731572'
  GOLDEN_ARTIFACT: vsa-hunga-narrative-visual-repair-v3

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate targeted V5 renderer and canonical contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/vsa/canonical_remake_sep12_13.py scripts/vsa/canonical_remake_sep12_13_v2.py scripts/vsa/canonical_remake_sep12_13_v3.py scripts/vsa/canonical_remake_sep12_13_v4.py scripts/vsa/canonical_remake_sep12_13_v5.py
          python -m json.tool config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json >/dev/null
          python scripts/vsa/validate_release_receipt.py --policy config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json --self-test
          python scripts/vsa/check_workflow_compliance.py .github/workflows/vsa-sep12-13-canonical-remake-20260911.yml

  build:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id:
          - IBERE
          - ROOSEVELT
          - FERNANDA_MONTENEGRO
          - MARISKA_LONGEVITY
          - EMICIDA_INFLUENCE
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install zero-cost canonical renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          python -m pip install --quiet pillow pyyaml edge-tts
      - name: Recover immutable Hunga V3 golden reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.GOLDEN_ARTIFACT }}
          path: /tmp/golden
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.GOLDEN_RUN_ID }}
      - name: Render one targeted V5 candidate
        shell: bash
        env:
          VSA_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          GOLDEN=/tmp/golden/VSA_20260913_1300_HUNGA_TSUNAMI_NARRATIVE_REPAIR_V3.mp4
          test -s "$GOLDEN"
          mkdir -p /tmp/output
          python scripts/vsa/canonical_remake_sep12_13_v5.py --id "$VSA_ID" --golden "$GOLDEN" --out-dir /tmp/output
          test "$(find /tmp/output -maxdepth 1 -name '*_REMAKE.mp4' | wc -l)" -eq 1
          test "$(find /tmp/output -maxdepth 1 -name '*_CONTACT_SHEET.jpg' | wc -l)" -eq 1
          test "$(find /tmp/output -maxdepth 1 -name '*_VSA_VISUAL_RELEASE_RECEIPT_V1.json' | wc -l)" -eq 1
      - name: Assert targeted repair remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$(find /tmp/output -maxdepth 1 -name '*_VSA_VISUAL_RELEASE_RECEIPT_V1.json' -print -quit)"
          python - "$RECEIPT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['human_review']['approved'] is False
          assert r['release_eligible'] is False
          assert r['schedule_mutated_before_gate'] is False
          assert all(r['gates'].values())
          assert r['status'].startswith('AWAITING_HUMAN_REVIEW')
          assert r.get('repair_version') == 'V4_TARGETED_NARRATIVE_DIVERSITY'
          print('VSA_V5_TARGETED_PRE_RELEASE_PASS',r['video_id'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vsa-v5-narrative-repair-${{ matrix.id }}
          path: /tmp/output/*
          if-no-files-found: error
          retention-days: 14

  # This recovery run never publishes or schedules. Any later release remains behind:
  # ./.github/actions/vsa-release-gate
  release_gate_marker:
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vsa-release-gate
        with:
          receipt: /tmp/never-release-from-targeted-repair.json
