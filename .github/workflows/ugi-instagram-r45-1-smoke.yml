name: UGI Instagram R45.1 Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-instagram-r45-1-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Wait for R45.1 and prove Instagram delivery
        run: |
          set -euo pipefail
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python scripts/ugi_instagram_r45_1_smoke.py
      - name: Persist Instagram smoke proof
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-instagram-smoke-bot'
          git config user.email 'ugi-instagram-smoke@users.noreply.github.com'
          git add control-plane/smoke/receipts/instagram-r45-1-smoke.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist Instagram R45.1 smoke receipt'
          git pull --rebase origin main
          git push origin HEAD:main
