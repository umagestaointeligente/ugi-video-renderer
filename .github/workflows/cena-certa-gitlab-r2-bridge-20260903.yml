name: Cena Certa GitLab PASS -> R2 bridge 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cena-certa-gitlab-r2-bridge-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
      GITLAB_JOB_ID: '16291063675'
      GITLAB_PROJECT_PATH: 'umagestaointeligente-group/umagestaointeligente-project'
    steps:
      - name: Validate existing R2 route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_VIDEO_UPLOAD_URL"
          test -n "$UGI_VIDEO_UPLOAD_KEY"
          echo 'R2_ROUTE_PRESENT'

      - name: Acquire only canonically PASS masters from GitLab artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          base="https://gitlab.com/${GITLAB_PROJECT_PATH}/-/jobs/${GITLAB_JOB_ID}/artifacts/raw/output"
          ids=(
            CC-20260903-DEAD-DROP
            CC-20260903-PASION-ORIENTAL
            CC-20260903-MAN-BEHIND-MACHINE
            CC-20260903-CONTAINMENT-BREACH
          )
          # Run Chicken Run from this job is intentionally excluded: its narration
          # was technically PASS but editorially superseded by the corrected factual script.
          for id in "${ids[@]}"; do
            curl --fail-with-body --location --silent --show-error \
              --retry 2 --connect-timeout 15 --max-time 180 \
              "$base/${id}.mp4" -o "media/${id}.mp4"
            test -s "media/${id}.mp4"
            head12="$(xxd -p -l 12 "media/${id}.mp4")"
            echo "$head12" | grep -qi '66747970'
            echo "GITLAB_MASTER_ACQUIRED $id bytes=$(stat -c%s "media/${id}.mp4")"
          done

      - name: Deliver PASS masters through existing Worker R2 route
        shell: bash
        run: |
          set -euo pipefail
          base="${UGI_VIDEO_UPLOAD_URL%/}"
          mkdir -p receipts
          for f in media/*.mp4; do
            id="$(basename "$f" .mp4)"
            response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 180 \
              -X POST "${base}/api/video-upload?renderId=${id}&duration=60" \
              -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
              -H 'Content-Type: video/mp4' \
              --data-binary @"$f")"
            printf '%s\n' "$response" > "receipts/${id}.json"
            echo "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"ready"'
            echo "R2_DELIVERY_SUCCESS $id"
          done

      - name: Print public result metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, glob
          for path in sorted(glob.glob('receipts/*.json')):
              d=json.load(open(path,encoding='utf-8'))
              print('R2_RESULT', d.get('renderId'), d.get('status'), d.get('videoUrl') or d.get('url') or d.get('mediaUrl'))
          PY

# manual retrigger 2026-09-03T20:30:00-03:00
