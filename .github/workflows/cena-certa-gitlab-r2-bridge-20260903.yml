name: Cena Certa canonical render -> R2 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cena-certa-gitlab-r2-bridge-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-deliver:
    strategy:
      fail-fast: false
      matrix:
        video_id:
          - CC-20260903-DEAD-DROP
          - CC-20260903-PASION-ORIENTAL
          - CC-20260903-MAN-BEHIND-MACHINE
          - CC-20260903-CONTAINMENT-BREACH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
      VIDEO_ID: ${{ matrix.video_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate existing delivery route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_VIDEO_UPLOAD_URL"
          test -n "$UGI_VIDEO_UPLOAD_KEY"
          echo "R2_ROUTE_PRESENT $VIDEO_ID"

      - name: Install canonical runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-lato fluidsynth timgm6mb-soundfont >/dev/null
          python -m pip install -q edge-tts aiohttp numpy pillow mido yt-dlp

      - name: Render and run fail-closed QA
        shell: bash
        run: |
          set -euo pipefail
          # Edge currently emits SentenceBoundary for this voice; preserve every sentence,
          # not only the first one, when generating literal CC timing.
          sed -i "s/elif chunk\['type'\]=='SentenceBoundary' and not words:/elif chunk['type']=='SentenceBoundary':/" ops/cena-certa-runtime/runtime_20260903.py
          python ops/cena-certa-runtime/runtime_20260903.py --id "$VIDEO_ID"
          test -s "output/${VIDEO_ID}.mp4"
          test -s "output/${VIDEO_ID}.receipt.json"
          grep -q '"canonical_mask_pass": true' "output/${VIDEO_ID}.receipt.json"
          grep -q '"mask_last_layer_pass": true' "output/${VIDEO_ID}.receipt.json"
          grep -q '"tech_qa_pass": true' "output/${VIDEO_ID}.receipt.json"
          grep -q '"editorial_qa_pass": true' "output/${VIDEO_ID}.receipt.json"

      - name: Deliver PASS master to existing R2 route
        shell: bash
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "output/${VIDEO_ID}.mp4" | awk -F. '{print $1}')"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 240 \
            -X POST "${UGI_VIDEO_UPLOAD_URL%/}/api/video-upload?renderId=${VIDEO_ID}&duration=${duration}" \
            -H "Authorization: Bearer ${UGI_VIDEO_UPLOAD_KEY}" \
            -H 'Content-Type: video/mp4' \
            --data-binary @"output/${VIDEO_ID}.mp4")"
          printf '%s\n' "$response" | tee "output/${VIDEO_ID}.r2.json"
          echo "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"ready"'
          python - "$VIDEO_ID" "output/${VIDEO_ID}.r2.json" <<'PY'
          import json,sys
          vid,path=sys.argv[1:]
          d=json.load(open(path,encoding='utf-8'))
          print('R2_RESULT',vid,d.get('status'),d.get('videoUrl') or d.get('url') or d.get('mediaUrl'))
          PY

      - name: Preserve proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cena-certa-${{ matrix.video_id }}
          path: |
            output/${{ matrix.video_id }}.mp4
            output/${{ matrix.video_id }}.receipt.json
            output/${{ matrix.video_id }}.r2.json
          if-no-files-found: warn
          retention-days: 7

# self-render bridge trigger 2026-09-03T20:29:00-03:00
