name: UGI R44.5.17 JIT Checkout Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ugi-commerce-jit-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create exactly one test checkout and validate redirect
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lola-operacional-ugi.umagestaointeligente.workers.dev/comprar/priorizacao'
          HTTP="$(curl --silent --show-error --max-redirs 0 -X POST -D /tmp/headers -o /tmp/body -w '%{http_code}' "$URL")"
          LOCATION="$(grep -i '^location:' /tmp/headers | tail -1 | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\r')"
          HOST_PASS=false
          case "$LOCATION" in
            https://www.asaas.com/*|https://asaas.com/*) HOST_PASS=true ;;
          esac
          mkdir -p cloudflare/status
          cat > cloudflare/status/r44-5-17-jit-smoke.txt <<EOF
          JIT_SMOKE_EXECUTED=true
          JIT_SMOKE_ATTEMPTS=1
          HTTP_STATUS=$HTTP
          REDIRECT_HOST_ASAAS=$HOST_PASS
          CHECKOUT_LOCATION_PRESENT=$([ -n "$LOCATION" ] && echo true || echo false)
          PAYMENT_PERFORMED=false
          FULFILLMENT_TRIGGERED=false
          EOF
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-17-jit-smoke.txt
          git commit -m 'UGI R44.5.17 — JIT checkout smoke result'
          git push origin HEAD:main
          test "$HTTP" = '303'
          test "$HOST_PASS" = true
