name: UGI Editorial Assets 2026-09-15 V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ugi_build_editorial_assets_20260915_v2.py'
      - '.github/workflows/ugi-editorial-assets-20260915-v2.yml'

permissions:
  contents: write

concurrency:
  group: ugi-editorial-assets-20260915-v2
  cancel-in-progress: false

jobs:
  build-qa-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow requests edge-tts
          command -v ffmpeg
          ffmpeg -version | head -1
          python -m py_compile scripts/ugi_build_editorial_assets_20260913.py scripts/ugi_build_editorial_assets_20260914.py scripts/ugi_safearea_v2.py scripts/ugi_build_editorial_assets_20260915.py scripts/ugi_build_editorial_assets_20260915_v2.py
      - name: Build Sep15 hard-gated assets V2
        id: build
        shell: bash
        run: |
          set +e
          python scripts/ugi_build_editorial_assets_20260915_v2.py > /tmp/ugi-sep15-v2-build.log 2>&1
          rc=$?
          cat /tmp/ugi-sep15-v2-build.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload diagnostics on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ugi-sep15-v2-build-diagnostics
          path: /tmp/ugi-sep15-v2-build.log
          retention-days: 1
          if-no-files-found: error
      - name: Assert QA pass
        run: |
          python - <<'PY'
          import json, pathlib
          q=json.loads(pathlib.Path('public/ugi/editorial/2026-09-15/daily/qa.json').read_text(encoding='utf-8'))
          assert q['state']=='PASS', q
          assert q['metricoolMutationAuthorized'] is True, q
          assert q['safeAreaV2'] is True
          assert q['storytellingBenchmark'] is True
          assert q['counts']=={'instagram_story':4,'instagram_reel':2,'linkedin_image':1,'tiktok_video':2,'instagram_carousel_slide':6}, q['counts']
          for f in q['files']:
              v=f['visualQa']
              assert v['REAL_CONTEXTUAL_VISUAL_PASS'] is True
              assert v['RIGHTS_PROVENANCE_PASS'] is True
              assert v['EXACT_VISUAL_REUSE_COUNT']==0
              assert v['SAFE_AREA_V2_PASS'] is True
              if f['path'].endswith('.mp4'):
                  assert v['CC_DEDICATED_LOWER_BAND_PASS'] is True
                  assert v['CC_MAX_TWO_LINES_PASS'] is True
                  assert v['CC_CHUNKED_SYNC_PASS'] is True
                  assert v['CC_OVER_PRIMARY_VISUAL'] is False
                  assert f['bytes'] > 100000
          reels=[x for x in q['files'] if x['kind']=='instagram_reel']
          assert len(reels)==2
          assert all(x['visualQa']['STORYTELLING_BENCHMARK_PASS'] is True for x in reels)
          print('UGI_SEP15_V2_QA_PASS')
          PY
      - name: Commit immutable finals
        run: |
          git config user.name 'ugi-editorial-bot'
          git config user.email 'ugi-editorial-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-15/daily
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'assets(ugi): Sep15 storytelling editorial finals v2 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
