name: UGI Sunday Longform Mondial 2026-09-13

on:
  push:
    paths:
      - '.github/workflows/ugi-sunday-longform-mondial-20260913.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts pillow requests numpy

      - name: Apply contained source and visual uniqueness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/ugi_longform_mondial_20260913.py')
          s=p.read_text(encoding='utf-8')

          replacements=[
            (
              'https://media.glassdoor.com/lst2x/ba/8f/2f/0f/f%C3%A3-brica-jacu%C3%A3-pe-ba-br.jpg?signature=c9ed6d8ce34adc8964cb404f9e880f46f1ab7af6008f241509e4d9910548e060',
              'https://newr7-r7-prod.web.arc-cdn.net/resizer/v2/WQYWG2PUXVNGXDZUPKFCJE3VLU.jpg?auth=d9d7d54b653ac12ebc677d47fb9ac1d54adaa3c8b020fb9953dfc2da5b746c19&height=1047&width=1600',
              'FACTORY_SOURCE'
            ),
            (
              'https://www.gov.br/suframa/pt-br/assuntos/noticias/suframa-conhece-estrutura-e-planos-de-expansao-da-mondial-no-pim/VisitaempresaMondialCopia.jpeg/%40%40images/95e7f387-4610-4954-80d3-ad568b9ede24.jpeg',
              'https://static.sbt.com.br/noticias/images/content/20210604055805.jpeg',
              'MANAUS_SOURCE'
            )
          ]
          for old_url,new_url,label in replacements:
              if old_url not in s:
                  raise SystemExit(label+'_PATCH_TARGET_NOT_FOUND')
              s=s.replace(old_url,new_url,1)
          s=s.replace('Glassdoor / Mondial - Conceicao do Jacuipe','R7 / imagem de fabrica Mondial',1)
          s=s.replace('Suframa, 2026','SBT News / antiga fabrica Sony em Manaus',1)

          # Remove one unstable CDN asset entirely. This scene becomes an original
          # management graphic; the documentary still keeps 4 unique Giovanni
          # photographs and 10 unique real company/product/factory visuals.
          block='''    "factory_entrance": {\n        "url": "https://media.licdn.com/dms/image/v2/D4E22AQFT9ly9yidWog/feedshare-shrink_2048_1536/B4EZUe7xa8HcAs-/0/1739980742564?e=2147483647&t=qYx8ADm6DI75l51aq0LiScdiXtqRbKda196xfiqx6Y8&v=beta",\n        "credit": "LinkedIn / visita a fabrica Mondial",\n        "entity": "company"\n    }\n'''
          if block not in s:
              raise SystemExit('UNSTABLE_ASSET_BLOCK_NOT_FOUND')
          s=s.replace(block,'',1)
          old_scene='("factory_entrance", "Capacidade antes de categoria"'
          if old_scene not in s:
              raise SystemExit('CAPABILITY_SCENE_NOT_FOUND')
          s=s.replace(old_scene,'("card_capability", "Capacidade antes de categoria"',1)

          old='("showcase", "Da feira pequena ao grande estande"'
          new='("card_eletrolar", "Da feira pequena ao grande estande"'
          if old not in s:
              raise SystemExit('UNIQUE_VISUAL_PATCH_TARGET_NOT_FOUND')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('FACTORY_SOURCE_REPLACEMENT=PASS')
          print('MANAUS_SOURCE_REPLACEMENT=PASS')
          print('UNSTABLE_ASSET_REMOVAL=PASS')
          print('CAPABILITY_GRAPHIC_REPLACEMENT=PASS')
          print('UNIQUE_VISUAL_PATCH=PASS')
          PY

      - name: Render YouTube documentary and LinkedIn executive cut
        run: |
          set -euo pipefail
          python scripts/ugi_longform_mondial_20260913.py

      - name: Verify hard gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/ugi/editorial/2026-09-13/longform')
          qa=json.loads((p/'qa.json').read_text())
          m=json.loads((p/'source-manifest.json').read_text())
          assert qa['state']=='PASS'
          assert qa['founderRealVisualCount'] >= 4
          assert qa['companyRealVisualCount'] >= 8
          assert qa['youtubeExactVisualReuseCount'] == 0
          assert qa['linkedinExactVisualReuseCount'] == 0
          assert qa['subtitleBurnedIn'] is True
          assert 570 <= qa['youtubeDurationSeconds'] <= 960
          assert 170 <= qa['linkedinDurationSeconds'] <= 390
          for f in ['youtube-mondial-historias-de-gestao.mp4','linkedin-mondial-historias-de-gestao.mp4','youtube-mondial-thumbnail.jpg']:
              q=p/f
              assert q.exists() and q.stat().st_size>10000, f
          assert len(m['realVisuals']) >= 12
          assert len(m['factSources']) >= 7
          print('UGI_LONGFORM_QA=PASS')
          print(json.dumps(qa,ensure_ascii=False))
          PY

      - name: Commit immutable production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-bot'
          git config user.email 'ugi-editorial-bot@users.noreply.github.com'
          git add scripts/ugi_longform_mondial_20260913.py public/ugi/editorial/2026-09-13/longform/
          git commit -m 'assets(ugi): Mondial Sunday longform finals [skip ci]'
          git push
          echo "ASSET_COMMIT=$(git rev-parse HEAD)"
          ls -lh public/ugi/editorial/2026-09-13/longform/
