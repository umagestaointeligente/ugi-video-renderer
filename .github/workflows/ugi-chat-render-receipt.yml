name: UGI Chat Render Receipt

on:
  workflow_run:
    workflows:
      - UGI Reel Renderer R43.8.6 Correlated Dynamic Scenes + Semantic Callback
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  persist-receipt:
    if: startsWith(github.event.workflow_run.display_title, 'UGI ugi-chat-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist completion receipt
        shell: bash
        env:
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS: ${{ github.event.workflow_run.status }}
          RENDER_RUN_ID: ${{ github.event.workflow_run.id }}
          RENDER_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RENDER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RENDER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          RENDER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          RENDER_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          RID="${DISPLAY_TITLE#UGI }"
          [ -n "$RID" ] || { echo 'render id missing'; exit 1; }
          mkdir -p control-plane/receipts
          python - <<'PY'
          import json, os
          from pathlib import Path
          rid=os.environ['DISPLAY_TITLE'][4:]
          payload={
            'renderId': rid,
            'workflowStatus': os.environ['STATUS'],
            'workflowConclusion': os.environ['CONCLUSION'],
            'githubRunId': int(os.environ['RENDER_RUN_ID']),
            'githubRunNumber': int(os.environ['RENDER_RUN_NUMBER']),
            'githubRunAttempt': int(os.environ['RENDER_RUN_ATTEMPT']),
            'githubRunUrl': os.environ['RENDER_RUN_URL'],
            'createdAt': os.environ['RENDER_CREATED_AT'],
            'updatedAt': os.environ['RENDER_UPDATED_AT'],
            'completionReceipt': True
          }
          Path(f'control-plane/receipts/{rid}.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
          git config user.name 'ugi-control-plane-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "control-plane/receipts/${RID}.json"
          git commit -m "chore: persist UGI render receipt ${RID}"
          git pull --rebase origin main
          git push origin HEAD:main
