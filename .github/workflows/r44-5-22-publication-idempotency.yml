name: UGI R44.5.22 Publication Idempotency

# Production Worker mutation is explicit only. Source pushes and maintenance
# changes must never redeploy the publication plane automatically.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live exactly-once guard first
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/api/health" -o /tmp/health-before.json
          live=false
          if jq -e '.ok == true
            and .capabilities.publicationExactlyOnceGuard == true
            and .capabilities.publicationAssetLockR2 == true
            and .capabilities.publicationSlotLockR2 == true
            and .capabilities.publicationRetryCreateBlockedOnUncertain == true
            and .bindings.MEDIA_R2 == true
            and .bindings.BUFFER_API_KEY == true' /tmp/health-before.json >/dev/null; then
            live=true
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: Install requests
        if: steps.preflight.outputs.live != 'true'
        run: python -m pip install --disable-pip-version-check requests

      - name: Deploy exactly-once Buffer guard preserving exact live bindings
        if: steps.preflight.outputs.live != 'true'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          echo "::add-mask::$CF_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          mkdir -p cloudflare/status

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/r44_5_22_publication_idempotency.py')
          s=p.read_text(encoding='utf-8')
          old='''    if route.count(success_anchor)!=1:\n        raise RuntimeError(f'platform publish success anchor count={route.count(success_anchor)}')\n    success_repl='''
          new='''    success_pos=route.find(success_anchor)\n    if success_pos < 0:\n        raise RuntimeError('platform publish success anchor missing')\n    success_repl='''
          if old in s:
              s=s.replace(old,new,1)
              old2='''    route=route.replace(success_anchor,success_repl,1)\n\n    catch_candidates='''
              new2='''    route=route[:success_pos]+success_repl+route[success_pos+len(success_anchor):]\n\n    catch_candidates='''
              if old2 not in s:
                  raise SystemExit('runtime helper replacement anchor missing')
              s=s.replace(old2,new2,1)
              p.write_text(s,encoding='utf-8')
          PY

          python -m py_compile scripts/r44_5_22_publication_idempotency.py
          python scripts/r44_5_22_publication_idempotency.py

      - name: Verify terminal worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/api/health" -o /tmp/health-after.json
          jq -e '.ok == true
            and .capabilities.publicationExactlyOnceGuard == true
            and .capabilities.publicationAssetLockR2 == true
            and .capabilities.publicationSlotLockR2 == true
            and .capabilities.publicationRetryCreateBlockedOnUncertain == true
            and .bindings.MEDIA_R2 == true
            and .bindings.BUFFER_API_KEY == true' /tmp/health-after.json >/dev/null

      - name: Persist deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          if [ "${{ steps.preflight.outputs.live }}" = "true" ]; then
            {
              echo 'R44.5.22_STAGE=PUBLICATION_IDEMPOTENCY'
              echo 'STATE=ALREADY_LIVE_VERIFIED'
              echo 'WORKER_HEALTH_PASS=true'
              echo 'PUBLICATION_EXACTLY_ONCE_GUARD=true'
              echo 'PUBLICATION_ASSET_LOCK_R2=true'
              echo 'PUBLICATION_SLOT_LOCK_R2=true'
              echo 'UNCERTAIN_RETRY_CREATE_BLOCKED=true'
              echo 'BUFFER_PROVIDER_UNCHANGED=true'
              echo 'METRICOOL_PUBLICATION_ALLOWED=false'
              echo 'PAYMENT_TRIGGERED=false'
              echo 'OK=true'
            } > cloudflare/status/r44-5-22-publication-idempotency.txt
          else
            test -f cloudflare/status/r44-5-22-publication-idempotency.txt || echo 'R44.5.22_STAGE=STATUS_MISSING' > cloudflare/status/r44-5-22-publication-idempotency.txt
          fi
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git pull --rebase origin main || true
          git add cloudflare/status/r44-5-22-publication-idempotency.txt
          git commit -m 'UGI R44.5.22 — deployment evidence [skip ci]' || true
          git push origin HEAD:main
