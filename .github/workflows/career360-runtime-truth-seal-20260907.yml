name: Career360 Runtime Truth Seal 2026-09-07
run-name: Career360 Runtime Truth Seal ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths: ['.github/workflows/career360-runtime-truth-seal-20260907.yml']

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch authoritative recovery
        shell: bash
        run: |
          set -euo pipefail
          python career360/scripts/update-recovery-runtime-truth-20260907.py
          git diff --check
          grep -F 'CLOUDFLARE_V16_BROWSER_PRELOGIN=PASS' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'RLS_PUBLIC_TABLES=PASS_47_OF_47_WITH_POLICY' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'ROLE_INTELLIGENCE_V3_CHAMPION_ALIGNED=LIVE' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '34084862777' docs/LSI_RECOVERY_CURRENT.md >/dev/null
      - name: Commit recovery seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          git diff --cached --quiet && { echo 'HARD_STOP_NO_RECOVERY_DIFF'; exit 1; }
          git commit -m 'career360: update authoritative recovery with 2026-09-07 runtime truth'
          git push origin HEAD:main
          echo "RECOVERY_SEAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'RECOVERY_RUNTIME_TRUTH_SEAL=PASS' >> "$GITHUB_STEP_SUMMARY"
