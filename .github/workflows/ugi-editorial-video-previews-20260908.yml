name: UGI Editorial Video Previews 2026-09-08

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_editorial_20260908_video_previews.py'
      - '.github/workflows/ugi-editorial-video-previews-20260908.yml'

permissions:
  contents: write

concurrency:
  group: ugi-editorial-video-previews-20260908
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Build preview videos
        run: |
          set -euo pipefail
          python scripts/ugi_editorial_20260908_video_previews.py
      - name: Persist preview media only
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-video-bot'
          git config user.email 'ugi-editorial-video-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-08
          git commit -m 'preview: UGI real-company videos 2026-09-08' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
