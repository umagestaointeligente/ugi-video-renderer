name: Cena Certa Sep11 Title Repair

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - '.github/workflows/cena-certa-sep11-title-repair.yml'

permissions:
  contents: write
  packages: read

jobs:
  repair-and-activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    container:
      image: ghcr.io/umagestaointeligente/cena-certa-runtime@sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cena-certa-factory-v2-certified
      - name: Rebuild exact batch and repair mask titles only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          src=pathlib.Path('.github/workflows/cena-certa-sep11-dispatch-bootstrap.yml').read_text(encoding='utf-8')
          marker="python - <<'PY'\n"
          code=src.split(marker,1)[1].split("\n          PY",1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          exec(compile(code,'sep11-bootstrap-generator','exec'),{})
          p=pathlib.Path('ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          short={
            'CC-20260911-GUARDIANS3-V1':'Guardians Vol. 3',
            'CC-20260911-WAKANDA-V1':'Wakanda Forever',
            'CC-20260911-SHANGCHI-V1':'Shang-Chi',
            'CC-20260911-PHANTOM-MENACE-V1':'Star Wars: Episode I',
            'CC-20260911-HOME-ALONE-V1':'Home Alone',
            'CC-20260911-THUNDERBOLTS-V1':'Thunderbolts*',
            'CC-20260911-AVATAR2-V1':'Avatar 2',
            'CC-20260911-INDIANA5-V1':'Indiana Jones 5'
          }
          for item in data:
              item['film_title']=short[item['id']]
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('SEP11_MASK_TITLE_REPAIR_PASS',[(x['id'],x['film_title']) for x in data])
          PY
      - name: Activate exact validated 8-to-8 dispatch
        shell: bash
        run: |
          set -euo pipefail
          python ops/cena-certa/dispatch_activate.py \
            --batch ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json \
            --select-count 8 \
            --reserve-count 0 \
            --note 'Paulo authorized final video production, editorial continuation and scheduling for 11/09; mask-title overflow repaired without changing film selection.'
      - name: Persist validated batch and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='feat/cena-certa-factory-v2-certified'; api='https://api.github.com/repos/'+repo+'/contents/'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CenaCertaFactoryV2'}
          def meta(path):
              url=api+urllib.parse.quote(path,safe='/')+'?ref='+urllib.parse.quote(branch,safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code==404: return None
                  raise
          def put(path,message):
              raw=pathlib.Path(path).read_bytes(); m=meta(path); payload={'message':message,'content':base64.b64encode(raw).decode(),'branch':branch}
              if m: payload['sha']=m['sha']
              req=urllib.request.Request(api+urllib.parse.quote(path,safe='/'),data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req,timeout=45) as r: out=json.loads(r.read().decode())
              print('CONTENTS_API_WRITE_PASS',path,out['commit']['sha'])
          put('ops/cena-certa/batches/cena-certa-daily8-20260911-v1.json','ops(cena-certa): persist Sep 11 validated batch')
          put('ops/cena-certa/dispatch.json','ops(cena-certa): dispatch Sep 11 primary eight')
          PY
