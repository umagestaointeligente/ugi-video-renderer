name: UGI Import Today Live Receipts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-import-today-live-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Import live Buffer receipts
        run: |
          set -euo pipefail
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python scripts/ugi_import_today_live_receipts.py
      - name: Verify due deliveries
        id: verify
        continue-on-error: true
        run: python scripts/ugi_delivery_verifier.py
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-live-proof-bot'
          git config user.email 'ugi-live-proof@users.noreply.github.com'
          git add control-plane/publisher-hub/receipts/UGI-20260830-LIVE-IMPORT.json control-plane/delivery-proof/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist UGI live delivery evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Alert on delivery failure
        if: steps.verify.outcome == 'failure'
        run: |
          TITLE='UGI ALERT — publicação atrasada ou falhou'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file control-plane/delivery-proof/latest.json
          else
            gh issue create --title "$TITLE" --body-file control-plane/delivery-proof/latest.json
          fi
          exit 1
