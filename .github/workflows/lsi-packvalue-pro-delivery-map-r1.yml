name: LSI PackValue PRO Delivery Map R1
run-name: LSI PackValue PRO Delivery Map R1 ${{ github.run_id }}
on:
  push:
    branches: [lsi-revenue-asaas-greenfield-r1-20260830]
    paths: ['.github/workflows/lsi-packvalue-pro-delivery-map-r1.yml']
permissions: {contents: read}
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Map delivery lines
        env:
          CF_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail; test -n "$CF_API_TOKEN"; test -n "$CF_ACCOUNT_ID"; echo "::add-mask::$CF_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/lola-operacional-ugi"
          curl --fail --silent --show-error -D /tmp/h -H "Authorization: Bearer ${CF_API_TOKEN}" "$base" >/tmp/b
          python - <<'PY'
          import re
          from email import policy
          from email.parser import BytesParser
          h=open('/tmp/h','rb').read().decode('latin1'); b=open('/tmp/b','rb').read(); ct=re.search(r'(?im)^content-type:\s*([^\r\n]+)',h).group(1).strip()
          if 'multipart/' in ct:
            msg=BytesParser(policy=policy.default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode()+b); parts=[p.get_payload(decode=True) or b'' for p in msg.iter_parts()]; c=[x for x in parts if b'/api/material-delivery/' in x and b'createProviderCheckout' in x]; s=c[0].decode()
          else:s=b.decode()
          lines=s.splitlines(); hits=[]
          for i,line in enumerate(lines,1):
            if 'Content-Disposition' in line or ('fileName' in line and 'grant' in line) or ('mimeType' in line and ('html' in line or 'extension' in line or 'ext' in line)):
              hits.append((i,line.strip()[:700]))
          print('DELIVERY_RELEVANT_LINES='+str(len(hits)))
          for i,line in hits[:30]: print(f'DELIVERY_LINE {i}: {line}')
          PY
