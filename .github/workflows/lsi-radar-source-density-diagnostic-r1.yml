name: LSI Radar Source Density Diagnostic R1
run-name: LSI Radar Source Density Diagnostic R1 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths: ['.github/workflows/lsi-radar-source-density-diagnostic-r1.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official source density in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence /tmp/radar-density
          python - <<'PY'
          import concurrent.futures, datetime as dt, json, subprocess, time, urllib.parse
          today=dt.datetime.now(dt.timezone.utc).date()
          fromd=today-dt.timedelta(days=90)
          final=today+dt.timedelta(days=45)
          compras='https://dadosabertos.compras.gov.br/modulo-contratacoes/1_consultarContratacoes_PNCP_14133'
          pncp='https://pncp.gov.br/api/consulta/v1/contratacoes/proposta'
          jobs=[]
          for m in ['4','5','6','8']:
              q=urllib.parse.urlencode({'pagina':'1','tamanhoPagina':'100','dataPublicacaoPncpInicial':fromd.isoformat(),'dataPublicacaoPncpFinal':today.isoformat(),'codigoModalidade':m})
              jobs.append(('Compras.gov.br',m,f'{compras}?{q}'))
          for m in ['4','5','6','8']:
              q=urllib.parse.urlencode({'dataFinal':final.strftime('%Y%m%d'),'codigoModalidadeContratacao':m,'pagina':'1'})
              jobs.append(('PNCP propostas abertas',m,f'{pncp}?{q}'))
          def rows(payload):
              if isinstance(payload,list): return payload
              if not isinstance(payload,dict): return []
              for k in ['resultado','resultados','results','data','content']:
                  if isinstance(payload.get(k),list): return payload[k]
              return []
          def probe(item):
              provider,mod,url=item; start=time.time()
              p=subprocess.run(['curl','--max-time','20','-sS','-w','\n%{http_code}',url],capture_output=True,text=True)
              elapsed=round((time.time()-start)*1000)
              if '\n' in p.stdout:
                  body,code=p.stdout.rsplit('\n',1)
              else: body,code=p.stdout,'0'
              try: payload=json.loads(body); count=len(rows(payload))
              except Exception: count=0
              return {'provider':provider,'modality':mod,'http':int(code or 0) if str(code).isdigit() else 0,'count':count,'elapsed_ms':elapsed,'curl_rc':p.returncode}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              result=list(ex.map(probe,jobs))
          result.sort(key=lambda x:(x['provider'],x['modality']))
          usable=[x for x in result if x['http']==200 and x['count']>0]
          out={'schema_version':'1.0','project':'LSI_REVENUE_DEMAND_FIRST','component':'RADAR_SOURCE_DENSITY_DIAGNOSTIC','window_days':90,'open_horizon_days':45,'results':result,'usable':usable,'best':sorted(usable,key=lambda x:(-x['count'],x['elapsed_ms']))[:4]}
          open('generated/evidence/lsi-radar-source-density-diagnostic-r1.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not usable: raise SystemExit('NO_DENSE_OFFICIAL_SOURCE_FOUND')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lsi-radar-source-density-diagnostic-r1-${{ github.run_id }}
          path: generated/evidence/lsi-radar-source-density-diagnostic-r1.json
          retention-days: 14
