name: Career360 V16 Runtime Truth Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-runtime-truth-patch.yml'

permissions:
  contents: write

concurrency:
  group: career360-v16-runtime-truth-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime truth correction
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_runtime_truth_patch.py patch
          cp career360/frontend/app-m.js /tmp/app-m.mjs
          node --check /tmp/app-m.mjs
          node --check career360/tests/v16-clarity-smoke.mjs

      - name: Commit immutable source and bundle pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add career360/frontend/app-m.js career360/tests/v16-clarity-smoke.mjs
          git diff --cached --check
          git commit -m 'career360: derive proactive status from real UI state'
          APP_M_SHA="$(git rev-parse HEAD)"
          echo "V16_APP_M_IMMUTABLE=$APP_M_SHA"
          python3 career360/tools/v16_runtime_truth_patch.py repin "$APP_M_SHA"
          git add career360/frontend/index.html
          git diff --cached --check
          git commit -m 'career360: repin bundle to runtime-truth V16'
          echo "V16_RUNTIME_TRUTH_BUNDLE=$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo 'V16_RUNTIME_TRUTH_PUSH=PASS'
