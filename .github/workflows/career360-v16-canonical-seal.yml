name: Career360 V16 Canonical Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-canonical-seal.yml'

permissions:
  contents: write

concurrency:
  group: career360-v16-canonical-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Seal current V16 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_canonical_seal.py
          git diff --check

      - name: Commit canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md
          git diff --cached --check
          git commit -m 'career360: seal truthful V16 canonical evidence'
          git push origin HEAD:main
          echo 'V16_CANONICAL_DOC_PUSH=PASS'
