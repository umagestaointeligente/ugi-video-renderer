name: Cena Certa Sep26 Recovery Render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cena-certa-sep26-recovery-render.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: cena-certa-sep26-recovery-render
  cancel-in-progress: true
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        video_id:
          - CC-20260926-TT-LOQUE
          - CC-20260926-IG-MINOS
          - CC-20260926-YT-GRIEF
          - CC-20260926-FB-STOPOVER
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIDEO_ID: ${{ matrix.video_id }}
      UGI_VIDEO_UPLOAD_URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      UGI_VIDEO_UPLOAD_KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-lato ca-certificates curl >/dev/null
          python -m pip install -q edge-tts pillow
      - name: Render, QA and deliver
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_VIDEO_UPLOAD_URL"
          test -n "$UGI_VIDEO_UPLOAD_KEY"
          python ops/cena-certa-runtime/sep26_recovery.py
          test -s "output/$VIDEO_ID.mp4"
          test -s "output/$VIDEO_ID.qa.json"
          test -s "output/$VIDEO_ID.r2.json"
      - name: Evidence issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "STATUS=READY"
            echo "VIDEO_ID=$VIDEO_ID"
            echo
            echo "QA:"
            cat "output/$VIDEO_ID.qa.json"
            echo
            echo "R2:"
            cat "output/$VIDEO_ID.r2.json"
          } > work/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-SEP26-READY] $VIDEO_ID" --body-file work/issue.md
      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.video_id }}
          path: |
            output/${{ matrix.video_id }}.mp4
            output/${{ matrix.video_id }}.qa.json
            output/${{ matrix.video_id }}.r2.json
            work/source-fingerprint.txt
            work/dedupe.txt
          retention-days: 7
          if-no-files-found: warn
