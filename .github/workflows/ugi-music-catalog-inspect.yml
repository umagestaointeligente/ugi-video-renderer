name: UGI Music Catalog Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-music-catalog-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read music catalog
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          mkdir -p control-plane/music-catalog-inspect
          curl --fail --silent --show-error --location --max-time 120 \
            -H "x-lola-command-key: $UGI_WORKER_COMMAND_KEY" \
            -H 'accept: application/json' \
            -X POST \
            -d '{}' \
            -H 'content-type: application/json' \
            "$WORKER_URL/api/music/catalog" \
            | jq '.' > control-plane/music-catalog-inspect/latest.json
      - name: Persist catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-music-catalog-bot'
          git config user.email 'ugi-music-catalog@users.noreply.github.com'
          git add control-plane/music-catalog-inspect/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: inspect UGI music catalog'
          git pull --rebase origin main
          git push origin HEAD:main
