name: VSA Sep18 Production
# trigger: production contract armed after workflow creation

on:
  workflow_dispatch:
  push:
    branches:
      - ops/vsa-sep18-production
    paths:
      - '.github/workflows/vsa-sep18-production.yml'
      - 'production/vsa/2026-09-18/production_today.py'
      - 'scripts/vsa/render_canonical_v2.py'
      - 'scripts/vsa/render_preventive_v3.py'
      - 'config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json'
      - 'scripts/vsa/validate_release_receipt.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vsa-sep18-production.yml'
      - 'production/vsa/2026-09-18/production_today.py'
      - 'scripts/vsa/render_canonical_v2.py'
      - 'scripts/vsa/render_preventive_v3.py'
      - 'config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json'
      - 'scripts/vsa/validate_release_receipt.py'

permissions:
  contents: write

concurrency:
  group: vsa-sep18-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated production branch
        uses: actions/checkout@v4
        with:
          ref: ops/vsa-sep18-production

      - name: Validate Python before dependencies
        run: |
          set -euo pipefail
          python -m py_compile \
            production/vsa/2026-09-18/production_today.py \
            production/vsa/2026-09-16/recovery_today.py \
            scripts/vsa/render_canonical_v2.py \
            scripts/vsa/render_preventive_v3.py \
            scripts/vsa/validate_release_receipt.py

      - name: Install zero-cost render dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq
          python -m pip install --upgrade pip
          python -m pip install edge-tts Pillow numpy requests

      - name: Build fresh five-item VSA slate
        run: |
          set -euo pipefail
          python production/vsa/2026-09-18/production_today.py 2>&1 | tee production/vsa/2026-09-18/BUILD_LOG.txt
          test -s production/vsa/2026-09-18/RELEASE_MANIFEST.json
          jq -e '.all_release_eligible == true and (.results|length)==5 and .scheduler_mutated == false' production/vsa/2026-09-18/RELEASE_MANIFEST.json

      - name: Commit release manifest for operator readback
        run: |
          set -euo pipefail
          git config user.name "vsa-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add production/vsa/2026-09-18/RELEASE_MANIFEST.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(vsa): persist Sep18 release manifest [skip ci]"
          git push origin HEAD:ops/vsa-sep18-production

      - name: Upload masters and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsa-sep18-production
          path: |
            production/vsa/2026-09-18/output/
            production/vsa/2026-09-18/BUILD_LOG.txt
            production/vsa/2026-09-18/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
