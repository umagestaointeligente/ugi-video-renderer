name: Career360 ONET31 Runtime Seal

on:
  push:
    branches: [main]
    paths:
      - 'career360/tools/onet31_runtime_seal.py'
      - '.github/workflows/career360-onet31-runtime-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical O*NET runtime seal
        run: python career360/tools/onet31_runtime_seal.py
      - name: Verify canonical states
        run: |
          grep -q 'ONET_31_BULK_SYNC=LIVE' docs/LSI_RECOVERY_CURRENT.md
          grep -q 'ONET_MATCHING_REGRESSION=57_OF_57_CLASS_AND_SCORE_STABLE' docs/LSI_RECOVERY_CURRENT.md
          grep -q 'SUPABASE_PUBLIC_TABLE_RLS=47_OF_47' docs/LSI_RECOVERY_CURRENT.md
          grep -q 'official Vercel production remains V14' docs/LSI_RECOVERY_CURRENT.md
          grep -q 'ONET_31_BULK_SYNC=LIVE' career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md
      - name: Commit canonical seal
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md career360/releases/MASTER_PILOT_1_0_CLARITY_UI_V16_2026-09-06.md
          git commit -m 'career360: seal O*NET 31 live runtime state'
          git push
