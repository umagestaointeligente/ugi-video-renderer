name: Orbit Cena Certa Facebook Batch Sep10

on:
  push:
    paths:
      - '.github/workflows/orbit-cena-certa-facebook-batch-sep10-20260910.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch guarded Facebook schedules serially
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: umagestaointeligente/ugi-video-renderer
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local key="$1" media="$2" caption="$3" when="$4"
            echo "DISPATCH=$key $when"
            gh workflow run orbit-cena-certa-facebook-direct.yml \
              --repo "$GH_REPO" \
              --ref orbit/direct-publisher-v1 \
              -f item_key="$key" \
              -f media_url="$media" \
              -f caption="$caption" \
              -f publish_at="$when" \
              -f format=video \
              -f expected_page_id=1314911305035494 \
              -f graph_version=v23.0
            sleep 2
          }

          dispatch 'cc-fb-20260910-0950-avatar' 'https://static.metricool.com/planner/202609/6809869-file-5595474224742679778.mp4' '🎬 Avatar: Fire and Ash (2025)\n\nJake precisa proteger a família enquanto Pandora enfrenta uma ameaça que agora também divide os próprios Na’vi.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T12:50:00Z'
          dispatch 'cc-fb-20260910-1055-fantastic-four' 'https://static.metricool.com/planner/202609/6809869-file-12107579948747182229.mp4' '🎬 The Fantastic Four: First Steps (2025)\n\nA família mais famosa da Marvel precisa enfrentar Galactus sem deixar de proteger aquilo que a mantém unida.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T13:55:00Z'
          dispatch 'cc-fb-20260910-1220-freakier-friday' 'https://static.metricool.com/planner/202609/6809869-file-5344562135665139186.mp4' '🎬 Freakier Friday (2025)\n\nAnos depois da primeira troca, Anna e Tess descobrem que a confusão voltou — agora envolvendo uma nova geração.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T15:20:00Z'
          dispatch 'cc-fb-20260910-1445-mandalorian-grogu' 'https://static.metricool.com/planner/202609/6809869-file-2541473595053156097.mp4' '🎬 The Mandalorian & Grogu (2026)\n\nDin Djarin e Grogu voltam à estrada enquanto restos do Império ainda ameaçam uma galáxia tentando se reorganizar.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T17:45:00Z'
          dispatch 'cc-fb-20260910-1555-tron-ares' 'https://static.metricool.com/planner/202609/6809869-file-6675897578004913803.mp4' '🎬 TRON: Ares (2025)\n\nUm programa cruza a fronteira digital e chega ao nosso mundo. O problema é que Ares começa a tomar suas próprias decisões.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T18:55:00Z'
          dispatch 'cc-fb-20260910-1710-lilo-stitch' 'https://static.metricool.com/planner/202609/6809869-file-9593390560294638437.mp4' '🎬 Lilo & Stitch (2025)\n\nLilo adota uma criatura que parece impossível de controlar. Só depois descobre que Stitch foi criado para destruir.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T20:10:00Z'
          dispatch 'cc-fb-20260910-1830-snow-white' 'https://static.metricool.com/planner/202609/6809869-file-16299976514689167123.mp4' '🎬 Snow White (2025)\n\nBranca de Neve foge de uma rainha que governa pelo medo e precisa descobrir se tem coragem para voltar.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T21:30:00Z'
          dispatch 'cc-fb-20260910-1950-zootopia2' 'https://static.metricool.com/planner/202609/6809869-file-16383714918174588957.mp4' '🎬 Zootopia 2 (2025)\n\nJudy e Nick investigam uma serpente misteriosa e acabam descobrindo segredos que podem mudar a cidade inteira.\n\n💬 Você assistiria?\n\n#CenaCerta #Cinema #Filme' '2026-09-10T22:50:00Z'

          echo DISPATCH_COUNT=8
