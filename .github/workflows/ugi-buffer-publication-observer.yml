name: UGI Buffer Publication Observer

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-buffer-publication-observer.yml'
      - 'scripts/ugi_buffer_publication_observer.py'

permissions:
  contents: write

concurrency:
  group: ugi-buffer-publication-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --quiet requests
      - name: Observe Buffer publication path without mutating posts
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python scripts/ugi_buffer_publication_observer.py
      - name: Persist observability state
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-buffer-observer-bot'
          git config user.email 'ugi-buffer-observer@users.noreply.github.com'
          git add control-plane/observability/buffer-publication/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No observability state change'
            exit 0
          fi
          git commit -m 'chore: persist Buffer publication observability [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
