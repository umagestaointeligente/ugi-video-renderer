name: Cena Certa Oct01 Rebuild
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-oct01-rebuild.yml
      - scripts/cena_certa_oct01_rebuild.py
      - ops/cena-certa-oct01/manifest.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp edge-tts
      - name: Render and QA 12 masters
        run: |
          set -euo pipefail
          python scripts/cena_certa_oct01_rebuild.py
      - name: Require current execution-bound editorial evidence
        run: |
          set -euo pipefail
          python scripts/cena_certa_render_evidence_guard.py out/cena-certa-oct01/summary.json ops/cena-certa-oct01/prepublish-receipts.json out/cena-certa-oct01/release-preflight.json

      - name: Publish approved masters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cena-certa-oct01-rebuild
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Oct01 Rebuild" --notes "Corrected 1990+ / 2000+ preferred multiplatform pack."
          gh release upload "$TAG" out/cena-certa-oct01/*.mp4 --repo "$GITHUB_REPOSITORY"
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_OCT01_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "PUBLICATION_STATUS=NOT_VERIFIED"
            echo
            cat out/cena-certa-oct01/summary.json
          } > out/cena-certa-oct01/issue.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-OCT01-PACK] $GITHUB_RUN_ID" --body-file out/cena-certa-oct01/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-oct01-${{ github.run_id }}
          path: out/cena-certa-oct01/
          retention-days: 7
