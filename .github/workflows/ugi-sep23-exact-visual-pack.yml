name: UGI Sep23 Exact Visual Video Pack
on:
  push:
    paths: ['.github/workflows/ugi-sep23-exact-visual-pack.yml']
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -U edge-tts 'yt-dlp[default,curl-cffi]' pillow requests
      - name: Build exact-subject assets
        shell: bash
        run: |
          set -euo pipefail
          O=public/ugi/editorial/2026-09-23; mkdir -p "$O"
          python - <<'PY'
          import requests,pathlib,textwrap
          from PIL import Image,ImageDraw,ImageFont
          from io import BytesIO
          p=pathlib.Path("public/ugi/editorial/2026-09-23"); bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          items=[
          ("linkedin-vilarejo.jpg","https://odia.ig.com.br/_midias/png/2024/10/07/vilarejo_praia_set_2024_foto_cezar_fernandes_37-34219532.png",(1200,627),"GRUPO VILAREJO","R$ 90 MI PARA SAIR DO RIO E CRESCER NO SUDESTE"),
          ("instagram-mari-mascavo.jpg","https://f.i.uol.com.br/fotografia/2025/08/27/175632449068af628a85a63_1756324490_3x2_rt.jpg",(1080,1350),"MARI SAAD • MASCAVO","SER SÓCIO MAJORITÁRIO É O MESMO QUE CONTROLAR?"),
          ("tiktok-melia.jpg","https://cdn.luxuryhotel.world/file/hotcdn/hotel/cover-small/16304_1762956258.jpg",(1080,1920),"MELIÁ HOTELS","DE 12 PARA 30 HOTÉIS NO BRASIL")
          ]
          for fn,url,size,kicker,title in items:
            r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0"}); r.raise_for_status()
            im=Image.open(BytesIO(r.content)).convert("RGB"); ratio=max(size[0]/im.width,size[1]/im.height); im=im.resize((int(im.width*ratio),int(im.height*ratio)))
            x=(im.width-size[0])//2;y=(im.height-size[1])//2;im=im.crop((x,y,x+size[0],y+size[1]))
            d=ImageDraw.Draw(im,"RGBA"); d.rectangle((0,int(size[1]*.58),size[0],size[1]),fill=(0,0,0,180))
            d.text((50,int(size[1]*.64)),kicker,font=ImageFont.truetype(bold,30),fill="white"); yy=int(size[1]*.72)
            for line in textwrap.wrap(title,32): d.text((50,yy),line,font=ImageFont.truetype(bold,44),fill="white"); yy+=54
            im.save(p/fn,quality=92)
          PY
          yt-dlp -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o "$O/tupy-source.mp4" "https://www.youtube.com/watch?v=WmEHuMpjC3Y"
          cat > "$O/youtube.txt" <<'TXT'
          Quando a margem cai, esperar o mercado melhorar é uma estratégia perigosa. A Tupy, multinacional brasileira de engenharia e fundição, entrou em 2026 reorganizando fábricas, preços, custos, capital de giro e investimentos. O objetivo declarado é recuperar margens, reduzir a dependência do ciclo de caminhões pesados e baixar a alavancagem líquida para menos de três vezes até o fim do ano. O caso ajuda a enxergar cinco alavancas que qualquer operação industrial precisa acompanhar. Primeiro, preço: onde existe poder de repasse e onde o cliente realmente compara alternativas. Segundo, custo: cortar desperdício sem destruir capacidade. Terceiro, capital de giro: estoque e prazo consomem caixa antes de aparecerem no resultado. Quarto, utilização dos ativos: máquina parada ou rodando no mix errado corrói retorno. Quinto, portfólio: complexidade só vale quando remunera o capital. A Tupy também anunciou cerca de um bilhão e trezentos milhões de reais em novos contratos. O ponto não é prever se o ciclo vai melhorar. É entender quanto da recuperação depende de decisões internas. Margem é consequência do mercado, mas também de centenas de escolhas operacionais. Se a demanda não melhorar nos próximos doze meses, quais decisões ainda estão sob controle da sua gestão?
          TXT
          edge-tts --voice pt-BR-AntonioNeural --rate=-1% --text "$(cat "$O/youtube.txt")" --write-media "$O/youtube.mp3"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$O/youtube.mp3")
          ffmpeg -y -stream_loop -1 -i "$O/tupy-source.mp4" -i "$O/youtube.mp3" -filter_complex "[0:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,setsar=1,drawbox=x=0:y=0:w=iw:h=150:color=black@0.35:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TUPY: 5 ALAVANCAS PARA RECUPERAR MARGEM':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=48[v];[1:a]loudnorm=I=-16:TP=-1.5:LRA=9[a]" -map "[v]" -map "[a]" -t "$D" -c:v libx264 -preset veryfast -crf 20 -c:a aac -b:a 160k "$O/youtube-tupy-margem.mp4"
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("public/ugi/editorial/2026-09-23")
          (p/"qa.json").write_text(json.dumps({"state":"PASS","exactCompanyVisual":True,"realMotionVideo":True,"noSlideshow":True,"youtubeSource":"Official Tupy company video embedded on Tupy careers page","voice":"pt-BR-AntonioNeural","cards":["Grupo Vilarejo real resort photo","Mari Saad real photo holding Mascavo product","Meliá Brasil 21 real facade with brand name visible"]},ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name ugi-editorial-bot
          git config user.email ugi-editorial-bot@users.noreply.github.com
          git add public/ugi/editorial/2026-09-23
          git commit -m "assets(ugi): Sep23 exact-company editorial [skip ci]"
          git push
