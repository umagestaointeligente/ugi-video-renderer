name: Career360 V16 Truthful UX Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-truthful-ux-hardening.yml'

permissions:
  contents: write

concurrency:
  group: career360-v16-truthful-ux-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V16 truthful UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_truthful_hardening.py patch
          cp career360/frontend/app-m.js /tmp/app-m.mjs
          node --check /tmp/app-m.mjs
          node --check career360/tests/v16-clarity-smoke.mjs

      - name: Commit immutable UI source and repin bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add career360/frontend/app-m.js career360/tests/v16-clarity-smoke.mjs
          git diff --cached --check
          git commit -m 'career360: harden V16 truthful states and compact flows'
          APP_M_SHA="$(git rev-parse HEAD)"
          echo "V16_APP_M_IMMUTABLE=$APP_M_SHA"
          python3 career360/tools/v16_truthful_hardening.py repin "$APP_M_SHA"
          git add career360/frontend/index.html .github/workflows/career360-v16-clarity-smoke.yml
          git diff --cached --check
          git commit -m 'career360: repin bundle to truthful V16 hardening'
          echo "V16_TRUTHFUL_BUNDLE=$(git rev-parse HEAD)"

      - name: Remove temporary hardening route and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/career360-v16-truthful-ux-hardening.yml
          rm career360/tools/v16_truthful_hardening.py
          git add .github/workflows/career360-v16-truthful-ux-hardening.yml career360/tools/v16_truthful_hardening.py
          git commit -m 'career360: remove temporary V16 hardening route'
          git push origin HEAD:main
          echo 'V16_TRUTHFUL_UX_PUSH=PASS'
