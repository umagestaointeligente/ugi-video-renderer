name: Career360 V16 Truthful UX Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-v16-truthful-ux-hardening.yml'

permissions:
  contents: write

concurrency:
  group: career360-v16-truthful-ux-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V16 truthful UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 career360/tools/v16_truthful_hardening.py patch
          cp career360/frontend/app-m.js /tmp/app-m.mjs
          node --check /tmp/app-m.mjs
          node --check career360/tests/v16-clarity-smoke.mjs

      - name: Commit immutable UI source and repin index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-career360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add career360/frontend/app-m.js career360/tests/v16-clarity-smoke.mjs
          git diff --cached --check
          git commit -m 'career360: harden V16 truthful states and compact flows'
          APP_M_SHA="$(git rev-parse HEAD)"
          echo "V16_APP_M_IMMUTABLE=$APP_M_SHA"
          python3 - "$APP_M_SHA" <<'PY'
          from pathlib import Path
          import re,sys
          sha=sys.argv[1]
          p=Path('career360/frontend/index.html')
          s=p.read_text()
          pat=r'@([0-9a-f]{40})/career360/frontend/app-m\.js'
          hits=re.findall(pat,s)
          if len(hits)!=1:
              raise SystemExit(f'expected one app-m pin, got {len(hits)}')
          p.write_text(re.sub(pat,f'@{sha}/career360/frontend/app-m.js',s,count=1))
          PY
          git add career360/frontend/index.html
          git diff --cached --check
          git commit -m 'career360: repin bundle to truthful V16 hardening'
          echo "V16_TRUTHFUL_BUNDLE=$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo 'V16_TRUTHFUL_UX_PUSH=PASS'
