name: UGI Today Recovery Generate
run-name: UGI Today Recovery Generate ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-today-recovery-generate.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate three independent platform briefs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          mkdir -p control-plane/receipts/ugi-today
          python -m pip install --disable-pip-version-check requests
          python - <<'PY'
          import json,os,datetime,requests
          base=os.environ['WORKER_URL']; key=os.environ['UGI_LOLA_COMMAND_KEY']
          briefs=[
            {
              'platform':'instagram','contentId':'UGI-20260823-IG-001','type':'reel',
              'topic':'Checklist de 5 minutos para começar segunda-feira sem apagar incêndio',
              'objective':'saves shares retention',
              'keyMessage':'Antes de começar a segunda, elimine ruído: escolha três resultados, remova uma falsa urgência e delegue uma tarefa.',
              'cta':'Salve para usar amanhã cedo.',
              'commercialIntent':'none',
              'instructions':'Conteúdo independente para Instagram. Reel profissional, direto, sem introdução lenta, foco em saves e shares. Não reutilizar criativo recente. Não citar link no perfil nem produto.'
            },
            {
              'platform':'tiktok','contentId':'UGI-20260823-TT-001','type':'reel',
              'topic':'3 sinais de que sua segunda-feira vai começar apagando incêndio',
              'objective':'choose to view retention completion shares',
              'keyMessage':'Agenda lotada, nenhuma prioridade explícita e tudo marcado como urgente são sinais de segunda reativa.',
              'cta':'Comenta qual dos três mais acontece na sua rotina.',
              'commercialIntent':'none',
              'requestedVideoDuration':10,
              'instructions':'Conteúdo independente para TikTok. 7 a 12 segundos, hook no frame zero, cortes rápidos, sem introdução lenta, linguagem natural. Não reutilizar criativo recente. Não usar link no perfil.'
            },
            {
              'platform':'youtube','contentId':'UGI-20260823-YT-001','type':'reel',
              'topic':'Use IA em 2 minutos para transformar pendências em 3 prioridades de segunda',
              'objective':'choose to view average percentage viewed satisfaction',
              'keyMessage':'Liste as pendências, peça à IA para separar impacto, urgência real e delegação, e saia com três prioridades explícitas.',
              'cta':'Teste antes de abrir sua agenda amanhã.',
              'commercialIntent':'none',
              'instructions':'Conteúdo independente para YouTube Short. Hook imediato, explicação prática e fechamento curto. Não reutilizar criativo recente. Não citar produto ou oferta.'
            }
          ]
          headers={
            'content-type':'application/json',
            'accept':'application/json',
            'user-agent':'UGI-GitHub-Actions/1.0',
            'x-lola-command-key':key
          }
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'publication_provider':'BUFFER','analytics_provider':'METRICOOL','metricool_publication_allowed':False,'results':[]}
          for b in briefs:
            payload={k:v for k,v in b.items() if k!='platform'}
            try:
              r=requests.post(base+'/api/command',headers=headers,json=payload,timeout=180)
              try: body=r.json()
              except Exception: body={'raw':r.text[:1500]}
              out['results'].append({'platform':b['platform'],'http':r.status_code,'response':body})
            except Exception as e:
              out['results'].append({'platform':b['platform'],'error':repr(e)})
          open('control-plane/receipts/ugi-today/generation.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          if not all(x.get('http')==202 and x.get('response',{}).get('ok') for x in out['results']):
            raise SystemExit(2)
          PY
      - name: Persist generation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-autonomy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add control-plane/receipts/ugi-today/generation.json
          git commit -m 'UGI: persist Aug 23 recovery generation [skip ci]' || true
          git push origin HEAD:main
