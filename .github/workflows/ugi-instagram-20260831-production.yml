name: UGI Instagram 2026-08-31 Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-instagram-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-instagram-20260831-production
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audiovisual runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet requests pillow
      - name: Generate clean visual assets and licensed music videos
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_instagram_production_20260831.py --generate-only
      - name: Persist deterministic PNGs before scheduling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf control-plane/instagram-20260831/assets/_music
          rm -f control-plane/instagram-20260831/assets/*.mp4
          git config user.name 'ugi-instagram-production-bot'
          git config user.email 'ugi-instagram-production@users.noreply.github.com'
          git add control-plane/instagram-20260831/assets/*.png control-plane/instagram-20260831/assets/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'media: persist clean UGI Instagram assets for 2026-08-31'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Regenerate local AV after binary cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_instagram_production_20260831.py --generate-only
      - name: Schedule six Instagram pieces with readback proof
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python3 scripts/ugi_instagram_schedule_20260831_idempotent.py
      - name: Persist schedule receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-instagram-production-bot'
          git config user.email 'ugi-instagram-production@users.noreply.github.com'
          git add control-plane/instagram-20260831/receipts/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist UGI Instagram 2026-08-31 schedule receipts'
          git pull --rebase origin main
          git push origin HEAD:main
