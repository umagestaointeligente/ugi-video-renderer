name: LSI Learning Velocity Diagnostic R1
run-name: LSI Learning Velocity Diagnostic R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-mass-market-r1-20260829]
    paths:
      - '.github/workflows/lsi-learning-velocity-diagnostic-r1.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe endpoints with status and body
        shell: bash
        run: |
          set -u
          probe() {
            name="$1"
            url="$2"
            echo "=== $name ==="
            code="$(curl -sS --max-time 15 -o "/tmp/$name.json" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            head -c 4000 "/tmp/$name.json" 2>/dev/null || true
            echo
          }
          probe learning_health 'https://lsi-continual-learning-r1.umagestaointeligente.workers.dev/health'
          probe learning_state 'https://lsi-continual-learning-r1.umagestaointeligente.workers.dev/state'
          probe learning_events 'https://lsi-continual-learning-r1.umagestaointeligente.workers.dev/events'
          probe velocity_health 'https://lsi-revenue-velocity-r1.umagestaointeligente.workers.dev/health'
          probe velocity 'https://lsi-revenue-velocity-r1.umagestaointeligente.workers.dev/velocity'
