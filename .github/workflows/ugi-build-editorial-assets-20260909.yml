name: UGI Build Editorial Assets 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/ugi-build-editorial-assets-20260909.yml'
      - 'scripts/ugi_build_editorial_assets_20260909.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-build-editorial-assets-20260909
  cancel-in-progress: false

jobs:
  build-finals:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --quiet pillow requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Build rights-cleared final assets
        run: python scripts/ugi_build_editorial_assets_20260909.py

      - name: Verify final media
        run: |
          set -euo pipefail
          test -s public/ugi/editorial/2026-09-09/story-apple-0900.mp4
          test -s public/ugi/editorial/2026-09-09/story-apple-0907.mp4
          test -s public/ugi/editorial/2026-09-09/feed-qualcomm-amazon-1230.jpg
          test -s public/ugi/editorial/2026-09-09/linkedin-digital-resilience-1400.jpg
          test -s public/ugi/editorial/2026-09-09/story-resilience-1800.mp4
          test -s public/ugi/editorial/2026-09-09/story-resilience-1812.mp4
          test -s public/ugi/editorial/2026-09-09/feed-mistral-1915.jpg
          test -s public/ugi/editorial/2026-09-09/asset-provenance.json
          for f in public/ugi/editorial/2026-09-09/*.mp4; do
            ffprobe -v error -show_entries stream=codec_type,width,height -of json "$f"
          done

      - name: Commit exact finals and provenance
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-builder-bot'
          git config user.email 'ugi-editorial-builder@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-09
          if git diff --cached --quiet; then
            echo 'No asset changes to persist'
            exit 0
          fi
          git commit -m 'assets(ugi): build Sep 9 exact editorial finals [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
