name: UGI 2026-09-04 Story Routing Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_20260904_story_routing_diagnostic.py'
      - '.github/workflows/ugi-20260904-story-routing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-20260904-story-routing-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read live Worker state only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_LOLA_COMMAND_KEY"
          python -m pip install --disable-pip-version-check --quiet requests
          python scripts/ugi_20260904_story_routing_diagnostic.py
      - name: Persist diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-diagnostic-bot'
          git config user.email 'ugi-diagnostic@users.noreply.github.com'
          git add control-plane/recovery/UGI_20260904_STORY_ROUTING_DIAGNOSTIC.json
          git commit -m 'chore: persist 04/09 Story routing diagnostic' || true
          git pull --rebase origin main
          git push origin HEAD:main
