name: Cena Certa V2 Certified Smoke

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - 'vendor/cena-certa-factory-v2/src/**'
      - '.github/workflows/cena-certa-certified-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ROOT: vendor/cena-certa-factory-v2/src
  RUNTIME_IMAGE: ghcr.io/umagestaointeligente/cena-certa-runtime
  RUNTIME_DIGEST: sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c

jobs:
  certified-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/umagestaointeligente/cena-certa-runtime@sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v7

      - id: clock
        name: Start Factory SLA clock
        shell: bash
        run: |
          now=$(date +%s)
          echo "started=$now" >> "$GITHUB_OUTPUT"
          echo "FACTORY_SLA_START_EPOCH=$now"

      - name: Prove pinned full production runtime
        shell: bash
        run: |
          set -euo pipefail
          bash --version | head -1
          git --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          fc-match Lato | head -1
          export PYTHONPATH="$ROOT"
          python - <<'PY'
          import PIL,numpy,aiohttp,edge_tts
          assert PIL.__version__=='12.3.0'
          assert numpy.__version__=='2.5.2'
          assert aiohttp.__version__=='3.14.3'
          from factory.cena_certa.v2.prepare import prepare_one
          from factory.cena_certa.v2.voice import tts_with_real_boundaries
          from factory.cena_certa.v2.render import render_one
          from factory.cena_certa.v2.qa import qa_video
          print('PINNED_FULL_RUNTIME_HEALTH_PASS')
          print('PRODUCTION_PREP_TTS_IMPORT_PASS')
          PY
          echo "PINNED_RUNTIME=${RUNTIME_IMAGE}@${RUNTIME_DIGEST}"

      - name: Negative legacy scan and physical master gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vendor/cena-certa-factory-v2/assets-b64
          test ! -e vendor/cena-certa-factory-v2/payload-exact-v1
          test ! -e vendor/cena-certa-factory-v2/payload-test
          test ! -e vendor/cena-certa-factory-v2/payload-v2
          test ! -e .github/workflows/cena-certa-gitlab-r2-bridge-20260903.yml
          test ! -e .github/workflows/cena-certa-seal-assets-once.yml
          ! grep -RInE 'base64|\.b64|drive\.usercontent|d2ol7oe51mr4n9|mask_last_layer_patch|batch_2026_09_03|sed -i|assets-b64|payload-exact-v1|payload-test|payload-v2' "$ROOT"
          export PYTHONPATH="$ROOT"
          python -m py_compile "$ROOT"/factory/cena_certa/v2/*.py
          python - <<'PY'
          from factory.cena_certa.v2.common import verify_contract_and_assets
          verify_contract_and_assets()
          print('LEGACY_ROUTE_SCAN_PASS')
          print('PHYSICAL_ASSET_AND_CONTRACT_PASS')
          PY
          python -m factory.cena_certa.v2.preflight canary

      - name: Render and QA 10 consecutive outputs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$ROOT"
          mkdir -p slots
          cd "$ROOT"
          for slot in $(seq 0 9); do
            echo "SMOKE_RENDER_SLOT=$slot"
            python -m factory.cena_certa.v2.selftest
            cp output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.receipt.json "$GITHUB_WORKSPACE/slots/slot-${slot}.receipt.json"
            cp output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.mp4 "$GITHUB_WORKSPACE/slots/slot-${slot}.mp4"
          done
          cd "$GITHUB_WORKSPACE"
          test "$(find slots -maxdepth 1 -name 'slot-*.receipt.json' | wc -l | tr -d ' ')" = 10
          test "$(find slots -maxdepth 1 -name 'slot-*.mp4' | wc -l | tr -d ' ')" = 10
          python - <<'PY'
          import glob,json
          elapsed=[]
          for p in sorted(glob.glob('slots/slot-*.receipt.json')):
              d=json.load(open(p,encoding='utf-8'))
              if not (d.get('render_pass') is True and d.get('qa_pass') is True and d.get('state')=='PREVIEW_READY'):
                  raise SystemExit(f'RENDER_QA_RECEIPT_FAIL {p}')
              elapsed.append(float(d.get('elapsed_seconds',0)))
          print('TEN_RENDER_QA_RECEIPTS_PASS')
          print('RENDER_ELAPSED_MAX_SECONDS',max(elapsed))
          print('RENDER_ELAPSED_AVG_SECONDS',round(sum(elapsed)/len(elapsed),2))
          PY

      - name: Stage 10 reusable R2 canaries and prove public MP4 bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$URL" || { echo R2_UPLOAD_URL_MISSING; exit 1; }
          test -n "$KEY" || { echo R2_UPLOAD_KEY_MISSING; exit 1; }
          failures=0
          for slot in $(seq 0 9); do
            echo "R2_STAGE_SLOT=$slot"
            f="slots/slot-${slot}.mp4"
            rid="CC-FV2-SMOKE-A-${slot}"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            raw="slots/slot-${slot}.r2.raw.json"
            if ! curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 120 -X POST "${URL%/}/api/video-upload?renderId=${rid}&duration=${dur}" -H "Authorization: Bearer ${KEY}" -H 'Content-Type: video/mp4' --data-binary @"$f" -o "$raw"; then
              echo "R2_POST_FAIL slot=$slot"
              failures=$((failures+1))
              continue
            fi
            export SLOT="$slot" RAW="$raw"
            if ! python - <<'PY' > /tmp/r2-fields.env
          import json,os,shlex
          d=json.load(open(os.environ['RAW'],encoding='utf-8'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          video_url=video_key=poll_url=''
          for x in walk(d):
              if not video_url and x.get('videoUrl'): video_url=str(x['videoUrl'])
              if not video_key and x.get('videoKey'): video_key=str(x['videoKey'])
              for k in ('statusUrl','status_url','pollUrl','poll_url'):
                  if not poll_url and x.get(k): poll_url=str(x[k])
          status=str(d.get('status') or d.get('state') or 'UNKNOWN')
          print('PROVIDER_STATUS='+shlex.quote(status))
          print('VIDEO_URL='+shlex.quote(video_url))
          print('VIDEO_KEY='+shlex.quote(video_key))
          print('POLL_URL='+shlex.quote(poll_url))
          PY
            then
              echo "R2_RESPONSE_PARSE_FAIL slot=$slot"
              failures=$((failures+1))
              continue
            fi
            source /tmp/r2-fields.env
            echo "R2_PROVIDER_STATUS=$PROVIDER_STATUS"

            if { test -z "$VIDEO_URL" || test -z "$VIDEO_KEY"; } && test -n "$POLL_URL"; then
              for poll in $(seq 1 15); do
                sleep 2
                if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 -H "Authorization: Bearer ${KEY}" "$POLL_URL" -o /tmp/r2-poll.json; then
                  export RAW=/tmp/r2-poll.json
                  python - <<'PY' > /tmp/r2-fields.env
          import json,os,shlex
          d=json.load(open(os.environ['RAW'],encoding='utf-8'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          vu=vk=''
          for x in walk(d):
              if not vu and x.get('videoUrl'): vu=str(x['videoUrl'])
              if not vk and x.get('videoKey'): vk=str(x['videoKey'])
          status=str(d.get('status') or d.get('state') or 'UNKNOWN')
          print('PROVIDER_STATUS='+shlex.quote(status)); print('VIDEO_URL='+shlex.quote(vu)); print('VIDEO_KEY='+shlex.quote(vk)); print('POLL_URL='+shlex.quote(os.environ.get('POLL_URL','')))
          PY
                  source /tmp/r2-fields.env
                  test -n "$VIDEO_URL" && test -n "$VIDEO_KEY" && break
                fi
              done
            fi

            if test -z "$VIDEO_URL" || test -z "$VIDEO_KEY"; then
              echo "R2_MEDIA_FIELDS_MISSING slot=$slot provider_status=$PROVIDER_STATUS"
              failures=$((failures+1))
              continue
            fi

            public_ok=0
            for probe in $(seq 1 10); do
              if curl --fail --location --silent --show-error --connect-timeout 8 --max-time 30 --range 0-4095 "$VIDEO_URL" -o /tmp/r2-public.bin; then
                if python - <<'PY'
          b=open('/tmp/r2-public.bin','rb').read(32)
          raise SystemExit(0 if len(b)>=12 and b[4:8]==b'ftyp' else 1)
          PY
                then
                  public_ok=1
                  break
                fi
              fi
              sleep 2
            done
            if test "$public_ok" != 1; then
              echo "R2_PUBLIC_MP4_PROBE_FAIL slot=$slot"
              failures=$((failures+1))
              continue
            fi
            export PROVIDER_STATUS VIDEO_URL VIDEO_KEY
            python - <<'PY'
          import json,os
          slot=os.environ['SLOT']
          receipt={'status':'ready','public_probe_pass':True,'provider_status':os.environ['PROVIDER_STATUS'],'videoUrl':os.environ['VIDEO_URL'],'videoKey':os.environ['VIDEO_KEY']}
          json.dump(receipt,open(f'slots/slot-{slot}.r2.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('R2_SLOT_PUBLIC_MEDIA_PASS',slot,receipt['provider_status'])
          PY
          done
          test "$failures" = 0 || { echo "R2_STAGE_FAILURES=$failures"; exit 1; }

      - name: Certify 10-to-8 policy and SLA
        shell: bash
        run: |
          set -euo pipefail
          receipt_count=$(find slots -maxdepth 1 -name 'slot-*.receipt.json' | wc -l | tr -d ' ')
          r2_count=$(find slots -maxdepth 1 -name 'slot-*.r2.json' | wc -l | tr -d ' ')
          mp4_count=$(find slots -maxdepth 1 -name 'slot-*.mp4' | wc -l | tr -d ' ')
          test "$receipt_count" = 10
          test "$r2_count" = 10
          test "$mp4_count" = 10
          python - <<'PY'
          import glob,json
          for p in sorted(glob.glob('slots/slot-*.receipt.json')):
              d=json.load(open(p,encoding='utf-8'))
              if not (d.get('render_pass') is True and d.get('qa_pass') is True and d.get('state')=='PREVIEW_READY'):
                  raise SystemExit(f'RENDER_QA_RECEIPT_FAIL {p}')
          for p in sorted(glob.glob('slots/slot-*.r2.json')):
              d=json.load(open(p,encoding='utf-8'))
              if not (d.get('status')=='ready' and d.get('public_probe_pass') is True and d.get('videoUrl') and d.get('videoKey')):
                  raise SystemExit(f'R2_RECEIPT_FAIL {p}')
          print('TEN_RENDER_QA_AND_R2_PUBLIC_RECEIPTS_PASS')
          PY
          export PYTHONPATH="$ROOT"
          mkdir -p "$ROOT/output/cena-certa-v2"
          cp slots/slot-0.receipt.json "$ROOT/output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.receipt.json"
          cd "$ROOT"
          python -m factory.cena_certa.v2.batch_smoke
          cd "$GITHUB_WORKSPACE"
          start='${{ steps.clock.outputs.started }}'
          end=$(date +%s)
          elapsed=$((end-start))
          echo "FULL_SMOKE_ELAPSED_SECONDS=$elapsed"
          test "$elapsed" -le 660
          printf '{"state":"CERTIFIED_SMOKE_PASS","render_slots":10,"r2_staged":10,"r2_public_probes":10,"selected":8,"hot_reserves":2,"elapsed_seconds":%s,"sla_seconds":660,"runtime_digest":"%s","head_sha":"%s","prep_tts_import_pass":true,"reusable_canary_ids":true}\n' "$elapsed" "$RUNTIME_DIGEST" "$GITHUB_SHA" > certification.json
          cat certification.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-certified-evidence-${{ github.run_id }}
          path: |
            slots/
            certification.json
          if-no-files-found: warn
          retention-days: 7
