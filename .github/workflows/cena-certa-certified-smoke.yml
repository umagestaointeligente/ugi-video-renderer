name: Cena Certa V2 Certified Smoke

on:
  push:
    branches: [feat/cena-certa-factory-v2-certified]
    paths:
      - 'vendor/cena-certa-factory-v2/src/**'
      - 'ops/cena-certa/r2_stage.py'
      - 'ops/cena-certa/factory_doctor.py'
      - 'ops/cena-certa/dispatch_activate.py'
      - '.github/workflows/cena-certa-certified-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ROOT: vendor/cena-certa-factory-v2/src
  RUNTIME_DIGEST: sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c

jobs:
  certified-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/umagestaointeligente/cena-certa-runtime@sha256:5e35dcb15a263b190fd91ad759c6e570d16a186c180fe18fe3f8080ac86acf9c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      URL: ${{ secrets.UGI_VIDEO_UPLOAD_URL }}
      KEY: ${{ secrets.UGI_VIDEO_UPLOAD_KEY }}
    steps:
      - uses: actions/checkout@v7
      - id: clock
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prove runtime, proactive doctor, exact masters and no legacy routes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$ROOT"
          python -m py_compile "$ROOT"/factory/cena_certa/v2/*.py ops/cena-certa/r2_stage.py ops/cena-certa/factory_doctor.py ops/cena-certa/dispatch_activate.py
          python ops/cena-certa/factory_doctor.py
          python - <<'PY'
          import PIL,numpy,aiohttp,edge_tts
          assert PIL.__version__=='12.3.0'
          assert numpy.__version__=='2.5.2'
          assert aiohttp.__version__=='3.14.3'
          from factory.cena_certa.v2.common import verify_contract_and_assets,prepare_static_assets,contract,CACHE,sha256
          from factory.cena_certa.v2.prepare import prepare_one,_validate_source_ranges
          from factory.cena_certa.v2.render import render_one
          from factory.cena_certa.v2.qa import qa_video
          verify_contract_and_assets()
          c=contract()
          mask=prepare_static_assets(c)
          expected=sha256(mask)
          mask.write_bytes(b'INTENTIONAL_SMOKE_CACHE_CORRUPTION')
          repaired=prepare_static_assets(c)
          assert sha256(repaired)==expected
          prepare_static_assets(c)
          good={'scene_plan':[{'start_seconds':0.0},{'start_seconds':2.2}]}
          _validate_source_ranges(good,[(0,2,2.0),(2,4,2.0)],10.0)
          bad={'scene_plan':[{'start_seconds':0.0},{'start_seconds':1.0}]}
          try:
              _validate_source_ranges(bad,[(0,2,2.0),(2,4,2.0)],10.0)
          except RuntimeError as e:
              assert 'SCENE_SOURCE_OVERLAP_FAIL' in str(e)
          else:
              raise AssertionError('SOURCE_OVERLAP_GUARD_DID_NOT_FAIL')
          print('PINNED_RUNTIME_PHYSICAL_MASTERS_CACHE_REPAIR_AND_SOURCE_OVERLAP_PASS')
          PY
          test ! -e vendor/cena-certa-factory-v2/assets-b64
          test ! -e vendor/cena-certa-factory-v2/payload-exact-v1
          test ! -e .github/workflows/cena-certa-gitlab-r2-bridge-20260903.yml
          ! grep -RInE 'drive\.usercontent|mask_last_layer_patch|batch_2026_09_03|sed -i|assets-b64|payload-exact-v1|payload-test|payload-v2' "$ROOT"
          python -m factory.cena_certa.v2.preflight canary

      - name: Build stable certification fingerprint
        id: fp
        shell: bash
        run: |
          set -euo pipefail
          fp=$( { find "$ROOT/factory/cena_certa/v2" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum ops/cena-certa/r2_stage.py ops/cena-certa/factory_doctor.py ops/cena-certa/dispatch_activate.py; } | sha256sum | awk '{print $1}')
          test "${#fp}" = 64
          echo "value=$fp" >> "$GITHUB_OUTPUT"
          echo "CERTIFICATION_FINGERPRINT=$fp"

      - name: Render one representative 32-second stress profile and reconcile R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "$URL" || { echo R2_UPLOAD_URL_MISSING; exit 1; }
          test -n "$KEY" || { echo R2_UPLOAD_KEY_MISSING; exit 1; }
          export PYTHONPATH="$ROOT"
          mkdir -p slots
          (cd "$ROOT" && python -m factory.cena_certa.v2.selftest)
          cp "$ROOT/output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.receipt.json" slots/stress.receipt.json
          cp "$ROOT/output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.mp4" slots/stress.mp4
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 slots/stress.mp4)
          python ops/cena-certa/r2_stage.py \
            --base-url "$URL" \
            --auth-key "$KEY" \
            --id "CC-FV2-SMOKE-STRESS" \
            --batch-sha256 "${{ steps.fp.outputs.value }}" \
            --mp4 slots/stress.mp4 \
            --duration "$dur" \
            --out slots/stress.r2.json
          python - <<'PY'
          import json
          r=json.load(open('slots/stress.receipt.json',encoding='utf-8'))
          s=json.load(open('slots/stress.r2.json',encoding='utf-8'))
          assert r.get('render_pass') is True and r.get('qa_pass') is True and r.get('state')=='PREVIEW_READY'
          assert r.get('mask_composite_order')=='FILM_CC_TITLE_THEN_FINAL_STATIC_MASK'
          assert r.get('video_sha256') and r.get('video_sha256')==s.get('contentSha256')
          assert s.get('schema')=='CENA_CERTA_R2_RECEIPT_V2' and s.get('status')=='ready'
          assert s.get('public_probe_pass') is True and s.get('public_head_size_match') is True
          assert s.get('blind_retry_used') is False
          print('STRESS_RENDER_QA_R2_RECONCILIATION_PASS')
          PY

      - name: Prove 10-to-8 policy and total SLA without ten duplicate renders
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$ROOT"
          mkdir -p "$ROOT/output/cena-certa-v2"
          cp slots/stress.receipt.json "$ROOT/output/cena-certa-v2/CC-FACTORY-V2-SELFTEST.receipt.json"
          (cd "$ROOT" && python -m factory.cena_certa.v2.batch_smoke)
          elapsed=$(($(date +%s)-${{ steps.clock.outputs.started }}))
          echo "FULL_CERTIFIED_SMOKE_SECONDS=$elapsed"
          test "$elapsed" -le 660
          printf '{"state":"CERTIFIED_SMOKE_PASS","real_stress_renders":1,"real_r2_staged":1,"policy_candidate_pool":10,"selected":8,"hot_reserves":2,"elapsed_seconds":%s,"sla_seconds":660,"runtime_digest":"%s","head_sha":"%s","certification_fingerprint":"%s","production_r2_reconciler":true,"blind_post_retry":false,"cache_corruption_recovery_tested":true,"source_overlap_guard_tested":true,"cost_profile":"ONE_REAL_32S_STRESS_PLUS_SYNTHETIC_10_TO_8_POLICY"}\n' "$elapsed" "$RUNTIME_DIGEST" "$GITHUB_SHA" "${{ steps.fp.outputs.value }}" > certification.json
          cat certification.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-certified-evidence-${{ github.run_id }}
          path: |
            slots/stress.receipt.json
            slots/stress.r2.json
            certification.json
          if-no-files-found: warn
          retention-days: 7
