name: UGI Growth Policy Runtime Smoke
run-name: UGI Growth Policy Smoke ${{ github.run_id }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/ugi/growth-policy.json'
      - 'config/ugi/distribution-state.json'
      - 'scripts/ugi_growth_runtime.py'
      - 'scripts/ugi_growth_policy_smoke.py'
      - '.github/workflows/ugi-growth-policy-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'config/ugi/growth-policy.json'
      - 'config/ugi/distribution-state.json'
      - 'scripts/ugi_growth_runtime.py'
      - 'scripts/ugi_growth_policy_smoke.py'
      - '.github/workflows/ugi-growth-policy-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ugi-growth-policy-runtime-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical policy and operational state
        run: python scripts/ugi_growth_policy_smoke.py
      - name: Run incident regression tests
        run: python -m unittest tests.test_ugi_policy_incident_regression
      - name: Upload independent evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugi-growth-policy-smoke-${{ github.run_id }}
          path: control-plane/receipts/ugi-growth-engine/*.json
          retention-days: 30
          if-no-files-found: error

  persist-receipt:
    if: github.event_name != 'pull_request'
    needs: validate-readonly
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Re-run validated smoke at exact commit
        run: python scripts/ugi_growth_policy_smoke.py
      - name: Persist receipt only after validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-growth-evidence-bot'
          git config user.email 'ugi-growth-evidence-bot@users.noreply.github.com'
          git add control-plane/receipts/ugi-growth-engine/
          if git diff --cached --quiet; then
            echo 'No receipt change found' >&2
            exit 1
          fi
          git commit -m "UGI growth: persist validated runtime receipt [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
