name: UGI Actions Health
run-name: UGI Actions Health ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-health.yml'
      - 'docs/AUTONOMOUS-BRIDGE-HANDOFF.txt'
      - 'cloudflare/lola-github-admin-bridge-ugi.mjs'
      - 'cloudflare/wrangler.ugi-admin.toml'

permissions:
  contents: write

concurrency:
  group: ugi-actions-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo 'UGI_ACTIONS_HEALTH=true'
          echo 'PROJECT=UGI'
          echo 'REPOSITORY=umagestaointeligente/ugi-video-renderer'
          echo 'DEFAULT_BRANCH=main'
          echo 'FAIL_CLOSED=true'
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "COMMIT_SHA=${GITHUB_SHA}"

      - name: Validate isolated bridge source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'const OWNER = "umagestaointeligente"' cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'const REPO = "ugi-video-renderer"' cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'actions-health.yml' cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'fail_closed' cloudflare/lola-github-admin-bridge-ugi.mjs

      - name: Write health receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          cat > generated/evidence/actions-health.json <<JSON
          {
            "project": "UGI",
            "repository": "umagestaointeligente/ugi-video-renderer",
            "default_branch": "main",
            "workflow": "actions-health.yml",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "runner_executed": true,
            "bridge_source_syntax_ok": true,
            "repository_lock_source_ok": true,
            "workflow_allowlist_source_ok": true,
            "fail_closed": true,
            "total_jobs": 1,
            "no_jobs_were_run": false,
            "publication_triggered": false,
            "payment_triggered": false
          }
          JSON

      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugi-actions-health-${{ github.run_id }}
          path: generated/evidence/actions-health.json
          retention-days: 30
          if-no-files-found: error

      - name: Persist compact health receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-autonomy-health-bot'
          git config user.email 'ugi-autonomy-health-bot@users.noreply.github.com'
          git add generated/evidence/actions-health.json
          if git diff --cached --quiet; then
            echo 'No health receipt change found' >&2
            exit 1
          fi
          git commit -m "UGI autonomy: persist actions health receipt [skip ci]"
          git push origin HEAD:main
