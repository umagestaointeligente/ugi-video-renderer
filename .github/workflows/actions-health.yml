name: UGI Actions Health
run-name: UGI Actions Health ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-health.yml'
      - 'docs/AUTONOMOUS-BRIDGE-HANDOFF.txt'
      - 'cloudflare/lola-github-admin-bridge-ugi.mjs'
      - 'cloudflare/wrangler.ugi-admin.toml'

permissions:
  contents: read

concurrency:
  group: ugi-actions-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo 'UGI_ACTIONS_HEALTH=true'
          echo 'PROJECT=UGI'
          echo 'REPOSITORY=umagestaointeligente/ugi-video-renderer'
          echo 'DEFAULT_BRANCH=main'
          echo 'FAIL_CLOSED=true'
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "COMMIT_SHA=${GITHUB_SHA}"

      - name: Write health receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          cat > generated/evidence/actions-health.json <<JSON
          {
            "project": "UGI",
            "repository": "umagestaointeligente/ugi-video-renderer",
            "default_branch": "main",
            "workflow": "actions-health.yml",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "runner_executed": true,
            "fail_closed": true,
            "no_jobs_were_run": false
          }
          JSON

      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugi-actions-health-${{ github.run_id }}
          path: generated/evidence/actions-health.json
          retention-days: 30
          if-no-files-found: error
