name: Cena Certa Sep30 Format Reset
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-sep30-format-reset.yml
      - scripts/cena_certa_sep30_format_reset.py
      - ops/cena-certa-sep30/manifest.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp
      - name: Render and QA 12 masters
        run: |
          set -euo pipefail
          python scripts/cena_certa_sep30_format_reset.py
      - name: Fail-closed evidence preflight before release or PASS issue
        run: |
          set -euo pipefail
          python scripts/cena_certa_render_evidence_guard.py \
            out/cena-certa-sep30/summary.json \
            ops/cena-certa-sep30/prepublish-receipts.json \
            out/cena-certa-sep30/preflight.json
      - name: Upload preflight-approved masters to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cena-certa-sep30-format-reset
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Sep30 Format Reset" --notes "Preflight-approved render assets; social publication is NOT_VERIFIED."
          gh release upload "$TAG" out/cena-certa-sep30/*.mp4 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_SEP30_PACK=PASS"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "PUBLICATION_STATUS=NOT_VERIFIED"
            cat out/cena-certa-sep30/preflight.json
            echo
            cat out/cena-certa-sep30/summary.json
          } > out/cena-certa-sep30/issue.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-SEP30-PACK] $GITHUB_RUN_ID" --body-file out/cena-certa-sep30/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-sep30-${{ github.run_id }}
          path: out/cena-certa-sep30/
          retention-days: 7

