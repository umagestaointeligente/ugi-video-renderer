name: UGI Production Smoke Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-production-smoke-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-production-smoke-now
  cancel-in-progress: false

jobs:
  prove-live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install requests
      - name: Run production smoke
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python scripts/ugi_production_smoke_now.py
      - name: Persist smoke receipt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-production-smoke-bot'
          git config user.email 'ugi-production-smoke@users.noreply.github.com'
          git add control-plane/smoke/receipts/production-smoke-latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No smoke receipt change'
            exit 0
          fi
          git commit -m 'chore: persist UGI production smoke receipt'
          git pull --rebase origin main
          git push origin HEAD:main
