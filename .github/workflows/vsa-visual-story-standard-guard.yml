name: VSA Visual Story Standard Guard

on:
  push:
    branches: [main]
    paths:
      - 'config/vsa/**'
      - 'scripts/vsa/**'
      - '.github/actions/vsa-release-gate/**'
      - '.github/workflows/vsa-*.yml'
      - '.github/workflows/vsa-*.yaml'
  pull_request:
    paths:
      - 'config/vsa/**'
      - 'scripts/vsa/**'
      - '.github/actions/vsa-release-gate/**'
      - '.github/workflows/vsa-*.yml'
      - '.github/workflows/vsa-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsa-visual-story-standard-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical policy JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json >/dev/null
          test "$(python - <<'PY'
          import json
          p=json.load(open('config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json',encoding='utf-8'))
          print(p['status'])
          PY
          )" = 'ACTIVE_FAIL_CLOSED'

      - name: Prove validator blocks known regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/vsa/validate_release_receipt.py \
            --policy config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json \
            --self-test

      - name: Prove a future VSA workflow cannot bypass canonical gate
        shell: bash
        run: |
          set -euo pipefail
          BAD=.github/workflows/vsa-negative-guard-self-test.yml
          GOOD=.github/workflows/vsa-positive-guard-self-test.yml
          trap 'rm -f "$BAD" "$GOOD"' EXIT
          cat > "$BAD" <<'YAML'
          name: bad future vsa workflow
          jobs:
            render:
              steps:
                - run: echo generic-render-without-gate
          YAML
          if python scripts/vsa/check_workflow_compliance.py "$BAD"; then
            echo 'NEGATIVE_WORKFLOW_WAS_NOT_BLOCKED'
            exit 1
          fi
          cat > "$GOOD" <<'YAML'
          # VSA_VISUAL_STORY_ENGINE_V1
          # VSA_VISUAL_RELEASE_RECEIPT_V2
          # Metricool VSA brand lock: 6935441
          name: compliant future vsa workflow
          jobs:
            gate:
              steps:
                - uses: ./.github/actions/vsa-release-gate
                  with:
                    receipt: /tmp/receipt.json
                    master: /tmp/final.mp4
          YAML
          python scripts/vsa/check_workflow_compliance.py "$GOOD"
          echo 'VSA_FUTURE_WORKFLOW_BYPASS_SELF_TEST_PASS'

      - name: Identify changed repository paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            git fetch origin "$BASE_REF" --depth=1 || true
            git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/vsa_changed_paths.txt
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -Eq '^0+$'; then
            git diff --name-only "$BEFORE" "$SHA" > /tmp/vsa_changed_paths.txt
          else
            git show --pretty='' --name-only "$SHA" > /tmp/vsa_changed_paths.txt
          fi
          cat /tmp/vsa_changed_paths.txt

      - name: Block new or changed VSA workflows that bypass canonical gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < /tmp/vsa_changed_paths.txt
          python scripts/vsa/check_workflow_compliance.py "${changed[@]}"

      - name: Assert VSA Metricool channel isolation and no secret material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('config/vsa/VSA_VISUAL_STORY_ENGINE_V1.json',encoding='utf-8'))
          assert p['channel']['name'] == 'Você Sabia Agora?'
          assert p['channel']['youtube_channel_id'] == 'UCm0UMO6lNWlr66YSIS1p4iQ'
          assert p['channel']['metricool_brand_id'] == 6935441
          assert p['channel']['official_publisher'] == 'METRICOOL'
          assert p['isolation']['metricool_for_vsa'] == 'OFFICIAL_ONLY'
          assert p['isolation']['metricool_brand_id'] == 6935441
          assert p['isolation']['youtube_channel_id'] == p['channel']['youtube_channel_id']
          assert p['isolation']['cena_certa_mutation'] == 'FORBIDDEN'
          assert p['isolation']['blind_retry'] == 'FORBIDDEN'
          print('VSA_METRICOOL_CHANNEL_ISOLATION_POLICY_PASS')
          PY
          if grep -RniE 'CENA[_ -]?CERTA|88240|88242|6809869' .github/actions/vsa-release-gate; then
            echo 'CROSS_CHANNEL_TOKEN_FOUND_IN_RELEASE_GATE'
            exit 1
          fi
          if grep -RniE '(POSTLY_API_KEY|CLIENT_SECRET|REFRESH_TOKEN)[[:space:]]*[:=][[:space:]]*[^$<{ ]+' \
            config/vsa .github/actions/vsa-release-gate; then
            echo 'SECRET_LITERAL_FOUND'
            exit 1
          fi
          echo 'VSA_CHANNEL_ISOLATION_AND_SECRET_SCAN_PASS'

      - name: Canonical guard receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'VSA_VISUAL_STORY_ENGINE_V1=ACTIVE_FAIL_CLOSED' \
            'VSA_VISUAL_RELEASE_RECEIPT_V2=REQUIRED' \
            'METRICOOL_BRAND_ID=6935441' \
            'SHOT_MAP_REQUIRED=true' \
            'EXACT_REAL_ACTION_REQUIRED=true' \
            'GENERIC_FILLER_FORBIDDEN=true' \
            'VOICE_PTBR_NEUTRAL_REQUIRED=true' \
            'CANONICAL_MASK_V2_REQUIRED=true' \
            'ENTITY_INTEGRITY_REQUIRED=true' \
            'FRESH_BUILD_REQUIRED=true' \
            'PRE_CTA_CONTAMINATION_BLOCKED=true' \
            'FINAL_MASTER_HASH_TOKEN_REQUIRED=true' \
            'SCHEDULE_BEFORE_GATE_FORBIDDEN=true' \
            'FUTURE_WORKFLOW_BYPASS_BLOCKED=true' \
            'CHANNEL_ISOLATION_ASSERTED=true' \
            'PAULO_IS_NOT_PRIMARY_QA=true' \
            'CENA_CERTA_TOUCHED=false'
