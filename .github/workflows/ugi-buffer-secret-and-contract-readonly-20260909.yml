name: UGI Buffer Secret + Contract Readonly 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/ugi-buffer-secret-and-contract-readonly-20260909.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
      UGI_BUFFER_API_KEY: ${{ secrets.UGI_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect secret presence and Buffer implementation without values
        shell: bash
        run: |
          set -euo pipefail
          for s in "${BUFFER_API_KEY:-}" "${BUFFER_ACCESS_TOKEN:-}" "${BUFFER_TOKEN:-}" "${UGI_BUFFER_API_KEY:-}"; do
            [ -n "$s" ] && echo "::add-mask::$s" || true
          done
          python - <<'PY'
          import os,json,re
          p='cloudflare/lola-operacional-worker.mjs'
          text=open(p,encoding='utf-8').read().splitlines()
          needles=['customScheduled','PostActionSuccess','createPost','createUpdate','graphql','BUFFER_API_KEY','channelId','scheduledAt','dueAt','story']
          hits=[]
          for i,line in enumerate(text):
            if any(n.lower() in line.lower() for n in needles):
              lo=max(0,i-3); hi=min(len(text),i+8)
              block='\n'.join(f'{j+1}: {text[j]}' for j in range(lo,hi))
              if 'BUFFER' in block.upper() or 'GRAPHQL' in block.upper() or 'POSTACTION' in block.upper() or 'customScheduled' in block:
                hits.append(block)
          # Deduplicate and cap; source code only, no secrets.
          uniq=[]
          for h in hits:
            if h not in uniq: uniq.append(h)
          out={'secretPresent':{
            'BUFFER_API_KEY':bool(os.environ.get('BUFFER_API_KEY')),
            'BUFFER_ACCESS_TOKEN':bool(os.environ.get('BUFFER_ACCESS_TOKEN')),
            'BUFFER_TOKEN':bool(os.environ.get('BUFFER_TOKEN')),
            'UGI_BUFFER_API_KEY':bool(os.environ.get('UGI_BUFFER_API_KEY')),
          },'sourceSnippets':uniq[:35]}
          open('buffer-contract.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ugi-buffer-contract-${{ github.run_id }}
          path: buffer-contract.json
          retention-days: 3
