name: UGI R45 Live Worker Inspect

on:
  push:
    branches: [ugi-r45-multiformat-20260830]
    paths:
      - 'control-plane/r45/inspect-trigger.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect live worker source anchors
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          python -m pip install --quiet requests
          python - <<'PY'
          import os
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import requests

          account=os.environ['CF_ACCOUNT_ID']; token=os.environ['CF_API_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/lola-operacional-ugi/content/v2'
          r=requests.get(base,headers={'Authorization':f'Bearer {token}'},timeout=30); r.raise_for_status()
          ctype=r.headers.get('content-type',''); body=r.content
          if 'multipart/' in ctype.lower():
              env=(f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n'.encode()+body)
              msg=BytesParser(policy=default).parsebytes(env); cand=[]
              for part in msg.iter_parts():
                  ptype=(part.get_content_type() or '').lower(); fn=(part.get_filename() or '').lower(); payload=part.get_payload(decode=True) or b''
                  if 'javascript' in ptype or fn.endswith(('.js','.mjs')): cand.append(payload)
              src=max(cand,key=len).decode('utf-8')
          else: src=body.decode('utf-8')

          root=Path('cloudflare/status/r45-live-parts'); root.mkdir(parents=True,exist_ok=True)
          patterns={
            '01-validate-command.txt':'function validateCommand(',
            '02-create-command.txt':'function createCommand(',
            '03-generate-from-command.txt':'async function generateFromCommand(',
            '04-generate-standard-post.txt':'async function generateStandardProposal(',
            '05-generate-carousel.txt':'async function generateCarousel(',
            '06-platform-approval.txt':'if (path === "/api/platform-approval"',
            '07-platform-eligibility.txt':'if (path === "/api/platform-publication-eligibility/"',
            '08-platform-publish.txt':'if (path === "/api/platform-publish"',
            '09-buffer-platform-video.txt':'async function createBufferPlatformVideoPost(',
            '10-buffer-create-with-assets.txt':'async function bufferCreateWithAssets(',
            '11-drafts-route.txt':'if (path === "/api/drafts"',
            '12-save-local-draft.txt':'async function saveLocalDraft(',
            '13-health-capabilities.txt':'capabilities: {',
          }
          summary=['UGI_R45_LIVE_SOURCE_CONTEXT',f'BYTES={len(src.encode("utf-8"))}']
          for fn,pat in patterns.items():
              count=src.count(pat); summary.append(f'{fn} PATTERN={pat} COUNT={count}')
              pos=src.find(pat)
              if pos < 0:
                  (root/fn).write_text(f'PATTERN_NOT_FOUND: {pat}\n',encoding='utf-8')
                  continue
              lo=max(0,pos-800); hi=min(len(src),pos+12000)
              (root/fn).write_text(src[lo:hi],encoding='utf-8')
          Path('cloudflare/status/r45-live-context.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          PY
      - name: Persist inspection only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-r45-inspect-bot'
          git config user.email 'ugi-r45-inspect@users.noreply.github.com'
          git add cloudflare/status/r45-live-context.txt cloudflare/status/r45-live-parts
          git commit -m 'chore: inspect live worker for R45 multiformat'
          git pull --rebase origin ugi-r45-multiformat-20260830
          git push origin HEAD:ugi-r45-multiformat-20260830
