name: UGI Legacy Publication Bridge (Deprecated)

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/chat-publication/*.json'

permissions:
  actions: write
  contents: read

jobs:
  forward-to-publisher-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve legacy manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^control-plane/chat-publication/.*\.json$' | tail -n1)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Forward only
        shell: bash
        env:
          MANIFEST: ${{ steps.manifest.outputs.file }}
        run: |
          set -euo pipefail
          gh workflow run ugi-publisher-hub.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f manifest="$MANIFEST" \
            -f wait_seconds=600
          echo "LEGACY_FORWARD_OK manifest=$MANIFEST"
          echo "No publication is executed in the legacy bridge."
