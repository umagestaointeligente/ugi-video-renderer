name: UGI Instagram MultiFormat Hub R45

on:
  push:
    branches: [main, ugi-r45-multiformat-20260830]
    paths:
      - 'control-plane/instagram-multiformat/queue/*.json'
  workflow_dispatch:
  # Queue pushes remain immediate. Hourly recovery avoids exhausting Buffer's
  # 500-request / 24h client window with repeated reconciliation polling.
  schedule:
    - cron: '26 * * * *'

permissions:
  contents: write

concurrency:
  group: ugi-instagram-multiformat-hub
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runtime setup and hard policy validation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UGI_WORKER_COMMAND_KEY"
          python -m pip install --disable-pip-version-check --quiet requests pillow
          python -m py_compile scripts/r45_instagram_multiformat_pilot.py scripts/ugi_anti_repeat_gate.py
          test -f control-plane/anti-repeat/platform-topic-history.json
          python - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('config/ugi/instagram-multiformat-policy.json').read_text(encoding='utf-8'))
          history=json.loads(Path('control-plane/anti-repeat/platform-topic-history.json').read_text(encoding='utf-8'))
          assert policy['project']=='UGI'
          assert policy['principles']['bufferExclusivePublisher'] is True
          assert policy['principles']['receiptRequiredForScheduledClaim'] is True
          assert history['project']=='UGI'
          assert history['scope']=='PER_PLATFORM'
          assert int(history['cooldownDays'])==15
          PY
      - name: Reconcile queued Instagram multiformat manifests through 15d topic gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p control-plane/instagram-multiformat/queue control-plane/instagram-multiformat/receipts
          shopt -s nullglob
          failed=0
          files=(control-plane/instagram-multiformat/queue/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No multiformat manifests queued.'
            exit 0
          fi
          for manifest in "${files[@]}"; do
            stem=$(basename "$manifest" .json)
            receipt="control-plane/instagram-multiformat/receipts/${stem}.json"

            # Keep durable history in queue without retrying expired failures forever.
            # This matches Publisher Hub's six-hour stale-window semantics.
            if python3 - "$manifest" <<'PY_STALE'
          import datetime as dt, json, sys
          path=sys.argv[1]
          try:
              rows=(json.load(open(path,encoding='utf-8')).get('posts') or [])
              dues=[]
              for row in rows:
                  raw=str(row.get('dueAt') or '')
                  if raw:
                      dues.append(dt.datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(dt.timezone.utc))
              stale=bool(dues) and max(dues) < dt.datetime.now(dt.timezone.utc)-dt.timedelta(hours=6)
          except Exception:
              stale=False
          raise SystemExit(0 if stale else 1)
          PY_STALE
            then
              echo "SKIP_STALE $manifest"
              continue
            fi

            if [ -f "$receipt" ] && jq -e '.ok == true' "$receipt" >/dev/null 2>&1; then
              echo "SKIP_PROVEN $manifest"
              continue
            fi
            # r45_instagram_multiformat_pilot.py fails closed before generation when
            # SAME-PLATFORM topic history returns BLOCK/REVIEW_REQUIRED. Successful
            # Buffer readback appends the topic to the durable 15-day registry.
            if ! python scripts/r45_instagram_multiformat_pilot.py "$manifest" --receipt "$receipt"; then
              failed=1
              # Error 4006 is batch-global capacity exhaustion. Stop this cycle on the
              # first proof instead of spending more requests on the remaining queue.
              if [ -f "$receipt" ] && jq -e '.. | strings | select(test("4006|daily free allocation|used up your daily free allocation"; "i"))' "$receipt" >/dev/null 2>&1; then
                echo "STOP_CAPACITY_EXHAUSTED $manifest"
                break
              fi
            fi
          done
          exit "$failed"
      - name: Persist receipts and per-platform topic history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane/instagram-multiformat/receipts control-plane/anti-repeat
          git config user.name 'ugi-instagram-multiformat-bot'
          git config user.email 'ugi-instagram-multiformat@users.noreply.github.com'
          git add control-plane/instagram-multiformat/receipts/*.json 2>/dev/null || true
          git add control-plane/anti-repeat/platform-topic-history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No receipt/history changes.'
            exit 0
          fi
          git commit -m 'chore: persist Instagram multiformat receipts and topic history'
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
