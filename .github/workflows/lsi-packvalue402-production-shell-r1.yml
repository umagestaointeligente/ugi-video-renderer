name: LSI PackValue402 Production Shell R1
run-name: LSI PackValue402 Production Shell R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-mass-market-r1-20260829]
    paths:
      - 'cloudflare/packvalue402-paid-r1/**'
      - '.github/workflows/lsi-packvalue402-production-shell-r1.yml'

permissions:
  contents: read

jobs:
  deploy-prove-disabled-production-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: https://lsi-packvalue402-r1.umagestaointeligente.workers.dev
      FACILITATOR_URL: https://facilitator.payai.network
    steps:
      - uses: actions/checkout@v4

      - name: Require fail-closed production shell config
        shell: bash
        run: |
          set -euo pipefail
          CFG=cloudflare/packvalue402-paid-r1/wrangler.production-shell.toml
          grep -q 'name = "lsi-packvalue402-r1"' "$CFG"
          grep -q 'PAYMENTS_ENABLED = "false"' "$CFG"
          grep -q 'NETWORK = "eip155:8453"' "$CFG"
          grep -q 'FACILITATOR_URL = "https://facilitator.payai.network"' "$CFG"
          ! grep -q '^PAY_TO' "$CFG"
          grep -q 'No wallet private key' cloudflare/packvalue402-paid-r1/PRODUCTION_ACTIVATION_POLICY_R1.md

      - name: Audit production stack and tests
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run check
          npm run test:e2e-mock

      - name: Verify live mainnet facilitator capability
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 20 "$FACILITATOR_URL/supported" > /tmp/facilitator.json
          jq -e '(.kinds | any(.x402Version==2 and .scheme=="exact" and .network=="eip155:8453")) and (((.extensions // []) | index("bazaar")) != null)' /tmp/facilitator.json >/dev/null

      - name: Require autonomous Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy separate production shell
        working-directory: cloudflare/packvalue402-paid-r1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production-shell.toml

      - name: Prove production shell is disabled
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS "$PROD_URL/health?ts=$RANDOM" > /tmp/health.json 2>/dev/null && jq -e '.ok==true and .mode=="PREPROD_DISABLED" and .payment.enabled==false and .payment.pay_to_configured==false and .payment.ready==false and .payment.network=="eip155:8453" and .payment.target_price_usd==0.001 and .payment.server_private_key_required==false and .payment.server_can_spend==false and .money_movement_from_server==false' /tmp/health.json >/dev/null; then
              ok=true
              break
            fi
            sleep 2
          done
          test "$ok" = true

      - name: Prove free normalize on production hostname
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSG "$PROD_URL/v1/normalize" \
            --data-urlencode 'text=6x330 ml' \
            --data-urlencode 'price=5.94' \
            --data-urlencode 'currency=USD' > /tmp/normalize.json
          jq -e '.ok==true and .result.count==6 and .result.base_quantity==1980 and .result.display_basis=="L" and .result.display_price==3' /tmp/normalize.json >/dev/null

      - name: Prove production paid route fails closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/blocked.json -w '%{http_code}' -X POST "$PROD_URL/v1/compare" -H 'content-type: application/json' --data '{"offers":[{"label":"a","text":"1 L","price":3},{"label":"b","text":"2 L","price":5}]}' )"
          test "$code" = "503"
          jq -e '.ok==false and .error=="payments_not_activated" and .money_movement==false' /tmp/blocked.json >/dev/null

      - name: Prove production discovery remains non-financial
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PROD_URL/.well-known/agent.json" > /tmp/agent.json
          jq -e '.name=="PackValue402" and .mode=="PREPROD_DISABLED" and .distribution.bazaar_declared==true and .distribution.bazaar_indexed==false and .payment.enabled==false and .payment.ready==false and .payment.pay_to_configured==false and .payment.server_can_spend==false' /tmp/agent.json >/dev/null

      - name: Write production-shell receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg url "$PROD_URL" '{schema_version:"1.0",project:"PACKVALUE402_PRODUCTION_SHELL_R1",acceptance_state:"PASS_DISABLED_SHELL",run_id:$run,commit:$sha,url:$url,protocol:"x402-v2",target_price_usd:0.001,network:"eip155:8453",facilitator:"https://facilitator.payai.network",dependency_gate:"PASS",cryptographic_mock_e2e:"PASS",payments_enabled:false,pay_to_configured:false,server_can_spend:false,money_movement:false,real_value_moved:false,activation_gate:"EXPLICIT_APPROVAL_PLUS_RECEIVE_ADDRESS"}' > generated/evidence/packvalue402-production-shell-r1.json

      - name: Upload production-shell receipt
        uses: actions/upload-artifact@v4
        with:
          name: packvalue402-production-shell-${{ github.run_id }}
          path: generated/evidence/packvalue402-production-shell-r1.json
          retention-days: 14
          if-no-files-found: error
