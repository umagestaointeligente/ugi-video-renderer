name: Cena Certa Oct02 Pack
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cena-certa-oct02-pack.yml
      - scripts/cena_certa_oct02_pack.py
      - ops/cena-certa-oct02/manifest.json
      - ops/cena-certa-oct02/anti-repeat-snapshot.json
      - assets/cena-certa-logo.png.b64
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        network: [tiktok, instagram, youtube, facebook]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CENA_NETWORK: ${{ matrix.network }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q --upgrade yt-dlp edge-tts
      - name: Render and QA
        run: |
          set -euo pipefail
          python scripts/cena_certa_oct02_pack.py
      - name: Publish approved masters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="cena-certa-oct02-${CENA_NETWORK}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Cena Certa Oct02 ${CENA_NETWORK}" --notes "QA-approved Cena Certa Oct02 ${CENA_NETWORK} masters."
          gh release upload "$TAG" out/cena-certa-oct02/*.mp4 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Create evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CENA_CERTA_OCT02_PACK=PASS"
            echo "NETWORK=$CENA_NETWORK"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo
            cat out/cena-certa-oct02/summary.json
          } > out/cena-certa-oct02/issue.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[CENA-CERTA-OCT02-${CENA_NETWORK}] $GITHUB_RUN_ID" --body-file out/cena-certa-oct02/issue.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cena-certa-oct02-${{ matrix.network }}-${{ github.run_id }}
          path: out/cena-certa-oct02/
          retention-days: 7
