name: LSI Capital Paper R1
on:
  push:
    branches: [lsi-capital-intelligence-r1-20260830]
    paths:
      - 'cloudflare/lsi-capital-paper-r1.mjs'
      - 'cloudflare/wrangler.lsi-capital-paper-r1.toml'
      - '.github/workflows/lsi-capital-paper-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static financial safety gates
        run: |
          grep -q "mode:'PAPER_ONLY'" cloudflare/lsi-capital-paper-r1.mjs
          grep -q "real_orders_enabled:false" cloudflare/lsi-capital-paper-r1.mjs
          grep -q "money_movement:false" cloudflare/lsi-capital-paper-r1.mjs
          grep -q "real_order_requires_per_trade_confirmation:true" cloudflare/lsi-capital-paper-r1.mjs
          ! grep -Eiq "placeOrder|submitOrder|buy_market|sell_market|private_key|seed phrase" cloudflare/lsi-capital-paper-r1.mjs
      - name: Require Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
      - name: Deploy isolated paper Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.36.0 deploy -c wrangler.lsi-capital-paper-r1.toml
      - name: Verify health and initial paper portfolio
        run: |
          BASE='https://lsi-capital-paper-r1.umagestaointeligente.workers.dev'
          for i in {1..20}; do curl -fsS "$BASE/health" > /tmp/health.json && break || sleep 3; done
          curl -fsS "$BASE/portfolio" > /tmp/portfolio.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          p=json.load(open('/tmp/portfolio.json'))['state']
          assert h['ok'] is True
          assert h['mode']=='PAPER_ONLY'
          assert h['real_orders_enabled'] is False
          assert h['money_movement'] is False
          assert p['nav_brl']==100000
          assert p['starting_nav_brl']==100000
          assert p['broker_connected'] is False
          assert p['real_orders_enabled'] is False
          assert abs(sum(x['market_value'] for x in p['positions'].values())+p['cash_brl']-100000)<0.01
          assert p['policy']['real_order_requires_per_trade_confirmation'] is True
          print('PAPER_ACCEPTANCE=PASS')
          PY
      - name: Verify unauthorized mark is fail-closed
        run: |
          code=$(curl -s -o /tmp/deny.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"prices":{"BOVA11":999}}' 'https://lsi-capital-paper-r1.umagestaointeligente.workers.dev/v1/mark')
          test "$code" = "401"
          grep -q 'unauthorized' /tmp/deny.json
      - name: Write acceptance receipt
        run: |
          mkdir -p proof
          python - <<'PY'
          import json,os,datetime
          p=json.load(open('/tmp/portfolio.json'))['state']
          r={
            'status':'PASS','run_id':os.getenv('GITHUB_RUN_ID'),'commit':os.getenv('GITHUB_SHA'),
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'worker':'lsi-capital-paper-r1','mode':'PAPER_ONLY','real_orders_enabled':False,'money_movement':False,
            'starting_nav_brl':p['starting_nav_brl'],'nav_brl':p['nav_brl'],'cash_brl':p['cash_brl'],
            'positions':{k:{'units':v['units'],'seed_price':v['price'],'market_value':v['market_value']} for k,v in p['positions'].items()},
            'per_trade_confirmation_required':True
          }
          json.dump(r,open('proof/lsi-capital-paper-acceptance.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lsi-capital-paper-${{ github.run_id }}
          path: proof/lsi-capital-paper-acceptance.json
