name: Orbit Cena Certa Secret Alias Probe

on:
  push:
    paths:
      - '.github/workflows/orbit-cena-certa-secret-alias-probe-20260910.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN: ${{ secrets.ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN }}
      ORBIT_YOUTUBE_REFRESH_TOKEN: ${{ secrets.ORBIT_YOUTUBE_REFRESH_TOKEN }}
      CENA_CERTA_YOUTUBE_REFRESH_TOKEN: ${{ secrets.CENA_CERTA_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VSA_YOUTUBE_REFRESH_TOKEN: ${{ secrets.VSA_YOUTUBE_REFRESH_TOKEN }}
      ORBIT_YOUTUBE_CLIENT_ID: ${{ secrets.ORBIT_YOUTUBE_CLIENT_ID }}
      ORBIT_YOUTUBE_CLIENT_SECRET: ${{ secrets.ORBIT_YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CENA_CERTA_META_ACCESS_TOKEN: ${{ secrets.CENA_CERTA_META_ACCESS_TOKEN }}
      ORBIT_META_ACCESS_TOKEN: ${{ secrets.ORBIT_META_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      CENA_CERTA_FACEBOOK_PAGE_ID: ${{ secrets.CENA_CERTA_FACEBOOK_PAGE_ID }}
      META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          echo 'ORBIT_CENA_CERTA_SECRET_ALIAS_PROBE_V1'
          for k in ORBIT_CENA_CERTA_YOUTUBE_REFRESH_TOKEN ORBIT_YOUTUBE_REFRESH_TOKEN CENA_CERTA_YOUTUBE_REFRESH_TOKEN YOUTUBE_REFRESH_TOKEN VSA_YOUTUBE_REFRESH_TOKEN ORBIT_YOUTUBE_CLIENT_ID ORBIT_YOUTUBE_CLIENT_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET CENA_CERTA_META_ACCESS_TOKEN ORBIT_META_ACCESS_TOKEN META_ACCESS_TOKEN CENA_CERTA_FACEBOOK_PAGE_ID META_FB_PAGE_ID; do
            if [ -n "${!k:-}" ]; then echo "$k=true"; else echo "$k=false"; fi
          done
          echo 'SECRET_VALUES_EXPOSED=false'
