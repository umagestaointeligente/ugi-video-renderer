name: LSI Yellow Live Credential Probe R1
run-name: LSI Yellow Live Credential Probe R1 ${{ github.run_id }}
on:
  push:
    branches: [lsi-payment-hub-r1-20260830]
    paths: ['.github/workflows/lsi-yellow-live-credential-probe-r1.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      RAPIDAPI_PROVIDER_TOKEN: ${{ secrets.RAPIDAPI_PROVIDER_TOKEN }}
      RAPIDAPI_API_KEY: ${{ secrets.RAPIDAPI_API_KEY }}
      RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
      KIWIFY_CLIENT_ID: ${{ secrets.KIWIFY_CLIENT_ID }}
      KIWIFY_CLIENT_SECRET: ${{ secrets.KIWIFY_CLIENT_SECRET }}
      KIWIFY_ACCOUNT_ID: ${{ secrets.KIWIFY_ACCOUNT_ID }}
      KIWIFY_API_KEY: ${{ secrets.KIWIFY_API_KEY }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
    steps:
      - name: Presence only
        shell: bash
        run: |
          set -euo pipefail
          present(){ if [ -n "${!1:-}" ]; then echo true; else echo false; fi; }
          echo "APIFY_TOKEN_PRESENT=$(present APIFY_TOKEN)"
          echo "APIFY_API_TOKEN_PRESENT=$(present APIFY_API_TOKEN)"
          echo "RAPIDAPI_PROVIDER_TOKEN_PRESENT=$(present RAPIDAPI_PROVIDER_TOKEN)"
          echo "RAPIDAPI_API_KEY_PRESENT=$(present RAPIDAPI_API_KEY)"
          echo "RAPIDAPI_PROXY_SECRET_PRESENT=$(present RAPIDAPI_PROXY_SECRET)"
          echo "KIWIFY_CLIENT_ID_PRESENT=$(present KIWIFY_CLIENT_ID)"
          echo "KIWIFY_CLIENT_SECRET_PRESENT=$(present KIWIFY_CLIENT_SECRET)"
          echo "KIWIFY_ACCOUNT_ID_PRESENT=$(present KIWIFY_ACCOUNT_ID)"
          echo "KIWIFY_API_KEY_PRESENT=$(present KIWIFY_API_KEY)"
          echo "PAYPAL_CLIENT_ID_PRESENT=$(present PAYPAL_CLIENT_ID)"
          echo "PAYPAL_CLIENT_SECRET_PRESENT=$(present PAYPAL_CLIENT_SECRET)"
          echo 'SECRET_VALUES_EXPOSED=false'
