name: Orbit Direct Publisher Guard CI

on:
  pull_request:
    paths:
      - '.github/workflows/orbit-cena-certa-youtube-direct.yml'
      - '.github/workflows/orbit-cena-certa-youtube-queue.yml'
      - '.github/workflows/orbit-cena-certa-facebook-direct.yml'
      - 'cloudflare/orbit-cena-certa-auth.mjs'
      - 'cloudflare/wrangler.orbit-cena-certa-auth.toml'
      - '.github/workflows/orbit-direct-publisher-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and invariant checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/orbit-cena-certa-auth.mjs
          python - <<'PY'
          from pathlib import Path

          canonical_channel='UCq1h6RSnev5-JJQ8k4T98tg'
          canonical_page='1314911305035494'
          yt=Path('.github/workflows/orbit-cena-certa-youtube-direct.yml').read_text()
          queue=Path('.github/workflows/orbit-cena-certa-youtube-queue.yml').read_text()
          fb=Path('.github/workflows/orbit-cena-certa-facebook-direct.yml').read_text()
          worker=Path('cloudflare/orbit-cena-certa-auth.mjs').read_text()

          checks={
            'youtube canonical lock': canonical_channel in yt and "expected != canonical" in yt,
            'queue canonical lock': canonical_channel in queue and "expected !=" in queue,
            'meta canonical lock': canonical_page in fb and "page != canonical_page" in fb,
            'youtube serialized': 'group: orbit-cena-certa-youtube-mutation' in yt,
            'meta serialized': 'group: orbit-cena-certa-facebook-mutation' in fb,
            'youtube marker': "marker='orbit_'" in yt,
            'worker marker': "marker='orbit_'" in worker,
            'youtube readback': 'READBACK_VERIFIED=true' in yt,
            'meta readback': 'READBACK_VERIFIED=true' in fb,
            'uncertain mutation state': "unknown_after_upload" in worker,
            'story fail closed': "Facebook Story requires native UI" in fb,
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items():
              print(f"{name}={'PASS' if ok else 'FAIL'}")
          if failed:
              raise SystemExit('GUARD_FAILED: '+', '.join(failed))
          print('MUTATION_PERFORMED=false')
          PY
