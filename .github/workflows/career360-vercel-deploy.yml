name: Career360 Vercel Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/career360-vercel-deploy.trigger'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - validate
          - preview
          - production

concurrency:
  group: career360-vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_ZJys00FTE2kK9yVtsqH5fHyF
  VERCEL_PROJECT_ID: prj_DQbCLqrEixa8fTbOkOz3ZtjX9IGP
  VERCEL_CLI_VERSION: 59.11.7
  OFFICIAL_URL: https://lsi-career-360.vercel.app
  EXPECTED_APP_K: 6df7b4e63d7e52ce3c3f02247392b98f0393cbe8
  EXPECTED_APP_L: 4283646143425e4a3156e44100aabb475df88d27
  EXPECTED_APP_M: 719c15ebfe89d212a19473b70ea6e615174601d9
  TRUTHFUL_AUTH_COPY: Você confirma o que importa. O Career 360 organiza sua busca.
  LEGACY_UNVERIFIED_AUTH_COPY: Enquanto você trabalha na sua carreira, seu agente trabalha na próxima oportunidade.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target and credential gate
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            target="${MANUAL_TARGET:-preview}"
          else
            target="$(tr -d '[:space:]' < .github/career360-vercel-deploy.trigger)"
          fi

          case "$target" in
            validate|preview|production) ;;
            *)
              echo "::error::Invalid target '$target'. Expected validate, preview or production."
              exit 3
              ;;
          esac

          if [[ "$target" != "validate" && -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured. Deployment aborted before any Vercel mutation."
            exit 2
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      - name: Verify canonical frontend truth gates
        shell: bash
        run: |
          set -euo pipefail
          index='career360/frontend/index.html'

          grep -F "@${EXPECTED_APP_K}/career360/frontend/app-k.js" "$index" >/dev/null
          grep -F "@${EXPECTED_APP_L}/career360/frontend/app-l.js" "$index" >/dev/null
          grep -F "@${EXPECTED_APP_M}/career360/frontend/app-m.js" "$index" >/dev/null

          count_k="$(grep -o 'career360/frontend/app-k.js' "$index" | wc -l | tr -d ' ')"
          count_l="$(grep -o 'career360/frontend/app-l.js' "$index" | wc -l | tr -d ' ')"
          count_m="$(grep -o 'career360/frontend/app-m.js' "$index" | wc -l | tr -d ' ')"
          for pair in "app-k:$count_k" "app-l:$count_l" "app-m:$count_m"; do
            name="${pair%%:*}"
            count="${pair##*:}"
            if [[ "$count" != "1" ]]; then
              echo "::error::Expected exactly one ${name}.js reference, found $count."
              exit 4
            fi
          done

          truthful_count="$(grep -F -o "$TRUTHFUL_AUTH_COPY" "$index" | wc -l | tr -d ' ')"
          if [[ "$truthful_count" != "1" ]]; then
            echo "::error::Expected exactly one truthful static auth copy, found $truthful_count."
            exit 4
          fi
          if grep -F "$LEGACY_UNVERIFIED_AUTH_COPY" "$index" >/dev/null; then
            echo "::error::Legacy unverified auth copy is still present in static HTML."
            exit 4
          fi

          node --check career360/frontend/app-k.js
          cp career360/frontend/app-l.js /tmp/app-l.mjs
          cp career360/frontend/app-m.js /tmp/app-m.mjs
          node --check /tmp/app-l.mjs
          node --check /tmp/app-m.mjs

          echo 'CANONICAL_SOURCE_GATE=PASS'
          echo 'TRUTHFUL_UI_PIN_GATE=PASS'
          echo 'TRUTHFUL_AUTH_COPY_PIN_GATE=PASS'
          echo 'STATIC_AUTH_TRUTH_SOURCE_GATE=PASS'
          echo 'LEGACY_AUTH_COPY_ABSENT_GATE=PASS'

      - name: Bind checkout to official Vercel project
        if: env.TARGET != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p career360/frontend/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > career360/frontend/.vercel/project.json

      - name: Create deterministic preview
        if: env.TARGET != 'validate'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd career360/frontend
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes \
            --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          deploy_url="$(sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/vercel-deploy.log | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1 || true)"
          if [[ -z "$deploy_url" ]]; then
            echo "::error::Preview completed without a parseable Vercel URL."
            exit 5
          fi
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$deploy_url" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=$deploy_url"

      - name: Preview HTTP, pin and truth smoke
        if: env.TARGET != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location "$DEPLOY_URL/")"
          grep -F "@${EXPECTED_APP_K}/career360/frontend/app-k.js" <<< "$body" >/dev/null
          grep -F "@${EXPECTED_APP_L}/career360/frontend/app-l.js" <<< "$body" >/dev/null
          grep -F "@${EXPECTED_APP_M}/career360/frontend/app-m.js" <<< "$body" >/dev/null
          grep -F "$TRUTHFUL_AUTH_COPY" <<< "$body" >/dev/null
          if grep -F "$LEGACY_UNVERIFIED_AUTH_COPY" <<< "$body" >/dev/null; then
            echo '::error::Preview still exposes legacy unverified auth copy.'
            exit 5
          fi
          echo 'PREVIEW_HTTP_PIN_AND_TRUTH_SMOKE=PASS'

      - name: Promote exact preview to production
        if: env.TARGET == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd career360/frontend
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$DEPLOY_URL" --yes \
            --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          echo 'PREVIEW_PROMOTED_TO_PRODUCTION=PASS'

      - name: Verify official alias after promotion
        if: env.TARGET == 'production'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error --location "$OFFICIAL_URL/" || true)"
            if grep -F "@${EXPECTED_APP_K}/career360/frontend/app-k.js" <<< "$body" >/dev/null \
              && grep -F "@${EXPECTED_APP_L}/career360/frontend/app-l.js" <<< "$body" >/dev/null \
              && grep -F "@${EXPECTED_APP_M}/career360/frontend/app-m.js" <<< "$body" >/dev/null \
              && grep -F "$TRUTHFUL_AUTH_COPY" <<< "$body" >/dev/null \
              && ! grep -F "$LEGACY_UNVERIFIED_AUTH_COPY" <<< "$body" >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo '::error::Official alias did not converge to the promoted V15/V16 pins and truthful static auth copy.'
            exit 6
          fi
          echo 'OFFICIAL_ALIAS_HTTP_PIN_AND_TRUTH_SMOKE=PASS'

      - name: Validation summary
        if: env.TARGET == 'validate'
        shell: bash
        run: |
          {
            echo '### Career360 Vercel deployment readiness validation'
            echo '- Mutation: NONE'
            echo "- Team: $VERCEL_ORG_ID"
            echo "- Project: $VERCEL_PROJECT_ID"
            echo "- app-k: $EXPECTED_APP_K"
            echo "- app-l: $EXPECTED_APP_L"
            echo "- app-m: $EXPECTED_APP_M"
            echo '- Static auth truth: PASS'
            echo '- Legacy unverified auth copy absent: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'DEPLOY_READINESS_VALIDATE_ONLY=PASS'

      - name: Deployment summary
        if: env.TARGET != 'validate'
        shell: bash
        run: |
          {
            echo '### Career360 Vercel deployment'
            echo "- Requested target: $TARGET"
            echo "- Team: $VERCEL_ORG_ID"
            echo "- Project: $VERCEL_PROJECT_ID"
            echo "- Preview artifact: $DEPLOY_URL"
            echo "- app-k: $EXPECTED_APP_K"
            echo "- app-l: $EXPECTED_APP_L"
            echo "- app-m: $EXPECTED_APP_M"
            echo '- Preview pin + auth-truth smoke: PASS'
            if [[ "$TARGET" == "production" ]]; then
              echo '- Promotion strategy: exact preview promoted'
              echo "- Official alias: $OFFICIAL_URL"
              echo '- Official alias pin + auth-truth smoke: PASS'
            fi
          } >> "$GITHUB_STEP_SUMMARY"