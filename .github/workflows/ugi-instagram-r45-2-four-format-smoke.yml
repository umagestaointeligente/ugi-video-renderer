name: UGI Instagram R45.2 Four Format Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-instagram-r45-2-four-format-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install requests
      - name: Verify credentials are present
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$CF_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
      - name: Deploy R45.2 smoke-only media adapter
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/r45_2_story_media_deploy.py
      - name: Run four real Instagram shareNow smokes
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          python scripts/ugi_instagram_r45_2_four_format_smoke.py
      - name: Persist R45.2 evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ugi-r45-2-smoke-bot'
          git config user.email 'ugi-r45-2-smoke@users.noreply.github.com'
          git add cloudflare/status/r45-2-story-media.txt control-plane/smoke/receipts/instagram-r45-2-four-format-smoke.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist R45.2 four-format smoke evidence'
          git pull --rebase origin main
          git push origin HEAD:main
