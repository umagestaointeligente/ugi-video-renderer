name: Orbit YouTube Existing Credential Identity Probe

on:
  push:
    paths:
      - '.github/workflows/orbit-youtube-existing-credential-identity-probe-20260910.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      EXPECTED_CENA_CERTA_CHANNEL_ID: UCq1h6RSnev5-JJQ8k4T98tg
    steps:
      - name: Verify OAuth identity read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID"
          test -n "$CLIENT_SECRET"
          test -n "$REFRESH_TOKEN"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          body=urllib.parse.urlencode({
            'client_id':os.environ['CLIENT_ID'],
            'client_secret':os.environ['CLIENT_SECRET'],
            'refresh_token':os.environ['REFRESH_TOKEN'],
            'grant_type':'refresh_token'}).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body,method='POST',headers={'Content-Type':'application/x-www-form-urlencoded'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              token=json.loads(r.read())['access_token']
          except urllib.error.HTTPError as e:
            print('TOKEN_REFRESH_HTTP='+str(e.code))
            print('TOKEN_REFRESH_RESULT=FAILED')
            raise SystemExit(78)
          req=urllib.request.Request('https://www.googleapis.com/youtube/v3/channels?part=id,snippet&mine=true',headers={'Authorization':'Bearer '+token})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read())
          except urllib.error.HTTPError as e:
            print('CHANNEL_LOOKUP_HTTP='+str(e.code))
            print('CHANNEL_LOOKUP_RESULT=FAILED')
            raise SystemExit(78)
          items=data.get('items') or []
          print('TOKEN_REFRESH_RESULT=SUCCESS')
          print('CHANNEL_COUNT='+str(len(items)))
          if len(items)!=1:
            print('IDENTITY_RESULT=AMBIGUOUS')
            raise SystemExit(78)
          ch=items[0]
          cid=ch.get('id','')
          title=(ch.get('snippet') or {}).get('title','')
          print('CHANNEL_ID='+cid)
          print('CHANNEL_TITLE='+title)
          print('EXPECTED_CHANNEL_ID='+os.environ['EXPECTED_CENA_CERTA_CHANNEL_ID'])
          print('IDENTITY_MATCH='+str(cid==os.environ['EXPECTED_CENA_CERTA_CHANNEL_ID']).lower())
          print('MUTATION_PERFORMED=false')
          PY
