name: Cena Certa Oct13 Source Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cena-certa-oct13-source-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          python -m pip install -q --upgrade yt-dlp
      - name: Probe Globoplay candidates
        run: |
          set -u
          failed=0
          urls=(
            "https://globoplay.globo.com/v/6980346/"
            "https://globoplay.globo.com/v/5592391/"
            "https://globoplay.globo.com/v/6395851/"
            "https://globoplay.globo.com/v/3862655/"
            "https://globoplay.globo.com/v/5584476/"
            "https://globoplay.globo.com/v/12229932/"
            "https://globoplay.globo.com/v/7260459/"
            "https://globoplay.globo.com/v/6606563/"
            "https://globoplay.globo.com/v/5592395/"
          )
          for u in "${urls[@]}"; do
            echo "PROBE $u"
            if yt-dlp --no-warnings --simulate --print "SOURCE_META %(id)s | %(title)s | %(duration_string)s | %(uploader)s" "$u"; then
              echo "SOURCE_PROBE_PASS $u"
            else
              echo "SOURCE_PROBE_FAIL $u"
              failed=$((failed+1))
            fi
          done
          echo "GLOBOPLAY_FAILED_COUNT=$failed"
          test "$failed" -eq 0
      - name: Probe non-Globo YouTube candidates
        run: |
          set -euo pipefail
          urls=(
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/ICarly_Characters_Freaking_Out_For_9_Minutes_Straight_-_NickRewind.webm"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Victorious_Characters_%22Acting_Out%22_For_28_Minutes_Straight_-_NickRewind.webm"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/60_MINUTES_of_Big_Time_Bromance!_-_Big_Time_Rush_-_NickRewind.webm"
          )
          for u in "${urls[@]}"; do
            echo "COMMONS_PROBE $u"
            ffprobe -v error -user_agent "CenaCerta/2.8 editorial QA" -show_entries format=duration -of default=nw=1:nk=1 "$u"
            echo "COMMONS_PROBE_PASS $u"
          done
