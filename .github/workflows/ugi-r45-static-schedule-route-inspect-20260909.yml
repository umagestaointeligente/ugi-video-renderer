name: UGI R45.7 Static Schedule Route Inspect 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r45-static-schedule-route-inspect-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Concise deployed Buffer schedule capability readback
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          sl=s.lower()
          checks={
            'buffer_create_post':'bufferCreatePost(' in s,
            'buffer_editorial':'createBufferEditorialMediaPost' in s,
            'buffer_status':'publicationStateFromBufferPost' in s or 'getBufferPostStatus' in s,
            'platform_publication_status':'/api/platform-publication-status' in s,
            'custom_scheduled':'customScheduled' in s,
            'scheduled_at':'scheduledAt' in s or 'scheduled_at' in sl,
            'due_at':'dueAt' in s or 'due_at' in sl,
            'scheduling_automatic':'schedulingType: "automatic"' in s,
            'add_to_queue':'addToQueue' in s,
            'facebook':'facebook' in sl,
            'instagram':'instagram' in sl,
            'tiktok':'tiktok' in sl,
            'youtube':'youtube' in sl,
          }
          print('LSI_BUFFER_SCHEDULE_CAPABILITY_V1')
          for k,v in checks.items(): print(f'{k}={str(v).lower()}')
          PY
# concise-live-readback 2026-09-09T21:25:00-03:00
