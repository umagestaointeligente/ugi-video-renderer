name: UGI R45.7 Exact Multiformat Contract 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-r45-multiformat-exact-contract-20260909.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed exact-media/multiformat route blocks only
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lola-operacional-ugi" -o /tmp/w
          python - <<'PY'
          s=open('/tmp/w','rb').read().decode('utf-8','ignore')
          needles=[
            'if (path === "/api/editorial-media"',
            'if (path === "/api/editorial-media-publish"',
            'if (path === "/api/platform-publication-status"',
            'visual_post',
            'story_image'
          ]
          for n in needles:
              print('\n===== '+n+' =====')
              start=0; count=0
              while count<4:
                  i=s.find(n,start)
                  if i<0: break
                  print(s[max(0,i-3000):min(len(s),i+13000)])
                  start=i+len(n); count+=1
              if count==0: print('NOT_FOUND')
          PY
