name: Orbit Cena Certa Meta Auth Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-cena-certa-meta-auth-preflight
  cancel-in-progress: false

jobs:
  verify-meta-page-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGE_ACCESS_TOKEN: ${{ secrets.CENA_CERTA_META_ACCESS_TOKEN }}
      EXPECTED_PAGE_ID: '1314911305035494'
      GRAPH_VERSION: 'v23.0'
    steps:
      - name: Fail closed if credential is absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAGE_ACCESS_TOKEN:-}" ]; then
            echo 'AUTH_GATE=BLOCKED'
            echo 'REASON=CENA_CERTA_META_ACCESS_TOKEN_MISSING'
            exit 78
          fi
          echo 'AUTH_GATE=SECRET_PRESENT'

      - name: Validate canonical Facebook Page identity read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          token=os.environ['PAGE_ACCESS_TOKEN']
          expected=os.environ['EXPECTED_PAGE_ID']
          version=os.environ['GRAPH_VERSION']
          url=f"https://graph.facebook.com/{version}/me?"+urllib.parse.urlencode({
              'fields':'id,name',
              'access_token':token,
          })
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  data=json.loads(r.read())
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')[:1200]
              print(f'META_HTTP_STATUS={e.code}')
              print('IDENTITY_GATE=BLOCKED')
              print('REASON=META_TOKEN_REJECTED')
              print('META_ERROR='+body)
              raise SystemExit(79)
          actual=str(data.get('id') or '')
          name=str(data.get('name') or '')
          print('META_PAGE_ID='+actual)
          print('META_PAGE_NAME='+name)
          if actual != expected:
              print('IDENTITY_GATE=BLOCKED')
              print('REASON=WRONG_FACEBOOK_PAGE')
              raise SystemExit(80)
          print('IDENTITY_GATE=PASS')
          print('MUTATION_PERFORMED=false')
          PY
