name: UGI Admin Bridge Runtime Smoke
run-name: UGI Admin Bridge Runtime Smoke ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-admin-bridge-runtime-smoke.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://lola-github-admin-bridge-ugi.umagestaointeligente.workers.dev

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout UGI repository
        uses: actions/checkout@v4

      - name: Validate UGI-only scope and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q 'const OWNER = "umagestaointeligente"' cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'const REPO = "ugi-video-renderer"' cloudflare/lola-github-admin-bridge-ugi.mjs
          grep -q 'name = "lola-github-admin-bridge-ugi"' cloudflare/wrangler.ugi-admin.toml
          echo 'UGI_SCOPE_LOCK_OK=true'

      - name: Execute controlled runtime smoke and restore clean production source
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          SRC='cloudflare/lola-github-admin-bridge-ugi.mjs'
          CFG='cloudflare/wrangler.ugi-admin.toml'
          cp "$SRC" /tmp/lola-github-admin-bridge-ugi.clean.mjs
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          export SMOKE_TOKEN
          CLEAN_RESTORED=false

          restore_clean() {
            if [ -f /tmp/lola-github-admin-bridge-ugi.clean.mjs ]; then
              cp /tmp/lola-github-admin-bridge-ugi.clean.mjs "$SRC"
              npx --yes wrangler@4.32.0 deploy --config "$CFG" >/tmp/restore-deploy.log 2>&1 || {
                cat /tmp/restore-deploy.log
                return 1
              }
              CLEAN_RESTORED=true
            fi
          }
          trap 'restore_clean' EXIT

          echo '1) Verify live public health before smoke override'
          curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/health-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health-before.json'))
          assert d.get('ok') is True, d
          assert d.get('project') == 'UGI', d
          assert d.get('worker') == 'lola-github-admin-bridge-ugi', d
          assert d.get('repository') == 'umagestaointeligente/ugi-video-renderer', d
          s=d.get('required_secrets_configured') or {}
          for k in ('GITHUB_APP_ID','GITHUB_INSTALLATION_ID','GITHUB_APP_PRIVATE_KEY','BRIDGE_AUTH_SECRET'):
              assert s.get(k) is True, (k,d)
          assert d.get('github_called') is False, d
          assert d.get('fail_closed') is True, d
          print('HEALTH_BEFORE_PASS=true')
          PY

          echo '2) Build ephemeral authenticated smoke override in runner workspace only'
          python - <<'PY'
          import os, pathlib
          p=pathlib.Path('cloudflare/lola-github-admin-bridge-ugi.mjs')
          s=p.read_text()
          old='if (!(await requireAuth(request, env))) {'
          token=os.environ['SMOKE_TOKEN']
          new=f'if (request.headers.get("x-ugi-smoke") !== "{token}" && !(await requireAuth(request, env))) {{'
          if s.count(old) != 1:
              raise SystemExit('auth gate anchor not unique')
          p.write_text(s.replace(old,new))
          PY

          echo '3) Deploy ephemeral smoke override to isolated UGI admin Worker'
          npx --yes wrangler@4.32.0 deploy --config "$CFG" >/tmp/smoke-deploy.log 2>&1

          echo '4) Prove GitHub App installation auth + repository hard lock'
          curl --fail --silent --show-error \
            -H "x-ugi-smoke: $SMOKE_TOKEN" \
            "$WORKER_URL/diagnostics" -o /tmp/diagnostics.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diagnostics.json'))
          assert d.get('ok') is True, d
          assert d.get('repository') == 'umagestaointeligente/ugi-video-renderer', d
          assert d.get('default_branch') == 'main', d
          assert d.get('repository_lock_ok') is True, d
          assert d.get('installation_auth_ok') is True, d
          assert d.get('fail_closed') is True, d
          print('DIAGNOSTICS_PASS=true')
          PY

          echo '5) Prove Actions permissions reachability'
          curl --fail --silent --show-error \
            -H "x-ugi-smoke: $SMOKE_TOKEN" \
            "$WORKER_URL/github/actions/status" -o /tmp/actions-status.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/actions-status.json'))
          assert d.get('ok') is True, d
          assert d.get('repository') == 'umagestaointeligente/ugi-video-renderer', d
          print('ACTIONS_STATUS_PASS=true')
          PY

          echo '6) Controlled write: dispatch actions-health.yml through the bridge'
          START_EPOCH="$(date +%s)"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/dispatch.json --write-out '%{http_code}' \
            -X POST \
            -H "x-ugi-smoke: $SMOKE_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"workflow":"actions-health.yml","ref":"main","inputs":{}}' \
            "$WORKER_URL/github/workflows/dispatch")"
          test "$HTTP_CODE" = '202'
          python - <<'PY'
          import json
          d=json.load(open('/tmp/dispatch.json'))
          assert d.get('ok') is True, d
          assert d.get('workflow') == 'actions-health.yml', d
          assert d.get('ref') == 'main', d
          assert d.get('dispatch_status') == 204, d
          print('BRIDGE_DISPATCH_ACCEPTED=true')
          PY

          echo '7) Read back the run through the bridge and require a completed successful job'
          RUN_ID=''
          for i in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "x-ugi-smoke: $SMOKE_TOKEN" \
              "$WORKER_URL/github/workflows/runs" -o /tmp/runs.json
            RUN_ID="$(python - "$START_EPOCH" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          d=json.load(open('/tmp/runs.json'))
          for r in d.get('runs',[]):
              if r.get('path') != '.github/workflows/actions-health.yml':
                  continue
              created=r.get('created_at')
              if not created:
                  continue
              ts=int(datetime.datetime.fromisoformat(created.replace('Z','+00:00')).timestamp())
              if ts >= start-5:
                  print(r.get('id',''))
                  break
          PY
          )"
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          test -n "$RUN_ID"
          echo "ACTIONS_HEALTH_RUN_ID=$RUN_ID"

          JOB_PASS=false
          TOTAL_JOBS=''
          for i in $(seq 1 40); do
            curl --fail --silent --show-error \
              -H "x-ugi-smoke: $SMOKE_TOKEN" \
              "$WORKER_URL/github/workflows/jobs?run_id=$RUN_ID" -o /tmp/jobs.json
            read -r TOTAL_JOBS STATUS CONCLUSION < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/jobs.json'))
          jobs=d.get('jobs') or []
          j=jobs[0] if jobs else {}
          print(d.get('total_jobs',0), j.get('status',''), j.get('conclusion',''))
          PY
          )
            if [ "${TOTAL_JOBS:-0}" -gt 0 ] && [ "$STATUS" = 'completed' ]; then
              test "$CONCLUSION" = 'success'
              JOB_PASS=true
              break
            fi
            sleep 3
          done
          test "$JOB_PASS" = 'true'
          test "$TOTAL_JOBS" -gt 0

          echo '8) Restore exact clean source and redeploy production Worker'
          trap - EXIT
          restore_clean
          test "$CLEAN_RESTORED" = 'true'

          echo '9) Prove clean production is healthy and protected again'
          curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/health-after.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health-after.json'))
          assert d.get('ok') is True, d
          assert d.get('repository') == 'umagestaointeligente/ugi-video-renderer', d
          assert d.get('fail_closed') is True, d
          print('HEALTH_AFTER_PASS=true')
          PY
          PROTECTED_CODE="$(curl --silent --output /tmp/protected.json --write-out '%{http_code}' "$WORKER_URL/diagnostics")"
          test "$PROTECTED_CODE" = '401'

          mkdir -p generated/evidence
          python - "$RUN_ID" "$TOTAL_JOBS" <<'PY'
          import json,sys,datetime,os
          run_id=sys.argv[1]
          total_jobs=int(sys.argv[2])
          out={
            'project':'UGI',
            'repository':'umagestaointeligente/ugi-video-renderer',
            'worker':'lola-github-admin-bridge-ugi',
            'runtime_smoke':True,
            'health_before_pass':True,
            'github_app_installation_auth_pass':True,
            'repository_lock_pass':True,
            'actions_status_pass':True,
            'bridge_dispatch_pass':True,
            'actions_health_run_id':run_id,
            'total_jobs':total_jobs,
            'no_jobs_were_run':False,
            'job_conclusion':'success',
            'clean_source_redeployed':True,
            'health_after_pass':True,
            'unauthenticated_diagnostics_blocked':True,
            'publication_triggered':False,
            'payment_triggered':False,
            'secrets_exposed':False,
            'fail_closed':True,
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'commit_sha':os.environ.get('GITHUB_SHA'),
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('generated/evidence/ugi-admin-bridge-runtime-smoke.json','w').write(json.dumps(out,indent=2)+'\n')
          PY

      - name: Persist runtime smoke receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane/receipts/ugi-admin-bridge
          cp generated/evidence/ugi-admin-bridge-runtime-smoke.json control-plane/receipts/ugi-admin-bridge/latest.json
          git config user.name 'ugi-autonomy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/receipts/ugi-admin-bridge/latest.json
          if git diff --cached --quiet; then
            echo 'No receipt change to commit'
          else
            git commit -m 'UGI autonomy: persist admin bridge runtime smoke receipt [skip ci]'
            git push
          fi

      - name: Upload runtime smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugi-admin-bridge-runtime-smoke-${{ github.run_id }}
          path: generated/evidence/ugi-admin-bridge-runtime-smoke.json
          retention-days: 30
          if-no-files-found: error

