name: UGI R44.5.19 Commerce Hub + Visual Caption V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/r44_5_19_runner.py
      - .github/workflows/r44-5-19-commerce-hub-v3.yml

permissions:
  contents: write

concurrency:
  group: ugi-cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute R44.5.19 safe runner
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m scripts.r44_5_19_runner
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare/status
          test -f cloudflare/status/r44-5-19-final.txt || echo 'R44.5.19_STAGE=WORKFLOW_STATUS_MISSING' > cloudflare/status/r44-5-19-final.txt
          git config user.name 'ugi-automation'
          git config user.email 'ugi-automation@users.noreply.github.com'
          git add cloudflare/status/r44-5-19-final.txt
          git commit -m 'UGI R44.5.19 — deployment result v3' || true
          git push origin HEAD:main
