name: LSI Revenue Velocity R1
run-name: LSI Revenue Velocity R1 ${{ github.run_id }}

on:
  push:
    branches: [lsi-revenue-mass-market-r1-20260829]
    paths:
      - 'cloudflare/lsi-revenue-velocity-r1.mjs'
      - 'cloudflare/wrangler.lsi-revenue-velocity-r1.toml'
      - '.github/workflows/lsi-revenue-velocity-r1.yml'

permissions:
  contents: read

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VELOCITY_URL: https://lsi-revenue-velocity-r1.umagestaointeligente.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Static truth and safety gates
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/lsi-revenue-velocity-r1.mjs
          grep -q 'TARGET_USD_PER_MINUTE = 0.10' cloudflare/lsi-revenue-velocity-r1.mjs
          grep -q 'projection_is_revenue: false' cloudflare/lsi-revenue-velocity-r1.mjs
          grep -q 'verified_revenue_usd' cloudflare/lsi-revenue-velocity-r1.mjs
          grep -q 'money_movement: false' cloudflare/lsi-revenue-velocity-r1.mjs

      - name: Require autonomous Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy isolated velocity scorer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --config cloudflare/wrangler.lsi-revenue-velocity-r1.toml

      - name: Verify health and truth contract
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsS "$VELOCITY_URL/health" > /tmp/health.json && break || true
            sleep 2
          done
          jq -e '.ok==true and .target_usd_per_minute==0.1 and .revenue_source=="VERIFIED_PERSISTENT_ROUTE_STATE_ONLY" and .projections_count_as_revenue==false and .money_movement==false and .production_actions==false' /tmp/health.json >/dev/null
          curl -fsS "$VELOCITY_URL/velocity" > /tmp/velocity.json
          jq -e '.ok==true and .target_usd_per_minute==0.1 and .accounting_rule=="Only verified_revenue_usd from persistent learning state contributes to velocity. Projections are not revenue."' /tmp/velocity.json >/dev/null
          jq -e '[.routes[]? | select(.daily_projection_from_verified_velocity_usd > 0 and .projection_is_revenue != false)] | length == 0' /tmp/velocity.json >/dev/null

      - name: Write sanitized velocity receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/evidence
          events="$(jq -r '.event_count // 0' /tmp/velocity.json 2>/dev/null || echo 0)"
          best_route="$(jq -r '.best_route.route_id // "NONE"' /tmp/velocity.json 2>/dev/null || echo NONE)"
          best_velocity="$(jq -r '.best_route.verified_revenue_usd_per_minute // 0' /tmp/velocity.json 2>/dev/null || echo 0)"
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg route "$best_route" --argjson events "$events" --argjson velocity "$best_velocity" '{schema_version:"1.0",project:"LSI_REVENUE_VELOCITY_R1",run_id:$run,commit:$sha,target_usd_per_minute:0.10,event_count:$events,best_route:$route,best_verified_revenue_usd_per_minute:$velocity,projection_is_revenue:false,zero_cost_route:true,money_movement:false,production_actions:false}' > generated/evidence/lsi-revenue-velocity-r1.json

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsi-revenue-velocity-${{ github.run_id }}
          path: generated/evidence/lsi-revenue-velocity-r1.json
          retention-days: 30
          if-no-files-found: error
