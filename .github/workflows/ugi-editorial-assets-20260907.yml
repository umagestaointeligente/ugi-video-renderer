name: UGI Editorial Assets 2026-09-07

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_editorial_20260907_assets.py'
      - '.github/workflows/ugi-editorial-assets-20260907.yml'

permissions:
  contents: write

concurrency:
  group: ugi-editorial-assets-20260907
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
      - name: Build and QA editorial media
        run: |
          set -euo pipefail
          python scripts/ugi_editorial_20260907_assets.py
      - name: Persist approved media only
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-media-bot'
          git config user.email 'ugi-editorial-media-bot@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-07
          git commit -m 'asset: build UGI editorial media 2026-09-07' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
