name: Career360 Vercel OIDC Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career360-vercel-oidc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TEAM_ID: team_ZJys00FTE2kK9yVtsqH5fHyF
      VERCEL_PROJECT_ID: prj_DQbCLqrEixa8fTbOkOz3ZtjX9IGP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exchange GitHub OIDC for ephemeral Vercel token
        id: exchange
        uses: actions/github-script@v7
        with:
          script: |
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            core.setOutput('oidc', oidc);

      - name: Verify ephemeral token against official project (read only)
        env:
          OIDC_TOKEN: ${{ steps.exchange.outputs.oidc }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST 'https://api.vercel.com/login/oauth/token' \
            --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data 'client_id=cl_kyUx2zVvA4MGptBohkmtYHJly2XltXzD' \
            --data 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "team_id_or_slug=$VERCEL_TEAM_ID" \
            --data-urlencode "subject_token=$OIDC_TOKEN")"
          if [[ "$code" != "200" ]]; then
            echo "OIDC_EXCHANGE_HTTP=$code"
            exit 2
          fi
          token="$(jq -r '.access_token // empty' "$response_file")"
          if [[ -z "$token" ]]; then
            echo 'OIDC_EXCHANGE_TOKEN=EMPTY'
            exit 3
          fi
          echo "::add-mask::$token"
          project_code="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          echo "VERCEL_PROJECT_READ_HTTP=$project_code"
          if [[ "$project_code" != "200" ]]; then
            exit 4
          fi
          actual="$(jq -r '.id // empty' /tmp/vercel-project.json)"
          [[ "$actual" == "$VERCEL_PROJECT_ID" ]] || { echo 'PROJECT_ID_MISMATCH'; exit 5; }
          echo 'VERCEL_EPHEMERAL_OIDC_PROJECT_AUTH=PASS'
