name: UGI Admin Bridge Debug
run-name: UGI Admin Bridge Debug ${{ github.run_id }}

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-admin-bridge-debug.yml'

permissions:
  contents: write

env:
  WORKER_URL: https://lola-github-admin-bridge-ugi.umagestaointeligente.workers.dev

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.UGI_ADMIN_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UGI_ADMIN_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Persist debug run identity first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control-plane/receipts/ugi-admin-bridge
          printf '{"run_id":"%s","commit_sha":"%s","stage":"STARTED"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > control-plane/receipts/ugi-admin-bridge/debug-start.json
          git config user.name 'ugi-autonomy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-plane/receipts/ugi-admin-bridge/debug-start.json
          git commit -m 'UGI autonomy: record bridge debug run [skip ci]' || true
          git push
      - name: Probe health and temporary authenticated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/health.json
          SRC='cloudflare/lola-github-admin-bridge-ugi.mjs'
          CFG='cloudflare/wrangler.ugi-admin.toml'
          cp "$SRC" /tmp/clean.mjs
          SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_TOKEN"
          export SMOKE_TOKEN
          restore() { cp /tmp/clean.mjs "$SRC"; npx --yes wrangler@4.32.0 deploy --config "$CFG" >/tmp/restore.log 2>&1 || true; }
          trap restore EXIT
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('cloudflare/lola-github-admin-bridge-ugi.mjs')
          s=p.read_text(); old='if (!(await requireAuth(request, env))) {'
          tok=os.environ['SMOKE_TOKEN']; new=f'if (request.headers.get("x-ugi-smoke") !== "{tok}" && !(await requireAuth(request, env))) {{'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          npx --yes wrangler@4.32.0 deploy --config "$CFG"
          DIAG_OK=false
          for i in $(seq 1 20); do
            CODE=$(curl --silent --show-error -o /tmp/diag.json -w '%{http_code}' -H "x-ugi-smoke: $SMOKE_TOKEN" "$WORKER_URL/diagnostics" || true)
            if [ "$CODE" = '200' ]; then DIAG_OK=true; break; fi
            sleep 2
          done
          test "$DIAG_OK" = 'true'
          cat /tmp/diag.json
          ACT_OK=false
          for i in $(seq 1 10); do
            CODE=$(curl --silent --show-error -o /tmp/actions.json -w '%{http_code}' -H "x-ugi-smoke: $SMOKE_TOKEN" "$WORKER_URL/github/actions/status" || true)
            if [ "$CODE" = '200' ]; then ACT_OK=true; break; fi
            sleep 2
          done
          test "$ACT_OK" = 'true'
          cat /tmp/actions.json
          trap - EXIT
          restore

