name: UGI Sep09 Final Buffer Schedule 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-sep09-final-buffer-schedule-20260909.yml'
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Schedule exact approved editorial assets and verify Buffer readback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          cat > /tmp/schedule.py <<'PY'
          import os,json,hashlib,urllib.request,urllib.error,base64
          from datetime import datetime,timezone
          BASE=os.environ['WORKER_URL'].rstrip('/')
          KEY=os.environ['UGI_LOLA_COMMAND_KEY']
          COMMIT='f280ea288421267727d6beedde1e2936716e5391'
          ROOT=f'https://raw.githubusercontent.com/umagestaointeligente/ugi-video-renderer/{COMMIT}/public/ugi/editorial/2026-09-09/'
          IG='6a7896cdb2d9d57743457e33'
          LI='6a9acd94065799be46891f24'
          dec=lambda s:base64.b64decode(s).decode('utf-8')
          LT=dec('')
          QT=dec('')
          MT=dec('')
          items=[
            {'id':'UGI-20260909-IG-STORY-APPLE-0900','p':'instagram','f':'story','file':'story-apple-0900.mp4','sha':'90cbc670b7dc5ddfaf500d54d7bf1c8164b4d119f99e90cf2b513fcc305e9125','due':'2026-09-09T12:00:00Z','kind':'story_video','text':''},
            {'id':'UGI-20260909-IG-STORY-APPLE-0907','p':'instagram','f':'story','file':'story-apple-0907.mp4','sha':'2ce272df3011d19101e50cc5abec3026565e6f778041f82f387e60436bbf6160','due':'2026-09-09T12:07:00Z','kind':'story_video','text':''},
            {'id':'UGI-20260909-IG-FEED-QUALCOMM-1230','p':'instagram','f':'post','file':'feed-qualcomm-amazon-1230.jpg','sha':'5640d52a3f31f99ba61c4fea1cf6af2da64591dd4d48700c76bb134aca46b1a6','due':'2026-09-09T15:30:00Z','kind':'mixed_carousel','text':QT},
            {'id':'UGI-20260909-LI-RESILIENCE-1400','p':'linkedin','f':'post','file':'linkedin-digital-resilience-1400.jpg','sha':'29ae8c717cc90eb6a5c9c09dc253421e435495f3a1c8611d500f3a63410bd04f','due':'2026-09-09T17:00:00Z','kind':'linkedin','text':LT},
            {'id':'UGI-20260909-IG-STORY-RESILIENCE-1800','p':'instagram','f':'story','file':'story-resilience-1800.mp4','sha':'aa73ddd43d04859bb353322dd4b1ad9de3dcdc93c187a7c344f531e8e7221fa6','due':'2026-09-09T21:00:00Z','kind':'story_video','text':''},
            {'id':'UGI-20260909-IG-STORY-RESILIENCE-1812','p':'instagram','f':'story','file':'story-resilience-1812.mp4','sha':'855b102ce2c4a549a8a3ffd3777dcafb7894e87397ce829cd461f15fc1492b25','due':'2026-09-09T21:12:00Z','kind':'story_video','text':''},
            {'id':'UGI-20260909-IG-FEED-MISTRAL-1915','p':'instagram','f':'post','file':'feed-mistral-1915.jpg','sha':'a8253dc88f1d772a0e530973e11b929fbbedec2fe661bf449fc30dfa225fe57d','due':'2026-09-09T22:15:00Z','kind':'mixed_carousel','text':MT}
          ]
          def iso(v): return datetime.fromisoformat(v.replace('Z','+00:00')).astimezone(timezone.utc)
          def call(method,url,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'x-lola-command-key':KEY,'accept':'application/json','content-type':'application/json','user-agent':'UGI-Sep09-Exact-Scheduler/2.0'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: return e.code,json.loads(raw)
                  except Exception: return e.code,{'raw':raw[:1000]}
          proof={'schema':'UGI_BUFFER_SCHEDULE_PROOF_V1','assetCommit':COMMIT,'humanApproval':True,'startedAt':datetime.now(timezone.utc).isoformat(),'items':[],'overall':'IN_PROGRESS'}
          for x in items:
              with urllib.request.urlopen(ROOT+x['file'],timeout=60) as r: b=r.read()
              got=hashlib.sha256(b).hexdigest()
              if got!=x['sha']:
                  proof['overall']='PREFLIGHT_HASH_FAILED'; proof['failure']={'id':x['id'],'actual':got}; open('schedule-proof.json','w').write(json.dumps(proof,indent=2)); raise SystemExit(10)
          print('PRECHECK_SHA256=7/7_PASS')
          for x in items:
              u=ROOT+x['file']
              if x['kind']=='linkedin':
                  route='/api/editorial-media-publish'; payload={'platform':'linkedin','mediaType':'image','mediaUrl':u,'text':x['text'],'format':'post','mode':'customScheduled','dueAt':x['due']}
              elif x['kind']=='story_video':
                  route='/api/r45-3/instagram-publish'; payload={'kind':'story_video','text':'','videoUrl':u,'imageUrls':[],'mode':'customScheduled','dueAt':x['due']}
              else:
                  route='/api/r45-3/instagram-publish'; payload={'kind':'mixed_carousel','text':x['text'],'videoUrl':'','imageUrls':[u],'mode':'customScheduled','dueAt':x['due']}
              h,res=call('POST',BASE+route,payload)
              rec={'id':x['id'],'platform':x['p'],'format':x['f'],'dueAtExpected':x['due'],'sha256':x['sha'],'assetUrl':u,'scheduleHttp':h}
              if h<200 or h>=300 or res.get('ok') is not True:
                  rec.update(scheduleConfirmed=False,error=res.get('error') or res.get('errorClass'),bufferMutationPerformed=res.get('bufferMutationPerformed','UNKNOWN')); proof['items'].append(rec); proof['overall']='STOPPED_FAIL_CLOSED'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); print(json.dumps({'STOP':rec},ensure_ascii=False)); raise SystemExit(20)
              if x['p']=='instagram': post=res.get('post') or {}; target=res.get('channel') or {}; pid=post.get('id'); cid=target.get('id') or post.get('channelId')
              else: pub=res.get('publication') or {}; target=res.get('target') or {}; pid=pub.get('bufferPostId'); cid=target.get('channelId'); rec['targetType']=target.get('type'); rec['personalProfileTargetAllowed']=target.get('personalProfileTargetAllowed')
              rec.update(bufferPostId=pid,channelId=cid)
              if not pid or cid!=(IG if x['p']=='instagram' else LI):
                  rec.update(scheduleConfirmed=False,error='missing_post_id_or_wrong_channel'); proof['items'].append(rec); proof['overall']='STOPPED_FAIL_CLOSED'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(30)
              if x['p']=='instagram': rh,rb=call('GET',BASE+'/api/r45-2/buffer-status?id='+pid); rp=rb.get('post') or {}; st=rp.get('status'); da=rp.get('dueAt'); rec['metadata']=rp.get('metadata') or post.get('metadata') or {}
              else: rh,rb=call('GET',BASE+'/api/linkedin-publication-status?postId='+pid); rp=rb.get('publication') or {}; st=rp.get('bufferStatus') or rp.get('status'); da=rp.get('dueAt')
              dueok=False
              try: dueok=abs((iso(da)-iso(x['due'])).total_seconds())<1
              except Exception: pass
              rec.update(readbackHttp=rh,readbackStatus=st,dueAtActual=da,dueAtMatch=dueok,scheduleConfirmed=(rh==200 and str(st or '').lower()=='scheduled' and dueok)); proof['items'].append(rec)
              print(json.dumps({'id':x['id'],'bufferPostId':pid,'status':st,'dueAt':da,'confirmed':rec['scheduleConfirmed']},ensure_ascii=False))
              if not rec['scheduleConfirmed']:
                  proof['overall']='STOPPED_READBACK_MISMATCH'; open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); raise SystemExit(40)
          proof['confirmedCount']=sum(1 for r in proof['items'] if r.get('scheduleConfirmed')); proof['overall']='BUFFER_SCHEDULED_7_OF_7' if proof['confirmedCount']==7 else 'INCOMPLETE'; proof['finishedAt']=datetime.now(timezone.utc).isoformat(); open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2)); print(json.dumps({'overall':proof['overall'],'confirmedCount':proof['confirmedCount']}))
          PY
          python /tmp/schedule.py
      - name: Upload scheduling proof
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ugi-sep09-buffer-schedule-proof-${{ github.run_id }}
          path: schedule-proof.json
          if-no-files-found: warn
          retention-days: 1
