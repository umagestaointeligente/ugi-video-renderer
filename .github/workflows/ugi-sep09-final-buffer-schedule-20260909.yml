name: UGI Sep09 Final Buffer Schedule 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/ugi-sep09-final-buffer-schedule-20260909.yml'
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Schedule exact approved editorial assets and verify Buffer readback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          python - <<'PY'
          import os, json, hashlib, urllib.request, urllib.error
          from datetime import datetime, timezone

          BASE=os.environ['WORKER_URL'].rstrip('/')
          KEY=os.environ['UGI_LOLA_COMMAND_KEY']
          ASSET_COMMIT='f280ea288421267727d6beedde1e2936716e5391'
          ROOT=f'https://raw.githubusercontent.com/umagestaointeligente/ugi-video-renderer/{ASSET_COMMIT}/public/ugi/editorial/2026-09-09/'
          IG_CHANNEL='6a7896cdb2d9d57743457e33'
          LI_CHANNEL='6a9acd94065799be46891f24'

          linkedin_text='''🧭 Dependência tecnológica deixou de ser um problema só da TI. Virou tema de gestão.

🌐 Uma pesquisa com 1.300 executivos de grandes organizações mostra que infraestrutura digital já começa a ser tratada como energia e cadeia de suprimentos: algo que exige supervisão, contingência e capacidade de substituição.

⚠️ O risco aparece quando uma empresa descobre tarde demais que trocar um fornecedor crítico não leva dias. Pode levar meses — ou mais de um ano.

🔗 E isso vale para cloud, dados, modelos de IA, telecomunicações e qualquer tecnologia que sustente uma operação essencial.

📌 A pergunta de gestão muda.
Não é mais: “qual é o melhor fornecedor?”
É: “se esse fornecedor ficar indisponível amanhã, quanto tempo eu levo para continuar operando?”

🛠️ Isso exige pelo menos três coisas: mapear dependências críticas, definir alternativas reais e preservar controle sobre dados e ativos que não podem ficar presos a um único parceiro.

💡 Eficiência busca o melhor caminho. Resiliência garante que exista um segundo caminho quando o primeiro falha.

#Gestão #Estratégia #Risco #Tecnologia #InteligênciaArtificial #ContinuidadeDeNegócios #UGI'''

          qualcomm_text='''🤖 A Qualcomm está fazendo um movimento que vai muito além de vender mais chips.

📱 Durante anos, a empresa foi fortemente associada ao mercado de smartphones. Agora, a companhia tenta abrir uma nova avenida de crescimento em infraestrutura de IA.

☁️ A parceria de longo prazo com a Amazon pode envolver até US$ 60 bilhões em chips e produtos para data centers de IA.

📊 Isso muda a leitura do negócio: menos dependência de uma única avenida e mais exposição a um mercado que está redesenhando a infraestrutura tecnológica global.

🎯 O ponto de gestão é portfólio, concentração e timing.

💡 Empresas resilientes não esperam o motor principal perder força para procurar o próximo. Elas começam a construir o próximo motor enquanto o atual ainda funciona.

#Gestão #Estratégia #InteligênciaArtificial #Qualcomm #Amazon #UGI'''

          mistral_text='''🤖 A Mistral tem apenas três anos — e já vale cerca de US$ 24 bilhões.

💶 A empresa francesa levantou €3 bilhões numa rodada que entrou para a história da tecnologia europeia.

🌍 Mas existe algo maior por trás do valuation: a Europa quer reduzir sua dependência tecnológica e ter uma empresa capaz de disputar espaço num mercado dominado por gigantes americanos e chineses.

📈 A Mistral ainda é muito menor que os líderes globais, mas já projeta aproximadamente US$ 1 bilhão em receita recorrente anual até o fim do ano.

🎯 Isso mostra como investidores precificam não apenas o tamanho atual de uma empresa, mas o espaço estratégico que ela pode ocupar.

💡 Em mercados novos, posicionamento e velocidade podem valer tanto quanto escala.

#MistralAI #InteligênciaArtificial #Estratégia #Tecnologia #Gestão #UGI'''

          items=[
            dict(id='UGI-20260909-IG-STORY-APPLE-0900', platform='instagram', format='story', file='story-apple-0900.mp4', sha='90cbc670b7dc5ddfaf500d54d7bf1c8164b4d119f99e90cf2b513fcc305e9125', due='2026-09-09T12:00:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'story_video','text':'','videoUrl':u,'imageUrls':[],'mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-IG-STORY-APPLE-0907', platform='instagram', format='story', file='story-apple-0907.mp4', sha='2ce272df3011d19101e50cc5abec3026565e6f778041f82f387e60436bbf6160', due='2026-09-09T12:07:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'story_video','text':'','videoUrl':u,'imageUrls':[],'mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-IG-FEED-QUALCOMM-1230', platform='instagram', format='post', file='feed-qualcomm-amazon-1230.jpg', sha='5640d52a3f31f99ba61c4fea1cf6af2da64591dd4d48700c76bb134aca46b1a6', due='2026-09-09T15:30:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'mixed_carousel','text':qualcomm_text,'videoUrl':'','imageUrls':[u],'mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-LI-RESILIENCE-1400', platform='linkedin', format='post', file='linkedin-digital-resilience-1400.jpg', sha='29ae8c717cc90eb6a5c9c09dc253421e435495f3a1c8611d500f3a63410bd04f', due='2026-09-09T17:00:00Z', route='/api/editorial-media-publish', payload=lambda u,d:{'platform':'linkedin','mediaType':'image','mediaUrl':u,'text':linkedin_text,'format':'post','mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-IG-STORY-RESILIENCE-1800', platform='instagram', format='story', file='story-resilience-1800.mp4', sha='aa73ddd43d04859bb353322dd4b1ad9de3dcdc93c187a7c344f531e8e7221fa6', due='2026-09-09T21:00:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'story_video','text':'','videoUrl':u,'imageUrls':[],'mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-IG-STORY-RESILIENCE-1812', platform='instagram', format='story', file='story-resilience-1812.mp4', sha='855b102ce2c4a549a8a3ffd3777dcafb7894e87397ce829cd461f15fc1492b25', due='2026-09-09T21:12:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'story_video','text':'','videoUrl':u,'imageUrls':[],'mode':'customScheduled','dueAt':d}),
            dict(id='UGI-20260909-IG-FEED-MISTRAL-1915', platform='instagram', format='post', file='feed-mistral-1915.jpg', sha='a8253dc88f1d772a0e530973e11b929fbbedec2fe661bf449fc30dfa225fe57d', due='2026-09-09T22:15:00Z', route='/api/r45-3/instagram-publish', payload=lambda u,d:{'kind':'mixed_carousel','text':mistral_text,'videoUrl':'','imageUrls':[u],'mode':'customScheduled','dueAt':d}),
          ]

          def dt(v):
              return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)

          def request_json(method,url,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(url,data=data,method=method,headers={
                  'x-lola-command-key':KEY,
                  'accept':'application/json',
                  'content-type':'application/json',
                  'user-agent':'UGI-Sep09-Exact-Scheduler/1.0'
              })
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read().decode('utf-8')
                      return r.status,json.loads(body)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw[:2000]}
                  return e.code,body

          proof={
              'schema':'UGI_BUFFER_SCHEDULE_PROOF_V1',
              'project':'UGI','date':'2026-09-09','timezone':'America/Sao_Paulo',
              'assetCommit':ASSET_COMMIT,'humanApproval':True,
              'startedAt':datetime.now(timezone.utc).isoformat(),
              'items':[], 'overall':'IN_PROGRESS'
          }

          # Cheap preflight first: every exact approved byte must match before first mutation.
          for it in items:
              url=ROOT+it['file']
              with urllib.request.urlopen(url,timeout=60) as r:
                  data=r.read()
              got=hashlib.sha256(data).hexdigest()
              if got != it['sha']:
                  proof['overall']='PREFLIGHT_HASH_FAILED'
                  proof['failure']={'id':it['id'],'expected':it['sha'],'actual':got}
                  open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2))
                  raise SystemExit(f"HASH_MISMATCH {it['id']}")

          print('PRECHECK exact asset SHA256: 7/7 PASS')

          for it in items:
              media_url=ROOT+it['file']
              status,resp=request_json('POST',BASE+it['route'],it['payload'](media_url,it['due']))
              rec={'id':it['id'],'platform':it['platform'],'format':it['format'],'dueAtExpected':it['due'],'assetUrl':media_url,'sha256':it['sha'],'scheduleHttp':status}
              if status < 200 or status >= 300 or resp.get('ok') is not True:
                  rec['scheduleConfirmed']=False
                  rec['error']=resp.get('error') or resp.get('errorClass') or 'schedule_call_failed'
                  rec['bufferMutationPerformed']=resp.get('bufferMutationPerformed','UNKNOWN')
                  proof['items'].append(rec)
                  proof['overall']='STOPPED_FAIL_CLOSED'
                  proof['finishedAt']=datetime.now(timezone.utc).isoformat()
                  open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2))
                  print(json.dumps({'STOP':rec},ensure_ascii=False))
                  raise SystemExit(2)

              if it['platform']=='instagram':
                  post=resp.get('post') or {}
                  channel=resp.get('channel') or {}
                  post_id=post.get('id')
                  channel_id=channel.get('id') or post.get('channelId')
              else:
                  pub=resp.get('publication') or {}
                  post_id=pub.get('bufferPostId')
                  channel_id=(resp.get('target') or {}).get('channelId')

              rec['bufferPostId']=post_id
              rec['channelId']=channel_id
              expected_channel=IG_CHANNEL if it['platform']=='instagram' else LI_CHANNEL
              if not post_id or channel_id != expected_channel:
                  rec['scheduleConfirmed']=False
                  rec['error']='missing_post_id_or_wrong_channel'
                  proof['items'].append(rec)
                  proof['overall']='STOPPED_FAIL_CLOSED'
                  proof['finishedAt']=datetime.now(timezone.utc).isoformat()
                  open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2))
                  print(json.dumps({'STOP':rec},ensure_ascii=False))
                  raise SystemExit(3)

              if it['platform']=='instagram':
                  rb_http,rb=request_json('GET',BASE+'/api/r45-2/buffer-status?id='+post_id)
                  rb_post=rb.get('post') or {}
                  actual_status=rb_post.get('status')
                  actual_due=rb_post.get('dueAt')
                  metadata=rb_post.get('metadata') or post.get('metadata') or {}
                  rec['metadata']=metadata
              else:
                  rb_http,rb=request_json('GET',BASE+'/api/linkedin-publication-status?postId='+post_id)
                  rb_pub=rb.get('publication') or {}
                  actual_status=rb_pub.get('bufferStatus') or rb_pub.get('status')
                  actual_due=rb_pub.get('dueAt')
                  rec['targetType']=(resp.get('target') or {}).get('type')
                  rec['personalProfileTargetAllowed']=(resp.get('target') or {}).get('personalProfileTargetAllowed')

              rec['readbackHttp']=rb_http
              rec['readbackStatus']=actual_status
              rec['dueAtActual']=actual_due
              status_ok=str(actual_status or '').lower()=='scheduled'
              due_ok=False
              try: due_ok=abs((dt(actual_due)-dt(it['due'])).total_seconds()) < 1
              except Exception: due_ok=False
              rec['dueAtMatch']=due_ok
              rec['scheduleConfirmed']=bool(rb_http==200 and status_ok and due_ok)
              proof['items'].append(rec)
              print(json.dumps({'scheduled':it['id'],'bufferPostId':post_id,'status':actual_status,'dueAt':actual_due,'confirmed':rec['scheduleConfirmed']},ensure_ascii=False))

              if not rec['scheduleConfirmed']:
                  proof['overall']='STOPPED_READBACK_MISMATCH'
                  proof['finishedAt']=datetime.now(timezone.utc).isoformat()
                  open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2))
                  raise SystemExit(4)

          proof['confirmedCount']=sum(1 for x in proof['items'] if x.get('scheduleConfirmed'))
          proof['overall']='BUFFER_SCHEDULED_7_OF_7' if proof['confirmedCount']==7 else 'INCOMPLETE'
          proof['finishedAt']=datetime.now(timezone.utc).isoformat()
          open('schedule-proof.json','w').write(json.dumps(proof,ensure_ascii=False,indent=2))
          print(json.dumps({'overall':proof['overall'],'confirmedCount':proof['confirmedCount']},ensure_ascii=False))
          PY
      - name: Upload scheduling proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugi-sep09-buffer-schedule-proof-${{ github.run_id }}
          path: schedule-proof.json
          if-no-files-found: warn
          retention-days: 14
