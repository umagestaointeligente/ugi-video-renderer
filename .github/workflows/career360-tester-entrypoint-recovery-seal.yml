name: Career360 Tester Entrypoint Recovery Seal
run-name: Career360 Tester Entrypoint Recovery Seal ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - 'career360/scripts/patch_recovery_tester_entrypoint_20260907.py'
      - '.github/workflows/career360-tester-entrypoint-recovery-seal.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch authoritative recovery
        run: python career360/scripts/patch_recovery_tester_entrypoint_20260907.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F '`TESTER_ENTRYPOINT_V16=LIVE_BROWSER_VALIDATED`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'https://lsi-career-360.umagestaointeligente.workers.dev/' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'run `34161107108`, job `101862969136`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F 'run `34161107086`, job `101862969173`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          grep -F '`PUBLIC_BETA=NOT_OPENED_PRODUCT_DECISION`' docs/LSI_RECOVERY_CURRENT.md >/dev/null
          git config user.name 'career360-tester-seal-bot'
          git config user.email 'career360-tester-seal-bot@users.noreply.github.com'
          git add docs/LSI_RECOVERY_CURRENT.md
          if git diff --cached --quiet; then
            echo 'RECOVERY_ALREADY_CURRENT=1'
          else
            git commit -m 'career360: seal stable V16 tester entrypoint'
            git push origin HEAD:main
          fi
          echo "RECOVERY_HEAD=$(git rev-parse HEAD)"
