name: UGI Kick Sep11 Corrected Build

on:
  push:
    paths:
      - '.github/workflows/ugi-kick-sep11-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Sep11 build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ugi-build-editorial-assets-20260911.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'SEP11_BUILD_DISPATCHED=1'
