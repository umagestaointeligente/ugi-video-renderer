name: UGI Platform Video Recovery 2026-08-31

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ugi-platform-video-recovery-20260831.yml'
      - 'scripts/ugi_platform_video_recovery_20260831.py'

permissions:
  contents: write

concurrency:
  group: ugi-platform-video-recovery-20260831
  cancel-in-progress: false

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  recover-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate recovery and canonical publisher code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ugi_publisher_hub.py scripts/ugi_render_reconciler.py scripts/ugi_platform_video_recovery_20260831.py
      - name: Reconcile live render and draft state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          python3 scripts/ugi_render_reconciler.py
      - name: Schedule exact existing platform agenda through Buffer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ugi_platform_video_recovery_20260831.py
      - name: Persist recovery receipts and render state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-platform-recovery-bot'
          git config user.email 'ugi-platform-recovery@users.noreply.github.com'
          git add control-plane/publisher-hub/render-state/*.json 2>/dev/null || true
          git add control-plane/publisher-hub/receipts/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist UGI platform recovery proof'
          git pull --rebase origin main
          git push origin HEAD:main

