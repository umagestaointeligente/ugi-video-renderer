name: UGI R45.7 Contract Probe 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/ugi-r45-7-contract-probe-20260909.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UGI_LOLA_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Probe validation with empty payload only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_LOLA_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_LOLA_COMMAND_KEY"
          code=$(curl --silent --show-error --location --max-time 30 \
            -A 'UGI-GitHub-Actions/1.0' \
            -H "x-lola-command-key: $UGI_LOLA_COMMAND_KEY" \
            -H 'accept: application/json' \
            -H 'content-type: application/json' \
            --data-binary '{}' \
            --output contract.json --write-out '%{http_code}' \
            "$WORKER_URL/api/platform-publish")
          echo "HTTP=$code"
          python -m json.tool contract.json || cat contract.json
          test "$code" != '200' || python - <<'PY'
          import json
          p=json.load(open('contract.json'))
          if p.get('ok') is True:
              raise SystemExit('UNEXPECTED_MUTATION_ON_EMPTY_PAYLOAD')
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: ugi-r45-7-contract-${{ github.run_id }}
          path: contract.json
          retention-days: 3
          if-no-files-found: error
