name: VSA Buffer Route Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsa-buffer-route-probe.yml'

permissions:
  contents: read

env:
  WORKER_URL: https://lola-operacional-ugi.umagestaointeligente.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UGI_WORKER_COMMAND_KEY: ${{ secrets.UGI_LOLA_COMMAND_KEY }}
    steps:
      - name: Discover Buffer channels without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UGI_WORKER_COMMAND_KEY:-}"
          echo "::add-mask::$UGI_WORKER_COMMAND_KEY"
          curl --fail --silent --show-error --location --max-time 60 \
            -H "x-lola-command-key: $UGI_WORKER_COMMAND_KEY" \
            -H "accept: application/json" \
            "$WORKER_URL/api/buffer/channels" > /tmp/channels.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/channels.json'))
          out={
            'ok': d.get('ok'),
            'organization': d.get('organization'),
            'channels': [
              {k:c.get(k) for k in ('id','service','name','username','displayName','profileName','channelId') if c.get(k) is not None}
              for c in (d.get('channels') or [])
            ]
          }
          print('VSA_BUFFER_ROUTE_PROBE='+json.dumps(out, ensure_ascii=False))
          if d.get('ok') is not True:
            raise SystemExit(2)
          PY
