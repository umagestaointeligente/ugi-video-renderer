name: UGI Editorial Media Build 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ugi_editorial_media_build_20260906.py'
      - '.github/workflows/ugi-editorial-media-build-20260906.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ugi-editorial-media-build-20260906
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check --quiet edge-tts
      - name: Build real-news editorial media pack
        shell: bash
        run: |
          set -euo pipefail
          # ffmpeg drawbox does not accept w-40 in this runner build; use the equivalent constant.
          sed -i 's/w=w-40/w=680/g' scripts/ugi_editorial_media_build_20260906.py
          python scripts/ugi_editorial_media_build_20260906.py
          test -s public/ugi/editorial/2026-09-06/manifest.json
          test -s public/ugi/editorial/2026-09-06/rock-linkedin.jpg
          test -s public/ugi/editorial/2026-09-06/rock-instagram.mp4
          test -s public/ugi/editorial/2026-09-06/rock-tiktok.mp4
          test -s public/ugi/editorial/2026-09-06/foxconn-story.mp4
          test -s public/ugi/editorial/2026-09-06/retail-ai-tiktok.mp4
      - name: Persist media pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ugi-editorial-media-bot'
          git config user.email 'ugi-editorial-media@users.noreply.github.com'
          git add public/ugi/editorial/2026-09-06
          git commit -m 'media: UGI editorial pack 2026-09-06' || true
          git pull --rebase origin main
          git push origin HEAD:main
